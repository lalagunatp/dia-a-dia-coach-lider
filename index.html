          Semana <b>{semanaPasadaNum}</b> ({fmtDateObj(semanaPasadaIni)} al {fmtDateObj(semanaPasadaFin)}) vs semana <b>{semanaAntepasadaNum}</b> ({fmtDateObj(semanaAntepasadaIni)} al {fmtDateObj(semanaAntepasadaFin)}). La semana {semanaActualNum}, la que corre, no entra: su comisión se paga hasta la siguiente.
        </p>
        <p style={{fontSize:12,color:'var(--dim)',marginBottom:6,lineHeight:1.45}}>
          Si lo cotejas contra COMISIONES: ahí esas cuentas vienen marcadas como semana <b>{vSemanaPasada}</b> y <b>{vSemanaAntepasada}</b>, porque la columna V trae la semana en que se paga la comisión, una adelante de la semana en que se pagó la cuenta.
        </p>
        {esLider?pagosPorCoach.map(c=>{
          const key=c.coach.nombre;
          const isExp=expandedCoachPago===key;
          return <div key={key} style={{marginBottom:isExp?4:0}}>
            <div onClick={()=>setExpandedCoachPago(isExp?null:key)} style={{display:'flex',justifyContent:'space-between',alignItems:'center',fontSize:13,padding:'6px 0',borderBottom:isExp?'none':'1px solid var(--border)',cursor:'pointer'}}>
              <span style={{fontWeight:600}}>{c.coach.nombre.split(' ').slice(0,3).join(' ')}</span>
              <span style={{display:'flex',alignItems:'center',gap:6}}>
                <DeltaPagos pasada={c.pasada} antepasada={c.antepasada} importe={c.importePasada}/>
                <span style={{fontSize:13,color:'var(--dim)'}}>{isExp?'▲':'▼'}</span>
              </span>
            </div>
            {isExp&&<div style={{background:'var(--bg)',borderRadius:6,padding:'6px 8px',marginBottom:6}}>
              {c.vendedores.map(({m,pasada,antepasada,importePasada})=>
                <div key={m.numEmp||m.nombre} style={{display:'flex',justifyContent:'space-between',alignItems:'center',gap:6,fontSize:13,color:'var(--dim)',padding:'3px 0',borderBottom:'1px solid var(--border)'}}>
                  <span>{m.nombre.split(' ').slice(0,3).join(' ')}</span>
                  <DeltaPagos pasada={pasada} antepasada={antepasada} importe={importePasada}/>
                </div>
              )}
            </div>}
          </div>;
        }):pagosPorVendedorOrdenado.map(({m,pasada,antepasada,importePasada})=>
          <div key={m.numEmp||m.nombre} style={{display:'flex',justifyContent:'space-between',alignItems:'center',gap:6,padding:'6px 2px',borderBottom:'1px solid var(--border)'}}>
            <span style={{fontSize:13,fontWeight:600}}>{m.nombre.split(' ').slice(0,3).join(' ')}</span>
            <DeltaPagos pasada={pasada} antepasada={antepasada} importe={importePasada}/>
          </div>
        )}
        <p style={{fontSize:12,color:'var(--dim)',marginTop:6,lineHeight:1.45}}>
          Informativo. Se toma la semana de pago de COMISIONES (columna V) de las cuentas instaladas hace 25 a 90 días — las mismas del panel de arriba. El importe es el de la semana {semanaPasadaNum}.
        </p>
      </PanelAcordeon>
    }

    <Card title="🚦 Semáforo del equipo">
      <SemBar/>
      <div style={{display:'flex',justifyContent:'space-around',marginTop:10,fontSize:14,color:'var(--dim)',fontWeight:600}}>
        <span>🟢 {verdes}</span><span>🟡 {amarillos}</span><span>🔴 {rojos}</span><span>⚪ {sinEval}</span>
      </div>
      {sinEval>0&&<p style={{fontSize:14,color:'var(--yellow)',marginTop:10,fontWeight:600}}>
        ⚠️ Falta{sinEval!==1?'n':''} <b>{sinEval}</b> por semaforizar — márcalos abajo, en Equipo.
      </p>}
    </Card>

    <Card title={esDirector?`👥 Distrito por Coach (${(coaches||[]).length} coaches · ${vendedores.length} vendedores)`
      :esLider?`👥 Equipo por Coach (${(coaches||[]).length})`
      :`👥 Equipo (${vendedores.length})`}>
      <p style={{fontSize:14,color:'var(--dim)',marginBottom:10,lineHeight:1.45}}>
        Toca el <b>nombre</b> para ver el detalle · toca la <b>pastilla de color</b> para poner el semáforo.
      </p>
      {sinEval>0&&<div style={{display:'flex',gap:8,alignItems:'center',padding:'10px 12px',borderRadius:10,background:'var(--ybg)',border:'1.5px solid var(--yellow)',marginBottom:10}}>
        <span style={{fontSize:18}}>⚪</span>
        <span style={{fontSize:14,fontWeight:600,color:'var(--yellow)',lineHeight:1.4}}>
          {sinEval} {sinEval===1?'vendedor sigue':'vendedores siguen'} sin semáforo. Todos deben tener uno.
        </span>
      </div>}
      {esLider?(coaches||[]).map(c=>{
        const vendCoach=vendedoresPorCoach[c.nombre]||[];
        const key=c.nombre;
        const isExp=expandedCoachEquipo===key;
        const v=vendCoach.filter(m=>semColor(m.nombre)==='verde').length;
        const a=vendCoach.filter(m=>semColor(m.nombre)==='amarillo').length;
        const r=vendCoach.filter(m=>semColor(m.nombre)==='rojo').length;
        const sinEv2=vendCoach.length-v-a-r;
        // Mismos totales que la caja "🛒 Ventas" de cada vendedor (ContextCard), pero sumados entre
        // todos los vendedores del coach.
        let opSemana=0,valSemana=0,instSemana=0,opMes=0,valMes=0,instMes=0,metaMesCoach=0;
        vendCoach.forEach(m=>{
          const fSem=funnelPeriodo(m.ventas,semanaIni,semanaFin);
          const fMes=funnelPeriodo(m.ventas,mesIni,mesFin);
          opSemana+=fSem.oportunidades;valSemana+=fSem.validadas;instSemana+=fSem.instaladas;
          opMes+=fMes.oportunidades;valMes+=fMes.validadas;instMes+=fMes.instaladas;
          metaMesCoach+=metaMensual(m.badge);
        });
        return <div key={key}>
          <div onClick={()=>setExpandedCoachEquipo(isExp?null:key)} style={{
            display:'flex',alignItems:'center',justifyContent:'space-between',
            padding:'8px 10px',borderRadius:isExp?'8px 8px 0 0':8,marginBottom:isExp?0:4,cursor:'pointer',
            background:r>0?'var(--rbg)':a>0?'var(--ybg)':'transparent',
            border:`1px solid ${r>0?'var(--red)':a>0?'var(--yellow)':'var(--border)'}`,
            borderBottom:isExp?'none':undefined,
          }}>
            <div style={{flex:1}}>
              <div style={{fontSize:14,fontWeight:700}}>{c.nombre.split(' ').slice(0,3).join(' ')}</div>
              {/* El director ve coaches de varios líderes juntos: sin esto no se sabe de quién es cuál. */}
              {esDirector&&c.reportaA&&<div style={{fontSize:12,color:'var(--accent)',fontWeight:600,marginTop:1}}>⭐ {nombreCorto(c.reportaA)}</div>}
              <div style={{fontSize:12,color:'var(--dim)',marginTop:1}}>{vendCoach.length} vendedor{vendCoach.length!==1?'es':''} · 🟢{v} 🟡{a} 🔴{r} ⚪{sinEv2}</div>
              <div style={{fontSize:12,color:'var(--dim)',marginTop:2}}>Semana: {opSemana} op · {valSemana} val · {instSemana} inst</div>
              <div style={{fontSize:12,color:'var(--dim)',marginTop:1}}>Mes: {opMes} op · {valMes} val · {instMes} inst</div>
              {metaMesCoach>0&&<div style={{fontSize:12,color:'var(--dim)',marginTop:1}}>🎯 Meta del mes: <b>{instMes}/{metaMesCoach}</b></div>}
            </div>
            <span style={{fontSize:13,color:'var(--dim)'}}>{isExp?'▲':'▼'}</span>
          </div>
          {isExp&&<div style={{border:'1px solid var(--border)',borderTop:'none',borderRadius:'0 0 8px 8px',padding:'8px',marginBottom:4}}>
            {vendCoach.length===0?<p style={{fontSize:13,color:'var(--dim)'}}>Sin vendedores asignados.</p>:
            vendCoach.map(m=><VendedorRow key={m.numEmp||m.nombre} m={m} nested/>)}
          </div>}
        </div>;
      }):vendedores.map(m=><VendedorRow key={m.numEmp||m.nombre} m={m}/>)}
    </Card>

    {compPendientes.length>0&&
      <Card title={`⏰ Compromisos por revisar (${compPendientes.length})`} style={{borderLeft:'4px solid var(--yellow)'}}>
        {compPendientes.slice(0,5).map(r=><div key={r.id} style={{fontSize:13,padding:'6px 0',borderBottom:'1px solid var(--border)'}}>
          <div style={{display:'flex',justifyContent:'space-between'}}><b>{r.vendedor}</b><span style={{color:'var(--dim)'}}>{fmt(r.fecha_revision)}</span></div>
          <p style={{color:'var(--dim)',margin:'2px 0 0'}}>{r.compromisos?.slice(0,100)}{r.compromisos?.length>100?'...':''}</p>
        </div>)}
      </Card>
    }

    <Card title="⚡ Acciones rápidas">
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8}}>
        <Btn onClick={()=>setTab('arranque')} variant="secondary" style={{fontSize:14}}>☀️ Arranque</Btn>
        <Btn onClick={()=>setTab('cierre')} variant="secondary" style={{fontSize:14}}>🌙 Cierre</Btn>
        <Btn onClick={()=>setTab('feedback')} variant="secondary" style={{fontSize:14}}>💬 Hallazgo</Btn>
        <Btn onClick={()=>setTab('plan')} variant="secondary" style={{fontSize:14}}>📊 Plan</Btn>
      </div>
    </Card>
  </div>;
}

// ─── Historial ───
function HistorialTab({data,setData,toast,session}){
  const[filter,setFilter]=useState('todos');const[dateF,setDateF]=useState('');
  const[verFoto,setVerFoto]=useState(null);
  // 'dispositivo' (los registros propios: de este teléfono, o los de esa persona reconstruidos
  // del Sheet en la vista prestada del director) | 'equipo' (los de todo su equipo, del Sheet).
  const[vista,setVista]=useState('dispositivo');
  const enVista=!!session?.verComo;
  const[equipoRecs,setEquipoRecs]=useState([]);
  const[cargandoEquipo,setCargandoEquipo]=useState(false);
  // Nombres cuyos registros puede ver este usuario: los suyos propios y los de su equipo.
  const nombresEquipo=new Set([session?.user?.nombre,...(session?.team||[]).map(m=>m.nombre),...(session?.coaches||[]).map(m=>m.nombre)].filter(Boolean));
  const HOJAS_EQUIPO=Object.keys(HOJA_POR_TIPO);
  useEffect(()=>{
    if(vista!=='equipo')return;
    setCargandoEquipo(true);
    const hojas=filter==='todos'?HOJAS_EQUIPO:[filter];
    Promise.all(hojas.map(tipo=>fetchHistorialEquipo(HOJA_POR_TIPO[tipo],session.token,session.verComo).then(regs=>regs.map(r=>({...r,_tipo:tipo})))))
      .then(resultados=>{
        const todos=resultados.flat().filter(r=>nombresEquipo.has(r['Registrado por']));
        todos.sort((a,b)=>String(b['Timestamp']||'').localeCompare(String(a['Timestamp']||'')));
        setEquipoRecs(todos);
        setCargandoEquipo(false);
      });
  },[vista,filter]);
  const typeL={arranque:'☀️ Arranque',cierre:'🌙 Cierre',permiso:'📋 Permiso',plan:'📊 Plan',plan_resultado:'📊 Resultado Plan',feedback:'💬 Hallazgo',semaforo:'🚦 Semáforo'};
  const recs=data.records.filter(r=>filter==='todos'||r.type===filter).filter(r=>!dateF||r.date===dateF).sort((a,b)=>b.savedAt.localeCompare(a.savedAt));
  const del=id=>{if(enVista)return;if(!confirm('¿Eliminar?'))return;const upd={...data,records:data.records.filter(r=>r.id!==id)};setData(upd);saveData(upd);toast('Eliminado');};
  // Si ya se subió a Drive, `src` es una liga (no una foto embebida) — no carga como <img>,
  // así que se ofrece como botón para abrirla, en vez de intentar mostrarla en línea.
  const FotoMini=({src,style:s})=>{
    if(!src?.startsWith('data:'))return <a href={src} target="_blank" rel="noopener noreferrer" style={{display:'inline-flex',alignItems:'center',gap:6,padding:'8px 12px',borderRadius:8,background:'var(--accent-light)',color:'var(--accent)',fontSize:13,fontWeight:700,textDecoration:'none',...s}}>📷 Ver foto (Drive)</a>;
    return <img src={src} alt="" onClick={()=>setVerFoto(src)} style={{width:'100%',objectFit:'cover',borderRadius:8,cursor:'pointer',...s}}/>;
  };
  const detail=r=>{
    switch(r.type){
      case'arranque':return <div style={{fontSize:14}}><p><b>Presentes:</b> {r.presentes?.length||0} · <b>Ausentes:</b> {r.ausentes?.length||0}</p>{r.ausentes?.map(a=><div key={a.name} style={{margin:'2px 0'}}><p style={{color:'var(--red)',margin:0}}>✗ {a.name}: {a.reason}{a.detail?` — ${a.detail}`:''}</p>{a.photo&&<FotoMini src={a.photo} style={{maxHeight:160,marginTop:4}}/>}</div>)}{r.notas&&<p style={{marginTop:6}}>{r.notas}</p>}{r.photo&&<FotoMini src={r.photo} style={{maxHeight:120,marginTop:6}}/>}</div>;
      case'permiso':return <div style={{fontSize:14}}><p><b>{r.vendedor}</b> — {r.tipo}</p><p>{r.motivo}</p>{r.compromiso&&(r.compromiso.cuentas||r.compromiso.ventas||r.compromiso.instalaciones)&&<p>🎯 Compromiso: {r.compromiso.cuentas||0} cuentas · {r.compromiso.ventas||0} ventas · {r.compromiso.instalaciones||0} instal.</p>}{r.colonia&&<p>📍 {r.colonia}</p>}{r.autorizado_por&&<p style={{color:'var(--dim)'}}>Autorizado: {r.autorizado_por}</p>}{r.photo&&<FotoMini src={r.photo} style={{maxHeight:160,marginTop:6}}/>}</div>;
      case'cierre':return <div style={{fontSize:14}}>
        {r.resultados?.filter(x=>x.oportunidades||x.validadas||x.instaladas||x.pagadasHoy||x.pendiente).map((x,i)=>
          <div key={i} style={{fontSize:13,padding:'3px 0',borderBottom:'1px solid var(--border)'}}>
            <b>{x.nombre}:</b> {x.oportunidades||0} op · {x.validadas||0} val · {x.instaladas||0} inst{x.pagadasHoy?` · ${x.pagadasHoy} cta(s) pagada(s) hoy`:''}
            {x.pendiente&&<div style={{color:'var(--dim)'}}>Pendiente: {x.pendiente}</div>}
          </div>
        )}
        {r.incidencias&&<p style={{marginTop:4}}><b>Incidencias:</b> {r.incidencias}</p>}
        {r.seguimiento?.length>0&&<div style={{marginTop:4}}>
          <b>Seguimiento mañana:</b>
          {r.seguimiento.map((s,i)=><p key={i} style={{fontSize:13,margin:'2px 0'}}>• {s.name}{s.motivo?`: ${s.motivo}`:''}</p>)}
        </div>}
        {/* Compatibilidad con cierres guardados antes de este cambio */}
        {r.resultado&&<p><b>Resultado:</b> {r.resultado}</p>}
        {r.pendientes&&<p><b>Pendientes:</b> {r.pendientes}</p>}
        {r.vendedores_seguimiento&&<p><b>Seguimiento:</b> {r.vendedores_seguimiento}</p>}
      </div>;
      case'plan':return <div style={{fontSize:14}}>
        <p><b>Semana:</b> {r.semanaLabel||''}</p>
        {r.objetivos&&<p>🎯 Oport: {r.objetivos.oportunidades||0} (meta {r.metaOficial?.oportunidades??'-'}) · Ventas: {r.objetivos.ventas||0} (meta {r.metaOficial?.ventas??'-'}) · Instal: {r.objetivos.instalaciones||0} (meta {r.metaOficial?.instalaciones??'-'})</p>}
        {r.objetivos&&<p>NPPF: {r.objetivos.cuentasRecuperadas||0} · ARPU: {r.objetivos.arpu||0}</p>}
        {r.prioridades&&<p><b>Prioridades:</b> {r.prioridades}</p>}
        {r.vendedores_acompanar&&<p><b>Acompañamientos:</b> {r.vendedores_acompanar}</p>}
        {zonasATexto(r.zonas)&&<div style={{marginTop:4}}>
          <b>Zonas:</b>
          {zonasATexto(r.zonas).split('\n').map((linea,i)=><p key={i} style={{margin:'2px 0'}}>• {linea}</p>)}
        </div>}
        {r.resultado_esperado&&<p><b>Resultado esperado:</b> {r.resultado_esperado}</p>}
        {/* Compatibilidad con planes guardados antes de este cambio */}
        {r.objetivo&&<p><b>Objetivo:</b> {r.objetivo}</p>}
      </div>;
      case'plan_resultado':{
        const pctKpi=(k)=>{const o=Number(r.objetivos?.[k])||0;const v=Number(r.resultados?.[k])||0;return o?Math.round(v/o*100):null;};
        return <div style={{fontSize:14}}>
          <p><b>Semana:</b> {r.semanaLabel||''}</p>
          {['oportunidades','ventas','instalaciones'].map(k=>{
            const p=pctKpi(k);
            return <p key={k} style={{margin:'2px 0'}}>{k[0].toUpperCase()+k.slice(1)}: {r.resultados?.[k]||0}{r.objetivos?.[k]!=null&&` / obj. ${r.objetivos[k]}`}{p!=null&&<b style={{marginLeft:6,color:p>=95?'var(--green)':p>=60?'var(--yellow)':'var(--red)'}}>{p}%</b>}</p>;
          })}
          <p>NPPF: {r.resultados?.cuentasRecuperadas||0} · ARPU: {r.resultados?.arpu||0}</p>
        </div>;
      }
      case'feedback':return <div style={{fontSize:14}}><div style={{display:'flex',alignItems:'center',gap:8,marginBottom:4}}><b>{r.vendedor}</b> — {r.tipo}<StatusBadge status={r.semaforo} small/></div>{r.hallazgos&&<p>{r.hallazgos}</p>}{r.compromisos&&<p><b>Compromisos:</b> {r.compromisos}</p>}{r.transcript&&<p style={{fontStyle:'italic',background:'var(--bg)',padding:8,borderRadius:6,marginTop:4}}>🎙️ {r.transcript.slice(0,200)}{r.transcript.length>200?'...':''}</p>}{r.photo&&<FotoMini src={r.photo} style={{maxHeight:160,marginTop:6}}/>}{r.fotos?.length>0&&<div style={{display:'flex',flexWrap:'wrap',gap:6,marginTop:6}}>{r.fotos.map((p,i)=><FotoMini key={i} src={p} style={{width:90,height:90,maxHeight:90}}/>)}</div>}</div>;
      case'semaforo':return <div style={{fontSize:14}}>
        <p><b>{r.vendedor}</b> — {SEM_EMOJI[r.semaforo]||'⚪'} {STATUS[r.semaforo]?.label||r.semaforo}</p>
        {r.nota&&<p style={{color:'var(--dim)'}}>{r.nota}</p>}
      </div>;
      default:return null;
    }
  };
  // Detalle para registros que vienen del Sheet (vista "Equipo"): las columnas ya son texto
  // legible tal cual el Apps Script las guardó, no hay que reconstruir estructuras.
  const detailEquipo=(tipo,r)=>{
    switch(tipo){
      case'arranque':{
        const fotosAus=parseFotosAusentes(r['Fotos evidencia ausentes']);
        return <>
          <p style={{fontSize:14}}><b>Presentes:</b> {r['Presentes']} · <b>Ausentes:</b> {r['Ausentes']}</p>
          {r['Detalle ausentes']&&<p style={{fontSize:13,color:'var(--red)',margin:'2px 0'}}>{r['Detalle ausentes']}</p>}
          {r['Compromisos del día']&&<p style={{fontSize:13,margin:'2px 0'}}>🎯 {r['Compromisos del día']}</p>}
          {r['Notas']&&<p style={{fontSize:14,marginTop:4}}>{r['Notas']}</p>}
          {(r['Foto grupo']||r['Foto grupo subida'])&&<div style={{marginTop:6,display:'flex',gap:6}}>
            {r['Foto grupo']&&<FotoMini src={r['Foto grupo']}/>}
            {r['Foto grupo subida']&&<FotoMini src={r['Foto grupo subida']}/>}
          </div>}
          {fotosAus.length>0&&<div style={{marginTop:6,display:'flex',flexWrap:'wrap',gap:6}}>
            {fotosAus.map((f,j)=><a key={j} href={f.url} target="_blank" rel="noopener noreferrer" style={{display:'inline-flex',alignItems:'center',gap:6,padding:'6px 10px',borderRadius:8,background:'var(--rbg)',color:'var(--red)',fontSize:13,fontWeight:700,textDecoration:'none'}}>📷 {f.nombre}</a>)}
          </div>}
        </>;
      }
      case'cierre':return <>
        {r['Resultados por vendedor']&&<p style={{fontSize:14}}>{r['Resultados por vendedor']}</p>}
        {r['Incidencias']&&<p style={{fontSize:14}}><b>Incidencias:</b> {r['Incidencias']}</p>}
        {r['Seguimiento mañana']&&<p style={{fontSize:14}}><b>Seguimiento mañana:</b> {r['Seguimiento mañana']}</p>}
        {r['Notas']&&<p style={{fontSize:14}}>{r['Notas']}</p>}
      </>;
      case'permiso':return <>
        <p style={{fontSize:14}}><b>{r['Integrante']}</b> — {r['Tipo']}</p>
        {r['Motivo']&&<p style={{fontSize:14}}>{r['Motivo']}</p>}
        {(r['Compromiso Cuentas']||r['Compromiso Ventas']||r['Compromiso Instalaciones'])&&<p style={{fontSize:14}}>🎯 Compromiso: {r['Compromiso Cuentas']||0} cuentas · {r['Compromiso Ventas']||0} ventas · {r['Compromiso Instalaciones']||0} instal.</p>}
        {r['Colonia']&&<p style={{fontSize:14}}>📍 {r['Colonia']}</p>}
        {r['Autorizado por']&&<p style={{fontSize:13,color:'var(--dim)'}}>Autorizado: {r['Autorizado por']}</p>}
        {r['Foto evidencia']&&<FotoMini src={r['Foto evidencia']} style={{maxHeight:160,marginTop:6}}/>}
      </>;
      case'plan':return <>
        <p style={{fontSize:14}}><b>Semana:</b> {r['Semana']}</p>
        <p style={{fontSize:14}}>🎯 Oport: {r['Obj. Oportunidades']||0} (meta {r['Meta Oportunidades']??'-'}) · Ventas: {r['Obj. Ventas']||0} (meta {r['Meta Ventas']??'-'}) · Instal: {r['Obj. Instalaciones']||0} (meta {r['Meta Instalaciones']??'-'})</p>
        <p style={{fontSize:14}}>NPPF: {r['Obj. Cuentas recuperadas NPPF']||0} · ARPU: {fmtMoney(r['Obj. ARPU'])}</p>
        {r['Prioridades']&&<p style={{fontSize:14}}><b>Prioridades:</b> {r['Prioridades']}</p>}
        {r['Acompañamientos']&&<p style={{fontSize:14}}><b>Acompañamientos:</b> {r['Acompañamientos']}</p>}
        {r['Zonas']&&<p style={{fontSize:14}}><b>Zonas:</b> {r['Zonas']}</p>}
        {r['Resultado esperado']&&<p style={{fontSize:14}}><b>Resultado esperado:</b> {r['Resultado esperado']}</p>}
      </>;
      case'plan_resultado':return <>
        <p style={{fontSize:14}}><b>Semana:</b> {r['Semana']}</p>

const escapeHtml=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const REPORTE_TIPOS={
  arranque:{icon:'☀️',label:'Arranque',color:'#ca8a04'},
  cierre:{icon:'🌙',label:'Cierre',color:'#1e40af'},
  permiso:{icon:'📋',label:'Permiso',color:'#7c3aed'},
  plan:{icon:'📊',label:'Plan',color:'#16a34a'},
  plan_resultado:{icon:'📊',label:'Resultado Plan',color:'#16a34a'},
  feedback:{icon:'💬',label:'Hallazgo',color:'#dc2626'},
};
function reporteDetalleHTML(r){
  switch(r.type){
    case'arranque':
      return `<p><b>Presentes:</b> ${(r.presentes||[]).length} · <b>Ausentes:</b> ${(r.ausentes||[]).length}</p>`+
        (r.ausentes||[]).map(a=>`<p style="color:#dc2626;margin:2px 0">✗ ${escapeHtml(a.name)}: ${escapeHtml(a.reason)}${a.detail?' — '+escapeHtml(a.detail):''}</p>`).join('')+
        (r.notas?`<p>${escapeHtml(r.notas)}</p>`:'');
    case'permiso':
      return `<p><b>${escapeHtml(r.vendedor)}</b> — ${escapeHtml(r.tipo)}</p><p>${escapeHtml(r.motivo)}</p>`+(r.autorizado_por?`<p>Autorizado: ${escapeHtml(r.autorizado_por)}</p>`:'');
    case'cierre':
      return (r.resultados||[]).filter(x=>x.oportunidades||x.validadas||x.instaladas||x.pagadasHoy||x.pendiente)
        .map(x=>`<p style="margin:2px 0"><b>${escapeHtml(x.nombre)}:</b> ${x.oportunidades||0} op · ${x.validadas||0} val · ${x.instaladas||0} inst${x.pagadasHoy?` · ${x.pagadasHoy} pagada(s)`:''}${x.pendiente?`<br><span style="color:#6b7086">Pendiente: ${escapeHtml(x.pendiente)}</span>`:''}</p>`).join('')+
        (r.incidencias?`<p><b>Incidencias:</b> ${escapeHtml(r.incidencias)}</p>`:'')+
        ((r.seguimiento||[]).length?'<p><b>Seguimiento mañana:</b></p>'+r.seguimiento.map(s=>`<p style="margin:2px 0">• ${escapeHtml(s.name)}${s.motivo?': '+escapeHtml(s.motivo):''}</p>`).join(''):'');
    case'plan':{
      const o=r.objetivos||{},m=r.metaOficial||{};
      const zt=zonasATexto(r.zonas);
      return `<p>🎯 Oport: ${o.oportunidades||0} (meta ${m.oportunidades??'-'}) · Ventas: ${o.ventas||0} (meta ${m.ventas??'-'}) · Instal: ${o.instalaciones||0} (meta ${m.instalaciones??'-'})</p>`+
        `<p>NPPF: ${o.cuentasRecuperadas||0} · ARPU: ${escapeHtml(fmtMoney(o.arpu))}</p>`+
        (r.prioridades?`<p><b>Prioridades:</b> ${escapeHtml(r.prioridades)}</p>`:'')+
        (r.vendedores_acompanar?`<p><b>Acompañamientos:</b> ${escapeHtml(r.vendedores_acompanar)}</p>`:'')+
        (zt?`<p><b>Zonas:</b><br>${escapeHtml(zt).replace(/\n/g,'<br>')}</p>`:'')+
        (r.resultado_esperado?`<p><b>Resultado esperado:</b> ${escapeHtml(r.resultado_esperado)}</p>`:'');
    }
    case'plan_resultado':{
      const o=r.objetivos||{},res=r.resultados||{};
      const pct=(v,ob)=>ob?Math.round((Number(v)||0)/Number(ob)*100):null;
      return['oportunidades','ventas','instalaciones'].map(k=>{const p=pct(res[k],o[k]);return `<p style="margin:2px 0">${k[0].toUpperCase()+k.slice(1)}: ${res[k]||0}${o[k]!=null?` / obj. ${o[k]}`:''}${p!=null?` <b>${p}%</b>`:''}</p>`;}).join('')+
        `<p>NPPF: ${res.cuentasRecuperadas||0} · ARPU: ${escapeHtml(fmtMoney(res.arpu))}</p>`;
    }
    case'feedback':
      return `<p><b>${escapeHtml(r.vendedor)}</b> — ${escapeHtml(r.tipo)}${r.semaforo?` (${escapeHtml(STATUS[r.semaforo]?.label||'')})`:''}</p>`+
        (r.hallazgos?`<p>${escapeHtml(r.hallazgos)}</p>`:'')+(r.compromisos?`<p><b>Compromisos:</b> ${escapeHtml(r.compromisos)}</p>`:'');
    default:
      return'';
  }
}
function reporteRecordHTML(r){

// Reporte HTML autocontenido (imprimible / compartible) para reemplazar el respaldo en JSON crudo.

body{font-family:system-ui,-apple-system,sans-serif;background:#f0f2f8;color:#1a1d29;margin:0;padding:20px}

${cuerpo||'<p style="text-align:center;color:#6b7086;padding:40px">Sin registros.</p>'}

// Hoja para elegir a quién entrar (sus líderes en el primer nivel; los coaches de ese líder
// en el segundo). Las listas son cortas — no hace falta buscador.
function ModalElegirVista({titulo,opciones,onElegir,onCerrar}){
  return <div onClick={onCerrar} style={{position:'fixed',top:0,left:0,right:0,bottom:0,background:'rgba(0,0,0,.5)',zIndex:9998,display:'flex',alignItems:'flex-end',justifyContent:'center'}}>
    <div onClick={e=>e.stopPropagation()} style={{background:'var(--card)',width:'100%',maxWidth:600,borderRadius:'16px 16px 0 0',padding:18,maxHeight:'75vh',overflowY:'auto'}}>
      <h3 style={{margin:'0 0 4px',fontSize:16,fontWeight:800}}>{titulo}</h3>
      <p style={{margin:'0 0 12px',fontSize:13,color:'var(--dim)'}}>Verás la app tal como la ve esa persona, en modo consulta.</p>
      {opciones.length===0
        ?<p style={{color:'var(--dim)',fontSize:14}}>No hay nadie disponible en este nivel.</p>
        :opciones.map(o=>
          <button key={o.numEmp||o.nombre} onClick={()=>onElegir(o)}
            style={{display:'block',width:'100%',textAlign:'left',padding:'11px 12px',marginBottom:8,borderRadius:10,border:'1px solid var(--border)',background:'var(--input)',color:'var(--text)',cursor:'pointer'}}>
            <div style={{fontWeight:700,fontSize:14}}>{o.nombre}</div>
            <div style={{fontSize:13,color:'var(--dim)'}}>{o.posicion||''}</div>
          </button>)}
      <Btn variant="secondary" onClick={onCerrar} style={{width:'100%',marginTop:4}}>Cancelar</Btn>
    </div>
  </div>;
}
// Barra bajo el encabezado, solo para el Director: entra a la vista de un líder y, desde ahí, a la
// de uno de sus coaches (nivel 0 = su propia vista, 1 = líder, 2 = coach), y regresa un nivel a la
// vez. En cada nivel las opciones son `coaches` de la sesión activa: para el director son sus
// líderes; dentro de la vista de un líder son los coaches de ese líder.
function BarraVistaDirector({sessionBase,vistas,onAbrir,onRegresar,onSalir,abriendo}){
  const[eligiendo,setEligiendo]=useState(false);
  const nivel=vistas.length;
  const actual=nivel?vistas[nivel-1]:null;
  // Nivel 0: los líderes del director (van en `lideres`, aparte de `coaches`, que ahora son
  // todos los coaches del distrito). Nivel 1: los coaches del líder en el que ya se entró.
  // El `||sessionBase.coaches` cubre una sesión guardada de antes de que existiera `lideres`.
  const opciones=(actual?actual.coaches:(sessionBase.lideres&&sessionBase.lideres.length?sessionBase.lideres:sessionBase.coaches))||[];
  const puedeBajar=nivel<2&&opciones.length>0;
  const ruta=vistas.map(v=>nombreCorto(v.user.nombre)).join(' › ');
  const chip={fontSize:13,fontWeight:700,padding:'6px 10px',borderRadius:8,border:'none',cursor:abriendo?'default':'pointer'};
  return <>
    <div style={{display:'flex',alignItems:'center',gap:6,flexWrap:'wrap',padding:'8px 14px',background:nivel?'var(--ybg)':'var(--accent-light)',borderBottom:'1px solid var(--border)'}}>
      <span style={{flex:1,minWidth:150,fontSize:13,fontWeight:700,color:nivel?'var(--yellow)':'var(--accent)'}}>
        {nivel?`👁️ Viendo como ${ruta} · solo consulta`:'👔 Estás en tu vista de director'}
      </span>
      {puedeBajar&&<button onClick={()=>setEligiendo(true)} disabled={!!abriendo} style={{...chip,background:'var(--accent)',color:'#fff',opacity:abriendo?.6:1}}>
        {abriendo?'Abriendo…':nivel===0?'👁️ Ver como líder':'👁️ Ver un coach'}
      </button>}
      {nivel>0&&<button onClick={onRegresar} disabled={!!abriendo} style={{...chip,background:'var(--card)',color:'var(--text)',border:'1px solid var(--border)'}}>← Regresar</button>}
      {nivel>1&&<button onClick={onSalir} disabled={!!abriendo} style={{...chip,background:'var(--card)',color:'var(--dim)',border:'1px solid var(--border)'}}>Salir de la vista</button>}
    </div>
    {eligiendo&&<ModalElegirVista
      titulo={nivel===0?'Ver la app como uno de tus líderes':'Ver la app como uno de sus coaches'}
      opciones={opciones}
      onElegir={o=>{setEligiendo(false);onAbrir(o);}}
      onCerrar={()=>setEligiendo(false)}/>}
  </>;
}

function MainApp({session,setSession,onLogout,sessionBase,vistas,onAbrirVista,onRegresarVista,onSalirVista}){
  const[datosLocales,setDatosLocales]=useState(loadData());
  const[tab,setTab]=useState('dashboard');
  const[toastMsg,setToastMsg]=useState('');
  const toast=msg=>setToastMsg(msg);
  useEffect(()=>{retryPending(toast,setDatosLocales);},[]);
  const{user,team,coaches,role}=session;
  const enVista=!!session.verComo; // el director está viendo la app como un líder/coach suyo
  // Los registros guardados en ESTE teléfono son del director, no del líder/coach que está
  // viendo. Los de esa persona están en el Sheet (todo se sincroniza al guardar), así que se
  // traen de ahí y se reconstruyen a la forma local — con eso los contadores, el semáforo, el
  // plan de la semana y el historial se ven igual que en su propio teléfono, en vez de en 0.
  const[registrosVista,setRegistrosVista]=useState(null); // null = todavía cargando (ver efecto abajo)
  const data=enVista?{records:registrosVista||[],pendingSync:[]}:datosLocales;
  // En vista prestada nada se guarda (los botones de captura ya están bloqueados) — este setter
  // vacío evita además que algo escriba en localStorage los registros de otra persona.
  const setData=enVista?(()=>{}):setDatosLocales;
  const allTeam=[...(coaches||[]),...team];
  // Líder y Director supervisan a través de coaches (el director, los de todos sus líderes).
  const supervisaCoaches=role==='lider'||role==='director';
  const chipsEquipo=role==='director'?(session.lideres||[]):role==='lider'?(coaches||[]):[];
  const todayRecs=data.records.filter(r=>r.date===today());
  const hasArr=todayRecs.some(r=>r.type==='arranque');
  const hasCie=todayRecs.some(r=>r.type==='cierre');
  const roleLabels={coach:'🏅 Coach',lider:'⭐ Líder',director:'👔 Director',gestor:'🧑‍💼 Gestor CH'};

  // Botón flotante "Actualizar información" (todos los roles): re-trae ranking/ventas/cuentas del
  // equipo y fuerza a Arranque/Plan/Permisos a releer el historial del Sheet sin recargar la app.
  // La sesión se guarda en localStorage y sobrevive a cerrar la app por completo, así que sin esto
  // los datos podrían quedarse desactualizados indefinidamente entre una conexión y la siguiente.
  const[refreshKey,setRefreshKey]=useState(0);
  const[refreshing,setRefreshing]=useState(false);

  // Vista prestada: traer del Sheet los registros de esa persona (al entrar, al cambiar de
  // persona y al tocar "Actualizar información"). `cancelado` evita que una respuesta lenta de
  // la vista anterior pise a la nueva si se cambia de persona antes de que llegue.
  useEffect(()=>{
    if(!enVista){setRegistrosVista(null);return;}
    let cancelado=false;
    setRegistrosVista(null);
    fetchRegistrosPropiosDelSheet(session).then(recs=>{if(!cancelado)setRegistrosVista(recs);});
    return()=>{cancelado=true;};
  },[session.verComo,refreshKey]);
  const actualizarInfo=async()=>{
    if(refreshing)return;
    setRefreshing(true);
    try{
      // En vista prestada se refresca esa vista (sin tocar lo guardado en localStorage, que
      // sigue siendo la sesión propia del director); en la propia, el refresco de siempre.
      if(enVista)setSession(await cargarVistaComo(session.token,{numEmp:session.verComo}));
      else await refrescarYPersistirSesion(session,setSession);
      setRefreshKey(k=>k+1);
      toast('🔄 Información actualizada');
    }catch(e){
      console.error(e);
      if(esSesionExpirada(e)){
        toast('⚠️ Tu sesión expiró, vuelve a iniciar sesión');
        onLogout();
      }else{
        toast('⚠️ No se pudo actualizar, intenta de nuevo');
      }
    }
    setRefreshing(false);
  };

  // Entrar a la vista de un líder/coach: traer su sesión completa toma unos segundos (perfil +
  // ranking + ventas), así que el botón avisa que está abriendo y la app se queda usable mientras.
  const[abriendoVista,setAbriendoVista]=useState('');
  const abrirVista=async objetivo=>{
    if(abriendoVista)return;
    setAbriendoVista(objetivo.nombre||'…');
    try{
      await onAbrirVista(objetivo);
      setTab('dashboard');
      toast(`👁️ Viendo como ${nombreCorto(objetivo.nombre)}`);
    }catch(e){
      console.error(e);
      if(esSesionExpirada(e)){
        toast('⚠️ Tu sesión expiró, vuelve a iniciar sesión');
        onLogout();
      }else toast('⚠️ No se pudo abrir esa vista, intenta de nuevo');
    }
    setAbriendoVista('');
  };

  const exportReporte=()=>{
    const html=generarReporteHTML(data,user,roleLabels[role]);
    const blob=new Blob([html],{type:'text/html'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`reporte-supervision-${today()}.html`;a.click();toast('📥 Reporte descargado');
  };

  // 760 y no 600: con la letra ya en su tamaño bueno, a 600 los renglones del panel Equipo se
  // partían en dos en laptop. En celular no cambia nada, la pantalla nunca llega a ese ancho.
  return <div style={{maxWidth:760,margin:'0 auto',minHeight:'100vh',background:'var(--bg)'}}>
    {/* Header */}
    <div style={{padding:'12px 16px',background:'linear-gradient(135deg,#1e3a8a,#1e40af)',color:'#fff'}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
        <div>
          <h1 style={{margin:0,fontSize:17,fontWeight:800}}>Supervisión 2.0</h1>
          <p style={{margin:0,fontSize:13,opacity:.85}}>{roleLabels[role]} · {user.nombre}</p>
        </div>
        <div style={{display:'flex',gap:6,alignItems:'center'}}>
          {hasArr&&<span style={{fontSize:15}}>☀️</span>}
          {hasCie&&<span style={{fontSize:15}}>🌙</span>}
          {/* El reporte se arma con los registros de este teléfono — en vista prestada no hay
              ninguno de esa persona, así que saldría en blanco: mejor no ofrecerlo ahí. */}
          {!enVista&&<button onClick={exportReporte} style={{background:'rgba(255,255,255,.15)',border:'none',borderRadius:8,padding:'5px 8px',color:'#fff',cursor:'pointer',fontSize:15}} title="Descargar reporte">📥</button>}
          <button onClick={onLogout} style={{background:'rgba(255,255,255,.15)',border:'none',borderRadius:8,padding:'5px 8px',color:'#fff',cursor:'pointer',fontSize:13,fontWeight:700}} title="Cerrar sesión">Salir</button>
        </div>
      </div>
    </div>

    {/* Cambio de vista (solo Director) */}
    {sessionBase.role==='director'&&<BarraVistaDirector
      sessionBase={sessionBase} vistas={vistas} abriendo={abriendoVista}
      onAbrir={abrirVista} onRegresar={onRegresarVista} onSalir={onSalirVista}/>}

    {/* Stats */}
    <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:6,padding:'10px 14px'}}>
      {[{l:'Hoy',v:todayRecs.length,c:'var(--accent)'},{l:'Equipo',v:team.length,c:'var(--green)'},{l:supervisaCoaches?'Coaches':'Total',v:supervisaCoaches?(coaches||[]).length:data.records.length,c:'#7c3aed'},{l:'Registros',v:data.records.length,c:'#ca8a04'}].map(s=>
        <div key={s.l} style={{background:'var(--card)',borderRadius:10,padding:'6px 8px',textAlign:'center',border:'1px solid var(--border)'}}>
          <div style={{fontSize:18,fontWeight:800,color:s.c}}>{s.v}</div>
          <div style={{fontSize:12,color:'var(--dim)',fontWeight:600,textTransform:'uppercase'}}>{s.l}</div>
        </div>
      )}
    </div>

    {/* Team info — el líder ve sus coaches; el director, sus líderes (sus coaches son decenas
        y no caben como chips: van agrupados en la tarjeta de Distrito por Coach del Dashboard). */}
    {chipsEquipo.length>0&&
      <div style={{padding:'0 14px 8px',display:'flex',gap:4,flexWrap:'wrap'}}>
        {chipsEquipo.map(c=><span key={c.nombre} style={{fontSize:13,background:'var(--accent-light)',color:'var(--accent)',padding:'2px 8px',borderRadius:10,fontWeight:600}}>{c.nombre.split(' ').slice(0,2).join(' ')}</span>)}
      </div>
    }

    {/* Ventas/ranking no cargaron: hay que decirlo con todas sus letras. Un Dashboard en ceros
        por una lectura fallida se ve idéntico a uno en ceros porque no hubo ventas, y así se
        han perdido horas buscando el problema del lado equivocado. */}
    {session.avisoDatos&&<p style={{margin:'0 14px 10px',fontSize:13,fontWeight:600,color:'var(--red)',background:'var(--rbg)',border:'1.5px solid var(--red)',borderRadius:8,padding:'9px 11px'}}>
      ⚠️ Esta vez {session.avisoDatos}. Los números de oportunidades, validadas e instaladas de abajo salen en cero por eso — no es que el equipo no haya vendido. Toca 🔄 para reintentar.
    </p>}

    {/* En vista prestada los registros de esa persona se leen del Sheet — mientras llegan, los
        contadores están incompletos y hay que decirlo, o se leerían como "no trabajó". */}
    {enVista&&<p style={{margin:'0 14px 10px',fontSize:13,color:'var(--dim)',background:'var(--card)',border:'1px dashed var(--border)',borderRadius:8,padding:'8px 10px'}}>
      {registrosVista===null
        ?`⏳ Cargando del Sheet los registros de ${nombreCorto(user.nombre)}…`
        :`📄 ${registrosVista.length} registro${registrosVista.length!==1?'s':''} de ${nombreCorto(user.nombre)} leídos del Sheet.`}
    </p>}

    {/* Tabs */}
    <div style={{display:'flex',overflowX:'auto',gap:0,padding:'0 10px',borderBottom:'1px solid var(--border)',background:'var(--card)',WebkitOverflowScrolling:'touch'}}>
      {TABS.map(t=><button key={t.id} onClick={()=>setTab(t.id)} style={{flex:'0 0 auto',padding:'10px 12px',border:'none',background:'transparent',cursor:'pointer',fontSize:13,fontWeight:600,color:tab===t.id?'var(--accent)':'var(--dim)',borderBottom:tab===t.id?'3px solid var(--accent)':'3px solid transparent',whiteSpace:'nowrap'}}><span style={{fontSize:16,display:'block'}}>{t.icon}</span>{t.label}</button>)}
    </div>

    {/* Content — la `key` cambia al entrar/salir de una vista prestada, para que las pestañas
        se vuelvan a montar de cero y no arrastren el formulario a medio llenar ni los paneles
        ya cargados de la persona anterior. */}
    <div key={session.verComo||'propia'} style={{padding:14,paddingBottom:30}}>
      {tab==='dashboard'&&<DashboardTab data={data} setData={setData} team={allTeam} coaches={coaches} session={session} setTab={setTab} toast={toast}/>}
      {tab==='arranque'&&<ArranqueTab data={data} setData={setData} team={allTeam} toast={toast} session={session} refreshKey={refreshKey}/>}
      {tab==='permisos'&&<PermisosTab data={data} setData={setData} team={allTeam} toast={toast} session={session} refreshKey={refreshKey}/>}
      {tab==='cierre'&&<CierreTab data={data} setData={setData} team={allTeam} toast={toast} session={session} refreshKey={refreshKey}/>}
      {tab==='plan'&&<PlanTab data={data} setData={setData} team={allTeam} toast={toast} session={session} refreshKey={refreshKey}/>}
      {tab==='feedback'&&<FeedbackTab data={data} setData={setData} team={allTeam} toast={toast} session={session} refreshKey={refreshKey}/>}
      {tab==='historial'&&<HistorialTab data={data} setData={setData} toast={toast} session={session}/>}
    </div>
    <button onClick={actualizarInfo} disabled={refreshing} title="Actualizar información"
      style={{position:'fixed',bottom:20,right:16,zIndex:50,width:52,height:52,borderRadius:'50%',
        background:'var(--accent)',color:'#fff',border:'none',boxShadow:'0 4px 14px rgba(0,0,0,.3)',
        fontSize:22,cursor:refreshing?'default':'pointer',display:'flex',alignItems:'center',justifyContent:'center'}}>
      {refreshing?<span style={{display:'inline-block',width:20,height:20,border:'2.5px solid rgba(255,255,255,.4)',borderTop:'2.5px solid #fff',borderRadius:'50%',animation:'spin .8s linear infinite'}}/>:'🔄'}
    </button>
    {toastMsg&&<Toast msg={toastMsg} onClose={()=>setToastMsg('')}/>}
  </div>;
}

// ═══ APP ROOT ═══
function App(){
  const[session,setSession]=useState(null);
  const[avisoSesion,setAvisoSesion]=useState('');
  // Pila de vistas prestadas del Director: [] = su propia vista, [líder] = viendo a un líder,
  // [líder, coach] = viendo a un coach de ese líder. "Regresar" saca la de arriba. Vive solo en
  // memoria: al recargar la app se entra siempre por la vista propia.
  const[vistas,setVistas]=useState([]);
  const vistaActiva=vistas.length?vistas[vistas.length-1]:null;
  const abrirVista=async objetivo=>{
    const vista=await cargarVistaComo(session.token,objetivo);
    setVistas(v=>[...v,vista]);
  };
  // MainApp trabaja con la sesión activa sin saber si es propia o prestada: este setter manda el
  // cambio a donde corresponde (la vista de arriba de la pila, o la sesión propia).
  const setSessionActiva=upd=>{
    if(vistas.length)setVistas(v=>[...v.slice(0,-1),typeof upd==='function'?upd(v[v.length-1]):upd]);
    else setSession(upd);
  };
  // localStorage (no sessionStorage): al reabrir la app en campo sin señal, se entra directo con
  // la última sesión guardada en vez de quedarse atorado en la pantalla de login. Si esa sesión
  // guardada quedó incompleta o de una versión vieja de la app (le falta token/user/role), se
  // descarta en vez de arriesgarse a que truene MainApp con datos a medias — mejor pedir login
  // una vez que dejar la app "rota" hasta que alguien la cierre y la abra de nuevo a mano.
  useEffect(()=>{
    try{
      const s=localStorage.getItem('sv2-session');
      if(!s)return;
      const parsed=JSON.parse(s);
      if(parsed&&parsed.token&&parsed.user&&parsed.role){
        const revivida=revivirFechasSesion(parsed);
        // Sesión que se guardó sin ventas por tamaño (ver guardarSesionLocal): arranca en ceros
        // hasta que termine el refresco de abajo, y eso hay que decirlo — reusa el mismo aviso
        // que cuando la lectura de ventas falla.
        if(parsed.sinVentasGuardadas)revivida.avisoDatos='las ventas no se guardaron en este dispositivo por su tamaño, se están volviendo a cargar';
        setSession(revivida);
        // La app ya abre al instante con lo guardado — de fondo, sin bloquear ni avisar, se
        // refresca contra el servidor. Así una sesión que quedó con ventas/ranking vacíos (por
        // ejemplo por una falla de red justo al guardarla la última vez) se autocorrige sola en
        // cuanto haya señal, sin que la persona tenga que saber que existe el botón "Actualizar
        // información" — antes se quedaba así indefinidamente hasta que alguien lo tocara a mano.
        // Si en cambio el token ya venció, ni esto ni el botón manual pueden renovarlo — hay que
        // mandar de vuelta al login (con un aviso) en vez de dejar la app viendo datos viejos para
        // siempre sin que la persona entienda por qué.
        refrescarYPersistirSesion(revivida,setSession).catch(e=>{
          if(esSesionExpirada(e)){
            localStorage.removeItem('sv2-session');
            setSession(null);
            setAvisoSesion('Tu sesión expiró. Vuelve a iniciar sesión con tu PIN.');
          }
        });
      }else localStorage.removeItem('sv2-session');
    }catch{localStorage.removeItem('sv2-session');}
  },[]);
  const logout=()=>{localStorage.removeItem('sv2-session');setVistas([]);setSession(null);};
  if(!session)return <LoginScreen onLogin={setSession} aviso={avisoSesion}/>;
  return <MainApp session={vistaActiva||session} setSession={setSessionActiva} onLogout={logout}
    sessionBase={session} vistas={vistas} onAbrirVista={abrirVista}
    onRegresarVista={()=>setVistas(v=>v.slice(0,-1))} onSalirVista={()=>setVistas([])}/>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
<script>
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('./sw.js').then(reg=>{
      // El navegador solo revisa si hay una versión nueva del shell de vez en cuando por su cuenta
      // — se fuerza aquí para que un despliegue nuevo se note lo antes posible al abrir la app.
      reg.update().catch(()=>{});
    }).catch(()=>{});
  });
  // Si mientras la app está abierta se activa una versión nueva del service worker (se acaba de
  // desplegar algo), se recarga sola en vez de quedarse corriendo con JS viejo hasta que alguien
  // la cierre y la vuelva a abrir a mano. "controllerchange" también dispara la PRIMERA vez que
  // esta pestaña queda bajo control de un service worker (no solo en una actualización real) —
  // se ignora esa primera vez para no recargar de más justo al abrir la app.
  let yaHuboControlador=!!navigator.serviceWorker.controller;
  let recargandoPorSW=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{
    if(!yaHuboControlador){yaHuboControlador=true;return;}
    if(recargandoPorSW)return;
    recargandoPorSW=true;
    location.reload();
  });
}
</script>
