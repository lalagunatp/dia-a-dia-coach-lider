<!-- React/ReactDOM/Babel vendorizados en ./vendor (mismo origen que este archivo, servidos por
     GitHub Pages) en vez de bajarlos de unpkg.com en cada arranque. Antes, aunque el HTML cargara
     bien desde GitHub Pages, el arranque completo dependía de que el navegador TAMBIÉN pudiera
     alcanzar un segundo origen distinto (unpkg.com/Cloudflare) — con una red que tuviera problemas
     específicamente con ese CDN (o solo con ese, no con Fastly/GitHub Pages), la app se quedaba en
     blanco aunque el resto sí cargara. Con todo bajo el mismo origen, un solo camino de red decide
     si la app arranca o no. Versión: react-dom 18.3.1, babel standalone 7.24.7. -->

<style>

<div id="root"></div>
<script type="text/babel">
const{useState,useEffect,useRef,useCallback}=React;

// ═══ CONFIG ═══
// Ya no queda ningún dato (ni siquiera el catálogo de Clusters/Colonias) leído directo del
// navegador por gviz — todo pasa por el servidor con token, ver apps-script.gs.
const DOPOST_URL='https://script.google.com/macros/s/AKfycbx7DYc01sJV7QJsA9kVdtgW0JOZdyySjLqqHzszA9qsDE3xt8kpr7SfrdF2KqseVTr0/exec';
// Con datos móviles inestables, un fetch a Apps Script puede quedarse colgado (ni resuelve ni
// truena) en vez de fallar rápido — sin este tope, eso dejaba el login (u otros fetch) esperando
// para siempre con el spinner puesto, sin ningún mensaje de error. 25s es holgado (Apps Script
// puede tardar varios segundos leyendo hojas grandes), pero acotado.
function fetchConTope(url,opts,ms=25000){
  return Promise.race([
    fetch(url,opts),
    new Promise((_,rej)=>setTimeout(()=>rej(new Error('La conexión está tardando demasiado, intenta de nuevo')),ms)),
  ]);
}
// Debe coincidir con VENTAS_LOOKBACK_MESES en apps-script.gs, que es donde de verdad se aplica
// el filtro ahora (obtenerVentasComisiones) — aquí solo se usa para que el navegador de "Ventas
// del equipo" en el Dashboard no deje hojear a un periodo más viejo del que el servidor trae.
const VENTAS_LOOKBACK_MESES=3;
// Meta semanal de instalaciones por ranking (misma convención que informeseguimiento/avancecomisiones).
const META_SEMANAL_RANKING={ENTRENAMIENTO:3,CONDICIONADO:3,BRONCE:3,PLATA:4,ORO:5,PLATINO:6,DIAMANTE:6};
const metaSemanal=badge=>META_SEMANAL_RANKING[badge]||0;
const metaMensual=badge=>Math.round(metaSemanal(badge)*4.33);

// ═══ HELPERS ═══
const today=()=>new Date().toISOString().slice(0,10);
const now=()=>new Date().toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'});
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const fmt=d=>{if(!d)return'';const p=d.split('-');return`${p[2]}/${p[1]}/${p[0]}`};

const STATUS={
  verde:{bg:'var(--gbg)',border:'var(--green)',label:'Verde'},
  amarillo:{bg:'var(--ybg)',border:'var(--yellow)',label:'Amarillo'},
  rojo:{bg:'var(--rbg)',border:'var(--red)',label:'Rojo'},
};
const TABS=[
  {id:'dashboard',icon:'📈',label:'Dashboard'},
  {id:'plan',icon:'📊',label:'Plan'},
  {id:'arranque',icon:'☀️',label:'Arranque'},
  {id:'permisos',icon:'📋',label:'Permisos'},
  {id:'cierre',icon:'🌙',label:'Cierre'},
  {id:'feedback',icon:'💬',label:'Hallazgos'},
  {id:'historial',icon:'📁',label:'Historial'},
];
const ABSENCE_REASONS=['Falta justificada','Falta injustificada','Incapacidad','Permiso autorizado','Vacaciones','Retardo','Otro'];
const PERMISO_TIPOS=['Trabajo fuera de ruta','Trabajo por su cuenta','Salida anticipada','Llegada tardía','Cambio de zona','Actividad especial','Otro'];
const FEEDBACK_TIPOS=['Acompañamiento','Feedback 1 a 1','Revisión semanal','Incidencia operativa','Incidencia crítica','Retroalimentación','Evidencia de asignación externa','Otro'];
// Tipos de hallazgo que requieren foto sellada (como en Arranque) obligatoria.
const FEEDBACK_TIPOS_CON_FOTO=['Acompañamiento','Evidencia de asignación externa'];
const DIAS_SEMANA=['lunes','martes','miercoles','jueves','viernes','sabado','domingo'];
const DIAS_SEMANA_LABEL={lunes:'Lunes',martes:'Martes',miercoles:'Miércoles',jueves:'Jueves',viernes:'Viernes',sabado:'Sábado',domingo:'Domingo'};
const cycleS=c=>{const o=['verde','amarillo','rojo'];return o[(o.indexOf(c)+1)%3];};
// Compromiso vs. meta oficial: rojo si se comprometen por debajo, negro si es igual, verde si es mayor.
const colorVsMeta=(val,meta)=>{const v=Number(val)||0;if(!meta)return'var(--text)';if(v<meta)return'var(--red)';if(v>meta)return'var(--green)';return'#000';};

// ═══ STORAGE ═══
const LS_KEY='supervision-v2';
function loadData(){try{const d=localStorage.getItem(LS_KEY);return d?JSON.parse(d):{records:[],pendingSync:[]};}catch{return{records:[],pendingSync:[]};}}
function saveData(data){try{localStorage.setItem(LS_KEY,JSON.stringify(data));}catch(e){console.error(e);}}

// ═══ SYNC TO DIRECTOR'S SHEET ═══
async function sendToSheet(record){
  if(!DOPOST_URL)return{ok:false,error:'URL no configurada'};
  try{
    // Las fotos SÍ se envían: el Apps Script las sube a Drive y guarda la liga en el Sheet.
    const payload={...record};
    const res=await fetchConTope(DOPOST_URL,{method:'POST',body:JSON.stringify(payload),headers:{'Content-Type':'text/plain'}});
    const json=await res.json();
    return json;
  }catch(e){
    console.error('Sync error:',e);
    return{ok:false,error:e.message};
  }
}
// Guardar localmente + enviar al Sheet del Director
async function saveAndSync(data,record,toast,setData){
  saveData(data);
  if(DOPOST_URL){
    const result=await sendToSheet(record);
    if(!result.ok){
      // Guardar en cola pendiente para reintentar
      const pending=JSON.parse(localStorage.getItem('sv2-pending')||'[]');
      pending.push(record);
      localStorage.setItem('sv2-pending',JSON.stringify(pending));
      toast?.('⚠️ Guardado local — sin conexión al Sheet');
    }else if(setData&&(result.fotoGrupoUrl||result.fotosAusentes||result.fotoUrl||result.fotosEvidencia)){
      // Ya se subieron a Drive: se reemplaza la foto pesada (base64) local por la liga,
      // para que no se quede ocupando espacio en el teléfono.
      setData(d=>{
        const records=d.records.map(r=>{
          if(r.id!==record.id)return r;
          const upd={...r};
          if(result.fotoGrupoUrl)upd.photo=result.fotoGrupoUrl;
          if(result.fotoUrl)upd.photo=result.fotoUrl;
          if(result.fotosEvidencia)upd.fotos=result.fotosEvidencia;
          if(result.fotosAusentes&&upd.ausentes){
            upd.ausentes=upd.ausentes.map(a=>{
              const found=result.fotosAusentes.find(f=>f.name===a.name);
              return found?{...a,photo:found.url}:a;
            });
          }
          return upd;
        });
        const nuevo={...d,records};
        saveData(nuevo);
        return nuevo;
      });
    }
  }
}
// Reintentar pendientes
async function retryPending(toast,setData){
  if(!DOPOST_URL)return;
  const pending=JSON.parse(localStorage.getItem('sv2-pending')||'[]');
  if(pending.length===0)return;
  const still=[];
  for(const rec of pending){
    const r=await sendToSheet(rec);
    if(!r.ok){still.push(rec);continue;}
    if(setData&&(r.fotoGrupoUrl||r.fotosAusentes||r.fotoUrl||r.fotosEvidencia)){
      setData(d=>{
        const records=d.records.map(x=>{
          if(x.id!==rec.id)return x;
          const upd={...x};
          if(r.fotoGrupoUrl)upd.photo=r.fotoGrupoUrl;
          if(r.fotoUrl)upd.photo=r.fotoUrl;
          if(r.fotosEvidencia)upd.fotos=r.fotosEvidencia;
          if(r.fotosAusentes&&upd.ausentes){
            upd.ausentes=upd.ausentes.map(a=>{
              const found=r.fotosAusentes.find(f=>f.name===a.name);
              return found?{...a,photo:found.url}:a;
            });
          }
          return upd;
        });
        const nuevo={...d,records};
        saveData(nuevo);
        return nuevo;
      });
    }
  }
  localStorage.setItem('sv2-pending',JSON.stringify(still));
  if(still.length===0&&pending.length>0)toast?.('✅ Registros pendientes sincronizados');
}
// Historial del equipo leído del Sheet del Director (no solo lo capturado en este teléfono).
// `token` (emitido por fetchLogin) es obligatorio: el servidor valida la sesión y filtra
// el historial por jerarquía ahí mismo, ya no confía en que el cliente se autolimite.
async function fetchHistorialEquipo(hoja,token){
  if(!DOPOST_URL||!token)return[];
  try{
    const res=await fetchConTope(`${DOPOST_URL}?accion=historial&hoja=${encodeURIComponent(hoja||'ARRANQUE')}&token=${encodeURIComponent(token)}`);
    const json=await res.json();
    if(!json.ok)return[];
    return json.registros||[];
  }catch(e){console.error('Historial equipo fetch error:',e);return[];}
}
// "Nombre: liga; Nombre: liga" (como lo guarda el Apps Script) → [{nombre, url}]
function parseFotosAusentes(txt){
  if(!txt)return[];
  return String(txt).split(';').map(s=>s.trim()).filter(Boolean).map(s=>{
    const m=s.match(/^(.*?):\s*(https?:\/\/.+)$/);
    return m?{nombre:m[1].trim(),url:m[2].trim()}:{nombre:s,url:''};
  }).filter(f=>f.url);
}

function startOfWeek(date){ // lunes de la semana que contiene `date`
  const d=new Date(date);d.setHours(0,0,0,0);
  const diff=(d.getDay()+6)%7; // Mon=0..Sun=6
  d.setDate(d.getDate()-diff);
  return d;
}
function endOfWeek(date){
  const d=startOfWeek(date);
  d.setDate(d.getDate()+6);d.setHours(23,59,59,999);
  return d;
}
function startOfMonth(date){const d=new Date(date.getFullYear(),date.getMonth(),1);d.setHours(0,0,0,0);return d;}
function endOfMonth(date){const d=new Date(date.getFullYear(),date.getMonth()+1,0);d.setHours(23,59,59,999);return d;}
function enRango(fecha,inicio,fin){return fecha&&fecha>=inicio&&fecha<=fin;}
const fmtDateObj=d=>d?`${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`:'';
// yyyy-mm-dd en hora LOCAL (a diferencia de toISOString, que es UTC y puede recorrer la fecha un día).
const ymdLocal=d=>d?`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`:'';
const fmtMoney=n=>'$'+Number(n||0).toLocaleString('es-MX',{minimumFractionDigits:2,maximumFractionDigits:2});
const whatsappUrl=text=>`https://wa.me/?text=${encodeURIComponent(text)}`;
// Este estatus es la espera normal del primer pago del cliente, no algo accionable — no se muestra.
const ESTATUS_PAGO_OCULTO='COMISION RETENIDA AL PAGO DE LA PRIMER FACTURA DE SERVICIO';
const motivoNoPagado=c=>c.estatusPago&&c.estatusPago.toUpperCase()!==ESTATUS_PAGO_OCULTO?c.estatusPago:'';
function textoCuentasSinPagar(m,cuentas){
  const lineas=cuentas.map(c=>{
    const motivo=motivoNoPagado(c);
    return `• ${c.cuenta} · ${c.cliente} · ${fmtDateObj(c.fechaInstalacion)} · ${c.plan} · ${fmtMoney(c.importe)}${motivo?' · '+motivo:''}`;
  }).join('\n');
  return `📋 Cuentas sin pagar de ${m.nombre} (25 a 90 días de instaladas):\n\n${lineas}`;
}
function textoPendientesInstalar(m,pendientes,ref){
  const lineas=pendientes.map(v=>{
    const dias=Math.floor((ref-v.validacion)/86400000);
    const asig=(m.asignacionesPorOS||{})[v.os]||0;
    return `• ${v.cuenta} · ${v.os} · ${dias} día${dias!==1?'s':''} sin activar · ${asig} asignación${asig!==1?'es':''}`;
  }).join('\n');
  return `📋 Cuentas validadas sin instalar de ${m.nombre} (últ. 30 días):\n\n${lineas}`;
}
// Normaliza un día de zonas a {entradas,direccion,comentarios} — acepta también el formato
// viejo (un simple array de entradas) de planes guardados antes de agregar carpa/comentarios.
function diaZonas(zonas,d){
  const v=zonas?.[d];
  if(Array.isArray(v))return{entradas:v,direccion:'',comentarios:''};
  return v||{entradas:[],direccion:'',comentarios:''};
}
// Zonas por día ({lunes:{entradas:[{cluster,colonia}],direccion,comentarios},...}) → texto plano,
// una línea por día con actividad (zonas y/o punto de reunión y/o comentarios).
function zonasATexto(zonas){
  if(!zonas)return'';
  return DIAS_SEMANA.filter(d=>{
    const dz=diaZonas(zonas,d);
    return dz.entradas.length||dz.direccion||dz.comentarios;
  }).map(d=>{
    const dz=diaZonas(zonas,d);
    const partes=[];
    if(dz.entradas.length)partes.push(dz.entradas.map(e=>e.colonia?`${e.colonia} (${e.cluster})`:`${e.cluster} (todo)`).join(', '));
    if(dz.direccion)partes.push(`📍 ${dz.direccion}`);
    if(dz.comentarios)partes.push(`💬 ${dz.comentarios}`);
    return `${DIAS_SEMANA_LABEL[d]}: ${partes.join(' · ')}`;
  }).join('\n');
}
function textoPlan(rec){
  const o=rec.objetivos||{},m=rec.metaOficial||{};
  const lineas=[
    `📊 Plan de la semana — ${rec.semanaLabel}`,'',
    '🎯 Objetivo:',
    `• Oportunidades: ${o.oportunidades||0} (meta ${m.oportunidades??'-'})`,
    `• Ventas/validaciones: ${o.ventas||0} (meta ${m.ventas??'-'})`,
    `• Instalaciones: ${o.instalaciones||0} (meta ${m.instalaciones??'-'})`,
    `• Cuentas recuperadas NPPF: ${o.cuentasRecuperadas||0}`,
    `• ARPU: ${fmtMoney(o.arpu)}`,
  ];
  if(rec.prioridades)lineas.push('',`📌 Prioridades: ${rec.prioridades}`);
  if(rec.vendedores_acompanar)lineas.push('',`🤝 Acompañamientos: ${rec.vendedores_acompanar}`);
  const zt=zonasATexto(rec.zonas);
  if(zt)lineas.push('','🗺️ Zonas:',zt);
  if(rec.resultado_esperado)lineas.push('',`✅ Resultado esperado: ${rec.resultado_esperado}`);
  return lineas.join('\n');
}
function textoCierre(rec){
  const lineas=[`🌙 Cierre del día — ${fmt(rec.date)}${rec.time?' · '+rec.time:''}`,''];
  const resultados=(rec.resultados||[]).filter(x=>x.oportunidades||x.validadas||x.instaladas||x.pagadasHoy||x.pendiente);
  if(resultados.length){
    lineas.push('📊 Resultado del día:');
    resultados.forEach(x=>lineas.push(`• ${x.nombre}: ${x.oportunidades||0} op · ${x.validadas||0} val · ${x.instaladas||0} inst${x.pagadasHoy?` · ${x.pagadasHoy} pagada(s) hoy`:''}${x.pendiente?` — Pendiente: ${x.pendiente}`:''}`));
  }
  if(rec.incidencias)lineas.push('',`⚠️ Incidencias: ${rec.incidencias}`);
  if((rec.seguimiento||[]).length){
    lineas.push('','🔁 Seguimiento mañana:');
    rec.seguimiento.forEach(s=>lineas.push(`• ${s.name}${s.motivo?`: ${s.motivo}`:''}`));
  }
  if(rec.notas)lineas.push('',`📝 Notas: ${rec.notas}`);
  return lineas.join('\n');
}

// Login y refresco de sesión ahora se validan del lado del servidor (ver apps-script.gs:
// iniciarSesion/refrescarPerfil) — la app ya NO descarga el roster completo ni el PIN de
// nadie al navegador, ni decide aquí a quién le toca ver qué equipo. El servidor regresa
// solo lo que corresponde a este usuario, más un token firmado para las siguientes llamadas
// (historial, doPost) — así ya no hace falta reenviar el PIN después de este primer paso.
async function fetchLogin(numEmp,pin){
  try{
    const res=await fetchConTope(`${DOPOST_URL}?accion=login&numEmp=${encodeURIComponent(numEmp)}&pin=${encodeURIComponent(pin)}`);
    return await res.json();
  }catch(e){return{ok:false,error:'Error de conexión, intenta de nuevo'};}
}
// Re-trae team/coaches/role con el token (sin volver a pedir el PIN) — botón "Actualizar información".
async function fetchPerfil(token){
  try{
    const res=await fetchConTope(`${DOPOST_URL}?accion=perfil&token=${encodeURIComponent(token)}`);
    return await res.json();
  }catch(e){return{ok:false,error:'Error de conexión, intenta de nuevo'};}
}

// Ranking, ventas/comisiones y asignaciones ahora también se piden al servidor con el token
// (ver fetchVentasComisiones/fetchRanking) — comparte el mismo pipeline entre login y refresco.
async function enriquecerSesion({user,team,coaches,role},token){
  const[{rankEnt,rankMen},{ventasByVendedor,cuentasByHomologado,asignacionesPorOS}]=await Promise.all([fetchRanking(token),fetchVentasComisiones(token)]);
  const attachVentas=m=>({...m,
    ventas:ventasByVendedor[m.numEmp]||ventasByVendedor[m.numEmpB]||[],
    cuentasCom:cuentasByHomologado[m.numEmp]||cuentasByHomologado[m.numEmpB]||[],
    asignacionesPorOS,
  });
  return{
    user,
    team:sortByRanking(enrichTeam(team,rankEnt,rankMen).map(attachVentas)),
    coaches:sortByRanking(enrichTeam(coaches,rankEnt,rankMen).map(attachVentas)),
    role,
  };
}

// Re-ejecuta el pipeline de datos (ranking/ventas/cuentas/asignaciones) para la sesión ya
// autenticada — usado por el botón flotante "Actualizar información".
async function refrescarDatosSesion(token){
  const perfil=await fetchPerfil(token);
  if(!perfil.ok)throw new Error(perfil.error||'No se pudo actualizar la sesión');
  return enriquecerSesion(perfil,token);
}

// Vuelve a traer ranking/ventas/cuentas para una sesión ya autenticada, guarda el resultado en
// localStorage y actualiza el estado — usado tanto al abrir la app (automático, en segundo plano,
// para que una sesión guardada con ventas vacías por ejemplo por una falla de red se autocorrija
// sola) como por el botón flotante "Actualizar información" (manual).
async function refrescarYPersistirSesion(sesionBase,setSession){
  const nuevo=await refrescarDatosSesion(sesionBase.token);
  const nuevaSesion={...sesionBase,...nuevo,loginTime:new Date().toISOString()};
  // Descarta cualquier `allEmployees`/PIN que pudiera venir de una sesión guardada antes de este
  // cambio (el servidor ya nunca los manda, pero una sesión vieja guardada localmente sí podría
  // traerlos) — no se vuelven a persistir.
  delete nuevaSesion.allEmployees;
  if(nuevaSesion.user)delete nuevaSesion.user.pin;
  localStorage.setItem('sv2-session',JSON.stringify(nuevaSesion));
  setSession(nuevaSesion);
  return nuevaSesion;
}

// ═══ VENTAS, COMISIONES, ASIGNACIONES Y RANKING ═══
// Antes se leían directo de "BASE LA LAGUNA 2026" por gviz (obligaba a compartir ese Sheet
// ampliamente) — ahora el servidor hace la misma lectura y el mismo parseo dinámico de columnas
// de ranking (ver apps-script.gs: obtenerVentasComisiones/obtenerRanking), pero acotado por
// token a lo que le toca ver a cada quien. El shape que regresan sigue siendo el mismo de
// siempre, así que enrichTeam/attachVentas/funnelPeriodo/etc. no necesitaron ningún cambio.
// Las fechas viajan como texto ISO (JSON no tiene tipo Date) y se reconstruyen aquí.
const reviveFecha=s=>s?new Date(s):null;
// Si la fecha de validación quedó capturada a futuro (después de hoy), no cuenta como validada
// todavía — se trata como si no tuviera fecha de validación. Aplica solo a "validacion" (no a
// creacion/activacion/fechaInstalacion, que reviveFecha también reconstruye).
function reviveValidacion(s){
  const d=reviveFecha(s);
  if(!d)return d;
  const hoy=new Date();hoy.setHours(0,0,0,0);
  return d>hoy?null:d;
}

// Al guardar la sesión en localStorage (para poder abrir la app sin señal) las fechas dentro de
// ventas/cuentasCom se vuelven texto — igual que cuando viajan del servidor — y hay que
// reconstruirlas al leerla de vuelta, o cualquier código que espere un Date ahí (cuentasSinPagar,
// funnelPeriodo, etc.) truena. Los fetch frescos (login, "Actualizar información") no lo
// necesitan: ya pasan por reviveFecha en fetchVentasComisiones antes de guardarse.
function revivirFechasMiembro(m){
  return {
    ...m,
    ventas:(m.ventas||[]).map(v=>({...v,creacion:reviveFecha(v.creacion),validacion:reviveValidacion(v.validacion),activacion:reviveFecha(v.activacion)})),
    cuentasCom:(m.cuentasCom||[]).map(c=>({...c,fechaInstalacion:reviveFecha(c.fechaInstalacion)})),
  };
}
function revivirFechasSesion(session){
  return {
    ...session,
    team:(session.team||[]).map(revivirFechasMiembro),
    coaches:(session.coaches||[]).map(revivirFechasMiembro),
  };
}

async function fetchVentasComisiones(token){
  const vacio={ventasByVendedor:{},cuentasByHomologado:{},asignacionesPorOS:{}};
  if(!token)return vacio;
  try{
    const res=await fetchConTope(`${DOPOST_URL}?accion=ventas&token=${encodeURIComponent(token)}`);
    const json=await res.json();
    if(!json.ok){console.error('Ventas fetch error:',json.error);return vacio;}
    const ventasByVendedor={};
    Object.entries(json.ventasByVendedor||{}).forEach(([k,lista])=>{
      ventasByVendedor[k]=lista.map(v=>({...v,creacion:reviveFecha(v.creacion),validacion:reviveValidacion(v.validacion),activacion:reviveFecha(v.activacion)}));
    });
    const cuentasByHomologado={};
    Object.entries(json.cuentasByHomologado||{}).forEach(([k,lista])=>{
      cuentasByHomologado[k]=lista.map(c=>({...c,fechaInstalacion:reviveFecha(c.fechaInstalacion)}));
    });
    return{ventasByVendedor,cuentasByHomologado,asignacionesPorOS:json.asignacionesPorOS||{}};
  }catch(e){console.error('Ventas fetch error:',e);return vacio;}
}

async function fetchRanking(token){
  const vacio={rankEnt:{},rankMen:{}};

  try{

// Caché en localStorage de catálogos (clusters/colonias, PDV): si no hay señal en campo, se usa
// el último catálogo descargado en vez de dejar el formulario de Plan/Permisos sin opciones.
function cacheCatalogo(key,list){try{localStorage.setItem('sv2-cat-'+key,JSON.stringify(list));}catch{}}
function leerCatalogoCache(key){try{const s=localStorage.getItem('sv2-cat-'+key);return s?JSON.parse(s):[];}catch{return[];}}

// Catálogo de zonas para el Plan: hoja "Clusters Colonias" del mismo archivo base (Distrito La
// Laguna). Antes se leía por gviz directo del navegador (exigía que ese archivo tuviera enlace
// público) — ahora pasa por el Apps Script con token, igual que el resto, así el archivo ya puede
// restringirse a solo la cuenta del script sin romper nada (ver apps-script.gs: obtenerClusters).
async function fetchClustersColonias(token){
  if(!token)return leerCatalogoCache('clusters');
  try{
    const res=await fetchConTope(`${DOPOST_URL}?accion=clusters&token=${encodeURIComponent(token)}`);
    const json=await res.json();
    if(!json.ok){console.error('Clusters/Colonias fetch error:',json.error);return leerCatalogoCache('clusters');}
    cacheCatalogo('clusters',json.clusters||[]);
    return json.clusters||[];
  }catch(e){console.error('Clusters/Colonias fetch error:',e);return leerCatalogoCache('clusters');}
}
function buildClusterMap(list){
  const clusterToColonias={},coloniaToCluster={};
  list.forEach(({cluster,colonia})=>{
    (clusterToColonias[cluster]=clusterToColonias[cluster]||[]).push(colonia);
    coloniaToCluster[colonia]=cluster;
  });
  return{clusterToColonias,coloniaToCluster,clusters:Object.keys(clusterToColonias).sort()};
}
// Catálogo de Puntos de Venta (hoja "PDV", columna A) — Plan de Coach Promovendedor Punto de Venta.
async function fetchPDV(token){
  if(!token)return leerCatalogoCache('pdv');
  try{
    const res=await fetchConTope(`${DOPOST_URL}?accion=pdv&token=${encodeURIComponent(token)}`);
    const json=await res.json();

// Oportunidades validadas en los últimos 30 días que todavía no se instalan.
function pendientesInstalar30d(ventas,ref){
  const desde=new Date(ref);desde.setDate(desde.getDate()-30);desde.setHours(0,0,0,0);
  return(ventas||[]).filter(v=>v.estatus!=='Rechazada'&&v.validacion&&!v.activacion&&enRango(v.validacion,desde,ref));
}

// Funnel de oportunidades de un vendedor en un periodo (semana o mes): creadas / validadas / instaladas.
function funnelPeriodo(ventas,inicio,fin){
  const f={oportunidades:0,validadas:0,instaladas:0};
  (ventas||[]).forEach(v=>{
    if(enRango(v.creacion,inicio,fin))f.oportunidades++;
    if(v.validacion&&enRango(v.validacion,inicio,fin))f.validadas++;
    if(v.activacion&&enRango(v.activacion,inicio,fin))f.instaladas++;
  });
  return f;
}
// ARPU promedio (columna S de BASE DE DATOS, sin IVA ÷1.16) de las ventas activadas/instaladas de
// un vendedor en un periodo.
function arpuPromedioPeriodo(ventas,inicio,fin){
  const activadas=(ventas||[]).filter(v=>v.activacion&&enRango(v.activacion,inicio,fin));
  if(!activadas.length)return 0;
  return activadas.reduce((s,v)=>s+(Number(v.arpu)||0),0)/activadas.length/1.16;
}
// Oportunidades rechazadas de un vendedor en un periodo (agrupadas por fecha de oportunidad).
function rechazosPeriodo(ventas,inicio,fin){
  return(ventas||[]).filter(v=>v.estatus==='Rechazada'&&enRango(v.creacion,inicio,fin));
}
// Quita el sufijo de versión (V1, v9, V12...) del nombre del plan para agrupar todas las
// versiones como un solo plan. "TV" no es versión (no lleva dígito) y se conserva tal cual.
function normalizarPlan(nombre){
  return String(nombre||'').replace(/\s*\bV\d+\b\s*/gi,' ').trim().replace(/\s+/g,' ')||'Sin plan';
}
// Instalaciones de un vendedor en un periodo (semana o mes), agrupadas por plan (con el detalle de cada una).
function instalacionesPorPlan(ventas,inicio,fin){
  const out={};
  (ventas||[]).forEach(v=>{
    if(v.activacion&&enRango(v.activacion,inicio,fin)){
      const p=normalizarPlan(v.plan);
      (out[p]=out[p]||[]).push(v);
    }
  });
  return out; // plan -> [venta,...]
}
// Instalaciones con canal "Punto de Venta" de un vendedor en un periodo, agrupadas por el punto
// de venta específico (columna Subcanal) — para Coach/Líder Promovendedor Punto de Venta.
function instalacionesPorPDV(ventas,inicio,fin){
  const out={};
  (ventas||[]).forEach(v=>{
    if((v.canal||'').trim().toUpperCase()!=='PUNTO DE VENTA')return;
    if(v.activacion&&enRango(v.activacion,inicio,fin)){
      const pdv=(v.subcanal||'').trim();
      const key=(!pdv||pdv==='-')?'Sin especificar':pdv;
      (out[key]=out[key]||[]).push(v);
    }
  });
  return out; // pdv -> [venta,...]
}
// Cuentas activadas/instaladas entre hace 25 y 90 días (ventana rodante por día, no por mes
// calendario) — pagadas o no, es el universo contra el que se saca el %.
function cuentasDelPeriodo(cuentas,ref){
  return(cuentas||[]).filter(c=>{
    if(!c.fechaInstalacion)return false;
    const dias=Math.floor((ref-c.fechaInstalacion)/86400000);
    return dias>=25&&dias<=90;
  });
}
// De esas, las que aún no se han pagado.
function cuentasSinPagar(cuentas,ref){
  return cuentasDelPeriodo(cuentas,ref)
    .filter(c=>!/^YA COMISIONADA/i.test(c.estatusPago))
    .sort((a,b)=>a.fechaInstalacion-b.fechaInstalacion);
}

// Enrich team with ranking data
function enrichTeam(team,rankEnt,rankMen){
  const reByName={};
  Object.values(rankEnt).forEach(v=>{if(v._nombre)reByName[v._nombre]=v;});
  const rmByName={};
  Object.entries(rankMen).forEach(([k,v])=>{if(v.nombre)rmByName[v.nombre]=v;});

  return team.map(m=>{
    // Only match with D (numEmp) and B (numEmpB) — NOT C (ID POSICIONES, different namespace)
    const keys=[m.numEmp,m.numEmpB].filter(k=>k&&k!=='INTERNO'&&k!=='EXTERNO');
    const re=keys.reduce((found,k)=>found||rankEnt[k],null)||reByName[m.nombre]||null;
    const rm=keys.reduce((found,k)=>found||rankMen[k],null)||rmByName[m.nombre]||null;
    // Badge is whatever the sheet itself has already decided (never recomputed here):
    // re.ranking for employees still on the ENTRENAMIENTO tab, otherwise the official
    // "RANKING <mes>" column read from the main roster tab.
    let badge=re?.ranking||rm?.badgeOficial||null;
    let mesesEnRanking=0;
    if(rm){
      // Count consecutive months at a similar install level (context only, not the badge itself).
      const u=rm.ultimos3meses;
      if(u.length>=2){
        const lvl=u[u.length-1]>=20?20:u[u.length-1]>=12?12:u[u.length-1]>=8?8:0;
        mesesEnRanking=u.filter(v=>(v>=20&&lvl>=20)||(v>=12&&v<20&&lvl>=12&&lvl<20)||(v>=8&&v<12&&lvl>=8&&lvl<12)||(v<8&&lvl<8)).length;
      }
    }
    // Missing certifications: entrenamiento tab for rookies, otherwise the BRONCE/PLATA/ORO
    // block matching their current tier (read straight from the roster sheet).
    let certFaltantes=[];
    if(re){
      if(re.certActitud!=='APROBADO')certFaltantes.push('Actitud e Imagen');
      if(re.certSist1!=='APROBADO')certFaltantes.push('Sistémica I');
      if(re.certSist2!=='APROBADO')certFaltantes.push('Sistémica II');
      if(re.certSist3!=='APROBADO')certFaltantes.push('Sistémica III');
    }else if(rm?.certFaltantes?.length){
      certFaltantes=rm.certFaltantes;
    }
    // Observación oficial de la hoja de ranking (misma prioridad que el badge: entrenamiento primero).
    const obsRaw=re?.obs||rm?.obsOficial||'';
    const obs=obsRaw&&obsRaw!=='-'?obsRaw:null;
    return{...m,
      rankingEnt:re,
      rankingMen:rm,
      badge,
      mesesEnRanking,
      certFaltantes,
      obs,
    };
  });
}

// Order used for ranking-based sorting across dashboard/lists: lowest tier first.
const RANK_ORDER=['ENTRENAMIENTO','CONDICIONADO','BRONCE','PLATA','ORO','PLATINO','DIAMANTE'];
function getInstalls(m){
  if(m.rankingMen)return m.rankingMen.promedioMensual||0;
  if(m.rankingEnt)return Number(m.rankingEnt.insUlt4)||0;
  return 0;
}
// Sin ranking primero, luego Entrenamiento → Platino ascendente; empates por menos instalaciones primero.
function sortByRanking(members){
  return[...members].sort((a,b)=>{
    const ia=RANK_ORDER.indexOf(a.badge);
    const ib=RANK_ORDER.indexOf(b.badge);
    const oa=ia===-1?-1:ia;
    const ob=ib===-1?-1:ib;
    if(oa!==ob)return oa-ob;
    return getInstalls(a)-getInstalls(b);
  });
}

function PhotoCapture({photo,onCapture,label}){
  const refCam=useRef();

  const handle=e=>{const f=e.target.files?.[0];if(!f)return;const r=new FileReader();r.onload=ev=>{const img=new Image();img.onload=()=>{const c=document.createElement('canvas');const M=800;let w=img.width,h=img.height;if(w>M){h=h*(M/w);w=M;}c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);onCapture(c.toDataURL('image/jpeg',.7));};img.src=ev.target.result;};r.readAsDataURL(f);e.target.value='';};
  return <div>
    <input ref={refCam} type="file" accept="image/*" capture="environment" onChange={handle} style={{display:'none'}}/>
    <input ref={refGal} type="file" accept="image/*" onChange={handle} style={{display:'none'}}/>

// Foto con sello de coach, día/fecha/hora, dirección y coordenadas (geolocalización del dispositivo).
function PhotoCaptureGeo({photo,onCapture,coachName,toast,label}){
  const refCam=useRef();
  const refGal=useRef();
  const[loading,setLoading]=useState(false);
  const handle=e=>{
    const f=e.target.files?.[0];if(!f)return;
    setLoading(true);
    const r=new FileReader();
    r.onload=ev=>{
      const img=new Image();
      img.onload=async()=>{
        const M=900;let w=img.width,h=img.height;if(w>M){h=h*(M/w);w=M;}
        try{
          let coordsTxt='',direccion='';
          try{
            if(!navigator.geolocation)throw new Error('sin geolocalización');
            const pos=await new Promise((res,rej)=>navigator.geolocation.getCurrentPosition(res,rej,{enableHighAccuracy:true,timeout:8000}));
            const lat=pos.coords.latitude,lng=pos.coords.longitude;
            coordsTxt=`${lat.toFixed(5)}, ${lng.toFixed(5)}`;
            try{
              const resGeo=await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&zoom=18&addressdetails=1`,{headers:{'Accept-Language':'es'}});
              const j=await resGeo.json();
              direccion=j?.display_name||'';
            }catch(eGeo){console.error('Reverse geocoding falló:',eGeo);}
          }catch(eLoc){console.error('Geolocalización falló:',eLoc);toast?.('⚠️ No se pudo obtener ubicación (revisa permisos)');}
          const c=document.createElement('canvas');
          c.width=w;c.height=h;
          const ctx=c.getContext('2d');
          ctx.drawImage(img,0,0,w,h);
          const ahora=new Date();
          const diaFecha=ahora.toLocaleDateString('es-MX',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
          const hora=ahora.toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'});
          const lineas=[
            `👤 ${coachName||''}`,
            `📅 ${diaFecha.charAt(0).toUpperCase()+diaFecha.slice(1)}`,
            `🕒 ${hora}`,
            direccion?`📍 ${direccion}`:'',
            coordsTxt?`🌐 ${coordsTxt}`:'',
          ].filter(Boolean);
          const lh=Math.max(14,Math.round(w*0.032));
          const padY=8,boxH=lineas.length*lh+padY*2;
          ctx.fillStyle='rgba(0,0,0,.6)';
          ctx.fillRect(0,h-boxH,w,boxH);
          ctx.fillStyle='#fff';
          ctx.font=`${lh-3}px sans-serif`;
          ctx.textBaseline='top';
          lineas.forEach((linea,i)=>{
            let txt=linea;
            while(ctx.measureText(txt).width>w-16&&txt.length>10)txt=txt.slice(0,-4)+'…';
            ctx.fillText(txt,8,h-boxH+padY+i*lh);
          });
          onCapture(c.toDataURL('image/jpeg',.75));
        }catch(eStamp){
          console.error('No se pudo sellar la foto:',eStamp);
          toast?.('⚠️ No se pudo sellar la foto, se guardó sin datos');
          const c=document.createElement('canvas');
          c.width=w;c.height=h;
          c.getContext('2d').drawImage(img,0,0,w,h);
          onCapture(c.toDataURL('image/jpeg',.75));
        }
        setLoading(false);
      };
      img.src=ev.target.result;
    };
    r.readAsDataURL(f);
  };
  return <div>
    <input ref={refCam} type="file" accept="image/*" capture="environment" onChange={handle} style={{display:'none'}}/>
    <input ref={refGal} type="file" accept="image/*" onChange={handle} style={{display:'none'}}/>
    {photo?
      <div style={{position:'relative'}}>
        <img src={photo} alt="" style={{width:'100%',maxHeight:200,objectFit:'cover',borderRadius:8,border:'1px solid var(--border)'}}/>
        <div style={{position:'absolute',top:6,right:6,display:'flex',gap:4}}>
          <Btn onClick={()=>refCam.current.click()} variant="ghost" style={{background:'rgba(0,0,0,.55)',color:'#fff',borderRadius:8,fontSize:11,padding:'4px 8px'}}>📷</Btn>
          <Btn onClick={()=>refGal.current.click()} variant="ghost" style={{background:'rgba(0,0,0,.55)',color:'#fff',borderRadius:8,fontSize:11,padding:'4px 8px'}}>🖼️</Btn>
        </div>
      </div>
    :<>
      {label&&<p style={{fontSize:12,color:'var(--dim)',marginBottom:6}}>{label}</p>}
      <div style={{display:'flex',gap:8}}>
        <button onClick={()=>refCam.current.click()} disabled={loading} style={{flex:1,padding:'10px 12px',borderRadius:8,border:'2px dashed var(--border)',background:'var(--input)',cursor:loading?'wait':'pointer',textAlign:'center',color:'var(--dim)',fontSize:12}}>
          {loading?'📍 Obteniendo ubicación...':'📷 Tomar foto'}
        </button>
        <button onClick={()=>refGal.current.click()} disabled={loading} style={{flex:1,padding:'10px 12px',borderRadius:8,border:'2px dashed var(--border)',background:'var(--input)',cursor:loading?'wait':'pointer',textAlign:'center',color:'var(--dim)',fontSize:12}}>
          {loading?'📍 Obteniendo ubicación...':'🖼️ Subir foto'}
        </button>
      </div>
    </>}
  </div>;
}

// Tono corto (beep) antes de empezar a escuchar, para que los participantes sepan cuándo hablar.
function reproducirTono(){
  return new Promise(resolve=>{
    try{
      const ctx=new(window.AudioContext||window.webkitAudioContext)();
      const osc=ctx.createOscillator();
      const gain=ctx.createGain();
      osc.frequency.value=880;
      osc.connect(gain);gain.connect(ctx.destination);
      gain.gain.setValueAtTime(.001,ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(.2,ctx.currentTime+.02);
      gain.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.35);
      osc.start();
      osc.stop(ctx.currentTime+.35);
      osc.onended=()=>{ctx.close();resolve();};
    }catch(e){resolve();}
  });
}

// ═══ AUDIO RECORDER ═══
function AudioRecorder({onTranscript}){
  const[rec,setRec]=useState(false);const[preparando,setPreparando]=useState(false);const[txt,setTxt]=useState('');const rr=useRef(null);
  const toggle=async()=>{
    if(rec){rr.current?.stop();setRec(false);return;}
    const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
    if(!SR){alert('Navegador sin soporte de voz. Usa Chrome.');return;}
    setPreparando(true);
    await reproducirTono();
    setPreparando(false);
    const r=new SR();r.lang='es-MX';r.continuous=true;r.interimResults=true;let final=txt;
    r.onresult=e=>{let interim='';for(let i=e.resultIndex;i<e.results.length;i++){if(e.results[i].isFinal)final+=e.results[i][0].transcript+' ';else interim+=e.results[i][0].transcript;}setTxt(final+interim);onTranscript(final+interim);};
    r.onerror=()=>setRec(false);r.onend=()=>{if(rec)try{r.start();}catch{}};
    rr.current=r;r.start();setRec(true);
  };
  return <div><div style={{display:'flex',gap:8,alignItems:'center',marginBottom:8}}><Btn onClick={toggle} disabled={preparando} variant={rec?'danger':'primary'} style={{display:'flex',alignItems:'center',gap:6}}>{rec?<><span style={{width:10,height:10,borderRadius:'50%',background:'#fff',animation:'pulse 1s infinite'}}/>Detener</>:preparando?<>🔔 Suena el tono...</>:<>🎙️ Grabar</>}</Btn>{rec&&<span style={{fontSize:12,color:'var(--red)',fontWeight:600}}>● Escuchando...</span>}</div>{txt&&<Textarea value={txt} onChange={e=>{setTxt(e.target.value);onTranscript(e.target.value);}} style={{minHeight:100}}/>}</div>;
}

function LoginScreen({onLogin}){
  const[numEmp,setNumEmp]=useState('');
  const[pin,setPin]=useState('');
  const[loading,setLoading]=useState(false);
  const[error,setError]=useState('');

  const handleLogin=async()=>{
    if(!numEmp.trim()||!pin.trim()){setError('Ingresa número de empleado y PIN');return;}
    setLoading(true);setError('');
    try{
      // numEmp+PIN se validan en el servidor (apps-script.gs: iniciarSesion) — nunca se descarga
      // el roster completo ni el PIN de nadie a este navegador, solo lo que le toca ver a este usuario.
      const login=await fetchLogin(numEmp.trim(),pin.trim());
      if(!login.ok){setError(login.error||'No se pudo iniciar sesión');setLoading(false);return;}
      // Ventas y comisiones del equipo (semana/mes en curso, rechazos, asignaciones, cuentas sin pagar)
      // Base de Datos y Comisiones no siempre etiqueta "Num Vendedor" con la misma columna de ID
      // (a veces D/numEmp, a veces B/numEmpB según la persona) — se consultan ambas y se cruzan las dos al final.
      const{user,team,coaches,role}=await enriquecerSesion(login,login.token);
      const session={user,team,coaches,role,token:login.token,loginTime:new Date().toISOString()};
      // localStorage (no sessionStorage): sobrevive a que se cierre por completo el navegador/PWA,
      // para poder seguir trabajando con los últimos datos aunque no haya señal al reabrir la app
      // en campo — el botón "Actualizar información" refresca en cuanto vuelve la conexión.
      localStorage.setItem('sv2-session',JSON.stringify(session));
      onLogin(session);
    }catch(e){
      console.error(e);
      setError('Error al conectar con la base de datos. Verifica tu conexión.');
    }
    setLoading(false);
  };

  return(
    <div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',padding:20,background:'linear-gradient(135deg,#1e3a8a 0%,#1e40af 50%,#2563eb 100%)'}}>
      <div style={{background:'var(--card)',borderRadius:20,padding:32,maxWidth:380,width:'100%',boxShadow:'0 20px 60px rgba(0,0,0,.3)'}}>
        <div style={{textAlign:'center',marginBottom:28}}>
          <div style={{fontSize:48,marginBottom:8}}>📋</div>
          <h1 style={{fontSize:22,fontWeight:800,color:'var(--text)',marginBottom:4}}>Supervisión 2.0</h1>
          <p style={{fontSize:13,color:'var(--dim)'}}>Plan de Trabajo y Seguimiento</p>
        </div>
        <Field label="Número de empleado">
          <Input value={numEmp} onChange={e=>setNumEmp(e.target.value)} placeholder="Ej: 17091931"
            onKeyDown={e=>e.key==='Enter'&&document.getElementById('pin-input')?.focus()}
            style={{fontSize:16,textAlign:'center',letterSpacing:1}}/>
        </Field>
        <Field label="PIN">
          <Input id="pin-input" type="password" inputMode="numeric" maxLength={4} value={pin}
            onChange={e=>setPin(e.target.value.replace(/\D/g,''))}
            placeholder="••••" onKeyDown={e=>e.key==='Enter'&&handleLogin()}
            style={{fontSize:24,textAlign:'center',letterSpacing:8}}/>
        </Field>
        {error&&<p style={{color:'var(--red)',fontSize:13,textAlign:'center',marginBottom:12,fontWeight:600}}>{error}</p>}
        <Btn onClick={handleLogin} disabled={loading} style={{width:'100%',padding:14,fontSize:16,marginTop:8,borderRadius:12}}>
          {loading?<Spinner/>:'Iniciar sesión'}
        </Btn>
        <p style={{fontSize:11,color:'var(--dim)',textAlign:'center',marginTop:16}}>Distrito La Laguna · Totalplay</p>
      </div>
    </div>
  );
}

function ArranqueTab({data,setData,team,toast,session,refreshKey}){
  const esLider=session.role==='lider';
  // Coach Promovendedor Punto de Venta: arranca en un punto de venta, oficina o con su líder
  // (foto de grupo normal), pero además visita el punto de venta de CADA vendedor a su cargo —
  // ahí necesita una foto (con sello) por vendedor, presente o ausente, como evidencia de la
  // visita, y no puede guardar hasta tener la foto de todos.
  const esCoachPDV=(session.user.posicion||'').toUpperCase().includes('PROMOVENDEDOR');
  const[form,setForm]=useState({date:today(),time:now(),photo:null,presentes:[],ausentes:[],fotosVendedores:{},notas:''});
  useEffect(()=>{setForm(f=>({...f,presentes:team.map(m=>m.nombre),ausentes:[]}));},[team]);
  const toggle=name=>{setForm(f=>{const p=f.presentes.includes(name);return{...f,presentes:p?f.presentes.filter(n=>n!==name):[...f.presentes,name],ausentes:p?[...f.ausentes,{name,reason:'Falta justificada',detail:'',photo:null}]:f.ausentes.filter(a=>a.name!==name)};});};
  const updAus=(name,field,val)=>setForm(f=>({...f,ausentes:f.ausentes.map(a=>a.name===name?{...a,[field]:val}:a)}));
  const setFotoVendedor=(name,photo)=>setForm(f=>({...f,fotosVendedores:{...f.fotosVendedores,[name]:photo}}));

  // Líder: estatus de arranque de hoy de cada coach (leído del Sheet, cada coach lo guarda en su

    if(!esLider)return;

  },[esLider,refreshKey]);
  const coachesArranqueHoy=esLider?(session.coaches||[]).map(c=>({coach:c,row:arranquesEquipo.find(r=>r['Registrado por']===c.nombre&&r['Fecha']===hoyStr)||null})):[];
  const diaHoyKey=DIAS_SEMANA[(new Date().getDay()+6)%7];
  const semanaIniHoy=ymdLocal(startOfWeek(new Date()));
  const planLiderSemana=esLider?data.records.find(r=>r.type==='plan'&&r.registradoPor===session.user.nombre&&r.semanaInicio===semanaIniHoy):null;
  const coachesPrioridadHoy=planLiderSemana?.zonas?.[diaHoyKey]?.entradas?.map(e=>e.cluster)||[];

    if(!form.photo){alert(esLider?'Agrega la foto con el coach prioridad del día para poder guardar el arranque':'Agrega la foto de grupo para poder guardar el arranque');return;}

// Quita acentos para que la búsqueda no dependa de teclearlos (Muñoz ~ munoz).
const sinAcentos=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');

// ─── Combobox con búsqueda: escribe y filtra desde la primera letra, elige de la lista. ───
function Autocomplete({value,onChange,options,placeholder}){
  const[query,setQuery]=useState('');
  const[open,setOpen]=useState(false);
  const wrapRef=useRef(null);
  useEffect(()=>{
    const opt=options.find(o=>o.value===value);
    setQuery(opt?opt.label:'');
  },[value]);
  useEffect(()=>{
    const onClickFuera=e=>{if(wrapRef.current&&!wrapRef.current.contains(e.target))setOpen(false);};
    document.addEventListener('mousedown',onClickFuera);
    return()=>document.removeEventListener('mousedown',onClickFuera);
  },[]);
  const q=sinAcentos(query);
  const filtradas=q?options.filter(o=>sinAcentos(o.label).includes(q)):options;
  return <div ref={wrapRef} style={{position:'relative'}}>
    <Input value={query} placeholder={placeholder} onFocus={()=>setOpen(true)}
      onChange={e=>{setQuery(e.target.value);setOpen(true);if(!e.target.value&&value)onChange('');}}/>
    {open&&<div style={{position:'absolute',zIndex:30,top:'calc(100% + 2px)',left:0,right:0,background:'var(--card)',border:'1.5px solid var(--border)',borderRadius:8,maxHeight:170,overflowY:'auto',boxShadow:'0 6px 16px rgba(0,0,0,.15)'}}>
      {filtradas.length===0&&<div style={{padding:'8px 10px',fontSize:12,color:'var(--dim)'}}>Sin coincidencias</div>}
      {filtradas.slice(0,60).map(o=><AutocompleteOpcion key={o.value} label={o.label} onClick={()=>{onChange(o.value);setQuery(o.label);setOpen(false);}}/>)}
    </div>}
  </div>;
}
function AutocompleteOpcion({label,onClick}){
  const[hover,setHover]=useState(false);
  return <div onClick={onClick} onMouseDown={e=>e.preventDefault()} onMouseEnter={()=>setHover(true)} onMouseLeave={()=>setHover(false)}
    style={{padding:'8px 10px',fontSize:13,cursor:'pointer',background:hover?'var(--accent-light)':'transparent'}}>{label}</div>;
}

// ─── Plan: selector de zonas de un día (cluster y/o colonia, con cruce colonia↔cluster) ───
function ZonaDia({label,dia,zonasData,onChange}){
  const entradas=dia.entradas||[];
  const[modo,setModo]=useState('cluster');
  const[clusterSel,setClusterSel]=useState('');
  const[coloniasSel,setColoniasSel]=useState([]);
  const[coloniaSel,setColoniaSel]=useState('');
  const coloniasDelCluster=zonasData.clusterToColonias[clusterSel]||[];
  const todasColonias=Object.keys(zonasData.coloniaToCluster).sort();

  const agregar=()=>{
    if(modo==='cluster'){
      if(!clusterSel)return;
      if(coloniasSel.length===0){
        if(entradas.some(e=>e.cluster===clusterSel&&!e.colonia))return;
        onChange({...dia,entradas:[...entradas,{cluster:clusterSel,colonia:null}]});
      }else{
        const nuevas=coloniasSel.filter(c=>!entradas.some(e=>e.cluster===clusterSel&&e.colonia===c)).map(c=>({cluster:clusterSel,colonia:c}));
        onChange({...dia,entradas:[...entradas,...nuevas]});
      }
      setColoniasSel([]);
    }else{
      if(!coloniaSel||entradas.some(e=>e.colonia===coloniaSel))return;
      onChange({...dia,entradas:[...entradas,{cluster:zonasData.coloniaToCluster[coloniaSel]||'',colonia:coloniaSel}]});
      setColoniaSel('');
    }
  };
  const quitar=i=>onChange({...dia,entradas:entradas.filter((_,idx)=>idx!==i)});
  const toggleColonia=c=>setColoniasSel(s=>s.includes(c)?s.filter(x=>x!==c):[...s,c]);

  return <div style={{marginBottom:10,padding:8,border:'1px solid var(--border)',borderRadius:8}}>
    <div style={{fontWeight:700,fontSize:12,marginBottom:6}}>{label}</div>
    {entradas.length>0&&<div style={{display:'flex',flexWrap:'wrap',gap:4,marginBottom:6}}>
      {entradas.map((e,i)=><span key={i} style={{display:'inline-flex',alignItems:'center',gap:4,background:'var(--accent-light)',color:'var(--accent)',padding:'2px 8px',borderRadius:10,fontSize:11,fontWeight:600}}>
        {e.colonia?`${e.colonia} (${e.cluster})`:`${e.cluster} · todo`}
        <span onClick={()=>quitar(i)} style={{cursor:'pointer',fontWeight:800}}>✕</span>
      </span>)}
    </div>}
    <div style={{display:'flex',gap:4,marginBottom:6}}>
      <button onClick={()=>setModo('cluster')} style={{flex:1,padding:'5px 6px',fontSize:11,fontWeight:700,borderRadius:6,border:'1.5px solid var(--border)',background:modo==='cluster'?'var(--accent)':'var(--card)',color:modo==='cluster'?'#fff':'var(--dim)',cursor:'pointer'}}>Por Cluster</button>
      <button onClick={()=>setModo('colonia')} style={{flex:1,padding:'5px 6px',fontSize:11,fontWeight:700,borderRadius:6,border:'1.5px solid var(--border)',background:modo==='colonia'?'var(--accent)':'var(--card)',color:modo==='colonia'?'#fff':'var(--dim)',cursor:'pointer'}}>Por Colonia</button>
    </div>
    {modo==='cluster'?<>
      <div style={{marginBottom:6}}>
        <Autocomplete value={clusterSel} onChange={v=>{setClusterSel(v);setColoniasSel([]);}} placeholder="Buscar cluster..." options={zonasData.clusters.map(c=>({value:c,label:c}))}/>
      </div>
      {clusterSel&&coloniasDelCluster.length>0&&<div style={{maxHeight:120,overflowY:'auto',border:'1px solid var(--border)',borderRadius:6,padding:6,marginBottom:6}}>
        <p style={{fontSize:10,color:'var(--dim)',margin:'0 0 4px'}}>Opcional: marca colonias específicas (si no marcas ninguna, aplica a todo el cluster)</p>
        {coloniasDelCluster.map(c=><label key={c} style={{display:'flex',alignItems:'center',gap:6,fontSize:12,padding:'2px 0',cursor:'pointer'}}>
          <input type="checkbox" checked={coloniasSel.includes(c)} onChange={()=>toggleColonia(c)}/>{c}
        </label>)}
      </div>}
    </>:
      <div style={{marginBottom:6}}>
        <Autocomplete value={coloniaSel} onChange={setColoniaSel} placeholder="Buscar colonia..." options={todasColonias.map(c=>({value:c,label:`${c} (${zonasData.coloniaToCluster[c]})`}))}/>
      </div>
    }
    <Btn variant="secondary" onClick={agregar} style={{width:'100%',fontSize:12,padding:'6px 10px'}}>+ Agregar</Btn>
    <div style={{marginTop:8,paddingTop:8,borderTop:'1px dashed var(--border)'}}>
      <Field label="📍 Punto de reunión / Carpa">
        <Input value={dia.direccion||''} onChange={e=>onChange({...dia,direccion:e.target.value})} placeholder="Dirección o referencia..." style={{fontSize:13}}/>
      </Field>
      <Field label="💬 Comentarios adicionales">
        <Textarea value={dia.comentarios||''} onChange={e=>onChange({...dia,comentarios:e.target.value})} placeholder="Notas para este día..." style={{minHeight:50,fontSize:13}}/>
      </Field>
    </div>
  </div>;
}

// Para el líder: en vez de cluster/colonia, elige qué coach(es) va a priorizar/acompañar ese día
// + un comentario. Reutiliza la misma forma de dato que ZonaDia ({entradas,direccion,comentarios})
// guardando el nombre del coach en "cluster" — así zonasATexto/reporte/WhatsApp lo leen sin cambios.
function CoachDiaSelector({label,dia,coachesDisponibles,onChange}){
  const entradas=dia.entradas||[];
  const[coachSel,setCoachSel]=useState('');
  const agregar=()=>{
    if(!coachSel||entradas.some(e=>e.cluster===coachSel))return;
    onChange({...dia,entradas:[...entradas,{cluster:coachSel,colonia:null}]});
    setCoachSel('');
  };
  const quitar=i=>onChange({...dia,entradas:entradas.filter((_,idx)=>idx!==i)});
  return <div style={{marginBottom:10,padding:8,border:'1px solid var(--border)',borderRadius:8}}>
    <div style={{fontWeight:700,fontSize:12,marginBottom:6}}>{label}</div>
    {entradas.length>0&&<div style={{display:'flex',flexWrap:'wrap',gap:4,marginBottom:6}}>
      {entradas.map((e,i)=><span key={i} style={{display:'inline-flex',alignItems:'center',gap:4,background:'var(--accent-light)',color:'var(--accent)',padding:'2px 8px',borderRadius:10,fontSize:11,fontWeight:600}}>
        {e.cluster}
        <span onClick={()=>quitar(i)} style={{cursor:'pointer',fontWeight:800}}>✕</span>
      </span>)}
    </div>}
    <div style={{marginBottom:6}}>
      <Autocomplete value={coachSel} onChange={setCoachSel} placeholder="Buscar coach..." options={coachesDisponibles.map(c=>({value:c.nombre,label:c.nombre}))}/>
    </div>
    <Btn variant="secondary" onClick={agregar} style={{width:'100%',fontSize:12,padding:'6px 10px'}}>+ Agregar</Btn>
    <div style={{marginTop:8,paddingTop:8,borderTop:'1px dashed var(--border)'}}>
      <Field label="💬 Comentario adicional">
        <Textarea value={dia.comentarios||''} onChange={e=>onChange({...dia,comentarios:e.target.value})} placeholder="Notas para este día..." style={{minHeight:50,fontSize:13}}/>
      </Field>
    </div>
  </div>;
}

// Para Coach Promovendedor Punto de Venta: en vez de cluster/colonia, elige qué punto(s) de venta
// va a trabajar ese día (catálogo hoja PDV). Reutiliza la misma forma de dato que ZonaDia

// ─── Plan ───
// Objetivo semanal (KPIs comprometidos vs. meta oficial calculada de las metas por ranking del
// equipo) + resultado real de la semana pasada (precargado del sistema, editable) con % de cumplimiento.
// Porcentaje de qué tan lleno está un plan (fila cruda del Sheet, headers de SHEET_CONFIG.PLAN):
// los 5 KPI del objetivo + los 7 días de Zonas + Prioridades/Acompañamientos/Resultado esperado/Notas.
function completitudPlanFila(row){
  let total=0,llenos=0;
  ['Obj. Oportunidades','Obj. Ventas','Obj. Instalaciones','Obj. Cuentas recuperadas NPPF','Obj. ARPU'].forEach(k=>{
    total++;if(Number(row[k])>0)llenos++;
  });
  const zonasTxt=String(row['Zonas']||'');
  DIAS_SEMANA.forEach(d=>{total++;if(zonasTxt.includes(DIAS_SEMANA_LABEL[d]+':'))llenos++;});
  ['Prioridades','Acompañamientos','Resultado esperado','Notas'].forEach(k=>{
    total++;if(String(row[k]||'').trim())llenos++;
  });
  return Math.round(llenos/total*100);
}

function PlanTab({data,setData,team,toast,session,refreshKey}){
  const esLider=session.role==='lider';
  // Coach Promovendedor Punto de Venta: "Zonas a trabajar" se reemplaza por "Puntos de Venta a
  // trabajar" (catálogo hoja PDV) en vez de cluster/colonia.
  const esCoachPDV=(session.user.posicion||'').toUpperCase().includes('PROMOVENDEDOR');
  const vendedoresPlan=(team||[]).filter(m=>isVendedor(m.posicion));
  // Meta oficial del equipo: instalaciones = suma de meta semanal por ranking; ventas/validaciones
  // 15% mayor que instalaciones; oportunidades 15% mayor que ventas/validaciones.
  const metaInstalOficial=vendedoresPlan.reduce((s,m)=>s+metaSemanal(m.badge),0);
  const metaVentasOficial=Math.round(metaInstalOficial*1.15);
  const metaOportOficial=Math.round(metaVentasOficial*1.15);
  const KPIS=[
    {k:'oportunidades',label:'Oportunidades',meta:metaOportOficial},
    {k:'ventas',label:'Ventas (validaciones)',meta:metaVentasOficial},
    {k:'instalaciones',label:'Instalaciones',meta:metaInstalOficial},
  ];

  const nowDate=new Date();
  const semanaIni=startOfWeek(nowDate),semanaFin=endOfWeek(nowDate);
  const semanaIniStr=ymdLocal(semanaIni),semanaFinStr=ymdLocal(semanaFin);
  const semanaLabel=`${fmtDateObj(semanaIni)} al ${fmtDateObj(semanaFin)}`;
  const hoyStr=ymdLocal(nowDate);
  const esLunes=nowDate.getDay()===1;

  const planActual=data.records.find(r=>r.type==='plan'&&r.semanaInicio===semanaIniStr);
  const retraso=!planActual&&hoyStr>semanaIniStr;

  // Semana(s) anteriores con plan pero sin resultado real capturado todavía — se resuelve la más antigua primero.
  const planesConResultado=new Set(data.records.filter(r=>r.type==='plan_resultado').map(r=>r.planId));
  const planPendiente=data.records.filter(r=>r.type==='plan'&&!planesConResultado.has(r.id)&&r.semanaInicio<semanaIniStr).sort((a,b)=>a.semanaInicio.localeCompare(b.semanaInicio))[0]||null;

  const[zonasData,setZonasData]=useState({clusterToColonias:{},coloniaToCluster:{},clusters:[]});
  useEffect(()=>{if(!esCoachPDV)fetchClustersColonias(session.token).then(list=>setZonasData(buildClusterMap(list)));},[esCoachPDV]);
  const[puntosVenta,setPuntosVenta]=useState([]);
  useEffect(()=>{if(esCoachPDV)fetchPDV(session.token).then(setPuntosVenta);},[esCoachPDV]);

  // Líder: estado del plan de esta semana de cada uno de sus coaches (leído del Sheet, no del
  // dispositivo local — cada coach lo captura en su propio teléfono).
  const[planesEquipo,setPlanesEquipo]=useState([]);
  const[cargandoPlanesEquipo,setCargandoPlanesEquipo]=useState(false);
  useEffect(()=>{
    if(!esLider)return;
    setCargandoPlanesEquipo(true);
    fetchHistorialEquipo('PLAN',session.token).then(regs=>{setPlanesEquipo(regs);setCargandoPlanesEquipo(false);});
  },[esLider,refreshKey]);
  // Datos completos (no solo % de completitud) del plan de cada coach — alimenta la tarjeta de
  // estatus, el Objetivo/Prioridades/Acompañamientos agregados, y lo que se guarda al final.
  const coachesPlanDatos=esLider?(session.coaches||[]).map(c=>{
    const row=planesEquipo.find(r=>r['Registrado por']===c.nombre&&r['Semana inicio']===semanaIniStr);
    if(!row)return{coach:c,row:null,estado:'sin',pct:0,objetivos:{oportunidades:0,ventas:0,instalaciones:0,cuentasRecuperadas:0,arpu:0},prioridades:'',acompanamientos:''};
    const pct=completitudPlanFila(row);
    return{
      coach:c,row,estado:pct>=100?'completo':'parcial',pct,
      objetivos:{
        oportunidades:Number(row['Obj. Oportunidades'])||0,
        ventas:Number(row['Obj. Ventas'])||0,
        instalaciones:Number(row['Obj. Instalaciones'])||0,
        cuentasRecuperadas:Number(row['Obj. Cuentas recuperadas NPPF'])||0,
        arpu:Number(row['Obj. ARPU'])||0,
      },
      prioridades:String(row['Prioridades']||'').trim(),
      acompanamientos:String(row['Acompañamientos']||'').trim(),
    };
  }):[];
  const coachesPlanEstado=coachesPlanDatos; // alias: la tarjeta de estatus usa {coach,estado,pct}
  // Totales agregados del equipo — se guardan en el plan del líder al final de la semana.
  const objetivosEquipo={
    oportunidades:coachesPlanDatos.reduce((s,c)=>s+c.objetivos.oportunidades,0),
    ventas:coachesPlanDatos.reduce((s,c)=>s+c.objetivos.ventas,0),
    instalaciones:coachesPlanDatos.reduce((s,c)=>s+c.objetivos.instalaciones,0),
    cuentasRecuperadas:coachesPlanDatos.reduce((s,c)=>s+c.objetivos.cuentasRecuperadas,0),
    arpu:(()=>{const conArpu=coachesPlanDatos.filter(c=>c.objetivos.arpu>0);return conArpu.length?Math.round(conArpu.reduce((s,c)=>s+c.objetivos.arpu,0)/conArpu.length*100)/100:0;})(),
  };
  const prioridadesEquipoTexto=coachesPlanDatos.map(c=>`${c.coach.nombre.split(' ').slice(0,3).join(' ')}: ${c.prioridades||'(sin capturar)'}`).join('\n');
  const acompanamientosEquipoTexto=coachesPlanDatos.map(c=>`${c.coach.nombre.split(' ').slice(0,3).join(' ')}: ${c.acompanamientos||'(sin capturar)'}`).join('\n');

  const emptyZonas=()=>Object.fromEntries(DIAS_SEMANA.map(d=>[d,{entradas:[],direccion:'',comentarios:''}]));
  const[form,setForm]=useState({objetivos:{oportunidades:'',ventas:'',instalaciones:'',cuentasRecuperadas:'',arpu:''},prioridades:'',vendedores_acompanar:'',zonas:emptyZonas(),resultado_esperado:'',notas:''});
  const updObjetivo=(k,v)=>setForm(f=>({...f,objetivos:{...f.objetivos,[k]:v}}));

  const guardarPlan=async()=>{
    const rec={id:uid(),type:'plan',date:today(),
      semanaInicio:semanaIniStr,semanaFin:semanaFinStr,semanaLabel,
      objetivos:esLider?objetivosEquipo:form.objetivos,
      ...(esLider?{objetivosPorCoach:coachesPlanDatos.map(c=>({coach:c.coach.nombre,objetivos:c.objetivos}))}:{}),
      metaOficial:{oportunidades:metaOportOficial,ventas:metaVentasOficial,instalaciones:metaInstalOficial},
      prioridades:esLider?prioridadesEquipoTexto:form.prioridades,
      vendedores_acompanar:esLider?acompanamientosEquipoTexto:form.vendedores_acompanar,
      zonas:form.zonas,resultado_esperado:form.resultado_esperado,notas:form.notas,
      registradoPor:session.user.nombre,token:session.token,savedAt:new Date().toISOString()};
    const upd={...data,records:[...data.records,rec]};setData(upd);saveAndSync(upd,rec,toast);toast('✅ Plan guardado');
    setForm({objetivos:{oportunidades:'',ventas:'',instalaciones:'',cuentasRecuperadas:'',arpu:''},prioridades:'',vendedores_acompanar:'',zonas:emptyZonas(),resultado_esperado:'',notas:''});
  };

  // Resultado real de la semana pendiente: se precarga del sistema (embudo de esa semana) y es editable.
  const[resForm,setResForm]=useState(null);
  useEffect(()=>{
    if(!planPendiente){setResForm(null);return;}
    const ini=new Date(planPendiente.semanaInicio+'T00:00:00');
    const fin=new Date(planPendiente.semanaFin+'T23:59:59');
    const tot={oportunidades:0,ventas:0,instalaciones:0};
    vendedoresPlan.forEach(m=>{
      const f=funnelPeriodo(m.ventas,ini,fin);
      tot.oportunidades+=f.oportunidades;tot.ventas+=f.validadas;tot.instalaciones+=f.instaladas;
    });
    setResForm({...tot,cuentasRecuperadas:'',arpu:''});
  },[planPendiente?.id]);

  const guardarResultado=async()=>{
    if(!planPendiente||!resForm)return;
    const rec={id:uid(),type:'plan_resultado',planId:planPendiente.id,date:today(),
      semanaInicio:planPendiente.semanaInicio,semanaFin:planPendiente.semanaFin,semanaLabel:planPendiente.semanaLabel,
      objetivos:planPendiente.objetivos,resultados:resForm,
      registradoPor:session.user.nombre,token:session.token,savedAt:new Date().toISOString()};
    const upd={...data,records:[...data.records,rec]};setData(upd);saveAndSync(upd,rec,toast);toast('✅ Resultado guardado');
  };

  return <div>
    {esLider&&
      <Card title={`📊 Planes del equipo — Semana ${semanaLabel}`}>
        {cargandoPlanesEquipo?<div style={{textAlign:'center',padding:20}}><Spinner/></div>:
        (session.coaches||[]).length===0?<p style={{fontSize:12,color:'var(--dim)'}}>Sin coaches asignados.</p>:
        coachesPlanEstado.map(({coach,estado,pct})=>{
          const color=estado==='completo'?'var(--green)':estado==='parcial'?'var(--yellow)':'var(--red)';
          const bg=estado==='completo'?'var(--gbg)':estado==='parcial'?'var(--ybg)':'var(--rbg)';
          const texto=estado==='sin'?'Sin capturar':`${pct}%`;
          return <div key={coach.nombre} style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'8px 10px',borderRadius:8,marginBottom:6,background:bg,border:`1px solid ${color}`}}>
            <span style={{fontSize:13,fontWeight:600}}>{coach.nombre.split(' ').slice(0,3).join(' ')}</span>
            <span style={{fontSize:12,fontWeight:700,color}}>{texto}</span>
          </div>;
        })}
        <p style={{fontSize:10,color:'var(--dim)',marginTop:4}}>🟢 100% capturado · 🟡 capturado parcial · 🔴 sin capturar</p>
      </Card>
    }
    {retraso&&<Card style={{borderLeft:'4px solid var(--red)'}}>
      <p style={{fontSize:13,fontWeight:700,color:'var(--red)',margin:0}}>⚠️ Aún no se ha capturado el plan de esta semana — debía quedar listo el lunes.</p>
    </Card>}
    {!planActual&&!retraso&&<Card style={{borderLeft:`4px solid ${esLunes?'var(--yellow)':'var(--border)'}`}}>
      <p style={{fontSize:12,color:'var(--dim)',margin:0}}>{esLunes?'📌 Hoy es lunes — captura el objetivo comprometido para esta semana.':'Plan de la semana aún no capturado.'}</p>
    </Card>}

    {planPendiente&&resForm&&
      <Card title={`📌 Resultado pendiente — Semana ${planPendiente.semanaLabel}`} style={{borderLeft:'4px solid var(--yellow)'}}>
        <p style={{fontSize:11,color:'var(--dim)',marginBottom:8}}>Se precargó de lo que hay en sistema para esa semana — ajústalo si hace falta y guarda el resultado real.</p>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8}}>
          {KPIS.map(kpi=>{
            const obj=Number(planPendiente.objetivos?.[kpi.k])||0;
            const real=Number(resForm[kpi.k])||0;
            const p=obj?Math.round(real/obj*100):null;
            return <Field key={kpi.k} label={`${kpi.label} (obj: ${obj})`}>
              <Input type="number" value={resForm[kpi.k]} onChange={e=>setResForm(f=>({...f,[kpi.k]:e.target.value}))}/>
              {p!=null&&<p style={{fontSize:11,fontWeight:700,margin:'2px 0 0',color:p>=95?'var(--green)':p>=60?'var(--yellow)':'var(--red)'}}>{p}%</p>}
            </Field>;
          })}
          <Field label={`Cuentas recuperadas NPPF (obj: ${planPendiente.objetivos?.cuentasRecuperadas||0})`}>
            <Input type="number" value={resForm.cuentasRecuperadas} onChange={e=>setResForm(f=>({...f,cuentasRecuperadas:e.target.value}))}/>
          </Field>
          <Field label={`ARPU (obj: ${fmtMoney(planPendiente.objetivos?.arpu)})`}>
            <InputMoney value={resForm.arpu} onChange={e=>setResForm(f=>({...f,arpu:e.target.value}))}/>
          </Field>
        </div>
        <Btn onClick={guardarResultado} style={{width:'100%'}}>💾 Guardar resultado real</Btn>
      </Card>
    }

    {planActual?
      <Card title={`✅ Plan de la semana — ${planActual.semanaLabel}`} style={{borderLeft:'4px solid var(--green)'}}>
        <p style={{fontSize:12,color:'var(--dim)',marginBottom:6}}>Ya se capturó el objetivo de esta semana.</p>
        {KPIS.map(kpi=><div key={kpi.k} style={{display:'flex',justifyContent:'space-between',fontSize:13,padding:'3px 0'}}>
          <span>{kpi.label}</span>
          <b style={{color:colorVsMeta(planActual.objetivos?.[kpi.k],planActual.metaOficial?.[kpi.k])}}>{planActual.objetivos?.[kpi.k]||0} <span style={{color:'var(--dim)',fontWeight:400}}>/ meta {planActual.metaOficial?.[kpi.k]??'-'}</span></b>
        </div>)}
        <div style={{display:'flex',justifyContent:'space-between',fontSize:13,padding:'3px 0'}}><span>Cuentas recuperadas NPPF</span><b>{planActual.objetivos?.cuentasRecuperadas||0}</b></div>
        <div style={{display:'flex',justifyContent:'space-between',fontSize:13,padding:'3px 0'}}><span>ARPU</span><b>{fmtMoney(planActual.objetivos?.arpu)}</b></div>
        {DIAS_SEMANA.some(d=>{const dz=diaZonas(planActual.zonas,d);return dz.entradas.length||dz.direccion||dz.comentarios;})&&<div style={{marginTop:10,paddingTop:10,borderTop:'1px solid var(--border)'}}>
          <div style={{fontSize:12,fontWeight:700,color:'var(--dim)',marginBottom:4}}>🗺️ Zonas de la semana</div>
          {DIAS_SEMANA.filter(d=>{const dz=diaZonas(planActual.zonas,d);return dz.entradas.length||dz.direccion||dz.comentarios;}).map(d=>{
            const dz=diaZonas(planActual.zonas,d);
            return <div key={d} style={{marginBottom:4}}>
              {dz.entradas.length>0&&<p style={{fontSize:12,margin:'2px 0'}}><b>{DIAS_SEMANA_LABEL[d]}:</b> {dz.entradas.map(e=>e.colonia?`${e.colonia} (${e.cluster})`:`${e.cluster} (todo)`).join(', ')}</p>}
              {!dz.entradas.length&&<p style={{fontSize:12,margin:'2px 0'}}><b>{DIAS_SEMANA_LABEL[d]}</b></p>}
              {dz.direccion&&<p style={{fontSize:11,color:'var(--dim)',margin:'0 0 0 10px'}}>📍 {dz.direccion}</p>}
              {dz.comentarios&&<p style={{fontSize:11,color:'var(--dim)',margin:'0 0 0 10px'}}>💬 {dz.comentarios}</p>}
            </div>;
          })}
        </div>}
        <div style={{display:'flex',gap:8,marginTop:10,flexWrap:'wrap'}}>
          <a href={whatsappUrl(textoPlan(planActual))} target="_blank" rel="noopener noreferrer"
            style={{display:'inline-flex',alignItems:'center',gap:6,padding:'8px 14px',borderRadius:8,background:'#25D366',color:'#fff',fontSize:13,fontWeight:700,textDecoration:'none'}}>
            📲 Enviar plan al líder por WhatsApp
          </a>
          <Btn variant="secondary" onClick={()=>window.scrollTo({top:0,behavior:'smooth'})} style={{fontSize:13}}>← Volver al Plan</Btn>
        </div>
      </Card>
    :<>
      {esLider?<>
        <Card title="🎯 Objetivo de la semana (de tus coaches)">
          <p style={{fontSize:11,color:'var(--dim)',marginBottom:8}}>Semana {semanaLabel}. Se llena solo con lo que cada coach ya capturó en su propio plan.</p>
          {(session.coaches||[]).length===0?<p style={{fontSize:12,color:'var(--dim)'}}>Sin coaches asignados.</p>:
          <div style={{overflowX:'auto'}}>
            <table style={{width:'100%',borderCollapse:'collapse',fontSize:11}}>
              <thead><tr style={{borderBottom:'2px solid var(--border)'}}>
                <th style={{textAlign:'left',padding:'4px'}}>Coach</th>
                <th style={{textAlign:'right',padding:'4px'}}>Op.</th>
                <th style={{textAlign:'right',padding:'4px'}}>Val.</th>

// ─── Dashboard ───
function DashboardTab({data,team,coaches,session,setTab}){
  const{role}=session;
  const now=new Date();
  const mesActual=now.getMonth();const anioActual=now.getFullYear();
  const MESES=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
  const MESES_LARGO=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  const mesEvaluado=mesActual===0?MESES[11]+' '+(anioActual-1):MESES[mesActual-1]+' '+anioActual;
  const thisMonth=r=>{const d=new Date(r.date);return d.getMonth()===mesActual&&d.getFullYear()===anioActual;};
  const recs=data.records;
  const rm=recs.filter(thisMonth);
  const[expanded,setExpanded]=useState(null);

  const arranques=rm.filter(r=>r.type==='arranque').length;
  const cierres=rm.filter(r=>r.type==='cierre').length;
  const acomp=rm.filter(r=>r.type==='feedback'&&r.tipo==='Acompañamiento').length;
  const incOp=rm.filter(r=>r.type==='feedback'&&r.tipo==='Incidencia operativa').length;
  const incCrit=rm.filter(r=>r.type==='feedback'&&r.tipo==='Incidencia crítica').length;
  const permisos=rm.filter(r=>r.type==='permiso').length;
  const totalFeedback=rm.filter(r=>r.type==='feedback').length;

  const diasMes=new Date(anioActual,mesActual+1,0).getDate();
  const diasTranscurridos=Math.min(now.getDate(),diasMes);
  const diasLabTransc=Math.round(diasTranscurridos*6/7);

  const vendedores=team.filter(m=>isVendedor(m.posicion));
  // Para el líder: la información se muestra primero agrupada por coach (no por vendedor) —
  // se profundiza a nivel vendedor solo al tocar un coach específico.
  const esLider=role==='lider';
  const vendedoresPorCoach={};
  if(esLider){
    (coaches||[]).forEach(c=>{vendedoresPorCoach[c.nombre]=[];});
    vendedores.forEach(m=>{(vendedoresPorCoach[m.reportaA]=vendedoresPorCoach[m.reportaA]||[]).push(m);});
  }

  // ── Ventas del equipo: semana/mes en curso, rechazos, asignaciones y cuentas sin pagar ──
  const semanaIni=startOfWeek(now),semanaFin=endOfWeek(now);
  const mesIni=startOfMonth(now),mesFin=endOfMonth(now);
  const[periodoVentas,setPeriodoVentas]=useState('semana');
  // offsetVentas: 0 = periodo actual, 1 = el anterior, 2 = dos atrás... permite hojear semanas/meses previos
  // sin perder el resto de las tarjetas (sin pagar, pendientes), que siempre reflejan el estado de "hoy".
  const[offsetVentas,setOffsetVentas]=useState(0);
  // El servidor (obtenerVentasComisiones) solo trae los últimos VENTAS_LOOKBACK_MESES meses —
  // el tope de navegación debe coincidir exactamente, o se podría "hojear" a un periodo sin datos.
  const cutoffVentas=(()=>{const d=startOfMonth(now);d.setMonth(d.getMonth()-VENTAS_LOOKBACK_MESES);return d;})();
  const MAX_OFFSET_VENTAS=periodoVentas==='semana'
    ?Math.max(0,Math.floor((startOfWeek(now)-cutoffVentas)/(7*86400000)))
    :VENTAS_LOOKBACK_MESES;
  const cambiarPeriodoVentas=p=>{setPeriodoVentas(p);setOffsetVentas(0);};
  const fechaRefVentas=(()=>{
    const d=new Date(now);
    if(periodoVentas==='semana'){d.setDate(d.getDate()-offsetVentas*7);}
    else{d.setDate(1);d.setMonth(d.getMonth()-offsetVentas);} // día 1 primero: evita que setMonth se desborde al restar desde un día 29-31
    return d;
  })();

  const motivosOrdenados=Object.entries(rechazosMotivos).sort((a,b)=>b[1].length-a[1].length);

            {isExp&&<div style={{background:'var(--bg)',borderRadius:6,padding:'6px 8px',marginBottom:6}}>
              {planesCoach.map(([p,b])=>{

                const pct=Math.round(b.n/totalPlan*100);
                return <div key={p} style={{fontSize:11,color:'var(--dim)',display:'flex',justifyContent:'space-between',gap:6,padding:'3px 0',borderBottom:'1px solid var(--border)'}}>
                  <span>{p}</span>
                  <span><b>{b.n}</b> cta{b.n!==1?'s':''} · {pct}% de {totalPlan} inst. · <b style={{color:'var(--red)'}}>{fmtMoney(b.importe)}</b></span>
                </div>;
              })}
            </div>}
          </div>;
        }):sinPagarPorPlanOrdenado.map(([p,b])=>{

            <span>{p}</span>
            <span><b>{b.n}</b> cta{b.n!==1?'s':''} · {pct}% de {totalPlan} inst. · <b style={{color:'var(--red)'}}>{fmtMoney(b.importe)}</b></span>

    }

    <Card title="🚦 Semáforo del equipo">
      <SemBar/>
      <div style={{display:'flex',justifyContent:'space-around',marginTop:8,fontSize:11,color:'var(--dim)'}}>

      </div>
    </Card>

    <Card title={esLider?`👥 Equipo por Coach (${(coaches||[]).length}) — toca para ver detalle`:`👥 Equipo (${vendedores.length}) — toca para ver detalle`}>

        const vendCoach=vendedoresPorCoach[c.nombre]||[];
        const key=c.nombre;
        const isExp=expandedCoachEquipo===key;
        const v=vendCoach.filter(m=>semaforoMap[m.nombre]==='verde').length;
        const a=vendCoach.filter(m=>semaforoMap[m.nombre]==='amarillo').length;
        const r=vendCoach.filter(m=>semaforoMap[m.nombre]==='rojo').length;
        const sinEv2=vendCoach.length-v-a-r;
        // Mismos totales que la caja "🛒 Ventas" de cada vendedor (ContextCard), pero sumados entre
        // todos los vendedores del coach.
        let opSemana=0,valSemana=0,instSemana=0,opMes=0,valMes=0,instMes=0,metaMesCoach=0;
        vendCoach.forEach(m=>{
          const fSem=funnelPeriodo(m.ventas,semanaIni,semanaFin);
          const fMes=funnelPeriodo(m.ventas,mesIni,mesFin);
          opSemana+=fSem.oportunidades;valSemana+=fSem.validadas;instSemana+=fSem.instaladas;
          opMes+=fMes.oportunidades;valMes+=fMes.validadas;instMes+=fMes.instaladas;
          metaMesCoach+=metaMensual(m.badge);
        });
        return <div key={key}>
          <div onClick={()=>setExpandedCoachEquipo(isExp?null:key)} style={{
            display:'flex',alignItems:'center',justifyContent:'space-between',
            padding:'8px 10px',borderRadius:isExp?'8px 8px 0 0':8,marginBottom:isExp?0:4,cursor:'pointer',
            background:r>0?'var(--rbg)':a>0?'var(--ybg)':'transparent',
            border:`1px solid ${r>0?'var(--red)':a>0?'var(--yellow)':'var(--border)'}`,
            borderBottom:isExp?'none':undefined,
          }}>
            <div style={{flex:1}}>
              <div style={{fontSize:13,fontWeight:700}}>{c.nombre.split(' ').slice(0,3).join(' ')}</div>
              <div style={{fontSize:10,color:'var(--dim)',marginTop:1}}>{vendCoach.length} vendedor{vendCoach.length!==1?'es':''} · 🟢{v} 🟡{a} 🔴{r} ⚪{sinEv2}</div>
              <div style={{fontSize:10,color:'var(--dim)',marginTop:2}}>Semana: {opSemana} op · {valSemana} val · {instSemana} inst</div>
              <div style={{fontSize:10,color:'var(--dim)',marginTop:1}}>Mes: {opMes} op · {valMes} val · {instMes} inst</div>
              {metaMesCoach>0&&<div style={{fontSize:10,color:'var(--dim)',marginTop:1}}>🎯 Meta del mes: <b>{instMes}/{metaMesCoach}</b></div>}
            </div>
            <span style={{fontSize:12,color:'var(--dim)'}}>{isExp?'▲':'▼'}</span>
          </div>
          {isExp&&<div style={{border:'1px solid var(--border)',borderTop:'none',borderRadius:'0 0 8px 8px',padding:'8px',marginBottom:4}}>
            {vendCoach.length===0?<p style={{fontSize:12,color:'var(--dim)'}}>Sin vendedores asignados.</p>:
            vendCoach.map(m=><VendedorRow key={m.numEmp||m.nombre} m={m} nested/>)}
          </div>}
        </div>;
      }):vendedores.map(m=><VendedorRow key={m.numEmp||m.nombre} m={m}/>)}
    </Card>

    {compPendientes.length>0&&
      <Card title={`⏰ Compromisos por revisar (${compPendientes.length})`} style={{borderLeft:'4px solid var(--yellow)'}}>
        {compPendientes.slice(0,5).map(r=><div key={r.id} style={{fontSize:12,padding:'6px 0',borderBottom:'1px solid var(--border)'}}>
          <div style={{display:'flex',justifyContent:'space-between'}}><b>{r.vendedor}</b><span style={{color:'var(--dim)'}}>{fmt(r.fecha_revision)}</span></div>
          <p style={{color:'var(--dim)',margin:'2px 0 0'}}>{r.compromisos?.slice(0,100)}{r.compromisos?.length>100?'...':''}</p>
        </div>)}
      </Card>
    }

    <Card title="⚡ Acciones rápidas">
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8}}>
        <Btn onClick={()=>setTab('arranque')} variant="secondary" style={{fontSize:13}}>☀️ Arranque</Btn>
        <Btn onClick={()=>setTab('cierre')} variant="secondary" style={{fontSize:13}}>🌙 Cierre</Btn>
        <Btn onClick={()=>setTab('feedback')} variant="secondary" style={{fontSize:13}}>💬 Hallazgo</Btn>
        <Btn onClick={()=>setTab('plan')} variant="secondary" style={{fontSize:13}}>📊 Plan</Btn>
      </div>
    </Card>
  </div>;
}

// ─── Historial ───
function HistorialTab({data,setData,toast,session}){
  const[filter,setFilter]=useState('todos');const[dateF,setDateF]=useState('');
  const[verFoto,setVerFoto]=useState(null);
  const[vista,setVista]=useState('dispositivo'); // 'dispositivo' (local) | 'equipo' (Sheet)
  const[equipoRecs,setEquipoRecs]=useState([]);
  const[cargandoEquipo,setCargandoEquipo]=useState(false);
  // Nombres cuyos registros puede ver este usuario: los suyos propios y los de su equipo.
  const nombresEquipo=new Set([session?.user?.nombre,...(session?.team||[]).map(m=>m.nombre),...(session?.coaches||[]).map(m=>m.nombre)].filter(Boolean));
  const HOJAS_EQUIPO=['arranque','cierre','permiso','plan','plan_resultado','feedback'];
  const TIPO_A_HOJA={arranque:'ARRANQUE',cierre:'CIERRE',permiso:'PERMISO',plan:'PLAN',plan_resultado:'PLAN_RESULTADO',feedback:'FEEDBACK'};
  useEffect(()=>{
    if(vista!=='equipo')return;
    setCargandoEquipo(true);
    const hojas=filter==='todos'?HOJAS_EQUIPO:[filter];
    Promise.all(hojas.map(tipo=>fetchHistorialEquipo(TIPO_A_HOJA[tipo],session.token).then(regs=>regs.map(r=>({...r,_tipo:tipo})))))
      .then(resultados=>{
        const todos=resultados.flat().filter(r=>nombresEquipo.has(r['Registrado por']));
        todos.sort((a,b)=>String(b['Timestamp']||'').localeCompare(String(a['Timestamp']||'')));
        setEquipoRecs(todos);
        setCargandoEquipo(false);
      });
  },[vista,filter]);
  const typeL={arranque:'☀️ Arranque',cierre:'🌙 Cierre',permiso:'📋 Permiso',plan:'📊 Plan',plan_resultado:'📊 Resultado Plan',feedback:'💬 Hallazgo'};
  const recs=data.records.filter(r=>filter==='todos'||r.type===filter).filter(r=>!dateF||r.date===dateF).sort((a,b)=>b.savedAt.localeCompare(a.savedAt));
  const del=id=>{if(!confirm('¿Eliminar?'))return;const upd={...data,records:data.records.filter(r=>r.id!==id)};setData(upd);saveData(upd);toast('Eliminado');};
  // Si ya se subió a Drive, `src` es una liga (no una foto embebida) — no carga como <img>,
  // así que se ofrece como botón para abrirla, en vez de intentar mostrarla en línea.

    if(!src?.startsWith('data:'))return <a href={src} target="_blank" rel="noopener noreferrer" style={{display:'inline-flex',alignItems:'center',gap:6,padding:'8px 12px',borderRadius:8,background:'var(--accent-light)',color:'var(--accent)',fontSize:12,fontWeight:700,textDecoration:'none',...s}}>📷 Ver foto (Drive)</a>;

  };
  const detail=r=>{
    switch(r.type){
      case'arranque':return <div style={{fontSize:13}}><p><b>Presentes:</b> {r.presentes?.length||0} · <b>Ausentes:</b> {r.ausentes?.length||0}</p>{r.ausentes?.map(a=><div key={a.name} style={{margin:'2px 0'}}><p style={{color:'var(--red)',margin:0}}>✗ {a.name}: {a.reason}{a.detail?` — ${a.detail}`:''}</p>{a.photo&&<FotoMini src={a.photo} style={{maxHeight:160,marginTop:4}}/>}</div>)}{r.notas&&<p style={{marginTop:6}}>{r.notas}</p>}{r.photo&&<FotoMini src={r.photo} style={{maxHeight:120,marginTop:6}}/>}</div>;
      case'permiso':return <div style={{fontSize:13}}><p><b>{r.vendedor}</b> — {r.tipo}</p><p>{r.motivo}</p>{r.compromiso&&(r.compromiso.cuentas||r.compromiso.ventas||r.compromiso.instalaciones)&&<p>🎯 Compromiso: {r.compromiso.cuentas||0} cuentas · {r.compromiso.ventas||0} ventas · {r.compromiso.instalaciones||0} instal.</p>}{r.colonia&&<p>📍 {r.colonia}</p>}{r.autorizado_por&&<p style={{color:'var(--dim)'}}>Autorizado: {r.autorizado_por}</p>}{r.photo&&<FotoMini src={r.photo} style={{maxHeight:160,marginTop:6}}/>}</div>;

  // Detalle para registros que vienen del Sheet (vista "Equipo"): las columnas ya son texto

          <div style={{display:'flex',alignItems:'center',gap:8}}><b style={{fontSize:13}}>{r['Integrante']}</b><span style={{fontSize:13}}>— {r['Tipo']}</span>{r['Semáforo']&&<StatusBadge status={r['Semáforo']} small/>}</div>
