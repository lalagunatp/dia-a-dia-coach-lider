            padding:'8px 10px',borderRadius:isExp?'8px 8px 0 0':8,marginBottom:isExp?0:4,cursor:'pointer',
            background:sem==='rojo'?'var(--rbg)':sem==='amarillo'?'var(--ybg)':'transparent',
            border:`1px solid ${sem==='rojo'?'var(--red)':sem==='amarillo'?'var(--yellow)':'var(--border)'}`,
            borderBottom:isExp?'none':undefined,
          }}>
            <div style={{flex:1}}>
              <div style={{display:'flex',alignItems:'center',gap:4,flexWrap:'wrap'}}>
                <span style={{fontSize:13,fontWeight:600}}>{m.nombre.split(' ').slice(0,3).join(' ')}</span>
                <RankBadge badge={m.badge}/>
                {m.obs&&<span style={{fontSize:10,fontWeight:600,color:'var(--yellow)'}}>⚠️ {m.obs}</span>}
                {sinPagarN>0&&<span style={{fontSize:10,fontWeight:700,color:'var(--red)'}}>💰 {sinPagarN} sin pagar ({sinPagarPct}%)</span>}
              </div>
              {m.rankingMen&&<div style={{fontSize:10,color:'var(--dim)',marginTop:1}}>
                Prom: {m.rankingMen.promedioMensual} ins/mes
                {m.mesesEnRanking>0&&<span> · {m.mesesEnRanking}m en nivel</span>}
              </div>}
              {metaMensual(m.badge)>0&&<div style={{fontSize:10,color:'var(--dim)',marginTop:1}}>
                🎯 {funnelPeriodo(m.ventas,mesIni,mesFin).instaladas}/{metaMensual(m.badge)} inst. del mes
              </div>}
              {metaSemanal(m.badge)>0&&<div style={{fontSize:10,color:'var(--dim)',marginTop:1}}>
                🎯 {funnelPeriodo(m.ventas,semanaIni,semanaFin).instaladas}/{metaSemanal(m.badge)} inst. de la semana
              </div>}
              {m.rankingMen?.ventaSana&&<div style={{fontSize:10,color:'var(--dim)',marginTop:1}}>
                % Venta sana ({m.rankingMen.ventaSana.mes}): <b>{m.rankingMen.ventaSana.valor}</b>
              </div>}
              {lastFb&&<div style={{fontSize:10,color:'var(--dim)',marginTop:1}}>Último: {fmt(lastFb.date)} · {lastFb.tipo}</div>}
              {!lastFb&&<div style={{fontSize:10,color:'var(--yellow)',marginTop:1}}>Sin evaluación</div>}
            </div>
            <div style={{display:'flex',alignItems:'center',gap:4}}>
              {sem?<StatusBadge status={sem} small/>:<span style={{fontSize:10,color:'#9ca3af'}}>⚪</span>}
              <span style={{fontSize:12,color:'var(--dim)'}}>{isExp?'▲':'▼'}</span>
            </div>
          </div>
          {isExp&&<div style={{border:'1px solid var(--border)',borderTop:'none',borderRadius:'0 0 8px 8px',marginBottom:4}}>
            <ContextCard m={m}/>
          </div>}
        </div>;
      })}
    </Card>

    {compPendientes.length>0&&
      <Card title={`⏰ Compromisos por revisar (${compPendientes.length})`} style={{borderLeft:'4px solid var(--yellow)'}}>
        {compPendientes.slice(0,5).map(r=><div key={r.id} style={{fontSize:12,padding:'6px 0',borderBottom:'1px solid var(--border)'}}>
          <div style={{display:'flex',justifyContent:'space-between'}}><b>{r.vendedor}</b><span style={{color:'var(--dim)'}}>{fmt(r.fecha_revision)}</span></div>
          <p style={{color:'var(--dim)',margin:'2px 0 0'}}>{r.compromisos?.slice(0,100)}{r.compromisos?.length>100?'...':''}</p>
        </div>)}
      </Card>
    }

    <Card title="⚡ Acciones rápidas">
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8}}>
        <Btn onClick={()=>setTab('arranque')} variant="secondary" style={{fontSize:13}}>☀️ Arranque</Btn>
        <Btn onClick={()=>setTab('cierre')} variant="secondary" style={{fontSize:13}}>🌙 Cierre</Btn>
        <Btn onClick={()=>setTab('feedback')} variant="secondary" style={{fontSize:13}}>💬 Hallazgo</Btn>
        <Btn onClick={()=>setTab('plan')} variant="secondary" style={{fontSize:13}}>📊 Plan</Btn>
      </div>
    </Card>
  </div>;
}

// ─── Historial ───
function HistorialTab({data,setData,toast,session}){
  const[filter,setFilter]=useState('todos');const[dateF,setDateF]=useState('');
  const[verFoto,setVerFoto]=useState(null);
  const[vista,setVista]=useState('dispositivo'); // 'dispositivo' (local) | 'equipo' (Sheet)
  const[equipoRecs,setEquipoRecs]=useState([]);
  const[cargandoEquipo,setCargandoEquipo]=useState(false);
  // Nombres cuyos registros puede ver este usuario: los suyos propios y los de su equipo.
  const nombresEquipo=new Set([session?.user?.nombre,...(session?.team||[]).map(m=>m.nombre),...(session?.coaches||[]).map(m=>m.nombre)].filter(Boolean));
  const HOJAS_EQUIPO=['arranque','cierre','permiso','plan','plan_resultado','feedback'];
  const TIPO_A_HOJA={arranque:'ARRANQUE',cierre:'CIERRE',permiso:'PERMISO',plan:'PLAN',plan_resultado:'PLAN_RESULTADO',feedback:'FEEDBACK'};
  useEffect(()=>{
    if(vista!=='equipo')return;
    setCargandoEquipo(true);
    const hojas=filter==='todos'?HOJAS_EQUIPO:[filter];
    Promise.all(hojas.map(tipo=>fetchHistorialEquipo(TIPO_A_HOJA[tipo]).then(regs=>regs.map(r=>({...r,_tipo:tipo})))))
      .then(resultados=>{
        const todos=resultados.flat().filter(r=>nombresEquipo.has(r['Registrado por']));
        todos.sort((a,b)=>String(b['Timestamp']||'').localeCompare(String(a['Timestamp']||'')));
        setEquipoRecs(todos);
        setCargandoEquipo(false);
      });
  },[vista,filter]);
  const typeL={arranque:'☀️ Arranque',cierre:'🌙 Cierre',permiso:'📋 Permiso',plan:'📊 Plan',plan_resultado:'📊 Resultado Plan',feedback:'💬 Hallazgo'};
  const recs=data.records.filter(r=>filter==='todos'||r.type===filter).filter(r=>!dateF||r.date===dateF).sort((a,b)=>b.savedAt.localeCompare(a.savedAt));
  const del=id=>{if(!confirm('¿Eliminar?'))return;const upd={...data,records:data.records.filter(r=>r.id!==id)};setData(upd);saveData(upd);toast('Eliminado');};
  // Si ya se subió a Drive, `src` es una liga (no una foto embebida) — no carga como <img>,
  // así que se ofrece como botón para abrirla, en vez de intentar mostrarla en línea.
  const FotoMini=({src,style:s})=>{
    if(!src?.startsWith('data:'))return <a href={src} target="_blank" rel="noopener noreferrer" style={{display:'inline-flex',alignItems:'center',gap:6,padding:'8px 12px',borderRadius:8,background:'var(--accent-light)',color:'var(--accent)',fontSize:12,fontWeight:700,textDecoration:'none',...s}}>📷 Ver foto (Drive)</a>;
    return <img src={src} alt="" onClick={()=>setVerFoto(src)} style={{width:'100%',objectFit:'cover',borderRadius:8,cursor:'pointer',...s}}/>;
  };
  const detail=r=>{
    switch(r.type){
      case'arranque':return <div style={{fontSize:13}}><p><b>Presentes:</b> {r.presentes?.length||0} · <b>Ausentes:</b> {r.ausentes?.length||0}</p>{r.ausentes?.map(a=><div key={a.name} style={{margin:'2px 0'}}><p style={{color:'var(--red)',margin:0}}>✗ {a.name}: {a.reason}{a.detail?` — ${a.detail}`:''}</p>{a.photo&&<FotoMini src={a.photo} style={{maxHeight:160,marginTop:4}}/>}</div>)}{r.notas&&<p style={{marginTop:6}}>{r.notas}</p>}{r.photo&&<FotoMini src={r.photo} style={{maxHeight:120,marginTop:6}}/>}</div>;
      case'permiso':return <div style={{fontSize:13}}><p><b>{r.vendedor}</b> — {r.tipo}</p><p>{r.motivo}</p>{r.compromiso&&(r.compromiso.cuentas||r.compromiso.ventas||r.compromiso.instalaciones)&&<p>🎯 Compromiso: {r.compromiso.cuentas||0} cuentas · {r.compromiso.ventas||0} ventas · {r.compromiso.instalaciones||0} instal.</p>}{r.colonia&&<p>📍 {r.colonia}</p>}{r.autorizado_por&&<p style={{color:'var(--dim)'}}>Autorizado: {r.autorizado_por}</p>}{r.photo&&<FotoMini src={r.photo} style={{maxHeight:160,marginTop:6}}/>}</div>;
      case'cierre':return <div style={{fontSize:13}}>
        {r.resultados?.filter(x=>x.oportunidades||x.validadas||x.instaladas||x.pagadasHoy||x.pendiente).map((x,i)=>
          <div key={i} style={{fontSize:12,padding:'3px 0',borderBottom:'1px solid var(--border)'}}>
            <b>{x.nombre}:</b> {x.oportunidades||0} op · {x.validadas||0} val · {x.instaladas||0} inst{x.pagadasHoy?` · ${x.pagadasHoy} cta(s) pagada(s) hoy`:''}
            {x.pendiente&&<div style={{color:'var(--dim)'}}>Pendiente: {x.pendiente}</div>}
          </div>
        )}
        {r.incidencias&&<p style={{marginTop:4}}><b>Incidencias:</b> {r.incidencias}</p>}
        {r.seguimiento?.length>0&&<div style={{marginTop:4}}>
          <b>Seguimiento mañana:</b>
          {r.seguimiento.map((s,i)=><p key={i} style={{fontSize:12,margin:'2px 0'}}>• {s.name}{s.motivo?`: ${s.motivo}`:''}</p>)}
        </div>}
        {/* Compatibilidad con cierres guardados antes de este cambio */}
        {r.resultado&&<p><b>Resultado:</b> {r.resultado}</p>}
        {r.pendientes&&<p><b>Pendientes:</b> {r.pendientes}</p>}
        {r.vendedores_seguimiento&&<p><b>Seguimiento:</b> {r.vendedores_seguimiento}</p>}
      </div>;
      case'plan':return <div style={{fontSize:13}}>
        <p><b>Semana:</b> {r.semanaLabel||''}</p>
        {r.objetivos&&<p>🎯 Oport: {r.objetivos.oportunidades||0} (meta {r.metaOficial?.oportunidades??'-'}) · Ventas: {r.objetivos.ventas||0} (meta {r.metaOficial?.ventas??'-'}) · Instal: {r.objetivos.instalaciones||0} (meta {r.metaOficial?.instalaciones??'-'})</p>}
        {r.objetivos&&<p>NPPF: {r.objetivos.cuentasRecuperadas||0} · ARPU: {r.objetivos.arpu||0}</p>}
        {r.prioridades&&<p><b>Prioridades:</b> {r.prioridades}</p>}
        {r.vendedores_acompanar&&<p><b>Acompañamientos:</b> {r.vendedores_acompanar}</p>}
        {zonasATexto(r.zonas)&&<div style={{marginTop:4}}>
          <b>Zonas:</b>
          {zonasATexto(r.zonas).split('\n').map((linea,i)=><p key={i} style={{margin:'2px 0'}}>• {linea}</p>)}
        </div>}
        {r.resultado_esperado&&<p><b>Resultado esperado:</b> {r.resultado_esperado}</p>}
        {/* Compatibilidad con planes guardados antes de este cambio */}
        {r.objetivo&&<p><b>Objetivo:</b> {r.objetivo}</p>}
      </div>;
      case'plan_resultado':{
        const pctKpi=(k)=>{const o=Number(r.objetivos?.[k])||0;const v=Number(r.resultados?.[k])||0;return o?Math.round(v/o*100):null;};
        return <div style={{fontSize:13}}>
          <p><b>Semana:</b> {r.semanaLabel||''}</p>
          {['oportunidades','ventas','instalaciones'].map(k=>{
            const p=pctKpi(k);
            return <p key={k} style={{margin:'2px 0'}}>{k[0].toUpperCase()+k.slice(1)}: {r.resultados?.[k]||0}{r.objetivos?.[k]!=null&&` / obj. ${r.objetivos[k]}`}{p!=null&&<b style={{marginLeft:6,color:p>=95?'var(--green)':p>=60?'var(--yellow)':'var(--red)'}}>{p}%</b>}</p>;
          })}
          <p>NPPF: {r.resultados?.cuentasRecuperadas||0} · ARPU: {r.resultados?.arpu||0}</p>
        </div>;
      }
      case'feedback':return <div style={{fontSize:13}}><div style={{display:'flex',alignItems:'center',gap:8,marginBottom:4}}><b>{r.vendedor}</b> — {r.tipo}<StatusBadge status={r.semaforo} small/></div>{r.hallazgos&&<p>{r.hallazgos}</p>}{r.compromisos&&<p><b>Compromisos:</b> {r.compromisos}</p>}{r.transcript&&<p style={{fontStyle:'italic',background:'var(--bg)',padding:8,borderRadius:6,marginTop:4}}>🎙️ {r.transcript.slice(0,200)}{r.transcript.length>200?'...':''}</p>}{r.photo&&<FotoMini src={r.photo} style={{maxHeight:160,marginTop:6}}/>}{r.fotos?.length>0&&<div style={{display:'flex',flexWrap:'wrap',gap:6,marginTop:6}}>{r.fotos.map((p,i)=><FotoMini key={i} src={p} style={{width:90,height:90,maxHeight:90}}/>)}</div>}</div>;
      default:return null;
    }
  };
  // Detalle para registros que vienen del Sheet (vista "Equipo"): las columnas ya son texto
  // legible tal cual el Apps Script las guardó, no hay que reconstruir estructuras.
  const detailEquipo=(tipo,r)=>{
    switch(tipo){
      case'arranque':{
        const fotosAus=parseFotosAusentes(r['Fotos evidencia ausentes']);
        return <>
          <p style={{fontSize:13}}><b>Presentes:</b> {r['Presentes']} · <b>Ausentes:</b> {r['Ausentes']}</p>
          {r['Detalle ausentes']&&<p style={{fontSize:12,color:'var(--red)',margin:'2px 0'}}>{r['Detalle ausentes']}</p>}
          {r['Notas']&&<p style={{fontSize:13,marginTop:4}}>{r['Notas']}</p>}
          {r['Foto grupo']&&<div style={{marginTop:6}}><FotoMini src={r['Foto grupo']}/></div>}
          {fotosAus.length>0&&<div style={{marginTop:6,display:'flex',flexWrap:'wrap',gap:6}}>
            {fotosAus.map((f,j)=><a key={j} href={f.url} target="_blank" rel="noopener noreferrer" style={{display:'inline-flex',alignItems:'center',gap:6,padding:'6px 10px',borderRadius:8,background:'var(--rbg)',color:'var(--red)',fontSize:11,fontWeight:700,textDecoration:'none'}}>📷 {f.nombre}</a>)}
          </div>}
        </>;
      }
      case'cierre':return <>
        {r['Resultados por vendedor']&&<p style={{fontSize:13}}>{r['Resultados por vendedor']}</p>}
        {r['Incidencias']&&<p style={{fontSize:13}}><b>Incidencias:</b> {r['Incidencias']}</p>}
        {r['Seguimiento mañana']&&<p style={{fontSize:13}}><b>Seguimiento mañana:</b> {r['Seguimiento mañana']}</p>}
        {r['Notas']&&<p style={{fontSize:13}}>{r['Notas']}</p>}
      </>;
      case'permiso':return <>
        <p style={{fontSize:13}}><b>{r['Integrante']}</b> — {r['Tipo']}</p>
        {r['Motivo']&&<p style={{fontSize:13}}>{r['Motivo']}</p>}
        {(r['Compromiso Cuentas']||r['Compromiso Ventas']||r['Compromiso Instalaciones'])&&<p style={{fontSize:13}}>🎯 Compromiso: {r['Compromiso Cuentas']||0} cuentas · {r['Compromiso Ventas']||0} ventas · {r['Compromiso Instalaciones']||0} instal.</p>}
        {r['Colonia']&&<p style={{fontSize:13}}>📍 {r['Colonia']}</p>}
        {r['Autorizado por']&&<p style={{fontSize:12,color:'var(--dim)'}}>Autorizado: {r['Autorizado por']}</p>}
        {r['Foto evidencia']&&<FotoMini src={r['Foto evidencia']} style={{maxHeight:160,marginTop:6}}/>}
      </>;
      case'plan':return <>
        <p style={{fontSize:13}}><b>Semana:</b> {r['Semana']}</p>
        <p style={{fontSize:13}}>🎯 Oport: {r['Obj. Oportunidades']||0} (meta {r['Meta Oportunidades']??'-'}) · Ventas: {r['Obj. Ventas']||0} (meta {r['Meta Ventas']??'-'}) · Instal: {r['Obj. Instalaciones']||0} (meta {r['Meta Instalaciones']??'-'})</p>
        <p style={{fontSize:13}}>NPPF: {r['Obj. Cuentas recuperadas NPPF']||0} · ARPU: {fmtMoney(r['Obj. ARPU'])}</p>
        {r['Prioridades']&&<p style={{fontSize:13}}><b>Prioridades:</b> {r['Prioridades']}</p>}
        {r['Acompañamientos']&&<p style={{fontSize:13}}><b>Acompañamientos:</b> {r['Acompañamientos']}</p>}
        {r['Zonas']&&<p style={{fontSize:13}}><b>Zonas:</b> {r['Zonas']}</p>}
        {r['Resultado esperado']&&<p style={{fontSize:13}}><b>Resultado esperado:</b> {r['Resultado esperado']}</p>}
      </>;
      case'plan_resultado':return <>
        <p style={{fontSize:13}}><b>Semana:</b> {r['Semana']}</p>
        <p style={{fontSize:13}}>Oport: {r['Real Oportunidades']||0}{r['% Oportunidades']!==''?` (${r['% Oportunidades']}%)`:''} · Ventas: {r['Real Ventas']||0}{r['% Ventas']!==''?` (${r['% Ventas']}%)`:''} · Instal: {r['Real Instalaciones']||0}{r['% Instalaciones']!==''?` (${r['% Instalaciones']}%)`:''}</p>
        <p style={{fontSize:13}}>NPPF: {r['Real Cuentas recuperadas NPPF']||0} · ARPU: {fmtMoney(r['Real ARPU'])}</p>
      </>;
      case'feedback':{
        const fotos=String(r['Foto evidencia']||'').split(';').map(s=>s.trim()).filter(Boolean);
        return <>
          <div style={{display:'flex',alignItems:'center',gap:8}}><b style={{fontSize:13}}>{r['Integrante']}</b><span style={{fontSize:13}}>— {r['Tipo']}</span>{r['Semáforo']&&<StatusBadge status={r['Semáforo']} small/>}</div>
          {r['Hallazgos']&&<p style={{fontSize:13}}>{r['Hallazgos']}</p>}
          {r['Compromisos']&&<p style={{fontSize:13}}><b>Compromisos:</b> {r['Compromisos']}</p>}
          {r['Transcripción']&&<p style={{fontStyle:'italic',background:'var(--bg)',padding:8,borderRadius:6,marginTop:4,fontSize:12}}>🎙️ {String(r['Transcripción']).slice(0,200)}{String(r['Transcripción']).length>200?'...':''}</p>}
          {fotos.length>0&&<div style={{display:'flex',flexWrap:'wrap',gap:6,marginTop:6}}>{fotos.map((f,i)=><FotoMini key={i} src={f} style={{width:90,height:90,maxHeight:90}}/>)}</div>}
        </>;
      }
      default:return null;
    }
  };
  const equipoRecsFiltrados=equipoRecs.filter(r=>!dateF||r['Fecha']===dateF);
  return <div>
    <Card title="📁 Historial">
      <div style={{display:'flex',gap:6,marginBottom:10}}>
        <button onClick={()=>setVista('dispositivo')} style={{flex:1,padding:'8px 10px',borderRadius:8,border:'1.5px solid var(--border)',background:vista==='dispositivo'?'var(--accent)':'var(--card)',color:vista==='dispositivo'?'#fff':'var(--dim)',fontWeight:700,fontSize:12,cursor:'pointer'}}>📱 Este dispositivo</button>
        <button onClick={()=>setVista('equipo')} style={{flex:1,padding:'8px 10px',borderRadius:8,border:'1.5px solid var(--border)',background:vista==='equipo'?'var(--accent)':'var(--card)',color:vista==='equipo'?'#fff':'var(--dim)',fontWeight:700,fontSize:12,cursor:'pointer'}}>👥 Equipo</button>
      </div>
      <div style={{display:'flex',gap:6,marginBottom:10,flexWrap:'wrap'}}>
        <Select value={filter} onChange={v=>setFilter(v)} options={[{value:'todos',label:'Todos'},{value:'arranque',label:'☀️ Arranque'},{value:'cierre',label:'🌙 Cierre'},{value:'permiso',label:'📋 Permisos'},{value:'plan',label:'📊 Planes'},{value:'plan_resultado',label:'📊 Resultados Plan'},{value:'feedback',label:'💬 Hallazgos'}]} style={{flex:1,minWidth:120}}/>
        <Input type="date" value={dateF} onChange={e=>setDateF(e.target.value)} style={{flex:1,minWidth:120}}/>
        {dateF&&<Btn variant="ghost" onClick={()=>setDateF('')}>✕</Btn>}
      </div>
      {vista==='dispositivo'?
        <p style={{fontSize:12,color:'var(--dim)'}}>{recs.length} registro{recs.length!==1?'s':''} · guardados en este teléfono</p>
      :
        <p style={{fontSize:12,color:'var(--dim)'}}>{cargandoEquipo?'Cargando…':`${equipoRecsFiltrados.length} registro${equipoRecsFiltrados.length!==1?'s':''} del equipo`} · sincronizados al Sheet, se ven desde cualquier dispositivo.</p>
      }
    </Card>

    {vista==='dispositivo'&&<>
      {recs.length===0&&<div style={{textAlign:'center',padding:40,color:'var(--dim)'}}>Sin registros.</div>}
      {recs.map(r=><Card key={r.id} style={{borderLeft:`4px solid ${r.type==='feedback'&&r.semaforo?STATUS[r.semaforo]?.border:'var(--accent)'}`}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:6}}>
          <div><span style={{fontWeight:700,fontSize:13}}>{typeL[r.type]||r.type}</span><span style={{marginLeft:8,fontSize:11,color:'var(--dim)'}}>{fmt(r.date)} · {r.time||new Date(r.savedAt).toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'})}</span></div>
          <Btn variant="ghost" onClick={()=>del(r.id)} style={{color:'var(--red)',fontSize:11}}>Eliminar</Btn>
        </div>
        {detail(r)}
        {r.registradoPor&&<p style={{fontSize:11,color:'var(--dim)',marginTop:6,borderTop:'1px solid var(--border)',paddingTop:4}}>Registrado por: {r.registradoPor}</p>}
      </Card>)}
    </>}

    {vista==='equipo'&&<>
      {cargandoEquipo&&<div style={{textAlign:'center',padding:30}}><Spinner/></div>}
      {!cargandoEquipo&&equipoRecsFiltrados.length===0&&<div style={{textAlign:'center',padding:40,color:'var(--dim)'}}>Sin registros del equipo todavía.</div>}
      {!cargandoEquipo&&equipoRecsFiltrados.map((r,i)=><Card key={(r.ID||i)+'_'+r._tipo} style={{borderLeft:`4px solid ${r._tipo==='feedback'&&r['Semáforo']?STATUS[r['Semáforo']]?.border:'var(--accent)'}`}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:6}}>
          <span style={{fontWeight:700,fontSize:13}}>{typeL[r._tipo]||r._tipo}</span>
          <span style={{fontSize:11,color:'var(--dim)'}}>{fmt(r['Fecha'])}{r['Hora']?' · '+r['Hora']:''}</span>
        </div>
        {detailEquipo(r._tipo,r)}
        <p style={{fontSize:11,color:'var(--dim)',marginTop:6,borderTop:'1px solid var(--border)',paddingTop:4}}>Registrado por: {r['Registrado por']}{r['Rol']?` (${r['Rol']})`:''}</p>
      </Card>)}
    </>}

    {verFoto&&<div onClick={()=>setVerFoto(null)} style={{position:'fixed',inset:0,background:'rgba(0,0,0,.9)',zIndex:9999,display:'flex',alignItems:'center',justifyContent:'center',padding:16}}>
      <img src={verFoto} alt="" style={{maxWidth:'100%',maxHeight:'100%',objectFit:'contain',borderRadius:8}}/>
      <button onClick={()=>setVerFoto(null)} style={{position:'absolute',top:16,right:16,background:'rgba(255,255,255,.15)',border:'none',borderRadius:8,color:'#fff',fontSize:20,width:36,height:36,cursor:'pointer'}}>✕</button>
    </div>}
  </div>;
}

// ═══════════════════════════════════════
// REPORTE (respaldo legible, para reemplazar el JSON crudo)
// ═══════════════════════════════════════
const escapeHtml=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const REPORTE_TIPOS={
  arranque:{icon:'☀️',label:'Arranque',color:'#ca8a04'},
  cierre:{icon:'🌙',label:'Cierre',color:'#1e40af'},
  permiso:{icon:'📋',label:'Permiso',color:'#7c3aed'},
  plan:{icon:'📊',label:'Plan',color:'#16a34a'},
  plan_resultado:{icon:'📊',label:'Resultado Plan',color:'#16a34a'},
  feedback:{icon:'💬',label:'Hallazgo',color:'#dc2626'},
};
function reporteDetalleHTML(r){
  switch(r.type){
    case'arranque':
      return `<p><b>Presentes:</b> ${(r.presentes||[]).length} · <b>Ausentes:</b> ${(r.ausentes||[]).length}</p>`+
        (r.ausentes||[]).map(a=>`<p style="color:#dc2626;margin:2px 0">✗ ${escapeHtml(a.name)}: ${escapeHtml(a.reason)}${a.detail?' — '+escapeHtml(a.detail):''}</p>`).join('')+
        (r.notas?`<p>${escapeHtml(r.notas)}</p>`:'');
    case'permiso':
      return `<p><b>${escapeHtml(r.vendedor)}</b> — ${escapeHtml(r.tipo)}</p><p>${escapeHtml(r.motivo)}</p>`+(r.autorizado_por?`<p>Autorizado: ${escapeHtml(r.autorizado_por)}</p>`:'');
    case'cierre':
      return (r.resultados||[]).filter(x=>x.oportunidades||x.validadas||x.instaladas||x.pagadasHoy||x.pendiente)
        .map(x=>`<p style="margin:2px 0"><b>${escapeHtml(x.nombre)}:</b> ${x.oportunidades||0} op · ${x.validadas||0} val · ${x.instaladas||0} inst${x.pagadasHoy?` · ${x.pagadasHoy} pagada(s)`:''}${x.pendiente?`<br><span style="color:#6b7086">Pendiente: ${escapeHtml(x.pendiente)}</span>`:''}</p>`).join('')+
        (r.incidencias?`<p><b>Incidencias:</b> ${escapeHtml(r.incidencias)}</p>`:'')+
        ((r.seguimiento||[]).length?'<p><b>Seguimiento mañana:</b></p>'+r.seguimiento.map(s=>`<p style="margin:2px 0">• ${escapeHtml(s.name)}${s.motivo?': '+escapeHtml(s.motivo):''}</p>`).join(''):'');
    case'plan':{
      const o=r.objetivos||{},m=r.metaOficial||{};
      const zt=zonasATexto(r.zonas);
      return `<p>🎯 Oport: ${o.oportunidades||0} (meta ${m.oportunidades??'-'}) · Ventas: ${o.ventas||0} (meta ${m.ventas??'-'}) · Instal: ${o.instalaciones||0} (meta ${m.instalaciones??'-'})</p>`+
        `<p>NPPF: ${o.cuentasRecuperadas||0} · ARPU: ${escapeHtml(fmtMoney(o.arpu))}</p>`+
        (r.prioridades?`<p><b>Prioridades:</b> ${escapeHtml(r.prioridades)}</p>`:'')+
        (r.vendedores_acompanar?`<p><b>Acompañamientos:</b> ${escapeHtml(r.vendedores_acompanar)}</p>`:'')+
        (zt?`<p><b>Zonas:</b><br>${escapeHtml(zt).replace(/\n/g,'<br>')}</p>`:'')+
        (r.resultado_esperado?`<p><b>Resultado esperado:</b> ${escapeHtml(r.resultado_esperado)}</p>`:'');
    }
    case'plan_resultado':{
      const o=r.objetivos||{},res=r.resultados||{};
      const pct=(v,ob)=>ob?Math.round((Number(v)||0)/Number(ob)*100):null;
      return['oportunidades','ventas','instalaciones'].map(k=>{const p=pct(res[k],o[k]);return `<p style="margin:2px 0">${k[0].toUpperCase()+k.slice(1)}: ${res[k]||0}${o[k]!=null?` / obj. ${o[k]}`:''}${p!=null?` <b>${p}%</b>`:''}</p>`;}).join('')+
        `<p>NPPF: ${res.cuentasRecuperadas||0} · ARPU: ${escapeHtml(fmtMoney(res.arpu))}</p>`;
    }
    case'feedback':
      return `<p><b>${escapeHtml(r.vendedor)}</b> — ${escapeHtml(r.tipo)}${r.semaforo?` (${escapeHtml(STATUS[r.semaforo]?.label||'')})`:''}</p>`+
        (r.hallazgos?`<p>${escapeHtml(r.hallazgos)}</p>`:'')+(r.compromisos?`<p><b>Compromisos:</b> ${escapeHtml(r.compromisos)}</p>`:'');
    default:
      return'';
  }
}
function reporteRecordHTML(r){
  const t=REPORTE_TIPOS[r.type]||{icon:'•',label:r.type,color:'#6b7086'};
  return `<div style="border-left:4px solid ${t.color};background:#fff;border-radius:10px;padding:14px 16px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.06)">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
      <span style="font-weight:700;font-size:13px">${t.icon} ${t.label}</span>
      <span style="font-size:11px;color:#6b7086">${escapeHtml(fmt(r.date))}${r.time?' · '+escapeHtml(r.time):''}</span>
    </div>
    <div style="font-size:13px;color:#1a1d29;line-height:1.5">${reporteDetalleHTML(r)||'<span style="color:#6b7086">Sin detalle</span>'}</div>
    ${r.registradoPor?`<div style="font-size:11px;color:#6b7086;margin-top:8px;border-top:1px solid #e2e4ec;padding-top:6px">Registrado por: ${escapeHtml(r.registradoPor)}</div>`:''}
  </div>`;
}
// Reporte HTML autocontenido (imprimible / compartible) para reemplazar el respaldo en JSON crudo.
function generarReporteHTML(data,user,rolLabel){
  const recs=[...data.records].sort((a,b)=>b.savedAt.localeCompare(a.savedAt));
  const porFecha={};
  recs.forEach(r=>{(porFecha[r.date]=porFecha[r.date]||[]).push(r);});
  const fechas=Object.keys(porFecha).sort((a,b)=>b.localeCompare(a));
  const cuerpo=fechas.map(f=>`
    <h2 style="font-size:15px;color:#1e40af;border-bottom:2px solid #dbeafe;padding-bottom:6px;margin:24px 0 10px">${escapeHtml(fmt(f))}</h2>
    ${porFecha[f].map(reporteRecordHTML).join('')}
  `).join('');
  return `<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><title>Reporte Supervisión — ${escapeHtml(user.nombre)}</title>
<style>
body{font-family:system-ui,-apple-system,sans-serif;background:#f0f2f8;color:#1a1d29;margin:0;padding:20px}
.header{background:linear-gradient(135deg,#1e3a8a,#1e40af);color:#fff;padding:20px;border-radius:12px;margin-bottom:20px}
.header h1{margin:0;font-size:20px}
.header p{margin:4px 0 0;font-size:13px;opacity:.9}
p{margin:4px 0}
@media print{body{background:#fff}.header{background:#1e40af!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}}
</style></head><body>
<div class="header"><h1>📋 Reporte de Supervisión</h1><p>${escapeHtml(user.nombre)}${rolLabel?' · '+escapeHtml(rolLabel):''}</p><p>Generado el ${escapeHtml(fmt(today()))} · ${recs.length} registro${recs.length!==1?'s':''}</p></div>
${cuerpo||'<p style="text-align:center;color:#6b7086;padding:40px">Sin registros.</p>'}
</body></html>`;
}

// ═══════════════════════════════════════
// MAIN APP
// ═══════════════════════════════════════
function MainApp({session,onLogout}){
  const[data,setData]=useState(loadData());
  const[tab,setTab]=useState('dashboard');
  const[toastMsg,setToastMsg]=useState('');
  const toast=msg=>setToastMsg(msg);
  useEffect(()=>{retryPending(toast,setData);},[]);
  const{user,team,coaches,role}=session;
  const allTeam=[...(coaches||[]),...team];
  const todayRecs=data.records.filter(r=>r.date===today());
  const hasArr=todayRecs.some(r=>r.type==='arranque');
  const hasCie=todayRecs.some(r=>r.type==='cierre');
  const roleLabels={coach:'🏅 Coach',lider:'⭐ Líder',director:'👔 Director'};

  const exportReporte=()=>{
    const html=generarReporteHTML(data,user,roleLabels[role]);
    const blob=new Blob([html],{type:'text/html'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`reporte-supervision-${today()}.html`;a.click();toast('📥 Reporte descargado');
  };

  return <div style={{maxWidth:600,margin:'0 auto',minHeight:'100vh',background:'var(--bg)'}}>
    {/* Header */}
    <div style={{padding:'12px 16px',background:'linear-gradient(135deg,#1e3a8a,#1e40af)',color:'#fff'}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
        <div>
          <h1 style={{margin:0,fontSize:16,fontWeight:800}}>Supervisión 2.0</h1>
          <p style={{margin:0,fontSize:11,opacity:.85}}>{roleLabels[role]} · {user.nombre}</p>
        </div>
        <div style={{display:'flex',gap:6,alignItems:'center'}}>
          {hasArr&&<span style={{fontSize:14}}>☀️</span>}
          {hasCie&&<span style={{fontSize:14}}>🌙</span>}
          <button onClick={exportReporte} style={{background:'rgba(255,255,255,.15)',border:'none',borderRadius:8,padding:'5px 8px',color:'#fff',cursor:'pointer',fontSize:14}} title="Descargar reporte">📥</button>
          <button onClick={onLogout} style={{background:'rgba(255,255,255,.15)',border:'none',borderRadius:8,padding:'5px 8px',color:'#fff',cursor:'pointer',fontSize:12,fontWeight:700}} title="Cerrar sesión">Salir</button>
        </div>
      </div>
    </div>

    {/* Stats */}
    <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:6,padding:'10px 14px'}}>
      {[{l:'Hoy',v:todayRecs.length,c:'var(--accent)'},{l:'Equipo',v:team.length,c:'var(--green)'},{l:role==='lider'?'Coaches':'Total',v:role==='lider'?(coaches||[]).length:data.records.length,c:'#7c3aed'},{l:'Registros',v:data.records.length,c:'#ca8a04'}].map(s=>
        <div key={s.l} style={{background:'var(--card)',borderRadius:10,padding:'6px 8px',textAlign:'center',border:'1px solid var(--border)'}}>
          <div style={{fontSize:18,fontWeight:800,color:s.c}}>{s.v}</div>
          <div style={{fontSize:9,color:'var(--dim)',fontWeight:600,textTransform:'uppercase'}}>{s.l}</div>
        </div>
      )}
    </div>

    {/* Team info */}
    {role==='lider'&&coaches&&coaches.length>0&&
      <div style={{padding:'0 14px 8px',display:'flex',gap:4,flexWrap:'wrap'}}>
        {coaches.map(c=><span key={c.nombre} style={{fontSize:11,background:'var(--accent-light)',color:'var(--accent)',padding:'2px 8px',borderRadius:10,fontWeight:600}}>{c.nombre.split(' ').slice(0,2).join(' ')}</span>)}
      </div>
    }

    {/* Tabs */}
    <div style={{display:'flex',overflowX:'auto',gap:0,padding:'0 10px',borderBottom:'1px solid var(--border)',background:'var(--card)',WebkitOverflowScrolling:'touch'}}>
      {TABS.map(t=><button key={t.id} onClick={()=>setTab(t.id)} style={{flex:'0 0 auto',padding:'10px 12px',border:'none',background:'transparent',cursor:'pointer',fontSize:11,fontWeight:600,color:tab===t.id?'var(--accent)':'var(--dim)',borderBottom:tab===t.id?'3px solid var(--accent)':'3px solid transparent',whiteSpace:'nowrap'}}><span style={{fontSize:15,display:'block'}}>{t.icon}</span>{t.label}</button>)}
    </div>

    {/* Content */}
    <div style={{padding:14,paddingBottom:30}}>
      {tab==='dashboard'&&<DashboardTab data={data} team={allTeam} coaches={coaches} session={session} setTab={setTab}/>}
      {tab==='arranque'&&<ArranqueTab data={data} setData={setData} team={allTeam} toast={toast} session={session}/>}
      {tab==='permisos'&&<PermisosTab data={data} setData={setData} team={allTeam} toast={toast} session={session}/>}
      {tab==='cierre'&&<CierreTab data={data} setData={setData} team={allTeam} toast={toast} session={session}/>}
      {tab==='plan'&&<PlanTab data={data} setData={setData} team={allTeam} toast={toast} session={session}/>}
      {tab==='feedback'&&<FeedbackTab data={data} setData={setData} team={allTeam} toast={toast} session={session}/>}
      {tab==='historial'&&<HistorialTab data={data} setData={setData} toast={toast} session={session}/>}
    </div>
    {toastMsg&&<Toast msg={toastMsg} onClose={()=>setToastMsg('')}/>}
  </div>;
}

// ═══ APP ROOT ═══
function App(){
  const[session,setSession]=useState(null);
  useEffect(()=>{try{const s=sessionStorage.getItem('sv2-session');if(s)setSession(JSON.parse(s));}catch{}},[]);
  const logout=()=>{sessionStorage.removeItem('sv2-session');setSession(null);};
  if(!session)return <LoginScreen onLogin={setSession}/>;
  return <MainApp session={session} onLogout={logout}/>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
<script>
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{navigator.serviceWorker.register('./sw.js').catch(()=>{});});
}
</script>
