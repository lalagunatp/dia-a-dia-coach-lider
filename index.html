// ─── Arranque ───
function ArranqueTab({data,setData,team,toast,session,refreshKey}){
  const esLider=session.role==='lider';
  // Coach Promovendedor Punto de Venta: arranca en un punto de venta, oficina o con su líder
  // (foto de grupo normal), pero además cada vendedor a su cargo tiene que quedar resuelto: o sube
  // la foto de entrada de ese vendedor en su punto de venta, o lo marca ausente con el motivo
  // (falta, descanso, etc.). Ninguno se puede dejar pasar, y hasta que todos estén resueltos se
  // habilita el botón de guardar. La foto del vendedor es solo de galería y va SIN sello: el
  // vendedor la toma en su punto de venta y se la manda al coach, así que el sello (nombre del
  // coach, hora y ubicación del teléfono del coach) no diría dónde ni cuándo se tomó de verdad —
  // sería evidencia falseada. Las fotos del propio coach (la de grupo) sí siguen sellándose.
  const esCoachPDV=(session.user.posicion||'').toUpperCase().includes('PROMOVENDEDOR');
  const[form,setForm]=useState({date:today(),time:now(),photo:null,photoSubida:null,presentes:[],ausentes:[],fotosVendedores:{},notas:''});
  useEffect(()=>{setForm(f=>({...f,presentes:team.map(m=>m.nombre),ausentes:[]}));},[team]);
  // Catálogo de colonias: lo necesita el compromiso del día de "Trabajo fuera de ruta"/"Actividad
  // especial", igual que en Permisos.
  const[zonasData,setZonasData]=useState({clusterToColonias:{},coloniaToCluster:{},clusters:[]});
  useEffect(()=>{fetchClustersColonias(session.token).then(list=>setZonasData(buildClusterMap(list)));},[]);
  const toggle=name=>{setForm(f=>{const p=f.presentes.includes(name);return{...f,presentes:p?f.presentes.filter(n=>n!==name):[...f.presentes,name],ausentes:p?[...f.ausentes,{name,reason:'Falta justificada',detail:'',photo:null,compromiso:{cuentas:'',ventas:'',instalaciones:''},colonia:''}]:f.ausentes.filter(a=>a.name!==name)};});};
  const updAus=(name,field,val)=>setForm(f=>({...f,ausentes:f.ausentes.map(a=>a.name===name?{...a,[field]:val}:a)}));
  // Igual que en Permisos: si el motivo deja de ser uno de los que llevan compromiso, se limpia para
  // no arrastrar números de una selección anterior.
  const updMotivoAus=(name,val)=>setForm(f=>({...f,ausentes:f.ausentes.map(a=>a.name!==name?a:(
    TIPOS_CON_COMPROMISO.includes(val)?{...a,reason:val}:{...a,reason:val,compromiso:{cuentas:'',ventas:'',instalaciones:''},colonia:''}))}));
  const setFotoVendedor=(name,photo)=>setForm(f=>({...f,fotosVendedores:{...f.fotosVendedores,[name]:photo}}));

  // Líder: estatus de arranque de hoy de cada coach (leído del Sheet, cada coach lo guarda en su
  // propio teléfono) + qué coach le toca priorizar hoy según su Plan de la semana ya guardado.
  const hoyStr=today();
  const[arranquesEquipo,setArranquesEquipo]=useState([]);
  const[cargandoArranquesEquipo,setCargandoArranquesEquipo]=useState(false);
  useEffect(()=>{
    if(!esLider)return;
    setCargandoArranquesEquipo(true);
    fetchHistorialEquipo('ARRANQUE',session.token,session.verComo).then(regs=>{setArranquesEquipo(regs);setCargandoArranquesEquipo(false);});
  },[esLider,refreshKey]);
  const coachesArranqueHoy=esLider?(session.coaches||[]).map(c=>({coach:c,row:arranquesEquipo.find(r=>r['Registrado por']===c.nombre&&r['Fecha']===hoyStr)||null})):[];
  const diaHoyKey=DIAS_SEMANA[(new Date().getDay()+6)%7];
  const semanaIniHoy=ymdLocal(startOfWeek(new Date()));
  const planLiderSemana=esLider?data.records.find(r=>r.type==='plan'&&r.registradoPor===session.user.nombre&&r.semanaInicio===semanaIniHoy):null;
  const coachesPrioridadHoy=planLiderSemana?.zonas?.[diaHoyKey]?.entradas?.map(e=>e.cluster)||[];

  // Vendedores del coach PDV que todavía no están resueltos: siguen marcados como presentes y no
  // tienen foto de entrada. Los ausentes ya quedan justificados por el motivo de su box.
  const pendientesPDV=esCoachPDV?team.filter(m=>form.presentes.includes(m.nombre)&&!form.fotosVendedores[m.nombre]):[];

  const guardar=async()=>{
    if(session.soloLectura)return; // vista prestada: solo consulta
    if(!form.photo){alert(esLider?'Agrega la foto con el coach prioridad del día para poder guardar el arranque':'Agrega la foto de grupo para poder guardar el arranque');return;}
    if(pendientesPDV.length){alert('Falta resolver a: '+pendientesPDV.map(m=>m.nombre).join(', ')+'. De cada vendedor sube su foto de entrada o márcalo ausente con el motivo (falta, descanso, etc.) para poder guardar el arranque.');return;}
    const rec={id:uid(),type:'arranque',...form,registradoPor:session.user.nombre,rolRegistro:session.role,token:session.token,savedAt:new Date().toISOString()};
    compartirEvidencia(textoArranque(rec),fotosArranque(rec));
    const upd={...data,records:[...data.records,rec]};setData(upd);saveAndSync(upd,rec,toast,setData);toast('✅ Arranque guardado');
    setUltimoGuardado(rec);
    setForm({date:today(),time:now(),photo:null,photoSubida:null,presentes:team.map(m=>m.nombre),ausentes:[],fotosVendedores:{},notas:''});
    window.scrollTo({top:0,behavior:'smooth'});
  };
  // Lo último que se guardó: se queda arriba con el botón para volver a mandar la evidencia.
  const[ultimoGuardado,setUltimoGuardado]=useState(null);
  return <div>
    {ultimoGuardado&&<Card style={{borderLeft:'4px solid var(--green)'}}>
      <p style={{fontSize:14,fontWeight:700,marginBottom:4}}>✅ Arranque guardado</p>
      <p style={{fontSize:13,color:'var(--dim)',marginBottom:8}}>Se abrió el envío con la evidencia: elige WhatsApp. Si no se abrió, o para mandarlo a alguien más, envíalo desde aquí:</p>
      <Btn onClick={()=>compartirEvidencia(textoArranque(ultimoGuardado),fotosArranque(ultimoGuardado))}
        style={{background:'#25D366',color:'#fff',fontSize:14}}>📲 Enviar evidencia por WhatsApp</Btn>
    </Card>}
    <Card title="☀️ Arranque del día">
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8,marginBottom:12}}>
        <Field label="Fecha"><Input type="date" value={form.date} onChange={e=>setForm({...form,date:e.target.value})}/></Field>
        <Field label="Hora"><Input value={form.time} readOnly style={{background:'var(--bg)'}}/></Field>
      </div>
      {/* Dos fotos separadas: la del momento (cámara, sellada, obligatoria) es la evidencia real, y
          la subida es un apoyo opcional de la galería — sin sello, porque no se tomó ahí ni entonces
          y sellarla con la hora/ubicación de ahorita sería falsear la evidencia. Cada una se cambia
          por su lado con los botones de la esquina. */}
      <Field label={esLider?'Foto con coach prioridad del día (obligatoria)':'Foto de grupo (obligatoria)'}>
        {esLider&&coachesPrioridadHoy.length>0&&<p style={{fontSize:13,color:'var(--accent)',marginBottom:6}}>👤 Hoy toca: <b>{coachesPrioridadHoy.join(', ')}</b> (según tu Plan de la semana)</p>}
        <PhotoCaptureGeo modo="camara" photo={form.photo} onCapture={p=>setForm({...form,photo:p})} coachName={session.user.nombre} toast={toast} label={esLider?'📷 Tomar foto con el coach (con sello)':'📷 Tomar foto de grupo (con sello)'}/>
      </Field>
      <Field label="Foto adicional subida (opcional)">
        <PhotoCapture modo="galeria" photo={form.photoSubida} onCapture={p=>setForm({...form,photoSubida:p})}
          onQuitar={()=>setForm({...form,photoSubida:null})} label="🖼️ Subir foto de la galería (sin sello)"/>
      </Field>
    </Card>
    {esLider?<>
      <Card title="Asistencia — ¿ya guardaron su arranque hoy?">
        {cargandoArranquesEquipo?<div style={{textAlign:'center',padding:20}}><Spinner/></div>:
        (session.coaches||[]).length===0?<p style={{color:'var(--dim)',fontSize:15}}>Sin coaches asignados.</p>:
        coachesArranqueHoy.map(({coach,row})=>
          <div key={coach.nombre} style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'8px 10px',borderRadius:8,marginBottom:6,border:`1.5px solid ${row?'var(--green)':'var(--red)'}`,background:row?'var(--gbg)':'var(--rbg)'}}>
            <span style={{fontWeight:600,fontSize:14}}>{coach.nombre}</span>
            <span style={{fontWeight:800,fontSize:16,color:row?'var(--green)':'var(--red)'}}>{row?'✓':'✗'}</span>
          </div>
        )}
      </Card>
      <Card title="📋 Reporte de asistencia por coach">
        {cargandoArranquesEquipo?<div style={{textAlign:'center',padding:20}}><Spinner/></div>:
        coachesArranqueHoy.filter(x=>x.row).length===0?<p style={{color:'var(--dim)',fontSize:15}}>Ningún coach ha guardado su arranque todavía.</p>:
        coachesArranqueHoy.filter(x=>x.row).map(({coach,row})=>
          <div key={coach.nombre} style={{marginBottom:10,padding:10,border:'1px solid var(--border)',borderRadius:8}}>
            <div style={{fontWeight:700,fontSize:14,marginBottom:4}}>{coach.nombre} <span style={{fontWeight:400,fontSize:13,color:'var(--dim)'}}>· {row['Hora']}</span></div>
            <p style={{fontSize:13,margin:'2px 0'}}><b>Presentes:</b> {row['Presentes']} · <b>Ausentes:</b> {row['Ausentes']}</p>
            {row['Detalle ausentes']&&<p style={{fontSize:13,color:'var(--red)',margin:'2px 0'}}>{row['Detalle ausentes']}</p>}
            {row['Compromisos del día']&&<p style={{fontSize:13,margin:'2px 0'}}>🎯 {row['Compromisos del día']}</p>}
            {row['Notas']&&<p style={{fontSize:13,color:'var(--dim)',margin:'2px 0'}}>{row['Notas']}</p>}
          </div>
        )}
      </Card>
    </>:
      <Card title={`Asistencia (${team.length})`}>
        {esCoachPDV&&team.length>0&&
          <p style={{fontSize:13,fontWeight:600,marginBottom:10,padding:'8px 10px',borderRadius:8,
            border:`1.5px solid ${pendientesPDV.length?'var(--red)':'var(--green)'}`,
            background:pendientesPDV.length?'var(--rbg)':'var(--gbg)',
            color:pendientesPDV.length?'var(--red)':'var(--green)'}}>
            {pendientesPDV.length
              ?`${team.length-pendientesPDV.length} de ${team.length} resueltos — falta subir la foto de entrada o marcar ausente a: ${pendientesPDV.map(m=>m.nombre).join(', ')}`
              :`✓ Los ${team.length} vendedores están resueltos (foto de entrada o justificación)`}
          </p>}
        {team.length===0?<p style={{color:'var(--dim)',fontSize:15}}>Sin integrantes asignados.</p>:
        team.map(m=>{
          const present=form.presentes.includes(m.nombre);
          const aus=form.ausentes.find(a=>a.name===m.nombre);
          const fotoVendedor=form.fotosVendedores[m.nombre]||null;
          return <div key={m.numEmp||m.nombre} style={{padding:'8px 10px',borderRadius:8,marginBottom:6,border:`1.5px solid ${present?'var(--green)':'var(--red)'}`,background:present?'var(--gbg)':'var(--rbg)'}}>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
              <div><span style={{fontWeight:600,fontSize:14}}>{m.nombre}</span>
                {isCoach(m.posicion)&&<span style={{marginLeft:6,fontSize:12,background:'var(--accent-light)',color:'var(--accent)',padding:'1px 6px',borderRadius:8,fontWeight:700}}>COACH</span>}
                <RankBadge badge={m.badge}/>
              </div>
              <Btn onClick={()=>toggle(m.nombre)} variant={present?'success':'danger'} style={{padding:'3px 12px',fontSize:13}}>{present?'✓':'✗'}</Btn>
            </div>
            {aus&&<div style={{marginTop:6,display:'flex',flexDirection:'column',gap:6}}>
              <div style={{display:'flex',gap:6,flexWrap:'wrap'}}>
                <Select value={aus.reason} onChange={v=>updMotivoAus(m.nombre,v)} options={ABSENCE_REASONS} style={{flex:1,minWidth:130}}/>
                <Input placeholder="Detalle..." value={aus.detail} onChange={e=>updAus(m.nombre,'detail',e.target.value)} style={{flex:2,minWidth:130}}/>
              </div>
              {TIPOS_CON_COMPROMISO.includes(aus.reason)&&
                <CompromisoDelDia compacto compromiso={aus.compromiso} colonia={aus.colonia} zonasData={zonasData}
                  onCompromiso={c=>updAus(m.nombre,'compromiso',c)} onColonia={v=>updAus(m.nombre,'colonia',v)}/>}
              {!esCoachPDV&&<PhotoCapture photo={aus.photo} onCapture={p=>updAus(m.nombre,'photo',p)} label="📷 Agregar evidencia (foto/plática)"/>}
            </div>}
            {esCoachPDV&&<div style={{marginTop:6}}>
              <PhotoCapture modo="galeria" photo={fotoVendedor} onCapture={p=>setFotoVendedor(m.nombre,p)}
                onQuitar={()=>setFotoVendedor(m.nombre,null)}
                label={present?'🖼️ Subir foto de entrada en el punto de venta (obligatoria, sin sello)':'🖼️ Subir foto (opcional — ya quedó justificado arriba)'}/>
            </div>}
          </div>;
        })}
      </Card>
    }
    <Card title="Notas"><Textarea value={form.notas} onChange={e=>setForm({...form,notas:e.target.value})} placeholder="Prioridades, situaciones especiales..."/></Card>
    {session.soloLectura?<AvisoSoloLectura nombre={session.user.nombre}/>:<>
      <Btn onClick={guardar} disabled={pendientesPDV.length>0} style={{width:'100%'}}>💾 Guardar arranque</Btn>
      {pendientesPDV.length>0&&<p style={{fontSize:13,color:'var(--dim)',textAlign:'center',marginTop:6}}>Se habilita cuando los {team.length} vendedores tengan foto de entrada o justificación.</p>}
    </>}
  </div>;
}

// ─── Permisos ───
function PermisosTab({data,setData,team,toast,session,refreshKey}){
  const esLider=session.role==='lider';
  const[form,setForm]=useState({date:today(),vendedor:'',tipo:'Trabajo fuera de ruta',motivo:'',compromiso:{cuentas:'',ventas:'',instalaciones:''},colonia:'',autorizado_por:session.user.nombre,notas:'',photo:null});
  const[zonasData,setZonasData]=useState({clusterToColonias:{},coloniaToCluster:{},clusters:[]});
  useEffect(()=>{fetchClustersColonias(session.token).then(list=>setZonasData(buildClusterMap(list)));},[]);

  // Líder: permisos que cada coach ya otorgó a su gente, agrupados por coach (mes en curso).
  const[permisosEquipo,setPermisosEquipo]=useState([]);
  const[cargandoPermisosEquipo,setCargandoPermisosEquipo]=useState(false);
  useEffect(()=>{
    if(!esLider)return;
    setCargandoPermisosEquipo(true);
    fetchHistorialEquipo('PERMISO',session.token,session.verComo).then(regs=>{setPermisosEquipo(regs);setCargandoPermisosEquipo(false);});
  },[esLider,refreshKey]);
  const mesActual=today().slice(0,7);
  const permisosPorCoach=esLider?(session.coaches||[]).map(c=>({
    coach:c,
    permisos:permisosEquipo.filter(r=>r['Registrado por']===c.nombre&&(r['Fecha']||'').slice(0,7)===mesActual)
  })):[];
  const totalPermisosMes=permisosPorCoach.reduce((s,x)=>s+x.permisos.length,0);

  const guardar=async()=>{
    if(session.soloLectura)return; // vista prestada: solo consulta
    if(!form.vendedor){alert('Selecciona un integrante');return;}
    if(!form.photo){alert('Agrega una foto de evidencia (foto o conversación del motivo) para poder guardar el permiso');return;}
    const rec={id:uid(),type:'permiso',...form,registradoPor:session.user.nombre,token:session.token,savedAt:new Date().toISOString()};
    const upd={...data,records:[...data.records,rec]};setData(upd);saveAndSync(upd,rec,toast,setData);toast('✅ Permiso documentado');
    setForm({date:today(),vendedor:'',tipo:'Trabajo fuera de ruta',motivo:'',compromiso:{cuentas:'',ventas:'',instalaciones:''},colonia:'',autorizado_por:session.user.nombre,notas:'',photo:null});
  };
  // Al cambiar a un tipo que no lleva compromiso se limpia, para no guardar en el Sheet los números
  // que hayan quedado escritos de un tipo anterior.
  const cambiarTipo=v=>setForm(f=>TIPOS_CON_COMPROMISO.includes(v)
    ?{...f,tipo:v}
    :{...f,tipo:v,compromiso:{cuentas:'',ventas:'',instalaciones:''},colonia:''});
  return <div>
    {esLider&&<Card title={`🗂️ Permisos otorgados por coach — este mes (${totalPermisosMes})`}>
      {cargandoPermisosEquipo?<div style={{textAlign:'center',padding:20}}><Spinner/></div>:
      (session.coaches||[]).length===0?<p style={{color:'var(--dim)',fontSize:15}}>Sin coaches asignados.</p>:
      permisosPorCoach.map(({coach,permisos})=>
        <div key={coach.nombre} style={{marginBottom:12}}>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'6px 10px',borderRadius:8,background:'var(--bg)',fontWeight:700,fontSize:14,marginBottom:6}}>
            <span>{coach.nombre}</span>
            <span style={{fontSize:13,color:'var(--dim)'}}>{permisos.length} permiso{permisos.length!==1?'s':''}</span>
          </div>
          {permisos.length===0?<p style={{fontSize:13,color:'var(--dim)',padding:'0 10px 4px'}}>Sin permisos este mes.</p>:
          permisos.map((p,i)=>
            <div key={i} style={{marginLeft:10,marginBottom:6,padding:8,border:'1px solid var(--nest-border)',background:'var(--nest-bg)',borderRadius:8}}>
              <div style={{display:'flex',justifyContent:'space-between',fontSize:13,fontWeight:600}}>
                <span>{p['Integrante']}</span>
                <span style={{color:'var(--dim)',fontWeight:400}}>{fmt(p['Fecha'])}</span>
              </div>
              <p style={{fontSize:13,color:'var(--dim)',margin:'2px 0'}}>{p['Tipo']}{p['Motivo']?' · '+p['Motivo']:''}</p>
              {(p['Compromiso Cuentas']||p['Compromiso Ventas']||p['Compromiso Instalaciones'])&&
                <p style={{fontSize:13,margin:'2px 0'}}>🎯 Compromiso: {p['Compromiso Cuentas']||0} cuentas · {p['Compromiso Ventas']||0} ventas · {p['Compromiso Instalaciones']||0} instal.{p['Colonia']?` en ${p['Colonia']}`:''}</p>}
              {p['Autorizado por']&&<p style={{fontSize:13,color:'var(--dim)',margin:'2px 0'}}>Autorizó: {p['Autorizado por']}</p>}
            </div>
          )}
        </div>
      )}
    </Card>}
    {!esLider&&<>
    <Card title="📋 Documentar permiso">
      <Field label="Fecha"><Input type="date" value={form.date} onChange={e=>setForm({...form,date:e.target.value})}/></Field>
      <Field label="Integrante"><Select value={form.vendedor} onChange={v=>setForm({...form,vendedor:v})} options={[{value:'',label:'— Seleccionar —'},...team.map(m=>({value:m.nombre,label:m.nombre+(isCoach(m.posicion)?' (Coach)':'')}))]}/></Field>
      <Field label="Tipo"><Select value={form.tipo} onChange={cambiarTipo} options={PERMISO_TIPOS}/></Field>
      <Field label="Motivo"><Textarea value={form.motivo} onChange={e=>setForm({...form,motivo:e.target.value})} placeholder="Motivo del permiso..."/></Field>
      {TIPOS_CON_COMPROMISO.includes(form.tipo)&&
        <CompromisoDelDia compromiso={form.compromiso} colonia={form.colonia} zonasData={zonasData}
          onCompromiso={c=>setForm(f=>({...f,compromiso:c}))} onColonia={v=>setForm(f=>({...f,colonia:v}))}/>}
      <Field label="Autorizado por"><Input value={form.autorizado_por} onChange={e=>setForm({...form,autorizado_por:e.target.value})}/></Field>
      <Field label="Evidencia (obligatoria)"><PhotoCapture photo={form.photo} onCapture={p=>setForm({...form,photo:p})} label="Foto o conversación del motivo del permiso"/></Field>
      <Field label="Notas"><Textarea value={form.notas} onChange={e=>setForm({...form,notas:e.target.value})} placeholder="Observaciones..." style={{minHeight:50}}/></Field>
    </Card>
    {session.soloLectura?<AvisoSoloLectura nombre={session.user.nombre}/>:<Btn onClick={guardar} style={{width:'100%'}}>💾 Guardar permiso</Btn>}
    </>}
  </div>;
}

// ─── Cierre ───
function CierreTab({data,setData,team,toast,session,refreshKey}){
  const esLider=session.role==='lider';
  const vendedores=team.filter(m=>isVendedor(m.posicion));
  const nowDate=new Date();
  const semanaIni=startOfWeek(nowDate),semanaFin=endOfWeek(nowDate);
  const[form,setForm]=useState({date:today(),time:now(),resultados:[],incidencias:'',seguimiento:[],notas:''});
  const[ultimoGuardado,setUltimoGuardado]=useState(null);

  // Líder: cierre de hoy de cada coach (leído del Sheet) — quién ya lo cargó y qué reportó.
  const hoyStr=today();
  const[cierresEquipo,setCierresEquipo]=useState([]);
  const[cargandoCierresEquipo,setCargandoCierresEquipo]=useState(false);
  useEffect(()=>{
    if(!esLider)return;
    setCargandoCierresEquipo(true);
    fetchHistorialEquipo('CIERRE',session.token,session.verComo).then(regs=>{setCierresEquipo(regs);setCargandoCierresEquipo(false);});
  },[esLider,refreshKey]);
  const coachesCierreHoy=esLider?(session.coaches||[]).map(c=>({coach:c,row:cierresEquipo.find(r=>r['Registrado por']===c.nombre&&r['Fecha']===hoyStr)||null})):[];

  useEffect(()=>{
    const hoyIni=new Date();hoyIni.setHours(0,0,0,0);
    const hoyFin=new Date();hoyFin.setHours(23,59,59,999);
    setForm(f=>({...f,resultados:vendedores.map(m=>{
      const fp=funnelPeriodo(m.ventas,hoyIni,hoyFin);
      return{nombre:m.nombre,oportunidades:fp.oportunidades,validadas:fp.validadas,instaladas:fp.instaladas,pendiente:'',pagadasHoy:0};
    }),seguimiento:[]}));
  },[team]);
  const updResultado=(nombre,field,val)=>setForm(f=>({...f,resultados:f.resultados.map(r=>r.nombre===nombre?{...r,[field]:val}:r)}));
  const toggleSeguimiento=nombre=>setForm(f=>{
    const existe=f.seguimiento.some(s=>s.name===nombre);
    return{...f,seguimiento:existe?f.seguimiento.filter(s=>s.name!==nombre):[...f.seguimiento,{name:nombre,motivo:''}]};
  });
  const updSeguimiento=(nombre,motivo)=>setForm(f=>({...f,seguimiento:f.seguimiento.map(s=>s.name===nombre?{...s,motivo}:s)}));
  const guardar=async()=>{
    if(session.soloLectura)return; // vista prestada: solo consulta
    const rec={id:uid(),type:'cierre',...form,registradoPor:session.user.nombre,token:session.token,savedAt:new Date().toISOString()};
    // Se abre WhatsApp aquí mismo, dentro del clic: si se hiciera después de un await el navegador
    // lo trataría como popup y lo bloquearía. La tarjeta de arriba queda como respaldo.
    window.open(whatsappUrl(textoCierre(rec)),'_blank','noopener');
    const upd={...data,records:[...data.records,rec]};setData(upd);saveAndSync(upd,rec,toast);toast('✅ Cierre guardado');
    setUltimoGuardado(rec);
    window.scrollTo({top:0,behavior:'smooth'});
    setForm(f=>({date:today(),time:now(),resultados:f.resultados.map(r=>({...r,oportunidades:0,validadas:0,instaladas:0,pendiente:'',pagadasHoy:0})),incidencias:'',seguimiento:[],notas:''}));
  };
  return <div>
    {ultimoGuardado&&<Card style={{borderLeft:'4px solid var(--green)'}}>
      <p style={{fontSize:14,fontWeight:700,marginBottom:4}}>✅ Cierre guardado</p>
      <p style={{fontSize:13,color:'var(--dim)',marginBottom:8}}>Se abrió WhatsApp con el resultado. Si no se abrió, envíalo desde aquí:</p>
      <a href={whatsappUrl(textoCierre(ultimoGuardado))} target="_blank" rel="noopener noreferrer"
        style={{display:'inline-flex',alignItems:'center',gap:6,padding:'8px 14px',borderRadius:8,background:'#25D366',color:'#fff',fontSize:14,fontWeight:700,textDecoration:'none'}}>
        📲 Enviar cierre por WhatsApp
      </a>
    </Card>}
    <Card title="🌙 Cierre del día">
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8,marginBottom:12}}>
        <Field label="Fecha"><Input type="date" value={form.date} onChange={e=>setForm({...form,date:e.target.value})}/></Field>
        <Field label="Hora"><Input value={form.time} readOnly style={{background:'var(--bg)'}}/></Field>
      </div>
    </Card>
    {esLider?
    <Card title="📊 Resultado del día por coach">
      {cargandoCierresEquipo?<div style={{textAlign:'center',padding:20}}><Spinner/></div>:
      (session.coaches||[]).length===0?<p style={{color:'var(--dim)',fontSize:15}}>Sin coaches asignados.</p>:
      coachesCierreHoy.map(({coach,row})=>
        <div key={coach.nombre} style={{marginBottom:8,padding:10,borderRadius:8,border:`1.5px solid ${row?'var(--green)':'var(--red)'}`,background:row?'var(--gbg)':'var(--rbg)'}}>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
            <span style={{fontWeight:700,fontSize:14}}>{coach.nombre}</span>
            <span style={{fontWeight:800,fontSize:16,color:row?'var(--green)':'var(--red)'}}>{row?'✓':'✗'}</span>
          </div>
          {row?<>
            {row['Resultados por vendedor']&&<p style={{fontSize:13,margin:'4px 0 0'}}>{row['Resultados por vendedor']}</p>}
            {row['Incidencias']&&<p style={{fontSize:13,color:'var(--red)',margin:'2px 0 0'}}>⚠️ {row['Incidencias']}</p>}
          </>:<p style={{fontSize:13,color:'var(--dim)',margin:'4px 0 0'}}>Aún no ha cargado el cierre de hoy.</p>}
        </div>
      )}
    </Card>
    :
    <Card title={`📊 Resultado del día por vendedor (${vendedores.length})`}>
      {vendedores.length===0?<p style={{color:'var(--dim)',fontSize:15}}>Sin integrantes asignados.</p>:
      form.resultados.map(r=>
        <div key={r.nombre} style={{border:'1px solid var(--border)',borderRadius:8,padding:10,marginBottom:8}}>
          <div style={{fontWeight:600,fontSize:14,marginBottom:6}}>{r.nombre}</div>
          <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:6,marginBottom:6}}>
            <Field label="Oport."><Input type="number" value={r.oportunidades} onChange={e=>updResultado(r.nombre,'oportunidades',Number(e.target.value))} style={{padding:'6px 8px'}}/></Field>
            <Field label="Valid."><Input type="number" value={r.validadas} onChange={e=>updResultado(r.nombre,'validadas',Number(e.target.value))} style={{padding:'6px 8px'}}/></Field>
            <Field label="Instal."><Input type="number" value={r.instaladas} onChange={e=>updResultado(r.nombre,'instaladas',Number(e.target.value))} style={{padding:'6px 8px'}}/></Field>
            <Field label="Pagadas hoy"><Input type="number" value={r.pagadasHoy} onChange={e=>updResultado(r.nombre,'pagadasHoy',Number(e.target.value))} style={{padding:'6px 8px'}}/></Field>
          </div>
          <Field label="Pendiente para mañana"><Input value={r.pendiente} onChange={e=>updResultado(r.nombre,'pendiente',e.target.value)} placeholder="..."/></Field>
        </div>
      )}

    :
    <Card title="Seguimiento mañana">
      {vendedores.length===0?<p style={{color:'var(--dim)',fontSize:15}}>Sin integrantes asignados.</p>:<>
      {vendedores.map(m=>{
        const sel=form.seguimiento.find(s=>s.name===m.nombre);
        const fSem=funnelPeriodo(m.ventas,semanaIni,semanaFin);
        const rHoy=form.resultados.find(r=>r.nombre===m.nombre);
        const resumen={
          oportunidades:fSem.oportunidades+(Number(rHoy?.oportunidades)||0),
          validadas:fSem.validadas+(Number(rHoy?.validadas)||0),

        return <div key={m.numEmp||m.nombre} style={{marginBottom:6}}>

            <span style={{fontSize:14,fontWeight:600}}>{m.nombre}</span>

          </div>

// Quita acentos para que la búsqueda no dependa de teclearlos (Muñoz ~ munoz).
const sinAcentos=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');

// ─── Combobox con búsqueda: escribe y filtra desde la primera letra, elige de la lista. ───
function Autocomplete({value,onChange,options,placeholder}){
  const[query,setQuery]=useState('');
  const[open,setOpen]=useState(false);
  const wrapRef=useRef(null);
  useEffect(()=>{
    const opt=options.find(o=>o.value===value);
    setQuery(opt?opt.label:'');
  },[value]);
  useEffect(()=>{
    const onClickFuera=e=>{if(wrapRef.current&&!wrapRef.current.contains(e.target))setOpen(false);};
    document.addEventListener('mousedown',onClickFuera);
    return()=>document.removeEventListener('mousedown',onClickFuera);
  },[]);
  const q=sinAcentos(query);
  const filtradas=q?options.filter(o=>sinAcentos(o.label).includes(q)):options;
  return <div ref={wrapRef} style={{position:'relative'}}>
    <Input value={query} placeholder={placeholder} onFocus={()=>setOpen(true)}
      onChange={e=>{setQuery(e.target.value);setOpen(true);if(!e.target.value&&value)onChange('');}}/>
    {open&&<div style={{position:'absolute',zIndex:30,top:'calc(100% + 2px)',left:0,right:0,background:'var(--card)',border:'1.5px solid var(--border)',borderRadius:8,maxHeight:170,overflowY:'auto',boxShadow:'0 6px 16px rgba(0,0,0,.15)'}}>
      {filtradas.length===0&&<div style={{padding:'8px 10px',fontSize:13,color:'var(--dim)'}}>Sin coincidencias</div>}
      {filtradas.slice(0,60).map(o=><AutocompleteOpcion key={o.value} label={o.label} onClick={()=>{onChange(o.value);setQuery(o.label);setOpen(false);}}/>)}
    </div>}
  </div>;
}
function AutocompleteOpcion({label,onClick}){
  const[hover,setHover]=useState(false);
  return <div onClick={onClick} onMouseDown={e=>e.preventDefault()} onMouseEnter={()=>setHover(true)} onMouseLeave={()=>setHover(false)}
    style={{padding:'8px 10px',fontSize:14,cursor:'pointer',background:hover?'var(--accent-light)':'transparent'}}>{label}</div>;
}

// ─── Plan: selector de zonas de un día (cluster y/o colonia, con cruce colonia↔cluster) ───
function ZonaDia({label,dia,zonasData,onChange}){
  const entradas=dia.entradas||[];
  const[modo,setModo]=useState('cluster');
  const[clusterSel,setClusterSel]=useState('');
  const[coloniasSel,setColoniasSel]=useState([]);
  const[coloniaSel,setColoniaSel]=useState('');
  const coloniasDelCluster=zonasData.clusterToColonias[clusterSel]||[];
  const todasColonias=Object.keys(zonasData.coloniaToCluster).sort();

  const agregar=()=>{
    if(modo==='cluster'){
      if(!clusterSel)return;
      if(coloniasSel.length===0){
        if(entradas.some(e=>e.cluster===clusterSel&&!e.colonia))return;
        onChange({...dia,entradas:[...entradas,{cluster:clusterSel,colonia:null}]});
      }else{
        const nuevas=coloniasSel.filter(c=>!entradas.some(e=>e.cluster===clusterSel&&e.colonia===c)).map(c=>({cluster:clusterSel,colonia:c}));
        onChange({...dia,entradas:[...entradas,...nuevas]});
      }
      setColoniasSel([]);
    }else{
      if(!coloniaSel||entradas.some(e=>e.colonia===coloniaSel))return;
      onChange({...dia,entradas:[...entradas,{cluster:zonasData.coloniaToCluster[coloniaSel]||'',colonia:coloniaSel}]});
      setColoniaSel('');
    }
  };
  const quitar=i=>onChange({...dia,entradas:entradas.filter((_,idx)=>idx!==i)});
  const toggleColonia=c=>setColoniasSel(s=>s.includes(c)?s.filter(x=>x!==c):[...s,c]);

  return <div style={{marginBottom:10,padding:8,border:'1px solid var(--border)',borderRadius:8}}>
    <div style={{fontWeight:700,fontSize:13,marginBottom:6}}>{label}</div>
    {entradas.length>0&&<div style={{display:'flex',flexWrap:'wrap',gap:4,marginBottom:6}}>
      {entradas.map((e,i)=><span key={i} style={{display:'inline-flex',alignItems:'center',gap:4,background:'var(--accent-light)',color:'var(--accent)',padding:'2px 8px',borderRadius:10,fontSize:13,fontWeight:600}}>
        {e.colonia?`${e.colonia} (${e.cluster})`:`${e.cluster} · todo`}
        <span onClick={()=>quitar(i)} style={{cursor:'pointer',fontWeight:800}}>✕</span>
      </span>)}
    </div>}
    <div style={{display:'flex',gap:4,marginBottom:6}}>
      <button onClick={()=>setModo('cluster')} style={{flex:1,padding:'5px 6px',fontSize:13,fontWeight:700,borderRadius:6,border:'1.5px solid var(--border)',background:modo==='cluster'?'var(--accent)':'var(--card)',color:modo==='cluster'?'#fff':'var(--dim)',cursor:'pointer'}}>Por Cluster</button>
      <button onClick={()=>setModo('colonia')} style={{flex:1,padding:'5px 6px',fontSize:13,fontWeight:700,borderRadius:6,border:'1.5px solid var(--border)',background:modo==='colonia'?'var(--accent)':'var(--card)',color:modo==='colonia'?'#fff':'var(--dim)',cursor:'pointer'}}>Por Colonia</button>
    </div>
    {modo==='cluster'?<>
      <div style={{marginBottom:6}}>
        <Autocomplete value={clusterSel} onChange={v=>{setClusterSel(v);setColoniasSel([]);}} placeholder="Buscar cluster..." options={zonasData.clusters.map(c=>({value:c,label:c}))}/>
      </div>
      {clusterSel&&coloniasDelCluster.length>0&&<div style={{maxHeight:120,overflowY:'auto',border:'1px solid var(--border)',borderRadius:6,padding:6,marginBottom:6}}>
        <p style={{fontSize:12,color:'var(--dim)',margin:'0 0 4px'}}>Opcional: marca colonias específicas (si no marcas ninguna, aplica a todo el cluster)</p>
        {coloniasDelCluster.map(c=><label key={c} style={{display:'flex',alignItems:'center',gap:6,fontSize:13,padding:'2px 0',cursor:'pointer'}}>
          <input type="checkbox" checked={coloniasSel.includes(c)} onChange={()=>toggleColonia(c)}/>{c}
        </label>)}
      </div>}
    </>:
      <div style={{marginBottom:6}}>
        <Autocomplete value={coloniaSel} onChange={setColoniaSel} placeholder="Buscar colonia..." options={todasColonias.map(c=>({value:c,label:`${c} (${zonasData.coloniaToCluster[c]})`}))}/>
      </div>
    }
    <Btn variant="secondary" onClick={agregar} style={{width:'100%',fontSize:13,padding:'6px 10px'}}>+ Agregar</Btn>
    <div style={{marginTop:8,paddingTop:8,borderTop:'1px dashed var(--border)'}}>
      <Field label="📍 Punto de reunión / Carpa">
        <Input value={dia.direccion||''} onChange={e=>onChange({...dia,direccion:e.target.value})} placeholder="Dirección o referencia..." style={{fontSize:14}}/>
      </Field>
      <Field label="💬 Comentarios adicionales">
        <Textarea value={dia.comentarios||''} onChange={e=>onChange({...dia,comentarios:e.target.value})} placeholder="Notas para este día..." style={{minHeight:50,fontSize:14}}/>
      </Field>
    </div>
  </div>;
}

// Para Coach Promovendedor Punto de Venta: en vez de cluster/colonia, elige qué punto(s) de venta
// va a trabajar ese día (catálogo hoja PDV). Reutiliza la misma forma de dato que ZonaDia
// ({entradas,direccion,comentarios}) guardando el nombre del PDV en "cluster" — así
// zonasATexto/reporte/WhatsApp lo leen sin cambios.
// Además lleva la lista de sus vendedores para marcar a quién le toca DESCANSO ese día: el rol de
// punto de venta rola descansos entre semana, y la tarjeta del día es donde se decide. Se guarda
// en `descansos` (arreglo de nombres) dentro del mismo objeto del día.
// `descansosSemana` (nombre → días en los que ya quedó marcado) es solo para avisar en la propia
// tarjeta si a alguien ya se le puso descanso en otro día o si no tiene ninguno.
function PDVDia({label,dia,puntosDisponibles,vendedores,descansosSemana,onChange}){
  const entradas=dia.entradas||[];
  const descansos=dia.descansos||[];
  const[pdvSel,setPdvSel]=useState('');
  const agregar=()=>{
    if(!pdvSel||entradas.some(e=>e.cluster===pdvSel))return;
    onChange({...dia,entradas:[...entradas,{cluster:pdvSel,colonia:null}]});
    setPdvSel('');
  };
  const quitar=i=>onChange({...dia,entradas:entradas.filter((_,idx)=>idx!==i)});
  const toggleDescanso=nombre=>onChange({...dia,descansos:descansos.includes(nombre)?descansos.filter(n=>n!==nombre):[...descansos,nombre]});
  return <div style={{marginBottom:10,padding:8,border:'1px solid var(--border)',borderRadius:8}}>
    <div style={{fontWeight:700,fontSize:13,marginBottom:6}}>{label}</div>
    {entradas.length>0&&<div style={{display:'flex',flexWrap:'wrap',gap:4,marginBottom:6}}>
      {entradas.map((e,i)=><span key={i} style={{display:'inline-flex',alignItems:'center',gap:4,background:'var(--accent-light)',color:'var(--accent)',padding:'2px 8px',borderRadius:10,fontSize:13,fontWeight:600}}>
        {e.cluster}
        <span onClick={()=>quitar(i)} style={{cursor:'pointer',fontWeight:800}}>✕</span>
      </span>)}
    </div>}
    <div style={{marginBottom:6}}>
      <Autocomplete value={pdvSel} onChange={setPdvSel} placeholder="Buscar punto de venta..." options={puntosDisponibles.map(p=>({value:p,label:p}))}/>
    </div>
    <Btn variant="secondary" onClick={agregar} style={{width:'100%',fontSize:13,padding:'6px 10px'}}>+ Agregar</Btn>
    {(vendedores||[]).length>0&&<div style={{marginTop:8,paddingTop:8,borderTop:'1px dashed var(--border)'}}>
      <div style={{fontSize:13,fontWeight:700,color:'var(--dim)',marginBottom:4}}>😴 Descanso — ¿a quién le toca este {label.toLowerCase()}?</div>
      <div style={{border:'1px solid var(--border)',borderRadius:6,padding:6}}>
        {vendedores.map(v=>{
          const marcado=descansos.includes(v.nombre);
          const otrosDias=(descansosSemana?.[v.nombre]||[]).filter(l=>l!==label);
          return <label key={v.numEmp||v.nombre} style={{display:'flex',alignItems:'center',gap:6,fontSize:13,padding:'3px 0',cursor:'pointer',lineHeight:1.3}}>
            <input type="checkbox" checked={marcado} onChange={()=>toggleDescanso(v.nombre)}/>
            <span style={{flex:1,fontWeight:marcado?700:400}}>{nombreCorto(v.nombre)}</span>
            {otrosDias.length>0&&<span style={{fontSize:12,color:'var(--dim)'}}>descansa {otrosDias.join(', ').toLowerCase()}</span>}
          </label>;
        })}
      </div>
      {descansos.length>0&&<p style={{fontSize:12,color:'var(--dim)',margin:'4px 0 0'}}>Descansan {descansos.length} de {vendedores.length}: {descansos.map(nombreCorto).join(', ')}</p>}
    </div>}
    <div style={{marginTop:8,paddingTop:8,borderTop:'1px dashed var(--border)'}}>
      <Field label="💬 Comentarios adicionales">
        <Textarea value={dia.comentarios||''} onChange={e=>onChange({...dia,comentarios:e.target.value})} placeholder="Notas para este día..." style={{minHeight:50,fontSize:14}}/>
      </Field>
    </div>
  </div>;
}

// ─── Plan ───
// Objetivo semanal (KPIs comprometidos vs. meta oficial calculada de las metas por ranking del
// equipo) + resultado real de la semana pasada (precargado del sistema, editable) con % de cumplimiento.
// Porcentaje de qué tan lleno está un plan (fila cruda del Sheet, headers de SHEET_CONFIG.PLAN):
// los 5 KPI del objetivo + los 7 días de Zonas + Prioridades/Acompañamientos/Resultado esperado/Notas.
function completitudPlanFila(row){
  let total=0,llenos=0;
  ['Obj. Oportunidades','Obj. Ventas','Obj. Instalaciones','Obj. Cuentas recuperadas NPPF','Obj. ARPU'].forEach(k=>{
    total++;if(Number(row[k])>0)llenos++;
  });
  const zonasTxt=String(row['Zonas']||'');
  DIAS_SEMANA.forEach(d=>{total++;if(zonasTxt.includes(DIAS_SEMANA_LABEL[d]+':'))llenos++;});
  ['Prioridades','Acompañamientos','Resultado esperado','Notas'].forEach(k=>{
    total++;if(String(row[k]||'').trim())llenos++;
  });
  return Math.round(llenos/total*100);
}
