  const coachesOrdenadosPendientes=esLider?Object.values(porCoachLider).filter(c=>c.pendientesTotal>0).sort((a,b)=>b.pendientesTotal-a.pendientesTotal):[];
  const coachesOrdenadosSinPagar=esLider?Object.values(porCoachLider).filter(c=>c.sinPagarTotal>0).sort((a,b)=>b.sinPagarTotal-a.sinPagarTotal):[];

  const semaforoMap=construirSemaforoMap(recs);
  const semColor=n=>semaforoMap[n]?.valor||'';
  const verdes=vendedores.filter(m=>semColor(m.nombre)==='verde').length;
  const amarillos=vendedores.filter(m=>semColor(m.nombre)==='amarillo').length;
  const rojos=vendedores.filter(m=>semColor(m.nombre)==='rojo').length;
  const sinEval=vendedores.length-verdes-amarillos-rojos;
  // Marcar el semáforo es un toque: se guarda un registro propio, sin abrir formulario.
  const marcarSemaforo=(nombre,valor)=>{
    if(session.soloLectura)return; // vista prestada: solo consulta
    if(semColor(nombre)===valor)return; // mismo color: no se guarda un registro de más
    const rec={id:uid(),type:'semaforo',date:today(),vendedor:nombre,semaforo:valor,nota:'',
      registradoPor:session.user.nombre,token:session.token,savedAt:new Date().toISOString()};
    const upd={...data,records:[...data.records,rec]};
    setData(upd);saveAndSync(upd,rec,toast,setData);
    toast(`${SEM_EMOJI[valor]} ${nombreCorto(nombre)} en ${STATUS[valor].label.toLowerCase()}`);
  };
  const hoy=today();
  const compPendientes=recs.filter(r=>r.type==='feedback'&&r.compromisos&&r.fecha_revision&&r.fecha_revision<=hoy);

  const Gauge=({value,goal,label,icon})=>{
    const pct=goal>0?Math.min(100,Math.round(value/goal*100)):0;
    const ok=pct>=95;const warn=pct>=60&&!ok;
    const barColor=ok?'var(--green)':warn?'var(--yellow)':'var(--red)';
    return <div style={{background:'var(--card)',borderRadius:10,padding:'12px 14px',border:'1px solid var(--border)'}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:6}}>
        <span style={{fontSize:13,fontWeight:700,color:'var(--dim)'}}>{icon} {label}</span>
        <span style={{fontSize:18,fontWeight:800,color:barColor}}>{value}<span style={{fontSize:13,fontWeight:600,color:'var(--dim)'}}>/{goal}</span></span>
      </div>
      <div style={{height:6,background:'var(--border)',borderRadius:3,overflow:'hidden'}}>
        <div style={{width:pct+'%',height:'100%',background:barColor,borderRadius:3,transition:'width .5s'}}/>
      </div>
    </div>;
  };
  const SemBar=()=><div style={{display:'flex',borderRadius:8,overflow:'hidden',height:28}}>
    {verdes>0&&<div style={{flex:verdes,background:'var(--green)',display:'flex',alignItems:'center',justifyContent:'center',color:'#fff',fontSize:13,fontWeight:700}}>{verdes}</div>}
    {amarillos>0&&<div style={{flex:amarillos,background:'var(--yellow)',display:'flex',alignItems:'center',justifyContent:'center',color:'#fff',fontSize:13,fontWeight:700}}>{amarillos}</div>}
    {rojos>0&&<div style={{flex:rojos,background:'var(--red)',display:'flex',alignItems:'center',justifyContent:'center',color:'#fff',fontSize:13,fontWeight:700}}>{rojos}</div>}
    {sinEval>0&&<div style={{flex:sinEval,background:'#d1d5db',display:'flex',alignItems:'center',justifyContent:'center',color:'#fff',fontSize:13,fontWeight:700}}>{sinEval}</div>}
  </div>;

  // Context card for expanded member
  const ContextCard=({m})=>{
    const re=m.rankingEnt;const rm2=m.rankingMen;
    return <div style={{background:'var(--bg)',borderRadius:8,padding:10,marginTop:6,fontSize:13,borderLeft:'3px solid var(--accent)'}}>
      <div style={{display:'flex',justifyContent:'space-between',marginBottom:6}}>
        <span style={{fontWeight:700}}>{m.nombre}</span>
        <button onClick={()=>setExpanded(null)} style={{background:'none',border:'none',cursor:'pointer',fontSize:15,color:'var(--dim)'}}>✕</button>
      </div>
      {/* Fecha de ingreso */}
      {m.fechaAlta&&<div style={{marginBottom:4,color:'var(--dim)'}}>
        📅 Ingreso: <b>{m.fechaAlta}</b>
      </div>}
      {/* Ranking + meses */}
      <div style={{display:'flex',gap:6,alignItems:'center',marginBottom:6,flexWrap:'wrap'}}>
        <RankBadge badge={m.badge}/>
        {m.mesesEnRanking>0&&<span style={{fontSize:12,color:'var(--dim)'}}>({m.mesesEnRanking} meses en este nivel)</span>}
      </div>
      {m.obs&&<p style={{fontSize:13,color:'var(--yellow)',fontStyle:'italic',marginBottom:6}}>⚠️ {m.obs}</p>}
      {/* Performance */}
      {rm2&&<div style={{padding:'6px 8px',background:'var(--card)',borderRadius:6,marginBottom:6}}>
        <div style={{fontSize:13,fontWeight:700,color:'var(--dim)',marginBottom:3}}>📊 Rendimiento (últ. mes evaluado: {mesEvaluado})</div>
        <div style={{display:'flex',justifyContent:'space-between'}}><span>Promedio mensual:</span><b>{rm2.promedioMensual} ins</b></div>
        <div style={{display:'flex',justifyContent:'space-between',color:'var(--dim)'}}><span>Últimos 3 meses:</span><span>{rm2.ultimos3meses.join(' → ')||'—'}</span></div>
      </div>}
      {/* Entrenamiento */}
      {re&&<div style={{padding:'6px 8px',background:'var(--card)',borderRadius:6,marginBottom:6}}>
        <div style={{fontSize:13,fontWeight:700,color:'var(--dim)',marginBottom:3}}>🎓 Entrenamiento</div>
        <div style={{display:'flex',justifyContent:'space-between'}}><span>Inst. últ. 4 sem:</span><b>{re.insUlt4}</b></div>
        {re.evalMes1&&re.evalMes1!=='-'&&<div style={{display:'flex',justifyContent:'space-between'}}><span>Eval Mes 1:</span><b>{re.evalMes1}</b></div>}
        {re.evalMes2&&re.evalMes2!=='-'&&<div style={{display:'flex',justifyContent:'space-between'}}><span>Eval Mes 2:</span><b>{re.evalMes2}</b></div>}
      </div>}
      {/* Certificaciones */}
      {re&&<div style={{marginBottom:6}}>
        <div style={{display:'flex',gap:4,flexWrap:'wrap'}}>
          {re.certActitud==='APROBADO'&&<span style={{background:'var(--gbg)',color:'var(--green)',padding:'1px 5px',borderRadius:6,fontSize:12,fontWeight:600}}>✓ Actitud</span>}
          {re.certSist1==='APROBADO'&&<span style={{background:'var(--gbg)',color:'var(--green)',padding:'1px 5px',borderRadius:6,fontSize:12,fontWeight:600}}>✓ Sistémica I</span>}
          {re.certSist2==='APROBADO'&&<span style={{background:'var(--gbg)',color:'var(--green)',padding:'1px 5px',borderRadius:6,fontSize:12,fontWeight:600}}>✓ Sistémica II</span>}
          {re.certSist3==='APROBADO'&&<span style={{background:'var(--gbg)',color:'var(--green)',padding:'1px 5px',borderRadius:6,fontSize:12,fontWeight:600}}>✓ Sistémica III</span>}
        </div>
      </div>}
      {/* Cursos faltantes */}
      {m.certFaltantes&&m.certFaltantes.length>0&&
        <div style={{fontSize:13,color:'var(--red)',fontWeight:600,padding:'4px 8px',background:'var(--rbg)',borderRadius:6,marginBottom:6}}>
          📚 Cursos faltantes: {m.certFaltantes.join(', ')}
        </div>
      }
      {/* Ventas: semana/mes del periodo elegido en "Ventas del equipo" (ver refEquipo) y meta */}
      {(()=>{
        const fSem=funnelPeriodo(m.ventas,semEqIni,semEqFin);
        const fMes=funnelPeriodo(m.ventas,mesEqIni,mesEqFin);
        const arpuSem=arpuPromedioPeriodo(m.ventas,semEqIni,semEqFin);
        const arpuMes=arpuPromedioPeriodo(m.ventas,mesEqIni,mesEqFin);
        const meta=metaMensual(m.badge);
        const sinPagar=cuentasSinPagar(m.cuentasCom,now);
        if(!m.ventas?.length&&!sinPagar.length)return null;
        return <div style={{padding:'6px 8px',background:'var(--card)',borderRadius:6,marginBottom:6}}>
          <div style={{fontSize:13,fontWeight:700,color:'var(--dim)',marginBottom:3}}>🛒 Ventas</div>
          <div style={{display:'flex',justifyContent:'space-between',gap:8}}><span>Semana ({labelSemEq}):</span><span style={{textAlign:'right'}}>{fSem.oportunidades} op · {fSem.validadas} val · {fSem.instaladas} inst{arpuSem>0?` · ARPU ${fmtMoney(arpuSem)}`:''}</span></div>
          <div style={{display:'flex',justifyContent:'space-between',gap:8}}><span>Mes ({labelMesEq}):</span><span style={{textAlign:'right'}}>{fMes.oportunidades} op · {fMes.validadas} val · {fMes.instaladas} inst{arpuMes>0?` · ARPU ${fmtMoney(arpuMes)}`:''}</span></div>
          {meta>0&&<div style={{display:'flex',justifyContent:'space-between',gap:8}}><span>Meta del mes:</span><b>{fMes.instaladas}/{meta}</b></div>}
        </div>;
      })()}
      {/* Validadas en los últimos 30 días que todavía no se instalan */}
      {(()=>{
        const pendientes=pendientesInstalar30d(m.ventas,now);
        if(!pendientes.length)return null;
        return <div style={{padding:'6px 8px',background:'var(--ybg)',borderRadius:6,marginBottom:6}}>
          <div style={{fontSize:13,fontWeight:700,color:'var(--yellow)',marginBottom:3}}>⏳ Validadas sin instalar, últ. 30 días ({pendientes.length})</div>
          {pendientes.map((v,i)=>{
            const dias=Math.floor((now-v.validacion)/86400000);
            const asig=(m.asignacionesPorOS||{})[v.os]||0;
            return <div key={i} style={{fontSize:13,color:'var(--dim)',display:'flex',justifyContent:'space-between',gap:6,padding:'3px 0',borderBottom:i<pendientes.length-1?'1px solid var(--border)':'none'}}>
              <span>{v.cuenta} · {v.os}</span>
              <span>{dias} día{dias!==1?'s':''} sin activar · {asig} asignación{asig!==1?'es':''}</span>
            </div>;
          })}
          <a href={whatsappUrl(textoPendientesInstalar(m,pendientes,now))} target="_blank" rel="noopener noreferrer"
            style={{display:'inline-flex',alignItems:'center',gap:6,marginTop:8,padding:'6px 12px',borderRadius:8,background:'#25D366',color:'#fff',fontSize:13,fontWeight:700,textDecoration:'none'}}>
            📲 Enviar por WhatsApp
          </a>
        </div>;
      })()}
      {/* Cuentas sin pagar de este vendedor (25 a 90 días de instaladas) */}
      {(()=>{
        const sinPagar=cuentasSinPagar(m.cuentasCom,now);
        if(!sinPagar.length)return null;
        const totalPeriodo=cuentasDelPeriodo(m.cuentasCom,now).length;
        const pct=totalPeriodo?Math.round(sinPagar.length/totalPeriodo*100):0;
        return <div style={{padding:'6px 8px',background:'var(--rbg)',borderRadius:6,marginBottom:6}}>
          <div style={{fontSize:13,fontWeight:700,color:'var(--red)',marginBottom:3}}>💰 Cuentas sin pagar ({sinPagar.length} · {pct}% de {totalPeriodo} instaladas)</div>
          {/* Informativo: del mismo universo de cuentas (las instaladas hace 25 a 90 días), cuántas
              ya se pagaron y cómo fue el ritmo de las dos semanas de pago ya cerradas (columna V).
              La semana en curso no se compara: su comisión se paga hasta la siguiente. */}
          {(()=>{
            const pagadas=cuentasPagadas(m.cuentasCom,now);
            if(!pagadas.length)return null;
            const semPasada=pagadasEnSemana(pagadas,vSemanaPasada);
            const semAntepasada=pagadasEnSemana(pagadas,vSemanaAntepasada);
            const dif=semPasada-semAntepasada;
            const pctPag=totalPeriodo?Math.round(pagadas.length/totalPeriodo*100):0;
            const sinSemana=pagadas.filter(c=>!c.semanaPago).length;
            return <div style={{fontSize:13,color:'var(--dim)',lineHeight:1.45,paddingBottom:5,marginBottom:4,borderBottom:'1px solid var(--border)'}}>
              <div>✅ Ya pagadas: <b style={{color:'var(--green)'}}>{pagadas.length}</b> de {totalPeriodo} ({pctPag}%)</div>
              <div>
                Semana <b>{semanaPasadaNum}</b>: <b>{semPasada}</b> · semana <b>{semanaAntepasadaNum}</b>: <b>{semAntepasada}</b>{' '}
                <span style={{fontWeight:700,color:dif>0?'var(--green)':dif<0?'var(--red)':'var(--dim)'}}>({dif>0?'+':''}{dif})</span>
              </div>
              <div style={{fontSize:12}}>Sem. {semanaPasadaNum}: {fmtDateObj(semanaPasadaIni)} al {fmtDateObj(semanaPasadaFin)} · sem. {semanaAntepasadaNum}: {fmtDateObj(semanaAntepasadaIni)} al {fmtDateObj(semanaAntepasadaFin)}</div>
              {sinSemana>0&&<div style={{fontSize:12}}>({sinSemana} pagada{sinSemana!==1?'s':''} sin semana de pago en la base, no entra{sinSemana!==1?'n':''} en la comparación)</div>}
            </div>;
          })()}
          {sinPagar.map((c,i)=>{
            // Días que lleva instalada sin que se pague: mientras más alto, más cerca del corte de
            // los 90 días con que la cuenta sale de la ventana (y de la lista) sin haberse cobrado.
            const diasSinPago=diasDesde(c.fechaInstalacion,now);
            return <div key={i} style={{fontSize:13,color:'var(--dim)',padding:'4px 0',borderBottom:i<sinPagar.length-1?'1px solid var(--border)':'none'}}>
              <div style={{display:'flex',justifyContent:'space-between',gap:6}}>
                <span>{c.cuenta} · {c.cliente} · {fmtDateObj(c.fechaInstalacion)} <b style={{color:'var(--red)'}}>({diasSinPago} día{diasSinPago!==1?'s':''})</b></span>
              </div>
              <div style={{display:'flex',justifyContent:'space-between',gap:6,marginTop:1}}>
                <span>{c.plan}</span>
                <span style={{color:'var(--red)',fontWeight:600,textAlign:'right'}}>{fmtMoney(c.importe)}</span>
              </div>
            </div>;
          })}
          <a href={whatsappUrl(textoCuentasSinPagar(m,sinPagar,now))} target="_blank" rel="noopener noreferrer"
            style={{display:'inline-flex',alignItems:'center',gap:6,marginTop:8,padding:'6px 12px',borderRadius:8,background:'#25D366',color:'#fff',fontSize:13,fontWeight:700,textDecoration:'none'}}>
            📲 Enviar por WhatsApp
          </a>
        </div>;
      })()}
    </div>;
  };

  // Fila de un vendedor con su semáforo/meta/último feedback — se usa tanto en el listado plano
  // (coach/director) como anidada dentro de un coach expandido (líder).
  // nested=true: esta fila se muestra dentro de un coach expandido (vista líder) — usa un tono
  // cálido/orgánico distinto al de la tarjeta del coach, para que se note el cambio de nivel.
  const VendedorRow=({m,nested})=>{
    const semInfo=semaforoMap[m.nombre];
    const sem=semInfo?.valor||'';
    const isExp=expanded===m.nombre;
    const abiertoSem=semAbierto===m.nombre;
    const lastFb=recs.filter(r=>r.type==='feedback'&&r.vendedor===m.nombre).sort((a,b)=>b.savedAt.localeCompare(a.savedAt))[0];
    const sinPagarN=cuentasSinPagar(m.cuentasCom,now).length;
    const sinPagarPct=sinPagarN?Math.round(sinPagarN/cuentasDelPeriodo(m.cuentasCom,now).length*100):0;
    // Franja de color a la izquierda: se lee el estado de toda la lista de un vistazo, sin tener
    // que buscar la pastilla de cada renglón. Gris cuando todavía nadie lo ha semaforizado.
    const franja=sem?STATUS[sem].border:'#cbd0dd';
    return <div key={m.numEmp||m.nombre}>
      <div onClick={()=>setExpanded(isExp?null:m.nombre)} style={{
        display:'flex',alignItems:'center',justifyContent:'space-between',
        padding:'10px 12px',borderRadius:isExp?'10px 10px 0 0':10,marginBottom:isExp?0:5,cursor:'pointer',
        borderLeft:`5px solid ${franja}`,
        background:sem==='rojo'?'var(--rbg)':sem==='amarillo'?'var(--ybg)':sem==='verde'?'var(--gbg)':nested?'var(--nest-bg)':'transparent',
        border:`1px solid ${sem?STATUS[sem].border:nested?'var(--nest-border)':'var(--border)'}`,
        borderLeftWidth:5,borderLeftColor:franja,
        borderBottom:isExp?'none':undefined,
      }}>
        <div style={{flex:1}}>
          <div style={{display:'flex',alignItems:'center',gap:4,flexWrap:'wrap'}}>
            <span style={{fontSize:15,fontWeight:700,lineHeight:1.3}}>{m.nombre.split(' ').slice(0,3).join(' ')}</span>
            <RankBadge badge={m.badge}/>
            {m.obs&&<span style={{fontSize:13,fontWeight:600,color:'var(--yellow)'}}>⚠️ {m.obs}</span>}
            {sinPagarN>0&&<span style={{fontSize:13,fontWeight:700,color:'var(--red)'}}>💰 {sinPagarN} sin pagar ({sinPagarPct}%)</span>}
          </div>
          {m.rankingMen&&<div style={{fontSize:13,color:'var(--dim)',marginTop:2,lineHeight:1.4}}>
            Prom: {m.rankingMen.promedioMensual} ins/mes
            {m.mesesEnRanking>0&&<span> · {m.mesesEnRanking}m en nivel</span>}
          </div>}
          {metaMensual(m.badge)>0&&<div style={{fontSize:13,color:'var(--dim)',marginTop:2,lineHeight:1.4}}>
            🎯 {funnelPeriodo(m.ventas,mesEqIni,mesEqFin).instaladas}/{metaMensual(m.badge)} inst. {mesEqEsActual?'del mes':`de ${labelMesEq}`}
          </div>}
          {metaSemanal(m.badge)>0&&<div style={{fontSize:13,color:'var(--dim)',marginTop:2,lineHeight:1.4}}>
            🎯 {funnelPeriodo(m.ventas,semEqIni,semEqFin).instaladas}/{metaSemanal(m.badge)} inst. {semEqEsActual?'de la semana':`del ${labelSemEq}`}
          </div>}
          {m.rankingMen?.ventaSana&&<div style={{fontSize:13,color:'var(--dim)',marginTop:2,lineHeight:1.4}}>
            % Venta sana ({m.rankingMen.ventaSana.mes}): <b>{m.rankingMen.ventaSana.valor}</b>
          </div>}
          {lastFb&&<div style={{fontSize:13,color:'var(--dim)',marginTop:2,lineHeight:1.4}}>Último: {fmt(lastFb.date)} · {lastFb.tipo}</div>}
          {!lastFb&&<div style={{fontSize:13,color:'var(--yellow)',marginTop:2,lineHeight:1.4}}>Sin evaluación</div>}
        </div>
        <div style={{display:'flex',alignItems:'center',gap:6}}>
          {/* El botón del semáforo NO abre el detalle del vendedor: stopPropagation, si no, cada
              intento de marcar terminaría desplegando la ficha. En vista prestada no
              se puede capturar nada, así que ahí se muestra el color pero sin invitar a tocarlo. */}
          <button onClick={e=>{e.stopPropagation();if(!session.soloLectura)setSemAbierto(abiertoSem?null:m.nombre);}}
            title={session.soloLectura?(sem?STATUS[sem].label:'Sin semáforo'):sem?`${STATUS[sem].label} — toca para cambiar`:'Sin semáforo — toca para marcar'}
            style={{display:'inline-flex',alignItems:'center',gap:5,padding:'7px 11px',borderRadius:20,cursor:session.soloLectura?'default':'pointer',
              border:`2px solid ${sem?STATUS[sem].border:'var(--yellow)'}`,
              background:sem?STATUS[sem].bg:'var(--ybg)',
              color:sem?STATUS[sem].border:'var(--yellow)',fontSize:14,fontWeight:700,whiteSpace:'nowrap'}}>
            {sem?<>{SEM_EMOJI[sem]} {STATUS[sem].label}</>:session.soloLectura?<>⚪ Sin marcar</>:<>⚪ Marcar</>}
          </button>
          <span style={{fontSize:14,color:'var(--dim)'}}>{isExp?'▲':'▼'}</span>
        </div>
      </div>
      {abiertoSem&&<div style={{border:`1px solid ${franja}`,borderTop:'none',borderRadius:'0 0 10px 10px',padding:10,marginBottom:5,background:'var(--card)'}}>
        <div style={{fontSize:13,fontWeight:700,color:'var(--dim)',marginBottom:8}}>¿Cómo va {nombreCorto(m.nombre)}?</div>
        <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:8}}>
          {SEM_OPCIONES.map(o=>{
            const activo=sem===o.valor;
            return <button key={o.valor} onClick={e=>{e.stopPropagation();marcarSemaforo(m.nombre,o.valor);setSemAbierto(null);}}
              style={{display:'flex',flexDirection:'column',alignItems:'center',gap:2,padding:'12px 6px',borderRadius:10,cursor:'pointer',
                border:`2px solid ${activo?STATUS[o.valor].border:'var(--border)'}`,
                background:activo?STATUS[o.valor].bg:'var(--input)',
                boxShadow:activo?`0 0 0 3px ${STATUS[o.valor].bg}`:'none'}}>
              <span style={{fontSize:22,lineHeight:1}}>{o.emoji}</span>
              <span style={{fontSize:14,fontWeight:800,color:STATUS[o.valor].border}}>{o.titulo}</span>
              <span style={{fontSize:13,color:'var(--dim)',textAlign:'center',lineHeight:1.25}}>{o.ayuda}</span>
            </button>;
          })}
        </div>
        {semInfo&&<p style={{fontSize:13,color:'var(--dim)',marginTop:8}}>
          Actual: <b>{STATUS[sem]?.label}</b>{semInfo.fecha?` · ${fmt(semInfo.fecha)}`:''}{semInfo.porQuien?` · ${nombreCorto(semInfo.porQuien)}`:''}
        </p>}
      </div>}
      {isExp&&<div style={{border:'1px solid var(--border)',borderTop:'none',borderRadius:'0 0 8px 8px',marginBottom:4}}>
        <ContextCard m={m}/>
      </div>}
    </div>;
  };

  // Pantalla angosta: una sola columna, en el orden de `order` (el mismo de siempre). Pantalla
  // amplia (ver .dash en el <style>): a la izquierda el resumen, las ventas y el semáforo; a la
  // derecha los paneles de análisis; y el equipo abajo a todo lo ancho, porque sus renglones
  // necesitan unos 700 px para no partirse en dos. Por eso en el código van agrupados por columna
  // y no en el orden en que se ven en el celular.
  return <div className="dash">
    <div className="dash-col">
      <div style={{order:1}}>
          <Card title={`📈 Dashboard — ${MESES[mesActual]} ${anioActual}`}>
            <p style={{fontSize:13,color:'var(--dim)',marginBottom:4}}>Día {diasTranscurridos} de {diasMes} · ~{diasLabTransc} días laborables</p>
            <p style={{fontSize:13,color:'var(--dim)'}}>Último mes evaluado: <b>{mesEvaluado}</b></p>
          </Card>
      </div>
      <div style={{order:2}}>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8,marginBottom:14}}>
            <Gauge value={acomp} goal={8} label="Acompañamientos" icon="🚶"/>
            <Gauge value={arranques} goal={diasLabTransc} label="Arranques" icon="☀️"/>
            <Gauge value={cierres} goal={diasLabTransc} label="Cierres" icon="🌙"/>
            <Gauge value={totalFeedback} goal={vendedores.length*2} label="Evaluaciones" icon="💬"/>
          </div>
      </div>
      <div style={{order:3}}>
          <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:8,marginBottom:14}}>
            {[
              {l:'Permisos',v:permisos,c:'var(--accent)',icon:'📋'},
              {l:'Inc. Operativas',v:incOp,c:'var(--yellow)',icon:'⚠️'},
              {l:'Inc. Críticas',v:incCrit,c:'var(--red)',icon:'🚨'},
            ].map(s=><div key={s.l} style={{background:'var(--card)',borderRadius:10,padding:'10px 8px',textAlign:'center',border:'1px solid var(--border)'}}>
              <div style={{fontSize:17}}>{s.icon}</div>
              <div style={{fontSize:20,fontWeight:800,color:s.c}}>{s.v}</div>
              <div style={{fontSize:12,color:'var(--dim)',fontWeight:600}}>{s.l}</div>
            </div>)}
          </div>
      </div>
      <div style={{order:4}}>

// ─── Historial ───
// Un solo historial para todo: lo que ya está en el Sheet (lo del equipo, visible desde cualquier
// teléfono) más lo capturado en este teléfono que todavía no sube. Antes eran dos vistas separadas
// ("Este dispositivo" y "Equipo") que se leían distinto, y la del dispositivo se perdía al cambiar
// de celular — ninguna de las dos servía como evidencia para Recursos Humanos o una auditoría.
const TIPOS_HIST={
  arranque:{icon:'☀️',label:'Arranque',color:'#b45309',fondo:'#fef3c7'},
  cierre:{icon:'🌙',label:'Cierre',color:'#1e40af',fondo:'#dbeafe'},
  permiso:{icon:'📋',label:'Permiso',color:'#7c3aed',fondo:'#ede9fe'},
  feedback:{icon:'💬',label:'Hallazgo',color:'#be123c',fondo:'#ffe4e6'},
  semaforo:{icon:'🚦',label:'Semáforo',color:'#0f766e',fondo:'#ccfbf1'},
  plan:{icon:'📊',label:'Plan',color:'#15803d',fondo:'#dcfce7'},
  plan_resultado:{icon:'🏁',label:'Resultado del plan',color:'#15803d',fondo:'#dcfce7'},
};
const ORDEN_TIPOS_HIST=['arranque','cierre','permiso','feedback','semaforo','plan','plan_resultado'];
// Qué tan grave es cada motivo de ausencia, para pintar el renglón. Descanso, vacaciones y permiso
// autorizado son ausencias previstas y no se pintan. "Trabajo fuera de ruta" y "Actividad especial"
// ni siquiera son ausencias (ver ABSENCE_REASONS): se cuentan aparte, como fuera de ruta.
const GRAVEDAD_AUSENCIA={'Falta injustificada':'rojo','Falta justificada':'amarillo','Incapacidad':'amarillo','Retardo':'amarillo','Otro':'amarillo'};
const colorGravedad=g=>g==='rojo'?['var(--red)','var(--rbg)']:g==='amarillo'?['var(--yellow)','var(--ybg)']:['var(--dim)','var(--bg)'];
const esFueraDeRuta=motivo=>TIPOS_CON_COMPROMISO.includes(motivo);
// Un renglón de cierre cuenta si tuvo algo que reportar — el mismo criterio con el que buildRow
// (apps-script.gs) decide qué vendedores escribir en el Sheet, para que lo local y lo del Sheet cuadren.
const conActividad=x=>!!(Number(x.oportunidades)||Number(x.validadas)||Number(x.instaladas)||Number(x.pagadasHoy)||x.pendiente);
const dos=n=>String(n).padStart(2,'0');
const diaDe=ymd=>{const[y,m,d]=String(ymd).split('-').map(Number);return new Date(y,m-1,d);};
const nombreDia=ymd=>DIAS_SEMANA_LABEL[DIAS_SEMANA[(diaDe(ymd).getDay()+6)%7]];
const fechaLarga=ymd=>/^\d{4}-\d{2}-\d{2}/.test(String(ymd))?`${nombreDia(ymd)} ${fmt(String(ymd).slice(0,10))}`:String(ymd||'');
const fechaCorta=ymd=>/^\d{4}-\d{2}-\d{2}/.test(String(ymd))?`${nombreDia(ymd).slice(0,3).toLowerCase()} ${fmt(String(ymd).slice(0,10)).slice(0,5)}`:'';

// Momento real en que llegó el registro: savedAt local (cuando se capturó) o el Timestamp del Sheet
// (cuando el servidor lo recibió, que para un pendiente que subió después no es la hora de captura).
function capturadoDe(r){
  const s=String(r.savedAt||'');
  if(!/^\d{4}-\d{2}-\d{2}T/.test(s))return null;
  const d=new Date(s);
  return isNaN(d)?null:d;
}
// Hora en 24 h, para poder ordenar los registros de un mismo día. `time` (arranque y cierre) lo
// escribe now() como "08:12 p.m.": si solo se cortara "08:12", un cierre de la noche se ordenaría
// como si fuera de la mañana. Si el Sheet convirtió la hora en fecha (llega "1899-12-30"), no cuadra
// con el patrón y se toma del momento de captura.
function horaDeRegistro(r){
  const m=String(r.time||'').trim().toLowerCase().match(/^(\d{1,2}):(\d{2})\s*(a\.?\s*m|p\.?\s*m)?/);
  if(m){
    let h=Number(m[1]);
    if(m[3]&&m[3][0]==='p'&&h<12)h+=12;
    if(m[3]&&m[3][0]==='a'&&h===12)h=0;
    return dos(h)+':'+m[2];
  }
  const d=capturadoDe(r);
  return d?dos(d.getHours())+':'+dos(d.getMinutes()):'';
}
// Día al que pertenece el registro. Hasta el 13/09/2026 today() sacaba la fecha en UTC, así que lo
// capturado después de las 6 de la tarde (hora de Torreón) se guardó con la fecha del día SIGUIENTE:
// un cierre del viernes a las 19:05 dice sábado. Esos registros viejos se corrigen aquí sin tocar lo
// guardado: si la fecha es justo la fecha UTC del momento de captura y no la local, fue el valor por
// defecto con el error y se usa la local. Si alguien cambió la fecha a mano no coincide y se respeta.
// Solo aplica a lo capturado antes del arreglo: desde ahí today() ya da la fecha local, y la misma
// regla movería por error un permiso registrado de noche con la fecha de mañana puesta a propósito.
const ARREGLO_FECHA_LOCAL=new Date(2026,8,14);
function fechaEfectiva(r){
  const f=String(r.date||'').slice(0,10);
  const d=capturadoDe(r);
  if(!d||d>=ARREGLO_FECHA_LOCAL)return f||(d?ymdLocal(d):'');
  const utc=String(r.savedAt).slice(0,10),local=ymdLocal(d);
  return f===utc&&local!==utc?local:(f||local);
}
// Vendedores de los que habla un registro. Es lo que arma el expediente de una persona: sus
// ausencias, permisos, hallazgos, semáforos y sus resultados en los cierres.
function sujetosDe(r){
  const lista=[];
  const add=(nombre,papel)=>{const nm=String(nombre||'').trim();if(nm&&!lista.some(x=>x.nombre===nm))lista.push({nombre:nm,papel});};
  switch(r.type){
    case'arranque':(r.ausentes||[]).forEach(a=>add(a.name,esFueraDeRuta(a.reason)?'fuera':'ausente'));break;
    case'cierre':
      (r.resultados||[]).filter(conActividad).forEach(x=>add(x.nombre,'cierre'));
      (r.seguimiento||[]).forEach(s=>add(s.name,'seguimiento'));
      break;
    case'permiso':add(r.vendedor,'permiso');break;
    case'feedback':add(r.vendedor,'hallazgo');break;
    case'semaforo':add(r.vendedor,'semaforo');break;
  }
  return lista;
}
// Una línea que dice de qué trata el registro sin abrirlo. Con `vendedor`, solo lo que toca a esa
// persona (su ausencia en ese arranque, sus números en ese cierre).
function resumenDe(r,vendedor){
  const n=v=>Number(v)||0;
  switch(r.type){
    case'arranque':{
      if(vendedor){
        const a=(r.ausentes||[]).find(x=>x.name===vendedor);
        return a?`${esFueraDeRuta(a.reason)?'🧭':'🚫'} ${a.reason||'Sin motivo'}${a.detail?' — '+a.detail:''}`:'Presente';
      }
      const aus=(r.ausentes||[]).filter(a=>!esFueraDeRuta(a.reason)).length;
      const fuera=(r.ausentes||[]).length-aus,pres=(r.presentes||[]).length;
      return `${pres} presente${pres!==1?'s':''} · ${aus} ausencia${aus!==1?'s':''}${fuera?` · ${fuera} fuera de ruta`:''}`;
    }
    case'cierre':{
      const filas=(r.resultados||[]).filter(conActividad);
      if(vendedor){
        const x=filas.find(f=>f.nombre===vendedor),s=(r.seguimiento||[]).find(f=>f.name===vendedor);
        const partes=[];
        if(x)partes.push(`${n(x.oportunidades)} op · ${n(x.validadas)} val · ${n(x.instaladas)} inst`);
        if(x&&x.pendiente)partes.push('Pendiente: '+x.pendiente);
        if(s)partes.push('Seguimiento'+(s.motivo?': '+s.motivo:''));
        return partes.join(' · ')||'Sin actividad';
      }
      const t=filas.reduce((a,x)=>({op:a.op+n(x.oportunidades),val:a.val+n(x.validadas),inst:a.inst+n(x.instaladas)}),{op:0,val:0,inst:0});
      return `${t.op} op · ${t.val} val · ${t.inst} inst${r.incidencias?' · ⚠️ con incidencias':''}`;
    }
    case'permiso':return vendedor?`${r.tipo||''}${r.motivo?' — '+r.motivo:''}`:`${nombreCorto(r.vendedor)} · ${r.tipo||''}`;
    case'feedback':return vendedor?(r.tipo||'Hallazgo'):`${nombreCorto(r.vendedor)} · ${r.tipo||''}`;
    case'semaforo':{
      const s=`${SEM_EMOJI[r.semaforo]||'⚪'} ${STATUS[r.semaforo]?.label||r.semaforo||''}`;
      return vendedor?s:`${nombreCorto(r.vendedor)} → ${s}`;
    }
    case'plan':return `Semana ${r.semanaLabel||''}${r.objetivos?` · obj. ${n(r.objetivos.instalaciones)} inst`:''}`;
    case'plan_resultado':{
      const o=n(r.objetivos?.instalaciones),v=n(r.resultados?.instalaciones);
      return `Semana ${r.semanaLabel||''} · ${v}/${o} inst${o?` (${Math.round(v/o*100)}%)`:''}${r.aDestiempo?' · ⚠️ a destiempo':''}`;
    }
    default:return'';
  }
}
// Color del renglón: el semáforo en hallazgos, la ausencia más grave en arranques, las incidencias en
// cierres y el cumplimiento en resultados de plan. null = sin nada que llamar la atención.
function tonoDe(r,vendedor){
  switch(r.type){
    case'feedback':case'semaforo':return STATUS[r.semaforo]?r.semaforo:null;
    case'arranque':{
      const g=(r.ausentes||[]).filter(a=>!vendedor||a.name===vendedor).map(a=>GRAVEDAD_AUSENCIA[a.reason]).filter(Boolean);
      return g.includes('rojo')?'rojo':g.length?'amarillo':null;
    }
    case'cierre':return !vendedor&&r.incidencias?'amarillo':null;
    case'plan_resultado':{
      const o=Number(r.objetivos?.instalaciones)||0;
      if(!o)return null;
      const p=(Number(r.resultados?.instalaciones)||0)/o*100;
      return p>=95?'verde':p>=60?'amarillo':'rojo';
    }
    default:return null;
  }
}
function normalizarEvento(r,pendientes){
  if(!r||!TIPOS_HIST[r.type])return null;
  return{id:r.id,tipo:r.type,fecha:fechaEfectiva(r),hora:horaDeRegistro(r),autor:r.registradoPor||'',
    pendiente:pendientes.has(r.id),desdeSheet:!!r.desdeSheet,sujetos:sujetosDe(r),r};
}
// {desde, hasta} en 'YYYY-MM-DD' (hora local) y la etiqueta a mostrar. offset 0 = el periodo actual,
// 1 = el anterior, etc. Las semanas llevan su número, que es como el negocio las nombra.
function rangoPeriodo(periodo,offset,rango,base){
  const hoy=new Date(base);hoy.setHours(0,0,0,0);
  const corto=d=>`${dos(d.getDate())} ${MESES[d.getMonth()].toLowerCase()}`;
  if(periodo==='dia'){
    const d=new Date(hoy);d.setDate(d.getDate()-offset);
    const s=ymdLocal(d);
    return{desde:s,hasta:s,etiqueta:offset===0?`Hoy · ${fechaLarga(s)}`:offset===1?`Ayer · ${fechaLarga(s)}`:fechaLarga(s)};
  }
  if(periodo==='semana'){
    const ini=startOfWeek(hoy);ini.setDate(ini.getDate()-7*offset);
    const fin=new Date(ini);fin.setDate(fin.getDate()+6);
    const nombre=offset===0?'Esta semana':offset===1?'Semana pasada':'Semana';
    return{desde:ymdLocal(ini),hasta:ymdLocal(fin),etiqueta:`${nombre} ${semanaISO(ini)} · ${corto(ini)} al ${corto(fin)}`};
  }
  if(periodo==='mes'){
    const ini=new Date(hoy.getFullYear(),hoy.getMonth()-offset,1),fin=new Date(ini.getFullYear(),ini.getMonth()+1,0);
    return{desde:ymdLocal(ini),hasta:ymdLocal(fin),etiqueta:`${MESES_LARGO[ini.getMonth()]} ${ini.getFullYear()}`};
  }
  let desde=rango.desde||rango.hasta||ymdLocal(hoy),hasta=rango.hasta||rango.desde||ymdLocal(hoy);
  if(desde>hasta)[desde,hasta]=[hasta,desde];
  return{desde,hasta,etiqueta:desde===hasta?fechaLarga(desde):`${fmt(desde)} al ${fmt(hasta)}`};
}
// Contadores de un conjunto de registros. Con `vendedor`, las ausencias y los cierres cuentan solo lo
// de esa persona — es el resumen de su expediente.
function resumirEventos(eventos,vendedor){
  const res={total:eventos.length,porTipo:{},colores:{rojo:0,amarillo:0,verde:0},ausencias:0,motivos:{},fueraRuta:0,
    cierre:{dias:0,op:0,val:0,inst:0},semaforo:null,pendientes:0};
  const n=v=>Number(v)||0;
  eventos.forEach(e=>{
    const r=e.r;
    res.porTipo[e.tipo]=(res.porTipo[e.tipo]||0)+1;
    if(e.pendiente)res.pendientes++;
    if(e.tipo==='feedback'&&STATUS[r.semaforo])res.colores[r.semaforo]++;
    if(e.tipo==='arranque')(r.ausentes||[]).filter(a=>!vendedor||a.name===vendedor).forEach(a=>{
      if(esFueraDeRuta(a.reason)){res.fueraRuta++;return;}
      const m=a.reason||'Sin motivo';
      res.ausencias++;res.motivos[m]=(res.motivos[m]||0)+1;
    });
    if(vendedor&&e.tipo==='cierre'){
      const x=(r.resultados||[]).find(f=>f.nombre===vendedor&&conActividad(f));
      if(x){res.cierre.dias++;res.cierre.op+=n(x.oportunidades);res.cierre.val+=n(x.validadas);res.cierre.inst+=n(x.instaladas);}
    }
    if(vendedor&&(e.tipo==='semaforo'||e.tipo==='feedback')&&STATUS[r.semaforo]){
      const clave=e.fecha+' '+e.hora;
      if(!res.semaforo||clave>res.semaforo.clave)res.semaforo={valor:r.semaforo,fecha:e.fecha,clave};
    }
  });
  return res;
}
// Agrupa para mostrar: por día (el más reciente arriba y, dentro del día, en el orden en que pasó),
// por tipo, por coach que capturó o por vendedor. En "vendedor" un mismo registro sale bajo cada
// persona de la que habla (un cierre, bajo cada vendedor con actividad), marcado con `_vendedor`
// para que el renglón muestre solo lo de esa persona. Lo que no habla de nadie (planes, arranques
// sin ausencias) no se pierde: va al final, en "Generales".
function agruparEventos(eventos,modo,soloVendedor){
  const porMomento=(a,b)=>(a.fecha+' '+a.hora).localeCompare(b.fecha+' '+b.hora);
  const grupos=new Map();
  const meter=(clave,titulo,e)=>{if(!grupos.has(clave))grupos.set(clave,{clave,titulo,eventos:[]});grupos.get(clave).eventos.push(e);};
  eventos.forEach(e=>{
    if(modo==='tipo')meter(e.tipo,`${TIPOS_HIST[e.tipo].icon} ${TIPOS_HIST[e.tipo].label}`,e);
    else if(modo==='coach')meter('c:'+(e.autor||'—'),e.autor||'Sin registrar',e);
    else if(modo==='vendedor'){
      // A "Generales" va solo lo que no habla de NADIE. Lo que habla de otras personas pero no de la
      // que está en foco no es general: simplemente no le toca a este expediente.
      // Y con una persona en foco (su expediente) no hay generales que mostrar.
      if(!e.sujetos.length){if(!soloVendedor)meter('~generales','📌 Generales (sin vendedor específico)',e);return;}
      e.sujetos.map(s=>s.nombre).filter(nm=>!soloVendedor||nm===soloVendedor)
        .forEach(nm=>meter('v:'+nm,nm,{...e,_vendedor:nm}));
    }
    else meter(e.fecha,fechaLarga(e.fecha),e);
  });
  const lista=[...grupos.values()];
  if(modo==='dia'||!['tipo','coach','vendedor'].includes(modo)){
    lista.sort((a,b)=>b.clave.localeCompare(a.clave));
    lista.forEach(g=>g.eventos.sort(porMomento));
  }else{
    if(modo==='tipo')lista.sort((a,b)=>ORDEN_TIPOS_HIST.indexOf(a.clave)-ORDEN_TIPOS_HIST.indexOf(b.clave));
    else lista.sort((a,b)=>a.clave==='~generales'?1:b.clave==='~generales'?-1:a.titulo.localeCompare(b.titulo));
    lista.forEach(g=>g.eventos.sort((a,b)=>porMomento(b,a)));
  }
  return lista;
}

const HS={
  etiqueta:{fontSize:12,fontWeight:700,color:'var(--dim)',textTransform:'uppercase',letterSpacing:'.6px',margin:'14px 0 4px'},
  texto:{fontSize:14,lineHeight:1.5,color:'var(--text)',whiteSpace:'pre-wrap',wordBreak:'break-word'},
  renglon:{display:'flex',justifyContent:'space-between',alignItems:'flex-start',gap:8,padding:'8px 0',borderBottom:'1px solid var(--border)'},
  // El último de una lista va sin línea: debajo ya viene la del pie del registro y se veían dos.
  ultimo:(i,lista)=>i===lista.length-1?{borderBottom:'none'}:null,
  chip:(color,fondo)=>({display:'inline-flex',alignItems:'center',gap:4,padding:'2px 9px',borderRadius:999,background:fondo,color,fontSize:12,fontWeight:700,whiteSpace:'nowrap'}),
};
function Seccion({titulo,children}){
  return <div><div style={HS.etiqueta}>{titulo}</div>{children}</div>;
}
function Metricas({items}){
  const v=items.filter(Boolean);
  if(!v.length)return null;
  return <div style={{display:'grid',gridTemplateColumns:`repeat(${Math.min(v.length,4)},minmax(0,1fr))`,gap:6,marginTop:6}}>
    {v.map((it,i)=><div key={i} style={{background:'var(--bg)',borderRadius:8,padding:'8px 4px',textAlign:'center',minWidth:0}}>
      <div style={{fontSize:19,fontWeight:800,lineHeight:1.15,color:it.color||'var(--text)',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{it.valor}</div>
      <div style={{fontSize:12,color:'var(--dim)',marginTop:2}}>{it.label}</div>
      {it.sub&&<div style={{fontSize:11,color:'var(--dim)'}}>{it.sub}</div>}
    </div>)}
  </div>;
}
// Foto de evidencia: si todavía es la imagen embebida (no ha subido) se muestra; si ya es liga de
// Drive, no carga como <img> (es una página del visor), así que se ofrece como botón para abrirla.
function EvidenciaFoto({src,onVer,imprimir,etiqueta}){
  if(!src)return null;
  if(!String(src).startsWith('data:'))
    return <a href={src} target="_blank" rel="noopener noreferrer" style={{display:'inline-flex',alignItems:'center',gap:6,padding:'6px 10px',borderRadius:8,background:'var(--accent-light)',color:'var(--accent)',fontSize:13,fontWeight:700,textDecoration:'none'}}>📷 {etiqueta||'Ver evidencia'}</a>;
  return <img src={src} alt={etiqueta||'Evidencia'} onClick={imprimir?undefined:()=>onVer&&onVer(src)}
    style={{width:imprimir?150:96,height:imprimir?150:96,objectFit:'cover',borderRadius:8,cursor:imprimir?'default':'pointer',border:'1px solid var(--border)'}}/>;
}
function Transcripcion({texto,imprimir}){
  const[abierta,setAbierta]=useState(false);
  const t=String(texto||''),largo=t.length>240;
  return <Seccion titulo="🎙️ Transcripción de la grabación">
    <div style={{...HS.texto,fontStyle:'italic',background:'var(--bg)',borderRadius:8,padding:'8px 10px'}}>{imprimir||abierta||!largo?t:t.slice(0,240)+'…'}</div>
    {!imprimir&&largo&&<button onClick={()=>setAbierta(!abierta)} style={{background:'none',border:'none',color:'var(--accent)',fontWeight:700,fontSize:13,padding:'4px 0',cursor:'pointer'}}>{abierta?'Ver menos':'Ver completa'}</button>}
  </Seccion>;
}

// El detalle de un registro, ordenado para leerse rápido: números grandes arriba, listas con un
// renglón por persona y cada texto bajo su etiqueta. `resaltar` marca en amarillo el renglón de una
// persona (en pantalla, dentro del registro completo). `enfoque` muestra SOLO lo de esa persona: es
// lo que va al PDF de un expediente, para no imprimir los números de todo el equipo en el de uno.
function FichaRegistro({ev,resaltar,enfoque,onVerFoto,imprimir,conEncabezado,rolDe}){
  const r=ev.r,t=TIPOS_HIST[ev.tipo],n=v=>Number(v)||0;
  const marca=nombre=>resaltar&&nombre===resaltar?{background:'#fff7d6',borderRadius:6,paddingLeft:6,paddingRight:6,marginLeft:-6,marginRight:-6}:null;
  const texto=(titulo,valor)=>valor?<Seccion titulo={titulo}><div style={HS.texto}>{valor}</div></Seccion>:null;
  const encabezadoPersona=(nombre,extra)=><div style={{display:'flex',justifyContent:'space-between',alignItems:'center',gap:8,flexWrap:'wrap',marginTop:4}}>
    <span style={{fontSize:15,fontWeight:700}}>{nombre}</span>
    <span style={{display:'flex',gap:6,alignItems:'center',flexWrap:'wrap'}}>{extra}</span>
  </div>;
  let cuerpo=null;
  switch(ev.tipo){
    case'arranque':{
      const todos=r.ausentes||[];
      const aus=todos.filter(a=>!esFueraDeRuta(a.reason)&&(!enfoque||a.name===enfoque));
      const fuera=todos.filter(a=>esFueraDeRuta(a.reason)&&(!enfoque||a.name===enfoque));
      const nombresPres=(r.presentes||[]).filter(Boolean);
      const fotosVend=Object.entries(r.fotosVendedores||{}).filter(([nm,u])=>u&&(!enfoque||nm===enfoque));
      const renglonAusencia=(a,i,lista)=>{
        const[c,f]=colorGravedad(GRAVEDAD_AUSENCIA[a.reason]);
        return <div key={i} style={{...HS.renglon,...HS.ultimo(i,lista),...marca(a.name)}}>
          <div style={{minWidth:0}}>
            <div style={{fontSize:14,fontWeight:600}}>{a.name}</div>
            {a.detail&&<div style={{fontSize:13,color:'var(--dim)'}}>{a.detail}</div>}
            {a.photo&&<div style={{marginTop:6}}><EvidenciaFoto src={a.photo} onVer={onVerFoto} imprimir={imprimir} etiqueta="Evidencia"/></div>}
          </div>
          <span style={HS.chip(c,f)}>{a.reason||'Sin motivo'}</span>
        </div>;
      };
      const renglonFuera=(a,i,lista)=>{
        const c=a.compromiso||{},comp=n(c.cuentas)||n(c.ventas)||n(c.instalaciones);
        return <div key={i} style={{...HS.renglon,...HS.ultimo(i,lista),...marca(a.name)}}>
          <div style={{minWidth:0}}>
            <div style={{fontSize:14,fontWeight:600}}>{a.name}</div>
            {comp?<div style={{fontSize:13,color:'var(--dim)'}}>🎯 {n(c.cuentas)} cuentas · {n(c.ventas)} ventas · {n(c.instalaciones)} instalaciones</div>:null}
            {a.colonia&&<div style={{fontSize:13,color:'var(--dim)'}}>📍 {a.colonia}</div>}
            {a.detail&&<div style={{fontSize:13,color:'var(--dim)'}}>{a.detail}</div>}
          </div>
          <span style={HS.chip('var(--accent)','var(--accent-light)')}>{a.reason}</span>
        </div>;
      };
      cuerpo=enfoque
        ?<>
          {!aus.length&&!fuera.length&&<div style={{...HS.texto,marginTop:4}}>✅ Presente en el arranque</div>}
          {aus.length>0&&<Seccion titulo="Ausencia">{aus.map(renglonAusencia)}</Seccion>}
          {fuera.length>0&&<Seccion titulo="Fuera de ruta / actividad especial">{fuera.map(renglonFuera)}</Seccion>}
          {fotosVend.length>0&&<Seccion titulo="Foto de entrada">{fotosVend.map(([nm,u])=><EvidenciaFoto key={nm} src={u} onVer={onVerFoto} imprimir={imprimir} etiqueta="Foto de entrada"/>)}</Seccion>}
        </>
        :<>
          <Metricas items={[{label:'Presentes',valor:(r.presentes||[]).length},{label:'Ausencias',valor:aus.length,color:aus.length?'var(--red)':null},fuera.length?{label:'Fuera de ruta',valor:fuera.length}:null]}/>
          {aus.length>0&&<Seccion titulo={`Ausencias (${aus.length})`}>{aus.map(renglonAusencia)}</Seccion>}
          {fuera.length>0&&<Seccion titulo={`Fuera de ruta / actividad especial (${fuera.length})`}>{fuera.map(renglonFuera)}</Seccion>}
          {texto('Compromisos del día',r.compromisosTexto)}
          {nombresPres.length>0&&<Seccion titulo={`Presentes (${nombresPres.length})`}><div style={{fontSize:13,color:'var(--dim)',lineHeight:1.6}}>{nombresPres.map(nombreCorto).join(' · ')}</div></Seccion>}
          {texto('Notas',r.notas)}
          {(r.photo||r.photoSubida||fotosVend.length>0)&&<Seccion titulo="Evidencia">
            <div style={{display:'flex',flexWrap:'wrap',gap:6}}>
              <EvidenciaFoto src={r.photo} onVer={onVerFoto} imprimir={imprimir} etiqueta="Foto de grupo"/>
              <EvidenciaFoto src={r.photoSubida} onVer={onVerFoto} imprimir={imprimir} etiqueta="Foto subida"/>
              {fotosVend.map(([nm,u])=><EvidenciaFoto key={nm} src={u} onVer={onVerFoto} imprimir={imprimir} etiqueta={nombreCorto(nm)}/>)}
            </div>
          </Seccion>}
        </>;
      break;
    }
    case'cierre':{
      const filas=(r.resultados||[]).filter(conActividad);
      if(enfoque){
        const x=filas.find(f=>f.nombre===enfoque),s=(r.seguimiento||[]).find(f=>f.name===enfoque);
        cuerpo=<>
          {x?<Metricas items={[{label:'Oportunidades',valor:n(x.oportunidades)},{label:'Validadas',valor:n(x.validadas)},{label:'Instaladas',valor:n(x.instaladas),color:'var(--green)'},n(x.pagadasHoy)?{label:'Pagadas hoy',valor:n(x.pagadasHoy)}:null]}/>
            :<div style={{...HS.texto,marginTop:4,color:'var(--dim)'}}>Sin actividad reportada en este cierre.</div>}
          {texto('Pendiente',x&&x.pendiente)}
          {s&&texto('Seguimiento para mañana',s.motivo||'Marcado para seguimiento')}
        </>;
        break;
      }
      const tot=filas.reduce((a,x)=>({op:a.op+n(x.oportunidades),val:a.val+n(x.validadas),inst:a.inst+n(x.instaladas),pag:a.pag+n(x.pagadasHoy)}),{op:0,val:0,inst:0,pag:0});
      const cols={display:'grid',gridTemplateColumns:'minmax(0,1fr) repeat(3,40px)',alignItems:'baseline'};
      cuerpo=<>
        <Metricas items={[{label:'Oportunidades',valor:tot.op},{label:'Validadas',valor:tot.val},{label:'Instaladas',valor:tot.inst,color:'var(--green)'},tot.pag?{label:'Pagadas hoy',valor:tot.pag}:null]}/>
        {filas.length>0&&<Seccion titulo={`Resultados por vendedor (${filas.length})`}>
          <div style={{...cols,fontSize:12,color:'var(--dim)',fontWeight:700,paddingBottom:4,borderBottom:'1px solid var(--border)'}}>
            <span>Vendedor</span><span style={{textAlign:'right'}}>Op</span><span style={{textAlign:'right'}}>Val</span><span style={{textAlign:'right'}}>Inst</span>
          </div>
          {filas.map((x,i)=><div key={i} style={{padding:'6px 0',borderBottom:i<filas.length-1?'1px solid var(--border)':'none',...marca(x.nombre)}}>
            <div style={{...cols,fontSize:14}}>
              <span style={{overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',fontWeight:600}}>{nombreCorto(x.nombre)}</span>
              <span style={{textAlign:'right'}}>{n(x.oportunidades)}</span>
              <span style={{textAlign:'right'}}>{n(x.validadas)}</span>
              <span style={{textAlign:'right',fontWeight:700}}>{n(x.instaladas)}</span>
            </div>
            {(n(x.pagadasHoy)>0||x.pendiente)&&<div style={{fontSize:12,color:'var(--dim)',marginTop:2}}>
              {[n(x.pagadasHoy)>0?`💲 ${n(x.pagadasHoy)} pagada${n(x.pagadasHoy)!==1?'s':''} hoy`:'',x.pendiente?`Pendiente: ${x.pendiente}`:''].filter(Boolean).join(' · ')}
            </div>}
          </div>)}
        </Seccion>}
        {r.incidencias&&<Seccion titulo="Incidencias"><div style={{...HS.texto,background:'var(--ybg)',borderRadius:8,padding:'8px 10px'}}>{r.incidencias}</div></Seccion>}
        {r.seguimiento?.length>0&&<Seccion titulo="Seguimiento para mañana">{r.seguimiento.map((s,i,lista)=><div key={i} style={{...HS.renglon,...HS.ultimo(i,lista),...marca(s.name)}}>
          <span style={{fontSize:14,fontWeight:600}}>{s.name}</span>
          <span style={{fontSize:13,color:'var(--dim)',textAlign:'right'}}>{s.motivo}</span>
        </div>)}</Seccion>}
        {texto('Notas',r.notas)}
        {/* Cierres guardados antes de que el formulario fuera por vendedor */}
        {texto('Resultado',r.resultado)}
        {texto('Pendientes',r.pendientes)}
        {texto('Seguimiento',r.vendedores_seguimiento)}
      </>;
      break;
    }
    case'permiso':{
      const c=r.compromiso||{},comp=n(c.cuentas)||n(c.ventas)||n(c.instalaciones);
      cuerpo=<>
        {encabezadoPersona(r.vendedor,r.tipo&&<span style={HS.chip(t.color,t.fondo)}>{r.tipo}</span>)}
        {texto('Motivo',r.motivo)}
        {comp?<Seccion titulo="Compromiso del día"><Metricas items={[{label:'Cuentas',valor:n(c.cuentas)},{label:'Ventas',valor:n(c.ventas)},{label:'Instalaciones',valor:n(c.instalaciones)}]}/></Seccion>:null}
        {r.colonia&&<Seccion titulo="Dónde trabaja"><div style={HS.texto}>📍 {r.colonia}</div></Seccion>}
        {texto('Autorizó',r.autorizado_por)}
        {texto('Notas',r.notas)}
        {r.photo&&<Seccion titulo="Evidencia"><EvidenciaFoto src={r.photo} onVer={onVerFoto} imprimir={imprimir}/></Seccion>}
      </>;
      break;
    }
    case'feedback':{
      const fotos=[...(r.photo?[r.photo]:[]),...(r.fotos||[])];
      cuerpo=<>
        {encabezadoPersona(r.vendedor,<>
          {r.tipo&&<span style={HS.chip(t.color,t.fondo)}>{r.tipo}</span>}
          {STATUS[r.semaforo]&&<StatusBadge status={r.semaforo} small/>}
        </>)}
        {texto('Hallazgo',r.hallazgos)}
        {texto('Fortalezas',r.fortalezas)}
        {texto('Áreas de oportunidad',r.areas_oportunidad)}
        {texto('Compromisos',r.compromisos)}
        {r.fecha_revision&&<Seccion titulo="Fecha de revisión"><div style={HS.texto}>📅 {fechaLarga(r.fecha_revision)}</div></Seccion>}
        {texto('Notas',r.notas)}
        {r.transcript&&<Transcripcion texto={r.transcript} imprimir={imprimir}/>}
        {fotos.length>0&&<Seccion titulo="Evidencia"><div style={{display:'flex',flexWrap:'wrap',gap:6}}>
          {fotos.map((f,i)=><EvidenciaFoto key={i} src={f} onVer={onVerFoto} imprimir={imprimir} etiqueta={fotos.length>1?`Evidencia ${i+1}`:'Evidencia'}/>)}
        </div></Seccion>}
      </>;
      break;
    }
    case'semaforo':
      cuerpo=<>
        {encabezadoPersona(r.vendedor,STATUS[r.semaforo]&&<StatusBadge status={r.semaforo} small/>)}
        {texto('Nota',r.nota)}
      </>;
      break;
    case'plan':{
      const o=r.objetivos||{},m=r.metaOficial||{},zt=zonasATexto(r.zonas);
      const vsMeta=(k,label)=>({label,valor:n(o[k]),sub:m[k]!=null&&m[k]!==''?`meta ${n(m[k])}`:null,color:colorVsMeta(o[k],n(m[k]))});
      cuerpo=<>
        {r.semanaLabel&&<div style={{fontSize:15,fontWeight:700,marginTop:4}}>Semana {r.semanaLabel}</div>}
        {r.objetivos&&<Seccion titulo="Compromiso de la semana">
          <Metricas items={[vsMeta('oportunidades','Oportunidades'),vsMeta('ventas','Ventas'),vsMeta('instalaciones','Instalaciones'),{label:'NPPF',valor:n(o.cuentasRecuperadas)}]}/>
          {n(o.arpu)>0&&<div style={{fontSize:13,color:'var(--dim)',marginTop:6}}>ARPU objetivo: <b style={{color:'var(--text)'}}>{fmtMoney(o.arpu)}</b></div>}
        </Seccion>}
        {texto('Prioridades',r.prioridades)}
        {texto('Acompañamientos',r.vendedores_acompanar)}
        {zt&&<Seccion titulo="Zonas por día">{zt.split('\n').map((l,i)=><div key={i} style={{fontSize:14,padding:'3px 0'}}>• {l}</div>)}</Seccion>}
        {texto('Resultado esperado',r.resultado_esperado)}
        {texto('Notas',r.notas)}
        {texto('Objetivo',r.objetivo)}
      </>;
      break;
    }
    case'plan_resultado':{
      cuerpo=<>
        {r.semanaLabel&&<div style={{fontSize:15,fontWeight:700,marginTop:4}}>Semana {r.semanaLabel}</div>}
        {r.aDestiempo&&<div style={{marginTop:6}}><AvisoDestiempo/></div>}
        <Seccion titulo="Resultado vs compromiso">
          <TablaComparativo objetivos={r.objetivos} resultados={r.resultados}/>
        </Seccion>
      </>;
      break;
    }
    default:cuerpo=null;
  }
  const capt=capturadoDe(r),rol=rolDe?rolDe(ev.autor):'';
  return <div className={imprimir?'h-ficha-print':undefined}
    style={imprimir?{border:'1px solid #d8dbe4',borderLeft:`4px solid ${t.color}`,borderRadius:8,padding:'10px 12px 8px',marginBottom:10,background:'#fff'}:{paddingTop:4}}>
    {conEncabezado&&<div style={{display:'flex',justifyContent:'space-between',alignItems:'center',gap:8,flexWrap:'wrap'}}>
      <span style={HS.chip(t.color,t.fondo)}>{t.icon} {t.label}</span>
      <span style={{fontSize:13,color:'var(--dim)',fontWeight:600}}>{fechaLarga(ev.fecha)}{ev.hora?` · ${ev.hora}`:''}</span>
    </div>}
    {ev.pendiente&&<div style={{...HS.chip('var(--yellow)','var(--ybg)'),marginTop:6}}>⏳ Todavía no sube al Sheet</div>}
    {cuerpo}
    <div style={{display:'flex',flexWrap:'wrap',gap:'2px 14px',fontSize:12,color:'var(--dim)',marginTop:12,paddingTop:8,borderTop:'1px dashed var(--border)'}}>
      <span>Registró: <b style={{color:'var(--text)'}}>{ev.autor||'—'}</b>{rol?` · ${rol}`:''}</span>
      {capt&&<span>{ev.desdeSheet?'Recibido en el Sheet':'Capturado'}: {fmt(ymdLocal(capt))} {dos(capt.getHours())}:{dos(capt.getMinutes())}</span>}
      <span>Folio: {ev.id}</span>
    </div>
  </div>;
}

function EncabezadoGrupo({g,agrupar,onPersona}){
  const vendedor=agrupar==='vendedor'&&g.clave.startsWith('v:')?g.titulo:'';
  const coach=agrupar==='coach'&&g.clave.startsWith('c:')?g.titulo:'';
  const r=resumirEventos(g.eventos,vendedor);
  const partes=[];
  if(vendedor){
    if(r.ausencias)partes.push(`🚫 ${r.ausencias}`);
    if(r.fueraRuta)partes.push(`🧭 ${r.fueraRuta}`);
    if(r.porTipo.permiso)partes.push(`📋 ${r.porTipo.permiso}`);
    if(r.porTipo.feedback)partes.push(`💬 ${r.porTipo.feedback}`);
    if(r.cierre.dias)partes.push(`🌙 ${r.cierre.inst} inst`);
  }else ORDEN_TIPOS_HIST.forEach(tp=>{if(r.porTipo[tp])partes.push(`${TIPOS_HIST[tp].icon} ${r.porTipo[tp]}`);});
  const accion=vendedor?{txt:'Expediente ›',val:'sujeto:'+vendedor}:coach?{txt:'Actividad ›',val:'autor:'+coach}:null;
  return <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-end',gap:8,padding:'2px 4px 6px',borderBottom:'2px solid var(--border)',marginBottom:8}}>
    <div style={{minWidth:0}}>
      <div style={{fontSize:15,fontWeight:800}}>{g.titulo}</div>
      <div style={{fontSize:12,color:'var(--dim)'}}>{g.eventos.length} registro{g.eventos.length!==1?'s':''}{partes.length?' · '+partes.join('   '):''}</div>
    </div>
    {accion&&onPersona&&<button onClick={()=>onPersona(accion.val)} style={{background:'none',border:'none',color:'var(--accent)',fontWeight:700,fontSize:13,cursor:'pointer',whiteSpace:'nowrap',padding:'4px 0'}}>{accion.txt}</button>}
  </div>;
}

// Contadores del periodo. Cada cuadro, al tocarlo, filtra la lista a ese tipo (y al volver a
// tocarlo se quita el filtro). Con `vendedor` es el resumen de su expediente.
function ResumenHistorial({res,vendedor,tipoActivo,onTipo,imprimir}){
  const pt=tp=>res.porTipo[tp]||0;
  const c=(tipo,icon,valor,label,color)=>({tipo,icon,valor,label,color});
  const chips=(vendedor
    ?[c('arranque','🚫',res.ausencias,'Ausencias',res.ausencias?'var(--red)':null),
      res.fueraRuta?c('arranque','🧭',res.fueraRuta,'Fuera de ruta'):null,
      c('permiso','📋',pt('permiso'),'Permisos'),
      c('feedback','💬',pt('feedback'),'Hallazgos'),
      c('cierre','🌙',res.cierre.dias,'Cierres con actividad')]
    :[c('arranque','☀️',pt('arranque'),'Arranques'),
      c('cierre','🌙',pt('cierre'),'Cierres'),
      c('arranque','🚫',res.ausencias,'Ausencias',res.ausencias?'var(--red)':null),
      res.fueraRuta?c('arranque','🧭',res.fueraRuta,'Fuera de ruta'):null,
      c('permiso','📋',pt('permiso'),'Permisos'),
      c('feedback','💬',pt('feedback'),'Hallazgos'),
      pt('semaforo')?c('semaforo','🚦',pt('semaforo'),'Semáforos'):null,
      pt('plan')?c('plan','📊',pt('plan'),'Planes'):null,
      pt('plan_resultado')?c('plan_resultado','🏁',pt('plan_resultado'),'Resultados de plan'):null]
  ).filter(Boolean);
  const motivos=Object.entries(res.motivos).sort((a,b)=>b[1]-a[1]);
  const colores=['rojo','amarillo','verde'].filter(k=>res.colores[k]);
  const interactivo=!imprimir&&!!onTipo;
  const extras=motivos.length>0||colores.length>0||(vendedor&&res.cierre.dias>0)||(vendedor&&res.semaforo)||(!imprimir&&res.pendientes>0);
  return <div>
    <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(100px,1fr))',gap:6}}>
      {chips.map((ch,i)=>{
        const activo=interactivo&&tipoActivo===ch.tipo;
        // En columna y separados: si una etiqueta baja a dos líneas, los números siguen alineados abajo.
        const estilo={display:'flex',flexDirection:'column',justifyContent:'space-between',gap:2,textAlign:'left',padding:'8px 10px',borderRadius:10,border:`1.5px solid ${activo?'var(--accent)':'var(--border)'}`,background:activo?'var(--accent-light)':'var(--bg)',color:'var(--text)',minWidth:0,cursor:interactivo?'pointer':'default'};
        const contenido=<>
          <div style={{fontSize:12,color:'var(--dim)',lineHeight:1.25}}>{ch.icon} {ch.label}</div>
          <div style={{fontSize:22,fontWeight:800,lineHeight:1.15,color:ch.color||'var(--text)'}}>{ch.valor}</div>
        </>;
        return interactivo
          ?<button key={i} onClick={()=>onTipo(ch.tipo)} style={estilo}>{contenido}</button>
          :<div key={i} style={estilo}>{contenido}</div>;
      })}
    </div>
    {extras&&<div style={{marginTop:10,display:'flex',flexDirection:'column',gap:4,fontSize:13,color:'var(--dim)',lineHeight:1.45}}>
      {motivos.length>0&&<div><b style={{color:'var(--text)'}}>Ausencias por motivo:</b> {motivos.map(([m,k])=>`${m} ${k}`).join(' · ')}</div>}
      {colores.length>0&&<div><b style={{color:'var(--text)'}}>Hallazgos por semáforo:</b> {colores.map(k=>`${SEM_EMOJI[k]} ${res.colores[k]}`).join('   ')}</div>}
      {vendedor&&res.cierre.dias>0&&<div><b style={{color:'var(--text)'}}>Resultados en cierres:</b> {res.cierre.op} op · {res.cierre.val} val · {res.cierre.inst} inst</div>}
      {vendedor&&res.semaforo&&<div><b style={{color:'var(--text)'}}>Último semáforo del periodo:</b> {SEM_EMOJI[res.semaforo.valor]} {STATUS[res.semaforo.valor].label} ({fmt(res.semaforo.fecha)})</div>}
      {!imprimir&&res.pendientes>0&&<div style={{color:'var(--yellow)',fontWeight:600}}>⏳ {res.pendientes} registro{res.pendientes!==1?'s':''} de este teléfono todavía no sube{res.pendientes!==1?'n':''} al Sheet</div>}
    </div>}
  </div>;
}

// Informe para Recursos Humanos o auditoría: lo mismo que se ve en pantalla con los filtros puestos,
// pero con todo abierto y en formato de documento. Se imprime con el diálogo del navegador, que en
// el celular y en la compu ofrece "Guardar como PDF". Se monta directo en <body> (portal) para que
// la regla de impresión pueda ocultar la app completa y dejar solo el documento — si viviera dentro
// de la app, la impresión saldría con páginas en blanco del resto de la pantalla.
function InformeImprimible({nombreArchivo,alcance,periodo,filtros,generadoPor,res,vendedor,grupos,rolDe,avisos,onCerrar}){
  useEffect(()=>{
    // Chrome sugiere el título de la página como nombre del PDF.
    const previo=document.title;
    document.title=nombreArchivo;
    document.body.classList.add('con-informe');
    return()=>{document.title=previo;document.body.classList.remove('con-informe');};
  },[nombreArchivo]);
  const ahora=new Date();
  const h2={fontSize:16,fontWeight:800,color:'#1e3a8a',margin:'22px 0 10px',paddingBottom:4,borderBottom:'2px solid #dbeafe'};
  const botonBarra={padding:'8px 14px',borderRadius:8,border:'none',fontSize:14,fontWeight:700,cursor:'pointer',whiteSpace:'nowrap'};
  return ReactDOM.createPortal(
    <div className="informe-print-root" style={{position:'fixed',inset:0,zIndex:10000,overflow:'auto',background:'#525659'}}>
      <div className="no-print" style={{position:'sticky',top:0,zIndex:1,display:'flex',gap:8,justifyContent:'space-between',alignItems:'center',padding:'10px 12px',background:'#323639'}}>
        <button onClick={onCerrar} style={{...botonBarra,background:'rgba(255,255,255,.15)',color:'#fff'}}>← Volver</button>
        <button onClick={()=>window.print()} style={{...botonBarra,background:'#fff',color:'#1e40af'}}>🖨️ Imprimir / Guardar PDF</button>
      </div>
      <div className="informe-hoja" style={{maxWidth:820,margin:'16px auto 40px',background:'#fff',color:'#1a1d29',padding:'28px 24px',borderRadius:4,boxShadow:'0 2px 14px rgba(0,0,0,.35)'}}>
        <div style={{borderBottom:'3px solid #1e40af',paddingBottom:12}}>
          <div style={{fontSize:12,fontWeight:800,letterSpacing:'1.5px',color:'#1e40af'}}>SUPERVISIÓN 2.0 · INFORME DE REGISTROS</div>
          <h1 style={{fontSize:22,lineHeight:1.25,margin:'6px 0 2px'}}>{alcance}</h1>
          <div style={{fontSize:15,fontWeight:700}}>{periodo}</div>
          <div style={{fontSize:12,color:'#6b7086',marginTop:8,lineHeight:1.55}}>
            {filtros}<br/>
            Generado por {generadoPor} el {fmt(ymdLocal(ahora))} a las {dos(ahora.getHours())}:{dos(ahora.getMinutes())} · {res.total} registro{res.total!==1?'s':''}
          </div>
        </div>
        <h2 style={h2}>Resumen</h2>
        <ResumenHistorial res={res} vendedor={vendedor} imprimir/>
        {/* Con la clase del grupo: el título se va a la hoja siguiente junto con el primer registro,
            en vez de quedarse solo al pie de la hoja del resumen. */}
        <h2 className="h-grupo-print" style={h2}>Detalle</h2>
        {grupos.length===0&&<p style={{fontSize:14,color:'#6b7086'}}>No hay registros para este periodo con los filtros elegidos.</p>}
        {grupos.map(g=><div key={g.clave}>
          <div className="h-grupo-print" style={{fontSize:14,fontWeight:800,margin:'16px 0 8px',color:'#1a1d29'}}>
            {g.titulo} <span style={{fontWeight:400,color:'#6b7086'}}>· {g.eventos.length} registro{g.eventos.length!==1?'s':''}</span>
          </div>
          {g.eventos.map(ev=>{
            const enfoque=ev._vendedor||vendedor;
            return <FichaRegistro key={g.clave+'|'+ev.id} ev={ev} enfoque={enfoque} rolDe={rolDe} imprimir conEncabezado/>;
          })}
        </div>)}
        {/* Avisos y firmas van juntos y sin partirse: sueltas, las firmas llegaban a quedar solas en
            la última hoja. */}
        <div className="h-firmas">
          <div style={{fontSize:12,color:'#6b7086',marginTop:18,borderTop:'1px solid #e2e4ec',paddingTop:10,lineHeight:1.55}}>
            {avisos.map((a,i)=><p key={i} style={{margin:'2px 0'}}>{a}</p>)}
          </div>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:48,marginTop:40}}>
            {['Elaboró','Revisó'].map(x=><div key={x} style={{textAlign:'center',fontSize:12,color:'#6b7086'}}>
              <div style={{borderTop:'1px solid #1a1d29',paddingTop:6}}>{x}</div>
            </div>)}
          </div>
        </div>
      </div>
    </div>,
    document.body);
}

function HistorialTab({data,session}){
  const[periodo,setPeriodo]=useState('semana');
  const[offset,setOffset]=useState(0);
  const[rango,setRango]=useState({desde:'',hasta:''});
  const[tipo,setTipo]=useState('todos');
  const[persona,setPersona]=useState('');
  const[agrupar,setAgrupar]=useState('dia');
  const[abiertos,setAbiertos]=useState(()=>new Set());
  const[verFoto,setVerFoto]=useState(null);
  const[informe,setInforme]=useState(false);
  const[recarga,setRecarga]=useState(0);
  const[sheet,setSheet]=useState({estado:'cargando',registros:[],actualizado:null});

  const user=session?.user||{};
  const nombresCoach=new Set((session?.coaches||[]).map(c=>c.nombre));
  const nombresLider=new Set((session?.lideres||[]).map(c=>c.nombre));
  const tieneEquipoDeCoaches=nombresCoach.size>0;
  const ROL_LABEL={coach:'Coach',lider:'Líder',director:'Director',gestor:'Gestor CH'};
  const rolDe=nombre=>!nombre?'':nombre===user.nombre?(ROL_LABEL[session?.role]||''):nombresLider.has(nombre)?'Líder':nombresCoach.has(nombre)?'Coach':'';

  // Las 7 hojas se leen una vez al abrir (y con 🔄). Mientras llegan, ya se ve lo del teléfono.
  useEffect(()=>{
    let vivo=true;
    setSheet(s=>({...s,estado:'cargando'}));
    Promise.all(Object.entries(HOJA_POR_TIPO).map(([tp,hoja])=>fetchHistorialHoja(hoja,session?.token,session?.verComo).then(res=>({tp,res}))))
      .then(lista=>{
        if(!vivo)return;
        const registros=[];let fallas=0;
        lista.forEach(({tp,res})=>{
          if(!res.ok){fallas++;return;}
          res.registros.forEach(f=>{const r=recordDesdeFila(tp,f);if(r)registros.push(r);});
        });
        setSheet({estado:fallas===lista.length?'error':fallas?'parcial':'listo',registros,actualizado:new Date()});
      });
    return()=>{vivo=false;};
  },[session?.token,session?.verComo,recarga]);

  // Lo del Sheet y lo del teléfono, sin repetir: el mismo registro trae el mismo ID en los dos lados.
  // Si está en ambos gana el del teléfono, que es más completo (el Sheet guarda cuántos presentes
  // hubo, no quiénes). Del teléfono solo entra lo de esta persona y su gente, por si el celular lo
  // usó antes alguien más.
  const eventos=useMemo(()=>{
    let pendientes=new Set();
    try{pendientes=new Set(JSON.parse(localStorage.getItem('sv2-pending')||'[]').map(p=>p.id));}catch(e){}
    const permitidos=new Set([user.nombre,...nombresCoach,...nombresLider].filter(Boolean));
    const porId=new Map();
    sheet.registros.forEach(r=>porId.set(r.id,r));
    (data.records||[]).filter(r=>!r.registradoPor||permitidos.has(r.registradoPor)).forEach(r=>porId.set(r.id,r));
    return[...porId.values()].map(r=>normalizarEvento(r,pendientes)).filter(Boolean);
  },[data.records,sheet.registros]);

  const opcionesPersona=useMemo(()=>{
    const autores=new Set([user.nombre,...nombresCoach,...nombresLider,...eventos.map(e=>e.autor)].filter(Boolean));
    const vendedores=new Set([...(session?.team||[]).filter(m=>isVendedor(m.posicion)).map(m=>m.nombre),...eventos.flatMap(e=>e.sujetos.map(s=>s.nombre))].filter(Boolean));
    return[
      ...[...autores].sort().map(nm=>({value:'autor:'+nm,label:`${nm} · ${nm===user.nombre?'Tú':rolDe(nm)||'Captura'} — actividad`})),
      ...[...vendedores].sort().map(nm=>({value:'sujeto:'+nm,label:`${nm} · ${rolDe(nm)||'Vendedor'} — expediente`})),
    ];
  },[eventos]);

  const per=rangoPeriodo(periodo,offset,rango,new Date());
  const sep=persona.indexOf(':');
  const modoPersona=persona?persona.slice(0,sep):'',nombrePersona=persona?persona.slice(sep+1):'';
  const vendedorFoco=modoPersona==='sujeto'?nombrePersona:'';
  // El resumen se saca sin el filtro de tipo, para que sus cuadros sigan diciendo cuántos hay de
  // cada cosa mientras la lista muestra solo el tipo elegido.
  const base=eventos
    .filter(e=>e.fecha>=per.desde&&e.fecha<=per.hasta)
    .filter(e=>!persona||(modoPersona==='autor'?e.autor===nombrePersona:e.sujetos.some(s=>s.nombre===nombrePersona)));
  const lista=tipo==='todos'?base:base.filter(e=>e.tipo===tipo);
  const res=resumirEventos(base,vendedorFoco);
  const grupos=agruparEventos(lista,agrupar,vendedorFoco);

  const alcance=modoPersona==='sujeto'?`Expediente de ${nombrePersona}`
    :modoPersona==='autor'?`Actividad de ${nombrePersona}`
    :session?.role==='director'?`Distrito de ${user.nombre||''}`
    :session?.role==='gestor'?'Coaches y vendedores (Capital Humano)'
    :`Equipo de ${user.nombre||''}`;
  const etiquetaAgrupar={dia:'Día',vendedor:'Vendedor',coach:'Coach',tipo:'Tipo'};
  const opcionesAgrupar=['dia','vendedor',tieneEquipoDeCoaches?'coach':null,'tipo'].filter(Boolean);
  const irAPersona=val=>{setPersona(val);setAgrupar('dia');setAbiertos(new Set());};
  const toggle=k=>setAbiertos(prev=>{const s=new Set(prev);s.has(k)?s.delete(k):s.add(k);return s;});

  const estadoFuente=sheet.estado==='cargando'?'Actualizando desde el Sheet…'
    :sheet.estado==='error'?'⚠️ Sin conexión con el Sheet: solo se ven los registros guardados en este teléfono.'
    :sheet.estado==='parcial'?'⚠️ Algunas secciones no cargaron del Sheet: la información puede estar incompleta.'
    :`Actualizado a las ${dos(sheet.actualizado.getHours())}:${dos(sheet.actualizado.getMinutes())} · incluye lo de todo el equipo`;
  const avisosInforme=[
    'Fuente: registros de Supervisión 2.0 guardados en el Sheet del distrito. Cada registro lleva su folio para ubicarlo en la hoja.',
    res.pendientes>0?`${res.pendientes} registro${res.pendientes!==1?'s':''} marcado${res.pendientes!==1?'s':''} como pendiente todavía no llega${res.pendientes!==1?'n':''} al Sheet: se tomaron de este dispositivo.`:'',
    sheet.estado==='error'?'ATENCIÓN: al generar este informe no hubo conexión con el Sheet. Incluye solo lo guardado en este dispositivo y puede estar incompleto.':'',
    sheet.estado==='parcial'?'ATENCIÓN: algunas secciones no se pudieron leer del Sheet al generar este informe; puede estar incompleto.':'',
  ].filter(Boolean);
  const filtrosTexto=`Periodo: ${per.desde===per.hasta?fmt(per.desde):`${fmt(per.desde)} al ${fmt(per.hasta)}`} · Tipo: ${tipo==='todos'?'Todos':TIPOS_HIST[tipo].label} · Agrupado por: ${etiquetaAgrupar[agrupar]}`;

  const chipBtn=activo=>({padding:'7px 13px',borderRadius:999,border:`1.5px solid ${activo?'var(--accent)':'var(--border)'}`,background:activo?'var(--accent)':'var(--card)',color:activo?'#fff':'var(--text)',fontSize:13,fontWeight:700,cursor:'pointer',whiteSpace:'nowrap'});

const escapeHtml=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
// Mismos iconos y colores que el Historial, para que el respaldo descargable se vea igual.
const REPORTE_TIPOS=TIPOS_HIST;
function reporteDetalleHTML(r){
  switch(r.type){
    case'arranque':
      return `<p><b>Presentes:</b> ${(r.presentes||[]).length} · <b>Ausentes:</b> ${(r.ausentes||[]).length}</p>`+
        (r.ausentes||[]).map(a=>`<p style="color:#dc2626;margin:2px 0">✗ ${escapeHtml(a.name)}: ${escapeHtml(a.reason)}${a.detail?' — '+escapeHtml(a.detail):''}</p>`).join('')+
        (r.notas?`<p>${escapeHtml(r.notas)}</p>`:'');
    case'permiso':
      return `<p><b>${escapeHtml(r.vendedor)}</b> — ${escapeHtml(r.tipo)}</p><p>${escapeHtml(r.motivo)}</p>`+(r.autorizado_por?`<p>Autorizado: ${escapeHtml(r.autorizado_por)}</p>`:'');
    case'cierre':
      return (r.resultados||[]).filter(x=>x.oportunidades||x.validadas||x.instaladas||x.pagadasHoy||x.pendiente)
        .map(x=>`<p style="margin:2px 0"><b>${escapeHtml(x.nombre)}:</b> ${x.oportunidades||0} op · ${x.validadas||0} val · ${x.instaladas||0} inst${x.pagadasHoy?` · ${x.pagadasHoy} pagada(s)`:''}${x.pendiente?`<br><span style="color:#6b7086">Pendiente: ${escapeHtml(x.pendiente)}</span>`:''}</p>`).join('')+
        (r.incidencias?`<p><b>Incidencias:</b> ${escapeHtml(r.incidencias)}</p>`:'')+
        ((r.seguimiento||[]).length?'<p><b>Seguimiento mañana:</b></p>'+r.seguimiento.map(s=>`<p style="margin:2px 0">• ${escapeHtml(s.name)}${s.motivo?': '+escapeHtml(s.motivo):''}</p>`).join(''):'');
    case'plan':{
      const o=r.objetivos||{},m=r.metaOficial||{};
      const zt=zonasATexto(r.zonas);
      return `<p>🎯 Oport: ${o.oportunidades||0} (meta ${m.oportunidades??'-'}) · Ventas: ${o.ventas||0} (meta ${m.ventas??'-'}) · Instal: ${o.instalaciones||0} (meta ${m.instalaciones??'-'})</p>`+
        `<p>NPPF: ${o.cuentasRecuperadas||0} · ARPU: ${escapeHtml(fmtMoney(o.arpu))}</p>`+
        (r.prioridades?`<p><b>Prioridades:</b> ${escapeHtml(r.prioridades)}</p>`:'')+
        (r.vendedores_acompanar?`<p><b>Acompañamientos:</b> ${escapeHtml(r.vendedores_acompanar)}</p>`:'')+
        (zt?`<p><b>Zonas:</b><br>${escapeHtml(zt).replace(/\n/g,'<br>')}</p>`:'')+
        (r.resultado_esperado?`<p><b>Resultado esperado:</b> ${escapeHtml(r.resultado_esperado)}</p>`:'');
    }
    case'plan_resultado':{
      const fmtV=(x,v)=>escapeHtml(x.dinero?fmtMoney(v):String(v));
      return (r.aDestiempo?'<p style="color:#dc2626;font-weight:700">⚠️ Capturado a destiempo: debía quedar el lunes y se llenó el martes.</p>':'')+
        comparativoResultado(r.objetivos,r.resultados).map(x=>`<p style="margin:2px 0">${escapeHtml(x.label)}: ${fmtV(x,x.real)} / compromiso ${fmtV(x,x.obj)}${x.pct!=null?` <b>${x.pct}%</b>`:''}</p>`).join('');
    }
    case'feedback':
      return `<p><b>${escapeHtml(r.vendedor)}</b> — ${escapeHtml(r.tipo)}${r.semaforo?` (${escapeHtml(STATUS[r.semaforo]?.label||'')})`:''}</p>`+
        (r.hallazgos?`<p>${escapeHtml(r.hallazgos)}</p>`:'')+(r.compromisos?`<p><b>Compromisos:</b> ${escapeHtml(r.compromisos)}</p>`:'');
    default:
      return'';
  }
}
function reporteRecordHTML(r){
  const t=REPORTE_TIPOS[r.type]||{icon:'•',label:r.type,color:'#6b7086'};
  return `<div style="border-left:4px solid ${t.color};background:#fff;border-radius:10px;padding:14px 16px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.06)">

      <span style="font-weight:700;font-size:13px">${t.icon} ${t.label}</span>

    <div style="font-size:13px;color:#1a1d29;line-height:1.5">${reporteDetalleHTML(r)||'<span style="color:#6b7086">Sin detalle</span>'}</div>

  </div>`;
}
// Reporte HTML autocontenido (imprimible / compartible) para reemplazar el respaldo en JSON crudo.
function generarReporteHTML(data,user,rolLabel){
  const recs=[...data.records].sort((a,b)=>b.savedAt.localeCompare(a.savedAt));
  const porFecha={};
  recs.forEach(r=>{(porFecha[r.date]=porFecha[r.date]||[]).push(r);});
  const fechas=Object.keys(porFecha).sort((a,b)=>b.localeCompare(a));
  const cuerpo=fechas.map(f=>`
    <h2 style="font-size:15px;color:#1e40af;border-bottom:2px solid #dbeafe;padding-bottom:6px;margin:24px 0 10px">${escapeHtml(fmt(f))}</h2>
    ${porFecha[f].map(reporteRecordHTML).join('')}
  `).join('');
  return `<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><title>Reporte Supervisión — ${escapeHtml(user.nombre)}</title>
<style>
body{font-family:system-ui,-apple-system,sans-serif;background:#f0f2f8;color:#1a1d29;margin:0;padding:20px}
.header{background:linear-gradient(135deg,#1e3a8a,#1e40af);color:#fff;padding:20px;border-radius:12px;margin-bottom:20px}
.header h1{margin:0;font-size:20px}
.header p{margin:4px 0 0;font-size:13px;opacity:.9}
p{margin:4px 0}
@media print{body{background:#fff}.header{background:#1e40af!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}}
</style></head><body>
<div class="header"><h1>📋 Reporte de Supervisión</h1><p>${escapeHtml(user.nombre)}${rolLabel?' · '+escapeHtml(rolLabel):''}</p><p>Generado el ${escapeHtml(fmt(today()))} · ${recs.length} registro${recs.length!==1?'s':''}</p></div>
${cuerpo||'<p style="text-align:center;color:#6b7086;padding:40px">Sin registros.</p>'}
</body></html>`;
}

// Hoja para elegir a quién entrar (para el director, sus líderes en el primer nivel y los coaches
