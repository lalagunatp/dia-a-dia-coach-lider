function PlanTab({data,setData,team,toast,session,refreshKey}){
  const esLider=session.role==='lider';
  // Coach Promovendedor Punto de Venta: "Zonas a trabajar" se reemplaza por "Puntos de Venta a
  // trabajar" (catálogo hoja PDV) en vez de cluster/colonia.
  const esCoachPDV=(session.user.posicion||'').toUpperCase().includes('PROMOVENDEDOR');
  const vendedoresPlan=(team||[]).filter(m=>isVendedor(m.posicion));
  // Meta oficial del equipo: instalaciones = suma de meta semanal por ranking (más 3 por vacante);
  // ventas/validaciones 15% mayor que instalaciones; oportunidades 15% mayor que ventas/validaciones.
  const coachesDelPlan=session.role==='coach'?[session.user.nombre]:(session.coaches||[]).map(c=>c.nombre);
  const vacantesPlan=vacantesDe(session,coachesDelPlan);
  const metaOficial=metaOficialDe(vendedoresPlan,vacantesPlan);
  const metaInstalOficial=metaOficial.instalaciones;
  const metaVentasOficial=metaOficial.ventas;
  const metaOportOficial=metaOficial.oportunidades;
  // Vendedores sin ranking en la hoja (o con uno que no se reconoce): cuentan 3 como en el Reporte
  // de seguimiento, pero se avisa para que lo carguen — su meta real puede ser mayor.
  const sinMetaRanking=vendedoresPlan.filter(m=>!tieneRanking(m.badge)).map(m=>m.nombre);
  const[verMeta,setVerMeta]=useState(false);
  const KPIS=[
    {k:'oportunidades',label:'Oportunidades',meta:metaOportOficial},
    {k:'ventas',label:'Ventas (validaciones)',meta:metaVentasOficial},
    {k:'instalaciones',label:'Instalaciones',meta:metaInstalOficial},
  ];

  const nowDate=new Date();
  const semanaIni=startOfWeek(nowDate),semanaFin=endOfWeek(nowDate);
  const semanaIniStr=ymdLocal(semanaIni),semanaFinStr=ymdLocal(semanaFin);
  const semanaLabel=`${fmtDateObj(semanaIni)} al ${fmtDateObj(semanaFin)}`;
  const hoyStr=ymdLocal(nowDate);
  const esLunes=nowDate.getDay()===1;

  // De esta semana puede haber más de un plan si se editó (ver masReciente): manda el último.
  const planActual=masReciente(data.records.filter(r=>r.type==='plan'&&r.semanaInicio===semanaIniStr),'savedAt');
  const retraso=!planActual&&hoyStr>semanaIniStr;
  const puedeEditarPlan=!session.soloLectura&&sePuedeEditarPlan(planActual,nowDate);

  // Resultado real de la semana anterior: se captura el lunes, o el martes a destiempo (ver
  // ventanaResultadoPlan). Se mira la semana completa y no un registro: si esa semana se editó, hay
  // varios planes y el resultado quedó colgado solo del que estaba vigente al capturarlo.
  const planesConResultado=new Set(data.records.filter(r=>r.type==='plan_resultado').map(r=>r.planId));
  const semanaAntIni=new Date(semanaIni);semanaAntIni.setDate(semanaAntIni.getDate()-7);
  const planesSemanaAnt=data.records.filter(r=>r.type==='plan'&&r.semanaInicio===ymdLocal(semanaAntIni));
  const semanaAntSinResultado=planesSemanaAnt.length>0&&!planesSemanaAnt.some(p=>planesConResultado.has(p.id));
  const ventanaResultado=ventanaResultadoPlan(nowDate);
  const planPendiente=ventanaResultado&&semanaAntSinResultado?masReciente(planesSemanaAnt,'savedAt'):null;
  // Miércoles a domingo sin haberlo capturado: ya no se puede, pero se dice en vez de desaparecer.
  const resultadoVencido=!ventanaResultado&&semanaAntSinResultado?masReciente(planesSemanaAnt,'savedAt'):null;

  const[zonasData,setZonasData]=useState({clusterToColonias:{},coloniaToCluster:{},clusters:[]});
  useEffect(()=>{if(!esCoachPDV)fetchClustersColonias(session.token).then(list=>setZonasData(buildClusterMap(list)));},[esCoachPDV]);
  const[puntosVenta,setPuntosVenta]=useState([]);
  useEffect(()=>{if(esCoachPDV)fetchPDV(session.token).then(setPuntosVenta);},[esCoachPDV]);

  // Líder: estado del plan de esta semana de cada uno de sus coaches (leído del Sheet, no del
  // dispositivo local — cada coach lo captura en su propio teléfono).
  const[planesEquipo,setPlanesEquipo]=useState([]);
  const[cargandoPlanesEquipo,setCargandoPlanesEquipo]=useState(false);
  useEffect(()=>{
    if(!esLider)return;
    setCargandoPlanesEquipo(true);
    fetchHistorialEquipo('PLAN',session.token,session.verComo).then(regs=>{setPlanesEquipo(regs);setCargandoPlanesEquipo(false);});
  },[esLider,refreshKey]);
  // Datos completos (no solo % de completitud) del plan de cada coach — alimenta la tarjeta de
  // estatus, el Objetivo/Prioridades/Acompañamientos agregados, y lo que se guarda al final.
  const coachesPlanDatos=esLider?(session.coaches||[]).map(c=>{
    // Si ese coach corrigió su plan, en la hoja quedaron varias filas de la misma semana: manda la
    // del Timestamp más alto, que es la que él ve como vigente en su propio teléfono.
    const row=masReciente(planesEquipo.filter(r=>r['Registrado por']===c.nombre&&r['Semana inicio']===semanaIniStr),'Timestamp');
    // Meta oficial de ESE coach: la misma cuenta que hace él en su propio Plan, pero con sus
    // vendedores (los que le reportan) — así el líder ve contra qué se está comparando cada quien
    // en vez de solo el total del equipo. Sale del ranking vigente de cada vendedor, así que se
    // mueve sola cuando el ranking cambia en la hoja.
    const metaCoach=metaOficialDe(vendedoresPlan.filter(m=>m.reportaA===c.nombre),vacantesDe(session,[c.nombre]));
    if(!row)return{coach:c,row:null,estado:'sin',pct:0,meta:metaCoach,objetivos:{oportunidades:0,ventas:0,instalaciones:0,cuentasRecuperadas:0,arpu:0},prioridades:'',acompanamientos:''};
    const pct=completitudPlanFila(row);
    return{
      coach:c,row,estado:pct>=100?'completo':'parcial',pct,meta:metaCoach,
      objetivos:{
        oportunidades:Number(row['Obj. Oportunidades'])||0,
        ventas:Number(row['Obj. Ventas'])||0,
        instalaciones:Number(row['Obj. Instalaciones'])||0,
        cuentasRecuperadas:Number(row['Obj. Cuentas recuperadas NPPF'])||0,
        arpu:Number(row['Obj. ARPU'])||0,
      },
      prioridades:String(row['Prioridades']||'').trim(),
      acompanamientos:String(row['Acompañamientos']||'').trim(),
    };
  }):[];
  const coachesPlanEstado=coachesPlanDatos; // alias: la tarjeta de estatus usa {coach,estado,pct}
  // Totales agregados del equipo — se guardan en el plan del líder al final de la semana.
  const objetivosEquipo={
    oportunidades:coachesPlanDatos.reduce((s,c)=>s+c.objetivos.oportunidades,0),
    ventas:coachesPlanDatos.reduce((s,c)=>s+c.objetivos.ventas,0),
    instalaciones:coachesPlanDatos.reduce((s,c)=>s+c.objetivos.instalaciones,0),
    cuentasRecuperadas:coachesPlanDatos.reduce((s,c)=>s+c.objetivos.cuentasRecuperadas,0),
    arpu:(()=>{const conArpu=coachesPlanDatos.filter(c=>c.objetivos.arpu>0);return conArpu.length?Math.round(conArpu.reduce((s,c)=>s+c.objetivos.arpu,0)/conArpu.length*100)/100:0;})(),
  };
  const prioridadesEquipoTexto=coachesPlanDatos.map(c=>`${c.coach.nombre.split(' ').slice(0,3).join(' ')}: ${c.prioridades||'(sin capturar)'}`).join('\n');
  const acompanamientosEquipoTexto=coachesPlanDatos.map(c=>`${c.coach.nombre.split(' ').slice(0,3).join(' ')}: ${c.acompanamientos||'(sin capturar)'}`).join('\n');

  const emptyZonas=()=>Object.fromEntries(DIAS_SEMANA.map(d=>[d,{entradas:[],direccion:'',comentarios:'',descansos:[]}]));
  const formVacio=()=>({objetivos:{oportunidades:'',ventas:'',instalaciones:'',cuentasRecuperadas:'',arpu:''},prioridades:'',vendedores_acompanar:'',zonas:emptyZonas(),resultado_esperado:'',notas:''});
  const[form,setForm]=useState(formVacio());
  const updObjetivo=(k,v)=>setForm(f=>({...f,objetivos:{...f.objetivos,[k]:v}}));

  // Descansos de la semana que se está capturando (coach de punto de venta): nombre → días en los
  // que ya quedó marcado, para avisar en cada tarjeta y listar arriba a quién todavía no se le
  // asigna ninguno. Se recalcula del formulario, así que se mueve conforme se va marcando.
  const descansosSemana={};
  DIAS_SEMANA.forEach(d=>{
    diaZonas(form.zonas,d).descansos.forEach(nombre=>{
      (descansosSemana[nombre]=descansosSemana[nombre]||[]).push(DIAS_SEMANA_LABEL[d]);
    });
  });
  const sinDescansoSemana=vendedoresPlan.filter(m=>!descansosSemana[m.nombre]).map(m=>m.nombre);

  // ── Editar el plan ya guardado (solo lunes y martes de su semana) ──
  // Se vuelve a abrir el mismo formulario de captura con lo que ya se había guardado dentro, para
  // corregir sobre eso en vez de volver a escribirlo todo.
  const[editandoPlan,setEditandoPlan]=useState(false);
  const abrirEdicionPlan=()=>{
    if(!planActual)return;
    setForm({
      objetivos:{
        oportunidades:planActual.objetivos?.oportunidades??'',
        ventas:planActual.objetivos?.ventas??'',
        instalaciones:planActual.objetivos?.instalaciones??'',
        cuentasRecuperadas:planActual.objetivos?.cuentasRecuperadas??'',
        arpu:planActual.objetivos?.arpu??'',
      },
      prioridades:planActual.prioridades||'',
      vendedores_acompanar:planActual.vendedores_acompanar||'',
      zonas:Object.fromEntries(DIAS_SEMANA.map(d=>[d,diaZonas(planActual.zonas,d)])),
      resultado_esperado:planActual.resultado_esperado||'',
      notas:planActual.notas||'',
    });
    setEditandoPlan(true);
    window.scrollTo({top:0,behavior:'smooth'});
  };
  const cancelarEdicionPlan=()=>{setEditandoPlan(false);setForm(formVacio());};

  const guardarPlan=async()=>{
    if(session.soloLectura)return; // vista prestada: solo consulta
    // Al editar se guarda un registro NUEVO en vez de pisar el anterior: así queda el rastro de lo
    // que decía antes (en el teléfono y en la hoja PLAN, donde cada versión es su propia fila).
    // `editaA` encadena las versiones; de la hoja no vuelve, ahí las ordena el Timestamp.
    const editando=editandoPlan&&planActual;
    const rec={id:uid(),type:'plan',date:today(),
      ...(editando?{editaA:planActual.id}:{}),
      semanaInicio:semanaIniStr,semanaFin:semanaFinStr,semanaLabel,
      objetivos:esLider?objetivosEquipo:form.objetivos,
      ...(esLider?{objetivosPorCoach:coachesPlanDatos.map(c=>({coach:c.coach.nombre,objetivos:c.objetivos}))}:{}),
      metaOficial:{oportunidades:metaOportOficial,ventas:metaVentasOficial,instalaciones:metaInstalOficial},
      prioridades:esLider?prioridadesEquipoTexto:form.prioridades,
      vendedores_acompanar:esLider?acompanamientosEquipoTexto:form.vendedores_acompanar,
      zonas:form.zonas,resultado_esperado:form.resultado_esperado,notas:form.notas,
      registradoPor:session.user.nombre,token:session.token,savedAt:new Date().toISOString()};
    const upd={...data,records:[...data.records,rec]};setData(upd);saveAndSync(upd,rec,toast);
    toast(editando?'✅ Cambios guardados':'✅ Plan guardado');
    setEditandoPlan(false);
    setForm(formVacio());
  };

  // Resultado real de la semana pendiente: se precarga del sistema (embudo de esa semana) y es editable.
  const[resForm,setResForm]=useState(null);
  useEffect(()=>{
    if(!planPendiente){setResForm(null);return;}
    const ini=new Date(planPendiente.semanaInicio+'T00:00:00');
    const fin=new Date(planPendiente.semanaFin+'T23:59:59');
    const tot={oportunidades:0,ventas:0,instalaciones:0};
    vendedoresPlan.forEach(m=>{
      const f=funnelPeriodo(m.ventas,ini,fin);
      tot.oportunidades+=f.oportunidades;tot.ventas+=f.validadas;tot.instalaciones+=f.instaladas;
    });
    // Cuentas pagadas: lo que se fue marcando como "Pagadas hoy" en los cierres de esa semana.
    const pagadas=data.records.filter(r=>r.type==='cierre'&&r.date>=planPendiente.semanaInicio&&r.date<=planPendiente.semanaFin)
      .reduce((s,r)=>s+(r.resultados||[]).reduce((s2,x)=>s2+(Number(x.pagadasHoy)||0),0),0);
    setResForm({...tot,cuentasRecuperadas:pagadas||'',arpu:''});
  },[planPendiente?.id]);

  // Lo último que se guardó: se queda en pantalla con el comparativo y el botón de WhatsApp.
  const[ultimoResultado,setUltimoResultado]=useState(null);
  const guardarResultado=async()=>{
    if(session.soloLectura)return; // vista prestada: solo consulta
    if(!planPendiente||!resForm)return;
    const resultados=Object.fromEntries(KPIS_RESULTADO.map(x=>[x.k,Number(resForm[x.k])||0]));
    const rec={id:uid(),type:'plan_resultado',planId:planPendiente.id,date:today(),
      semanaInicio:planPendiente.semanaInicio,semanaFin:planPendiente.semanaFin,semanaLabel:planPendiente.semanaLabel,
      objetivos:planPendiente.objetivos,resultados,aDestiempo:!!ventanaResultado?.aDestiempo,
      registradoPor:session.user.nombre,token:session.token,savedAt:new Date().toISOString()};
    // WhatsApp se abre aquí mismo, dentro del clic: después de un await el navegador lo bloquearía.
    window.open(whatsappUrl(textoResultadoPlan(rec)),'_blank','noopener');
    const upd={...data,records:[...data.records,rec]};setData(upd);saveAndSync(upd,rec,toast);toast('✅ Resultado guardado');
    setUltimoResultado(rec);
    window.scrollTo({top:0,behavior:'smooth'});
  };

  return <div>
    {esLider&&
      <Card title={`📊 Planes del equipo — Semana ${semanaLabel}`}>
        {cargandoPlanesEquipo?<div style={{textAlign:'center',padding:20}}><Spinner/></div>:
        (session.coaches||[]).length===0?<p style={{fontSize:13,color:'var(--dim)'}}>Sin coaches asignados.</p>:
        coachesPlanEstado.map(({coach,estado,pct})=>{
          const color=estado==='completo'?'var(--green)':estado==='parcial'?'var(--yellow)':'var(--red)';
          const bg=estado==='completo'?'var(--gbg)':estado==='parcial'?'var(--ybg)':'var(--rbg)';
          const texto=estado==='sin'?'Sin capturar':`${pct}%`;
          return <div key={coach.nombre} style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'8px 10px',borderRadius:8,marginBottom:6,background:bg,border:`1px solid ${color}`}}>
            <span style={{fontSize:14,fontWeight:600}}>{coach.nombre.split(' ').slice(0,3).join(' ')}</span>
            <span style={{fontSize:13,fontWeight:700,color}}>{texto}</span>
          </div>;
        })}
        <p style={{fontSize:12,color:'var(--dim)',marginTop:4}}>🟢 100% capturado · 🟡 capturado parcial · 🔴 sin capturar</p>
      </Card>
    }
    {retraso&&<Card style={{borderLeft:'4px solid var(--red)'}}>
      <p style={{fontSize:14,fontWeight:700,color:'var(--red)',margin:0}}>⚠️ Aún no se ha capturado el plan de esta semana — debía quedar listo el lunes.</p>
    </Card>}
    {!planActual&&!retraso&&<Card style={{borderLeft:`4px solid ${esLunes?'var(--yellow)':'var(--border)'}`}}>
      <p style={{fontSize:13,color:'var(--dim)',margin:0}}>{esLunes?'📌 Hoy es lunes — captura el objetivo comprometido para esta semana.':'Plan de la semana aún no capturado.'}</p>
    </Card>}

    {ultimoResultado&&
      <Card title={`🏁 Resultado guardado — Semana ${ultimoResultado.semanaLabel}`} style={{borderLeft:`4px solid ${ultimoResultado.aDestiempo?'var(--red)':'var(--green)'}`}}>
        {ultimoResultado.aDestiempo&&<AvisoDestiempo/>}
        <p style={{fontSize:13,color:'var(--dim)',marginBottom:6}}>Así quedaste contra el compromiso de esa semana:</p>
        <TablaComparativo objetivos={ultimoResultado.objetivos} resultados={ultimoResultado.resultados}/>
        <p style={{fontSize:13,color:'var(--dim)',margin:'10px 0 8px'}}>Se abrió WhatsApp con este resultado. Si no se abrió, envíalo desde aquí:</p>
        <a href={whatsappUrl(textoResultadoPlan(ultimoResultado))} target="_blank" rel="noopener noreferrer"
          style={{display:'inline-flex',alignItems:'center',gap:6,padding:'8px 14px',borderRadius:8,background:'#25D366',color:'#fff',fontSize:14,fontWeight:700,textDecoration:'none'}}>
          📲 Enviar resultado por WhatsApp
        </a>
      </Card>
    }

    {resultadoVencido&&
      <Card style={{borderLeft:'4px solid var(--red)',background:'var(--rbg)'}}>
        <p style={{fontSize:14,fontWeight:700,color:'var(--red)',margin:'0 0 4px'}}>⚠️ No se capturó el resultado de la semana {resultadoVencido.semanaLabel}</p>
        <p style={{fontSize:13,color:'var(--red)',margin:0}}>Se captura el lunes, o el martes a destiempo. Del miércoles en adelante ya no se puede.</p>
      </Card>
    }

    {planPendiente&&resForm&&
      <Card title={`🏁 Resultado del plan — Semana ${planPendiente.semanaLabel}`} style={{borderLeft:`4px solid ${ventanaResultado.aDestiempo?'var(--red)':'var(--yellow)'}`}}>
        {ventanaResultado.aDestiempo?<AvisoDestiempo/>:
          <p style={{fontSize:13,fontWeight:700,color:'var(--yellow)',marginBottom:6}}>📌 Hoy es lunes: captura cómo cerró la semana. Si no queda hoy, el martes se registra a destiempo.</p>}
        <p style={{fontSize:13,color:'var(--dim)',marginBottom:8}}>Oportunidades, validaciones e instalaciones se precargaron de lo que hay en sistema, y las cuentas pagadas de los cierres de esa semana. Ajústalo si hace falta. Debajo de cada dato ves cómo vas contra lo que te comprometiste.</p>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8}}>
          {comparativoResultado(planPendiente.objetivos,resForm).map(x=>
            <Field key={x.k} label={`${x.label} (compromiso: ${x.dinero?fmtMoney(x.obj):x.obj})`}>
              {x.dinero
                ?<InputMoney value={resForm[x.k]} onChange={e=>setResForm(f=>({...f,[x.k]:e.target.value}))}/>
                :<Input type="number" value={resForm[x.k]} onChange={e=>setResForm(f=>({...f,[x.k]:e.target.value}))}/>}
              {x.pct!=null&&<p style={{fontSize:13,fontWeight:700,margin:'2px 0 0',color:TONO_COLOR[x.tono]}}>{x.pct}%</p>}
            </Field>
          )}
        </div>
        {session.soloLectura?<AvisoSoloLectura nombre={session.user.nombre}/>:<Btn onClick={guardarResultado} style={{width:'100%'}}>💾 Guardar resultado y enviar por WhatsApp</Btn>}
      </Card>
    }

    {planActual&&!editandoPlan?
      <Card title={`✅ Plan de la semana — ${planActual.semanaLabel}`} style={{borderLeft:'4px solid var(--green)'}}>
        <p style={{fontSize:13,color:'var(--dim)',marginBottom:6}}>
          Ya se capturó el objetivo de esta semana.{planActual.editaA?' Incluye los cambios que se le hicieron.':''}
        </p>
        {KPIS.map(kpi=><div key={kpi.k} style={{display:'flex',justifyContent:'space-between',fontSize:14,padding:'3px 0'}}>
          <span>{kpi.label}</span>
          <b style={{color:colorVsMeta(planActual.objetivos?.[kpi.k],planActual.metaOficial?.[kpi.k])}}>{planActual.objetivos?.[kpi.k]||0} <span style={{color:'var(--dim)',fontWeight:400}}>/ meta {planActual.metaOficial?.[kpi.k]??'-'}</span></b>
        </div>)}
        <div style={{display:'flex',justifyContent:'space-between',fontSize:14,padding:'3px 0'}}><span>Cuentas recuperadas NPPF</span><b>{planActual.objetivos?.cuentasRecuperadas||0}</b></div>
        <div style={{display:'flex',justifyContent:'space-between',fontSize:14,padding:'3px 0'}}><span>ARPU</span><b>{fmtMoney(planActual.objetivos?.arpu)}</b></div>
        {DIAS_SEMANA.some(d=>{const dz=diaZonas(planActual.zonas,d);return dz.entradas.length||dz.direccion||dz.comentarios||dz.descansos.length;})&&<div style={{marginTop:10,paddingTop:10,borderTop:'1px solid var(--border)'}}>
          <div style={{fontSize:13,fontWeight:700,color:'var(--dim)',marginBottom:4}}>{esCoachPDV?'🏬 Puntos de venta de la semana':'🗺️ Zonas de la semana'}</div>
          {DIAS_SEMANA.filter(d=>{const dz=diaZonas(planActual.zonas,d);return dz.entradas.length||dz.direccion||dz.comentarios||dz.descansos.length;}).map(d=>{
            const dz=diaZonas(planActual.zonas,d);
            return <div key={d} style={{marginBottom:4}}>
              {dz.entradas.length>0&&<p style={{fontSize:13,margin:'2px 0'}}><b>{DIAS_SEMANA_LABEL[d]}:</b> {dz.entradas.map(e=>e.colonia?`${e.colonia} (${e.cluster})`:`${e.cluster} (todo)`).join(', ')}</p>}
              {!dz.entradas.length&&<p style={{fontSize:13,margin:'2px 0'}}><b>{DIAS_SEMANA_LABEL[d]}</b></p>}
              {dz.direccion&&<p style={{fontSize:13,color:'var(--dim)',margin:'0 0 0 10px'}}>📍 {dz.direccion}</p>}
              {dz.descansos.length>0&&<p style={{fontSize:13,color:'var(--dim)',margin:'0 0 0 10px'}}>😴 Descansa: {dz.descansos.map(nombreCorto).join(', ')}</p>}
              {dz.comentarios&&<p style={{fontSize:13,color:'var(--dim)',margin:'0 0 0 10px'}}>💬 {dz.comentarios}</p>}
            </div>;
          })}
        </div>}
        <div style={{display:'flex',gap:8,marginTop:10,flexWrap:'wrap'}}>
          <a href={whatsappUrl(textoPlan(planActual))} target="_blank" rel="noopener noreferrer"
            style={{display:'inline-flex',alignItems:'center',gap:6,padding:'8px 14px',borderRadius:8,background:'#25D366',color:'#fff',fontSize:14,fontWeight:700,textDecoration:'none'}}>
            📲 Enviar plan al líder por WhatsApp
          </a>
          {puedeEditarPlan&&<Btn variant="secondary" onClick={abrirEdicionPlan} style={{fontSize:14}}>✏️ Editar plan</Btn>}
          <Btn variant="secondary" onClick={()=>window.scrollTo({top:0,behavior:'smooth'})} style={{fontSize:14}}>← Volver al Plan</Btn>
        </div>
        {/* Por qué se puede o ya no se puede corregir. Sin esto, el botón simplemente no aparece el
            miércoles y se lee como una falla de la app en vez de como la regla que es. */}
        {!session.soloLectura&&<p style={{fontSize:12,color:'var(--dim)',margin:'8px 0 0'}}>
          {puedeEditarPlan
            ?'✏️ El plan se puede corregir hoy y hasta el martes. De miércoles en adelante queda firme.'
            :'🔒 Ya no se puede editar: el plan solo se corrige el lunes y el martes de su semana.'}
        </p>}
      </Card>
    :<>
      {editandoPlan&&<Card style={{borderLeft:'4px solid var(--yellow)',background:'var(--ybg)'}}>
        <p style={{fontSize:14,fontWeight:700,color:'var(--yellow)',margin:'0 0 4px'}}>✏️ Estás editando el plan de esta semana</p>
        <p style={{fontSize:13,color:'var(--dim)',margin:0}}>
          Abajo está lo que ya habías guardado — corrige lo que haga falta y guarda los cambios. Se
          registra como una nueva versión: lo anterior no se borra, queda el rastro de lo que decía.
        </p>
      </Card>}
      {esLider?<>
        <Card title="🎯 Objetivo de la semana (de tus coaches)">
          <p style={{fontSize:13,color:'var(--dim)',marginBottom:8}}>Semana {semanaLabel}. Se llena solo con lo que cada coach ya capturó en su propio plan.</p>
          {(session.coaches||[]).length===0?<p style={{fontSize:13,color:'var(--dim)'}}>Sin coaches asignados.</p>:
          <div style={{overflowX:'auto'}}>
            <table style={{width:'100%',borderCollapse:'collapse',fontSize:13}}>
              <thead><tr style={{borderBottom:'2px solid var(--border)'}}>
                <th style={{textAlign:'left',padding:'4px'}}>Coach</th>
                <th style={{textAlign:'right',padding:'4px'}}>Op.</th>
                <th style={{textAlign:'right',padding:'4px'}}>Val.</th>
                <th style={{textAlign:'right',padding:'4px'}}>Inst.</th>
                <th style={{textAlign:'right',padding:'4px'}}>NPPF</th>
                <th style={{textAlign:'right',padding:'4px'}}>ARPU</th>
              </tr></thead>
              <tbody>
                {/* Dos renglones por coach: lo que se comprometió y, debajo en gris, su propia meta
                    (la suma del ranking de SUS vendedores). Con una sola meta al final no se podía
                    ver quién se comprometió por debajo de la suya y quién no. */}
                {coachesPlanDatos.map(c=><React.Fragment key={c.coach.nombre}>
                  <tr>
                    <td style={{padding:'4px'}}>{c.coach.nombre.split(' ').slice(0,2).join(' ')}</td>
                    <td style={{textAlign:'right',padding:'4px',color:colorVsMeta(c.objetivos.oportunidades,c.meta.oportunidades)}}>{c.objetivos.oportunidades}</td>
                    <td style={{textAlign:'right',padding:'4px',color:colorVsMeta(c.objetivos.ventas,c.meta.ventas)}}>{c.objetivos.ventas}</td>
                    <td style={{textAlign:'right',padding:'4px',color:colorVsMeta(c.objetivos.instalaciones,c.meta.instalaciones)}}>{c.objetivos.instalaciones}</td>
                    <td style={{textAlign:'right',padding:'4px'}}>{c.objetivos.cuentasRecuperadas}</td>
                    <td style={{textAlign:'right',padding:'4px'}}>{fmtMoney(c.objetivos.arpu)}</td>
                  </tr>
                  <tr style={{fontSize:12,color:'var(--dim)',borderBottom:'1px solid var(--border)'}}>
                    <td style={{padding:'0 4px 4px 12px'}}>su meta</td>
                    <td style={{textAlign:'right',padding:'0 4px 4px'}}>{c.meta.oportunidades}</td>
                    <td style={{textAlign:'right',padding:'0 4px 4px'}}>{c.meta.ventas}</td>
                    <td style={{textAlign:'right',padding:'0 4px 4px'}}>{c.meta.instalaciones}</td>
                    <td/><td/>
                  </tr>
                </React.Fragment>)}
                <tr style={{fontWeight:800,borderTop:'2px solid var(--border)'}}>
                  <td style={{padding:'4px'}}>Total</td>
                  <td style={{textAlign:'right',padding:'4px',color:colorVsMeta(objetivosEquipo.oportunidades,metaOportOficial)}}>{objetivosEquipo.oportunidades}</td>
                  <td style={{textAlign:'right',padding:'4px',color:colorVsMeta(objetivosEquipo.ventas,metaVentasOficial)}}>{objetivosEquipo.ventas}</td>
                  <td style={{textAlign:'right',padding:'4px',color:colorVsMeta(objetivosEquipo.instalaciones,metaInstalOficial)}}>{objetivosEquipo.instalaciones}</td>
                  <td style={{textAlign:'right',padding:'4px'}}>{objetivosEquipo.cuentasRecuperadas}</td>
                  <td style={{textAlign:'right',padding:'4px'}}>{fmtMoney(objetivosEquipo.arpu)}</td>
                </tr>
                <tr style={{fontSize:12,color:'var(--dim)'}}>
                  <td style={{padding:'2px 4px'}}>Meta</td>
                  <td style={{textAlign:'right',padding:'2px 4px'}}>{metaOportOficial}</td>
                  <td style={{textAlign:'right',padding:'2px 4px'}}>{metaVentasOficial}</td>
                  <td style={{textAlign:'right',padding:'2px 4px'}}>{metaInstalOficial}</td>
                  <td/><td/>
                </tr>
              </tbody>
            </table>
          </div>}
        </Card>
        <Card title="Prioridades (de tus coaches)">
          {(session.coaches||[]).length===0?<p style={{fontSize:13,color:'var(--dim)'}}>Sin coaches asignados.</p>:
          coachesPlanDatos.map(c=><p key={c.coach.nombre} style={{fontSize:13,margin:'4px 0'}}>• <b>{c.coach.nombre.split(' ').slice(0,2).join(' ')}:</b> {c.prioridades||<span style={{color:'var(--dim)',fontStyle:'italic'}}>sin capturar</span>}</p>)}
        </Card>
        <Card title="Acompañamientos (de tus coaches)">
          {(session.coaches||[]).length===0?<p style={{fontSize:13,color:'var(--dim)'}}>Sin coaches asignados.</p>:
          coachesPlanDatos.map(c=><p key={c.coach.nombre} style={{fontSize:13,margin:'4px 0'}}>• <b>{c.coach.nombre.split(' ').slice(0,2).join(' ')}:</b> {c.acompanamientos||<span style={{color:'var(--dim)',fontStyle:'italic'}}>sin capturar</span>}</p>)}
        </Card>
        <Card title="🤝 Coach a priorizar en la semana">
          <p style={{fontSize:13,color:'var(--dim)',marginBottom:8}}>Elige con qué coach vas a trabajar cada día, y agrega un comentario si hace falta.</p>
          {DIAS_SEMANA.map(d=><CoachDiaSelector key={d} label={DIAS_SEMANA_LABEL[d]} dia={form.zonas[d]} coachesDisponibles={session.coaches||[]} onChange={nuevoDia=>setForm(f=>({...f,zonas:{...f.zonas,[d]:nuevoDia}}))}/>)}
        </Card>
      </>:<>
        <Card title="🎯 Objetivo de la semana">
          <p style={{fontSize:13,color:'var(--dim)',marginBottom:8}}>Semana {semanaLabel} (lunes a domingo). Compromiso del equipo al cierre de la semana (domingo).</p>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8}}>
            {KPIS.map(kpi=>{
              const val=form.objetivos[kpi.k];
              const color=colorVsMeta(val,kpi.meta);
              return <Field key={kpi.k} label={kpi.label}>
                <Input type="number" value={val} onChange={e=>updObjetivo(kpi.k,e.target.value)} style={{color,fontWeight:700}}/>
                <p style={{fontSize:12,color:'var(--dim)',margin:'2px 0 0'}}>Meta: <b>{kpi.meta}</b> — <span style={{color}}>{color==='var(--red)'?'debajo':color==='var(--green)'?'arriba':'igual'}</span></p>
              </Field>;
            })}
            <Field label="Cuentas recuperadas (NPPF)"><Input type="number" value={form.objetivos.cuentasRecuperadas} onChange={e=>updObjetivo('cuentasRecuperadas',e.target.value)}/></Field>
            <Field label="ARPU"><InputMoney value={form.objetivos.arpu} onChange={e=>updObjetivo('arpu',e.target.value)}/></Field>
          </div>
          {/* De dónde sale la meta: el ranking vigente de cada vendedor, tal como está en la hoja
              de ranking la última vez que se actualizó la información. Sin este desglose, una meta
              que se ve baja no se puede distinguir de un vendedor al que le falta ranking en la
              hoja (ese suma 0 y nadie se entera). */}
          {vendedoresPlan.length>0&&<div style={{marginTop:10,paddingTop:10,borderTop:'1px solid var(--border)'}}>
            <button onClick={()=>setVerMeta(v=>!v)} style={{fontSize:13,color:'var(--accent)',background:'none',border:'none',cursor:'pointer',padding:0}}>
              {verMeta?'▲ Ocultar de dónde sale la meta':'📊 ¿De dónde sale la meta?'}
            </button>
            {verMeta&&<div style={{marginTop:6,background:'var(--bg)',borderRadius:8,padding:10}}>
              <p style={{fontSize:12,color:'var(--dim)',margin:'0 0 6px'}}>
                Meta de instalaciones = suma de la meta semanal por ranking de cada vendedor (Platino 6, Oro 5,
                Plata 4, Bronce/Condicionado/Entrenamiento 3; sin ranking 3) más 3 por cada vacante. Ventas/validaciones
                y oportunidades salen 15% arriba de la anterior. Es la misma meta del Reporte de seguimiento. El ranking
                es el que trae la hoja de ranking en la última actualización — toca 🔄 <b>Actualizar información</b> si
                acabas de moverlo ahí.
              </p>
              {vendedoresPlan.map(m=><div key={m.numEmp||m.nombre} style={{display:'flex',justifyContent:'space-between',gap:8,fontSize:13,padding:'2px 0'}}>
                <span>{nombreCorto(m.nombre)} <span style={{color:'var(--dim)'}}>· {m.badge||'sin ranking en la hoja'}</span></span>
                <b style={{color:tieneRanking(m.badge)?'var(--text)':'var(--red)'}}>{metaSemanal(m.badge)}</b>
              </div>)}
              {vacantesPlan>0&&<div style={{display:'flex',justifyContent:'space-between',gap:8,fontSize:13,padding:'2px 0'}}>
                <span>Vacantes <span style={{color:'var(--dim)'}}>· {vacantesPlan} × {META_VACANTE}</span></span>
                <b>{vacantesPlan*META_VACANTE}</b>
              </div>}
              <div style={{display:'flex',justifyContent:'space-between',gap:8,fontSize:13,fontWeight:800,borderTop:'1px solid var(--border)',marginTop:4,paddingTop:4}}>
                <span>Meta de instalaciones</span><b>{metaInstalOficial}</b>
              </div>
              {sinMetaRanking.length>0&&<p style={{fontSize:12,color:'var(--red)',margin:'6px 0 0'}}>
                ⚠️ {sinMetaRanking.map(nombreCorto).join(', ')} {sinMetaRanking.length===1?'no tiene':'no tienen'} ranking
                en la hoja: {sinMetaRanking.length===1?'cuenta':'cuentan'} con la meta de {META_SIN_RANKING}. Repórtalo para que lo carguen.
              </p>}
            </div>}
          </div>}
        </Card>
        <Card title="Prioridades">
          <Textarea value={form.prioridades} onChange={e=>setForm({...form,prioridades:e.target.value})} placeholder="Amarillo/rojo, calidad, incidencias..."/>
        </Card>
        <Card title="Acompañamientos">
          <Textarea value={form.vendedores_acompanar} onChange={e=>setForm({...form,vendedores_acompanar:e.target.value})} placeholder="Quién y por qué..." style={{minHeight:50}}/>
        </Card>
        {esCoachPDV?
        <Card title="🏬 Puntos de Venta a trabajar en la semana">
          {vendedoresPlan.length>0&&<p style={{fontSize:13,fontWeight:600,marginBottom:8,padding:'8px 10px',borderRadius:8,
            border:`1.5px solid ${sinDescansoSemana.length?'var(--yellow)':'var(--green)'}`,
            background:sinDescansoSemana.length?'var(--ybg)':'var(--gbg)',
            color:sinDescansoSemana.length?'var(--yellow)':'var(--green)'}}>
            {sinDescansoSemana.length
              ?`😴 Falta asignarle descanso a: ${sinDescansoSemana.map(nombreCorto).join(', ')} — márcalos en el día que les toca.`
              :`✓ Los ${vendedoresPlan.length} vendedores ya tienen su día de descanso asignado.`}
          </p>}
          {puntosVenta.length===0?<p style={{color:'var(--dim)',fontSize:13}}>Cargando puntos de venta…</p>:
          DIAS_SEMANA.map(d=><PDVDia key={d} label={DIAS_SEMANA_LABEL[d]} dia={form.zonas[d]} puntosDisponibles={puntosVenta}
            vendedores={vendedoresPlan} descansosSemana={descansosSemana}
            onChange={nuevoDia=>setForm(f=>({...f,zonas:{...f.zonas,[d]:nuevoDia}}))}/>)}
        </Card>
        :
        <Card title="🗺️ Zonas a trabajar en la semana">
          {zonasData.clusters.length===0?<p style={{color:'var(--dim)',fontSize:13}}>Cargando clusters/colonias…</p>:
          DIAS_SEMANA.map(d=><ZonaDia key={d} label={DIAS_SEMANA_LABEL[d]} dia={form.zonas[d]} zonasData={zonasData} onChange={nuevoDia=>setForm(f=>({...f,zonas:{...f.zonas,[d]:nuevoDia}}))}/>)}
        </Card>
        }
      </>}
      <Card title="Resultado esperado">
        <Textarea value={form.resultado_esperado} onChange={e=>setForm({...form,resultado_esperado:e.target.value})} style={{minHeight:50}}/>
      </Card>
      <Card title="Notas"><Textarea value={form.notas} onChange={e=>setForm({...form,notas:e.target.value})} style={{minHeight:50}}/></Card>
      {session.soloLectura?<AvisoSoloLectura nombre={session.user.nombre}/>:<>
        <Btn onClick={guardarPlan} style={{width:'100%'}}>{editandoPlan?'💾 Guardar cambios':'💾 Guardar plan'}</Btn>
        {editandoPlan&&<Btn variant="secondary" onClick={cancelarEdicionPlan} style={{width:'100%',marginTop:8}}>Cancelar edición</Btn>}
      </>}
    </>}
  </div>;
}

// ─── Feedback ───
function FeedbackTab({data,setData,team,toast,session,refreshKey}){
  const esLider=session.role==='lider';
  const[form,setForm]=useState({date:today(),vendedor:'',tipo:'Acompañamiento',hallazgos:'',fortalezas:'',areas_oportunidad:'',compromisos:'',fecha_revision:'',semaforo:'',grabado:false,transcript:'',notas:'',photo:null,fotos:[]});
  const[consent,setConsent]=useState(false);
  const esAcompanamiento=form.tipo==='Acompañamiento';
  const esEvidenciaExterna=form.tipo==='Evidencia de asignación externa';

  // Líder: hallazgos/feedback que cada coach ya cargó hoy (leído del Sheet).
  const hoyStr=today();
  const[feedbackEquipo,setFeedbackEquipo]=useState([]);
  const[cargandoFeedbackEquipo,setCargandoFeedbackEquipo]=useState(false);
  useEffect(()=>{
    if(!esLider)return;
    setCargandoFeedbackEquipo(true);
    fetchHistorialEquipo('FEEDBACK',session.token,session.verComo).then(regs=>{setFeedbackEquipo(regs);setCargandoFeedbackEquipo(false);});
  },[esLider,refreshKey]);
  const coachesFeedbackHoy=esLider?(session.coaches||[]).map(c=>({coach:c,rows:feedbackEquipo.filter(r=>r['Registrado por']===c.nombre&&r['Fecha']===hoyStr)})):[];
  const guardar=async()=>{
    if(session.soloLectura)return; // vista prestada: solo consulta
    if(!form.vendedor){alert('Selecciona un integrante');return;}
    if(esAcompanamiento&&!form.photo){alert('Agrega una foto (con sello) — es obligatoria para este tipo de hallazgo');return;}
    if(esEvidenciaExterna&&!form.fotos.length){alert('Agrega al menos una foto (persona en campo y conversación del avance) — es obligatoria para este tipo de hallazgo');return;}
    // El semáforo que se guarda es el vigente al momento de documentar, no uno elegido aquí.
    const rec={id:uid(),type:'feedback',...form,semaforo:semaforoVigente,registradoPor:session.user.nombre,token:session.token,savedAt:new Date().toISOString()};
    const upd={...data,records:[...data.records,rec]};setData(upd);saveAndSync(upd,rec,toast,setData);toast('✅ Hallazgo guardado');
    setForm({date:today(),vendedor:'',tipo:'Acompañamiento',hallazgos:'',fortalezas:'',areas_oportunidad:'',compromisos:'',fecha_revision:'',semaforo:'',grabado:false,transcript:'',notas:'',photo:null,fotos:[]});
    setConsent(false);
  };
  const selectedMember=form.vendedor?team.find(m=>m.nombre===form.vendedor):null;
  // El semáforo ya no se elige aquí: se lee el vigente (puesto desde Dashboard → Equipo) y se
  // guarda con el hallazgo tal cual estaba, sin poder cambiarlo desde esta pantalla.
  const semaforoVigente=construirSemaforoMap(data.records)[form.vendedor]?.valor||'';
  // Líder: el hallazgo/feedback lo documenta sobre coaches, no directamente sobre vendedores
  // (eso le toca a cada coach) — la lista de integrantes se limita a sus coaches.
  const integrantesDisponibles=esLider?team.filter(m=>isCoach(m.posicion)):team;
  return <div>
    {esLider&&<Card title="💬 Hallazgos y feedback por coach — hoy">
      {cargandoFeedbackEquipo?<div style={{textAlign:'center',padding:20}}><Spinner/></div>:
      (session.coaches||[]).length===0?<p style={{color:'var(--dim)',fontSize:15}}>Sin coaches asignados.</p>:
      coachesFeedbackHoy.map(({coach,rows})=>
        <div key={coach.nombre} style={{marginBottom:8,padding:10,borderRadius:8,border:`1.5px solid ${rows.length?'var(--green)':'var(--red)'}`,background:rows.length?'var(--gbg)':'var(--rbg)'}}>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
            <span style={{fontWeight:700,fontSize:14}}>{coach.nombre}</span>
            <span style={{fontWeight:800,fontSize:16,color:rows.length?'var(--green)':'var(--red)'}}>{rows.length?`✓ (${rows.length})`:'✗'}</span>
          </div>
          {rows.length===0?<p style={{fontSize:13,color:'var(--dim)',margin:'4px 0 0'}}>Aún no ha cargado hallazgos hoy.</p>:
          rows.map((r,i)=>
            <div key={i} style={{marginTop:6,padding:8,border:'1px solid var(--nest-border)',background:'var(--nest-bg)',borderRadius:8}}>
              <div style={{display:'flex',justifyContent:'space-between',fontSize:13,fontWeight:600}}>
                <span>{r['Integrante']} · {r['Tipo']}</span>
                <span style={{color:r['Semáforo']==='rojo'?'var(--red)':r['Semáforo']==='amarillo'?'var(--yellow)':'var(--green)'}}>●</span>
              </div>
              {r['Hallazgos']&&<p style={{fontSize:13,margin:'2px 0'}}>{r['Hallazgos']}</p>}
              {r['Compromisos']&&<p style={{fontSize:13,color:'var(--dim)',margin:'2px 0'}}>✅ {r['Compromisos']}</p>}
            </div>
          )}
        </div>
      )}
    </Card>}
    <Card title="💬 Hallazgos y feedback">
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8,marginBottom:12}}>
        <Field label="Fecha"><Input type="date" value={form.date} onChange={e=>setForm({...form,date:e.target.value})}/></Field>
        <Field label="Tipo"><Select value={form.tipo} onChange={v=>setForm({...form,tipo:v})} options={FEEDBACK_TIPOS}/></Field>
      </div>
      <Field label="Integrante"><Select value={form.vendedor} onChange={v=>setForm({...form,vendedor:v})} options={[{value:'',label:'— Seleccionar —'},...integrantesDisponibles.map(m=>({value:m.nombre,label:m.nombre+(isCoach(m.posicion)?' (Coach)':'')+(m.badge?' — '+m.badge:'')}))]}/></Field>
      {selectedMember&&(selectedMember.rankingEnt||selectedMember.rankingMen)&&
        <div style={{background:'var(--bg)',borderRadius:10,padding:12,marginBottom:12,border:'1px solid var(--border)'}}>
          <div style={{fontSize:13,fontWeight:700,color:'var(--dim)',marginBottom:6}}>📊 CONTEXTO DEL INTEGRANTE</div>
          <div style={{display:'flex',flexWrap:'wrap',gap:8,alignItems:'center',marginBottom:8}}>
            <span style={{fontWeight:700,fontSize:15}}>{selectedMember.nombre}</span>
            <RankBadge badge={selectedMember.badge}/>
            {selectedMember.mesesEnRanking>0&&<span style={{fontSize:12,color:'var(--dim)',fontWeight:600}}>{selectedMember.mesesEnRanking} meses en este nivel</span>}
          </div>

          {/* Performance */}
          {selectedMember.rankingMen&&<div style={{fontSize:13,marginBottom:6,padding:'6px 8px',background:'var(--card)',borderRadius:6}}>
            <div style={{display:'flex',justifyContent:'space-between'}}>
              <span>Promedio mensual:</span><b>{selectedMember.rankingMen.promedioMensual} instalaciones</b>
            </div>
            <div style={{display:'flex',justifyContent:'space-between',color:'var(--dim)'}}>
              <span>Últimos 3 meses:</span><span>{selectedMember.rankingMen.ultimos3meses.join(' → ')||'—'}</span>
            </div>
            {selectedMember.rankingMen.ventaSana&&
              <div style={{display:'flex',justifyContent:'space-between'}}>
                <span>% Venta sana ({selectedMember.rankingMen.ventaSana.mes}):</span><b>{selectedMember.rankingMen.ventaSana.valor}</b>
              </div>
            }
          </div>}

          {/* Entrenamiento data */}
          {selectedMember.rankingEnt&&<div style={{fontSize:13,marginBottom:6,padding:'6px 8px',background:'var(--card)',borderRadius:6}}>
            <div style={{display:'flex',justifyContent:'space-between'}}>
              <span>Inst. últimas 4 sem:</span><b>{selectedMember.rankingEnt.insUlt4}</b>
            </div>
            {selectedMember.rankingEnt.evalMes1&&selectedMember.rankingEnt.evalMes1!=='-'&&
              <div style={{display:'flex',justifyContent:'space-between'}}><span>Eval Mes 1:</span><b>{selectedMember.rankingEnt.evalMes1}</b></div>}
            {selectedMember.rankingEnt.evalMes2&&selectedMember.rankingEnt.evalMes2!=='-'&&
              <div style={{display:'flex',justifyContent:'space-between'}}><span>Eval Mes 2:</span><b>{selectedMember.rankingEnt.evalMes2}</b></div>}
          </div>}

          {/* Certifications - approved */}
          {selectedMember.rankingEnt&&<div style={{display:'flex',gap:4,flexWrap:'wrap',marginBottom:4}}>
            {selectedMember.rankingEnt.certActitud==='APROBADO'&&<span style={{background:'var(--gbg)',color:'var(--green)',padding:'1px 5px',borderRadius:6,fontSize:12,fontWeight:600}}>✓ Actitud</span>}
            {selectedMember.rankingEnt.certSist1==='APROBADO'&&<span style={{background:'var(--gbg)',color:'var(--green)',padding:'1px 5px',borderRadius:6,fontSize:12,fontWeight:600}}>✓ Sistémica I</span>}
            {selectedMember.rankingEnt.certSist2==='APROBADO'&&<span style={{background:'var(--gbg)',color:'var(--green)',padding:'1px 5px',borderRadius:6,fontSize:12,fontWeight:600}}>✓ Sistémica II</span>}
            {selectedMember.rankingEnt.certSist3==='APROBADO'&&<span style={{background:'var(--gbg)',color:'var(--green)',padding:'1px 5px',borderRadius:6,fontSize:12,fontWeight:600}}>✓ Sistémica III</span>}
          </div>}

          {/* Missing certifications */}
          {selectedMember.certFaltantes&&selectedMember.certFaltantes.length>0&&
            <div style={{fontSize:13,color:'var(--red)',fontWeight:600,marginBottom:4,padding:'4px 8px',background:'var(--rbg)',borderRadius:6}}>
              📚 Cursos faltantes: {selectedMember.certFaltantes.join(', ')}
            </div>
          }

          {/* Observations */}
          {(()=>{const obs=selectedMember.rankingEnt?.obs||selectedMember.rankingMen?.obsOficial;
            return obs&&obs!=='-'&&<p style={{fontSize:13,color:'var(--yellow)',fontStyle:'italic',marginTop:4}}>⚠️ {obs}</p>;
          })()}
        </div>
      }
      {/* Solo informativo: el semáforo se pone en Dashboard → Equipo, que es donde se ve el
          rendimiento contra la meta. Aquí se muestra el vigente y se guarda con el hallazgo como
          foto del momento, para saber en qué estaba la persona cuando se documentó. */}
      <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:12,flexWrap:'wrap'}}>
        <span style={{fontSize:13,fontWeight:700,color:'var(--dim)'}}>SEMÁFORO:</span>
        {form.vendedor
          ? (semaforoVigente
              ? <StatusBadge status={semaforoVigente}/>
              : <span style={{fontSize:14,color:'var(--yellow)',fontWeight:600}}>⚪ Sin semáforo</span>)
          : <span style={{fontSize:14,color:'var(--dim)'}}>Selecciona un integrante</span>}
        <span style={{fontSize:13,color:'var(--dim)'}}>· se pone en Dashboard → Equipo</span>
      </div>
    </Card>
    {esAcompanamiento&&<Card title="📷 Evidencia (obligatoria)">
      <PhotoCaptureGeo photo={form.photo} onCapture={p=>setForm({...form,photo:p})} coachName={session.user.nombre} toast={toast} label="📷 Tomar foto (con sello)"/>
    </Card>}
    {esEvidenciaExterna&&<Card title="📷 Evidencia (obligatoria)">
      <p style={{fontSize:13,color:'var(--dim)',marginBottom:8}}>Sube foto(s) de la persona en campo y de la conversación con el avance al momento (sin sello).</p>
      <PhotoCaptureMulti photos={form.fotos} onChange={fotos=>setForm({...form,fotos})} label="Agregar foto"/>
    </Card>}
    {!esEvidenciaExterna&&<>
      <Card title="Observaciones">
        <Field label="Observación"><Textarea value={form.hallazgos} onChange={e=>setForm({...form,hallazgos:e.target.value})} placeholder="Qué se observó..."/></Field>
        <Field label="Fortalezas"><Textarea value={form.fortalezas} onChange={e=>setForm({...form,fortalezas:e.target.value})} style={{minHeight:50}}/></Field>
        <Field label="Áreas de oportunidad"><Textarea value={form.areas_oportunidad} onChange={e=>setForm({...form,areas_oportunidad:e.target.value})} style={{minHeight:50}}/></Field>
      </Card>
      <Card title="Compromisos">
        <Field label="Qué + Quién + Cuándo"><Textarea value={form.compromisos} onChange={e=>setForm({...form,compromisos:e.target.value})}/></Field>
        <Field label="Fecha de revisión"><Input type="date" value={form.fecha_revision} onChange={e=>setForm({...form,fecha_revision:e.target.value})}/></Field>
      </Card>
      <Card title="🎙️ Grabación de voz">
        <p style={{fontSize:13,color:'var(--dim)',margin:'0 0 10px'}}>Transcribe lo que se hable a texto en tiempo real (no guarda audio). Requiere autorización previa.</p>
        {!consent?<div style={{textAlign:'center',padding:12}}>
          <p style={{fontSize:14,marginBottom:8,textAlign:'left'}}>Antes de grabar, pide a los participantes que:</p>
          <ul style={{textAlign:'left',fontSize:14,margin:'0 0 12px',paddingLeft:18,color:'var(--text)'}}>
            <li>Digan su <b>nombre y puesto</b> al iniciar.</li>
            <li>Acepten en voz alta que se va a grabar este feedback.</li>
            <li>Empiecen a hablar <b>después del tono</b>.</li>
          </ul>
          <p style={{fontSize:14,fontWeight:700,marginBottom:10}}>¿Autoriza la grabación?</p>
          <div style={{display:'flex',gap:8,justifyContent:'center'}}><Btn onClick={()=>{setConsent(true);setForm({...form,grabado:true});}}>Sí</Btn><Btn variant="secondary" onClick={()=>toast('Sin autorización')}>No</Btn></div>
        </div>:
        <AudioRecorder onTranscript={t=>setForm({...form,transcript:t})}/>}
      </Card>
    </>}
    <Card title="Notas"><Textarea value={form.notas} onChange={e=>setForm({...form,notas:e.target.value})} style={{minHeight:50}}/></Card>
    {session.soloLectura?<AvisoSoloLectura nombre={session.user.nombre}/>:<Btn onClick={guardar} style={{width:'100%'}}>💾 Guardar hallazgo</Btn>}
  </div>;
}

// ─── Dashboard ───
function DashboardTab({data,setData,team,coaches,session,setTab,toast}){
  const{role}=session;
  const now=new Date();
  const mesActual=now.getMonth();const anioActual=now.getFullYear();
  const mesEvaluado=mesActual===0?MESES[11]+' '+(anioActual-1):MESES[mesActual-1]+' '+anioActual;
  const thisMonth=r=>{const d=new Date(r.date);return d.getMonth()===mesActual&&d.getFullYear()===anioActual;};
  const recs=data.records;

  const[expanded,setExpanded]=useState(null);
  const[semAbierto,setSemAbierto]=useState(null); // vendedor con el selector de semáforo desplegado

  const cierres=rm.filter(r=>r.type==='cierre').length;

  const incOp=rm.filter(r=>r.type==='feedback'&&r.tipo==='Incidencia operativa').length;
  const incCrit=rm.filter(r=>r.type==='feedback'&&r.tipo==='Incidencia crítica').length;
  const permisos=rm.filter(r=>r.type==='permiso').length;
  const totalFeedback=rm.filter(r=>r.type==='feedback').length;

  const diasMes=new Date(anioActual,mesActual+1,0).getDate();
  const diasTranscurridos=Math.min(now.getDate(),diasMes);
  const diasLabTransc=Math.round(diasTranscurridos*6/7);

  const vendedores=team.filter(m=>isVendedor(m.posicion));
  // Para el líder: la información se muestra primero agrupada por coach (no por vendedor) —
  // se profundiza a nivel vendedor solo al tocar un coach específico.
  // El Director usa exactamente el mismo agrupado, solo que con TODOS los coaches de TODOS sus
  // líderes: cada tarjeta trae además de qué líder es ese coach, y los totales de arriba
  // (ventas, metas, semáforo) terminan siendo los del distrito completo.
  const esDirector=role==='director';
  const esLider=role==='lider'||esDirector;
  const vendedoresPorCoach={};
  if(esLider){
    (coaches||[]).forEach(c=>{vendedoresPorCoach[c.nombre]=[];});
    vendedores.forEach(m=>{(vendedoresPorCoach[m.reportaA]=vendedoresPorCoach[m.reportaA]||[]).push(m);});
  }

  // ── Ventas del equipo: semana/mes en curso, rechazos, asignaciones y cuentas sin pagar ──
  const semanaIni=startOfWeek(now);
  // Las dos semanas de pago que se comparan: las dos ya cerradas antes de la que corre. La semana
  // viva nunca entra, porque su comisión se paga hasta la siguiente. Si hoy es la 37, se comparan
  // la 36 contra la 35. Las fechas son esas mismas semanas, solo para mostrarlas en pantalla.
  const semanaActualNum=semanaISO(now);
  const semanaPasadaNum=semanaMenos(semanaActualNum,1,now);
  const semanaAntepasadaNum=semanaMenos(semanaActualNum,2,now);
  // OJO con la columna V de COMISIONES: no trae la semana en que se pagó la cuenta, sino aquella
  // en que se paga la comisión de esa cuenta, que va UNA ADELANTE. O sea que las cuentas pagadas
  // en la semana 36 vienen marcadas con 37, y las de la 35 con 36. Por eso lo que se busca en V
  // está corrido un lugar respecto a lo que se muestra en pantalla: en pantalla va la semana real
  // (36 y 35, que es como las nombra el negocio) y en V se buscan 37 y 36.
  const vSemanaPasada=semanaActualNum;
  const vSemanaAntepasada=semanaMenos(semanaActualNum,1,now);
  const semanaPasadaIni=(()=>{const d=new Date(semanaIni);d.setDate(d.getDate()-7);return d;})();
  const semanaPasadaFin=endOfWeek(semanaPasadaIni);
  const semanaAntepasadaIni=(()=>{const d=new Date(semanaIni);d.setDate(d.getDate()-14);return d;})();
  const semanaAntepasadaFin=endOfWeek(semanaAntepasadaIni);
  const[periodoVentas,setPeriodoVentas]=useState('semana');
  // offsetVentas: 0 = periodo actual, 1 = el anterior, 2 = dos atrás... permite hojear semanas/meses previos
  // sin perder el resto de las tarjetas (sin pagar, pendientes), que siempre reflejan el estado de "hoy".
  const[offsetVentas,setOffsetVentas]=useState(0);
  // El servidor (obtenerVentasComisiones) solo trae los últimos VENTAS_LOOKBACK_MESES meses —
  // el tope de navegación debe coincidir exactamente, o se podría "hojear" a un periodo sin datos.
  const cutoffVentas=(()=>{const d=startOfMonth(now);d.setMonth(d.getMonth()-VENTAS_LOOKBACK_MESES);return d;})();
  const MAX_OFFSET_VENTAS=periodoVentas==='semana'
    ?Math.max(0,Math.floor((startOfWeek(now)-cutoffVentas)/(7*86400000)))
    :VENTAS_LOOKBACK_MESES;
  const cambiarPeriodoVentas=p=>{setPeriodoVentas(p);setOffsetVentas(0);};
  const fechaRefVentas=(()=>{
    const d=new Date(now);
    if(periodoVentas==='semana'){d.setDate(d.getDate()-offsetVentas*7);}
    else{d.setDate(1);d.setMonth(d.getMonth()-offsetVentas);} // día 1 primero: evita que setMonth se desborde al restar desde un día 29-31
    return d;
  })();
  const[rangoIni,rangoFin]=periodoVentas==='semana'?[startOfWeek(fechaRefVentas),endOfWeek(fechaRefVentas)]:[startOfMonth(fechaRefVentas),endOfMonth(fechaRefVentas)];
  const labelPeriodoVentas=periodoVentas==='semana'?etiquetaSemana(rangoIni,rangoFin,anioActual):etiquetaMes(rangoIni,anioActual);
  // La lista del Equipo (ficha de cada vendedor y renglón de cada coach) sigue el periodo elegido
  // aquí: si arriba se ve la semana del 7 al 13, su renglón "Semana" es esa semana y no la que corre
  // hoy. Sus dos renglones, semana y mes, salen del mismo día: el último del periodo elegido, o hoy
  // si ese periodo todavía no termina. Con una semana pasada, el mes es el de su domingo; con un mes
  // pasado, la semana es la de su último día.
  const refEquipo=rangoFin<now?rangoFin:now;
  const semEqIni=startOfWeek(refEquipo),semEqFin=endOfWeek(refEquipo);
  const mesEqIni=startOfMonth(refEquipo),mesEqFin=endOfMonth(refEquipo);
  const labelSemEq=etiquetaSemana(semEqIni,semEqFin,anioActual);
  const labelMesEq=etiquetaMes(mesEqIni,anioActual);
  const semEqEsActual=semEqIni.getTime()===semanaIni.getTime();
  const mesEqEsActual=mesEqIni.getMonth()===mesActual&&mesEqIni.getFullYear()===anioActual;
  const ventasTotal={oportunidades:0,validadas:0,instaladas:0};
  let metaInstalTotal=0;
  const rechazosMotivos={};let rechazosTotalN=0; // motivo -> [{nombre,oportunidad,cuenta}]
  const planesTotalN={};
  const planesDetalle={}; // plan -> [{nombre,cuenta,fecha}]
  const pdvTotalN={}; // pdv -> instalaciones
  const pdvPorPlan={}; // pdv -> {plan: n}
  const sinPagarPorPlan={}; // plan -> {n, importe}
  // Los otros dos cortes de las MISMAS cuentas sin pagar, para las otras dos vistas del panel.
  const sinPagarPorRango={}; // label de rango -> {n, importe, vend:{nombre -> {m,n,importe}}}
  const sinPagarPorVendedor=[]; // [{m, n, importe, rangos:{label -> {n,importe}}}]
  const instaladoPorPlan2m={}; // plan -> instalaciones (pagadas o no) entre 25 y 90 días, para el % de sin pagar
  // Ritmo de pago del equipo: de las mismas cuentas de la ventana de 25 a 90 días, las que se
  // pagaron en la semana pasada contra las de la antepasada (ambas cerradas — ver semanaPasadaIni).
  const pagosPorVendedor=[]; // [{m, pasada, antepasada, importePasada, importeAntepasada}]
  const pendientesPorVendedor=[]; // [{m, pendientes}]
  const arpuPorVendedor=[]; // [{m, arpu, n}] — ARPU promedio (sin IVA) de lo activado/instalado en el periodo
  // Mismos datos que arriba, pero agregados por coach (solo se llena si esLider).
  const porCoachLider={};
  if(esLider){
    (coaches||[]).forEach(c=>{
      porCoachLider[c.nombre]={coach:c,rechazos:{},rechazosTotal:0,planes:{},planesTotal:0,pendientes:[],pendientesTotal:0,sinPagarPorPlan:{},sinPagarPorRango:{},sinPagarPorVendedor:[],sinPagarTotal:0};
    });
  }
  const[expandedMotivo,setExpandedMotivo]=useState(null);
  const[expandedPlan,setExpandedPlan]=useState(null);
  const[expandedPendienteVendedor,setExpandedPendienteVendedor]=useState(null);
  const[abrirRechazos,setAbrirRechazos]=useState(false);
  const[abrirPlanes,setAbrirPlanes]=useState(false);
  const[abrirPendientesPanel,setAbrirPendientesPanel]=useState(false);
  const[abrirArpu,setAbrirArpu]=useState(false);
  const[expandedCoachArpu,setExpandedCoachArpu]=useState(null);
  const[expandedVendedorArpu,setExpandedVendedorArpu]=useState(null);
  const[abrirSinPagarPlan,setAbrirSinPagarPlan]=useState(false);
  const[expandedCoachRechazo,setExpandedCoachRechazo]=useState(null);
  const[expandedCoachPlan,setExpandedCoachPlan]=useState(null);
  const[expandedCoachPendiente,setExpandedCoachPendiente]=useState(null);
  const[expandedPendienteVendedorLider,setExpandedPendienteVendedorLider]=useState(null);
  const[expandedCoachSinPagar,setExpandedCoachSinPagar]=useState(null);
  // Las tres maneras de ver las mismas cuentas sin pagar: por días de espera (la de entrada, que
  // es la que dice qué urge), por vendedor o por plan.
  const[vistaSinPagar,setVistaSinPagar]=useState('dias');
  const[abrirPagos,setAbrirPagos]=useState(false);
  const[expandedCoachPago,setExpandedCoachPago]=useState(null);
  const[expandedCoachEquipo,setExpandedCoachEquipo]=useState(null);
  const[abrirPDV,setAbrirPDV]=useState(false);
  const[expandedPDV,setExpandedPDV]=useState(null);
  // Las vacantes de los coaches de estos vendedores también suman a la meta (3 por semana cada
  // una), igual que en el Plan y en el Reporte de seguimiento.
  const vacantesDash=vacantesDe(session,[...new Set(vendedores.map(m=>m.reportaA))]);
  metaInstalTotal+=periodoVentas==='semana'?vacantesDash*META_VACANTE:metaMensualVacantes(vacantesDash);
  vendedores.forEach(m=>{
    const f=funnelPeriodo(m.ventas,rangoIni,rangoFin);
    ventasTotal.oportunidades+=f.oportunidades;
    ventasTotal.validadas+=f.validadas;
    ventasTotal.instaladas+=f.instaladas;
    metaInstalTotal+=periodoVentas==='semana'?metaSemanal(m.badge):metaMensual(m.badge);
    const cLider=esLider?porCoachLider[m.reportaA]:null;

    const rz=rechazosPeriodo(m.ventas,rangoIni,rangoFin);
    rechazosTotalN+=rz.length;
    rz.forEach(v=>{
      const mo=v.motivoRechazo||'Sin motivo';
      (rechazosMotivos[mo]=rechazosMotivos[mo]||[]).push({nombre:m.nombre,oportunidad:v.oportunidad,cuenta:v.cuenta,fecha:v.creacion});
      if(cLider){
        cLider.rechazosTotal++;
        (cLider.rechazos[mo]=cLider.rechazos[mo]||[]).push({nombre:m.nombre,oportunidad:v.oportunidad,cuenta:v.cuenta,fecha:v.creacion});
      }
    });
    const planes=instalacionesPorPlan(m.ventas,rangoIni,rangoFin);
    Object.entries(planes).forEach(([p,items])=>{
      planesTotalN[p]=(planesTotalN[p]||0)+items.length;
      (planesDetalle[p]=planesDetalle[p]||[]).push(...items.map(v=>({nombre:m.nombre,cuenta:v.cuenta,fecha:v.activacion})));
      if(cLider){
        cLider.planesTotal+=items.length;
        (cLider.planes[p]=cLider.planes[p]||[]).push(...items.map(v=>({nombre:m.nombre,cuenta:v.cuenta,fecha:v.activacion})));
      }
    });
    const porPDV=instalacionesPorPDV(m.ventas,rangoIni,rangoFin);
    Object.entries(porPDV).forEach(([pdv,items])=>{
      pdvTotalN[pdv]=(pdvTotalN[pdv]||0)+items.length;
      const porPlanPDV=pdvPorPlan[pdv]=pdvPorPlan[pdv]||{};
      items.forEach(v=>{const p=normalizarPlan(v.plan);porPlanPDV[p]=(porPlanPDV[p]||0)+1;});
    });
    const instaladasArpu=(m.ventas||[]).filter(v=>v.activacion&&enRango(v.activacion,rangoIni,rangoFin));
    if(instaladasArpu.length){
      const arpuProm=instaladasArpu.reduce((s,v)=>s+(Number(v.arpu)||0),0)/instaladasArpu.length/1.16;
      const arpuPorPlan={}; // plan -> {n, sumaArpu}
      instaladasArpu.forEach(v=>{
        const p=normalizarPlan(v.plan);
        const b=arpuPorPlan[p]=arpuPorPlan[p]||{n:0,sumaArpu:0};
        b.n++;b.sumaArpu+=(Number(v.arpu)||0)/1.16;
      });
      arpuPorVendedor.push({m,arpu:arpuProm,n:instaladasArpu.length,arpuPorPlan});
    }
    // Las cuentas sin pagar de este vendedor se reparten de una vez en los tres cortes que
    // alimentan las tres vistas del panel (días, vendedor y plan): son las mismas cuentas vistas
    // de tres maneras, así que los tres totales cuadran entre sí por construcción.
    const sinPagarVend=cuentasSinPagar(m.cuentasCom,now);
    const rangosVend={}; // label -> {n, importe} — los días de ESTE vendedor, para la vista "Vendedor"
    sinPagarVend.forEach(c=>{
      const p=normalizarPlan(c.plan);
      const b=sinPagarPorPlan[p]=sinPagarPorPlan[p]||{n:0,importe:0};
      b.n++;b.importe+=c.importe;
      const r=rangoSinPagarDe(diasDesde(c.fechaInstalacion,now));
      const bv=rangosVend[r.label]=rangosVend[r.label]||{n:0,importe:0};
      bv.n++;bv.importe+=c.importe;
      acumularRangoSinPagar(sinPagarPorRango,r,m,c);
      if(cLider){
        const bc=cLider.sinPagarPorPlan[p]=cLider.sinPagarPorPlan[p]||{n:0,importe:0};
        bc.n++;bc.importe+=c.importe;
        cLider.sinPagarTotal++;
        acumularRangoSinPagar(cLider.sinPagarPorRango,r,m,c);
      }
    });
    if(sinPagarVend.length){
      const filaVend={m,n:sinPagarVend.length,importe:sinPagarVend.reduce((s,c)=>s+c.importe,0),rangos:rangosVend};
      sinPagarPorVendedor.push(filaVend);
      if(cLider)cLider.sinPagarPorVendedor.push(filaVend);
    }
    cuentasDelPeriodo(m.cuentasCom,now).forEach(c=>{
      const p=normalizarPlan(c.plan);
      instaladoPorPlan2m[p]=(instaladoPorPlan2m[p]||0)+1;
    });
    const pagadasVend=cuentasPagadas(m.cuentasCom,now);
    if(pagadasVend.length){
      const dePasada=pagadasVend.filter(c=>c.semanaPago===vSemanaPasada);
      const deAntepasada=pagadasVend.filter(c=>c.semanaPago===vSemanaAntepasada);
      if(dePasada.length||deAntepasada.length)pagosPorVendedor.push({

        importePasada:dePasada.reduce((s,c)=>s+c.importe,0),

    }
    const pend=pendientesInstalar30d(m.ventas,now);
    if(pend.length){
      pendientesPorVendedor.push({m,pendientes:pend});
      if(cLider){
        cLider.pendientes.push({m,pendientes:pend});
        cLider.pendientesTotal+=pend.length;
      }
    }
  });
  const motivosOrdenados=Object.entries(rechazosMotivos).sort((a,b)=>b[1].length-a[1].length);
  const planesOrdenados=Object.entries(planesTotalN).sort((a,b)=>b[1]-a[1]);
  const pdvOrdenados=Object.entries(pdvTotalN).sort((a,b)=>b[1]-a[1]);

  const hayCoachPDV=esLider
    ?(coaches||[]).some(c=>(c.posicion||'').toUpperCase().includes('PROMOVENDEDOR'))
    :(session.user.posicion||'').toUpperCase().includes('PROMOVENDEDOR');
  const arpuPorVendedorOrdenado=arpuPorVendedor.slice().sort((a,b)=>b.arpu-a.arpu);
  const arpuGeneral=(()=>{
    const totalN=arpuPorVendedor.reduce((s,x)=>s+x.n,0);
    if(!totalN)return 0;
    return arpuPorVendedor.reduce((s,x)=>s+x.arpu*x.n,0)/totalN;
  })();
  // Líder: mismo ARPU por vendedor de arriba, agrupado por coach — coach → vendedor → planes colocados.
  const arpuPorCoach=(()=>{
    if(!esLider)return[];
    const porCoach={};
    (coaches||[]).forEach(c=>{porCoach[c.nombre]={coach:c,vendedores:[],sumaArpu:0,totalN:0};});
    arpuPorVendedor.forEach(item=>{
      const bucket=porCoach[item.m.reportaA];
      if(!bucket)return;
      bucket.vendedores.push(item);
      bucket.sumaArpu+=item.arpu*item.n;
      bucket.totalN+=item.n;
    });
    return Object.values(porCoach).filter(c=>c.totalN>0)
      .map(c=>({...c,arpuProm:c.totalN?c.sumaArpu/c.totalN:0,vendedores:c.vendedores.slice().sort((a,b)=>b.arpu-a.arpu)}))

  })();
  // La vista por vendedor va del que más cuentas trae al que menos; la de días conserva el orden

  // qué tan cerca está de los 90 días, no cuántas cuentas hay.
  const sinPagarPorVendedorOrdenado=sinPagarPorVendedor.slice().sort((a,b)=>b.n-a.n||b.importe-a.importe);
  const sinPagarPorPlanTotales=Object.values(sinPagarPorPlan).reduce((acc,b)=>({n:acc.n+b.n,importe:acc.importe+b.importe}),{n:0,importe:0});
  const instaladoPorPlan2mTotal=Object.values(instaladoPorPlan2m).reduce((a,b)=>a+b,0);
  const sinPagarPorPlanPctTotal=instaladoPorPlan2mTotal?Math.round(sinPagarPorPlanTotales.n/instaladoPorPlan2mTotal*100):0;
  // Totales del equipo para el panel de ritmo de pago, y el mismo corte agrupado por coach.
  const pagosTotales=pagosPorVendedor.reduce((acc,x)=>({
    pasada:acc.pasada+x.pasada,antepasada:acc.antepasada+x.antepasada,
    importePasada:acc.importePasada+x.importePasada,importeAntepasada:acc.importeAntepasada+x.importeAntepasada,
  }),{pasada:0,antepasada:0,importePasada:0,importeAntepasada:0});
  const pagosPorVendedorOrdenado=pagosPorVendedor.slice().sort((a,b)=>b.pasada-a.pasada||b.antepasada-a.antepasada);
  const pagosPorCoach=(()=>{

      b.vendedores.push(item);

    });
    return Object.values(porCoach).filter(c=>c.pasada>0||c.antepasada>0)

  // Comparativo compacto "pagadas la semana pasada vs la antepasada", igual en cada renglón del panel.
