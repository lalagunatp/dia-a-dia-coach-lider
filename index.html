function ModalElegirVista({titulo,opciones,onElegir,onCerrar}){
  return <div onClick={onCerrar} style={{position:'fixed',top:0,left:0,right:0,bottom:0,background:'rgba(0,0,0,.5)',zIndex:9998,display:'flex',alignItems:'flex-end',justifyContent:'center'}}>
    <div onClick={e=>e.stopPropagation()} style={{background:'var(--card)',width:'100%',maxWidth:600,borderRadius:'16px 16px 0 0',padding:18,maxHeight:'75vh',overflowY:'auto'}}>
      <h3 style={{margin:'0 0 4px',fontSize:16,fontWeight:800}}>{titulo}</h3>
      <p style={{margin:'0 0 12px',fontSize:13,color:'var(--dim)'}}>Verás la app tal como la ve esa persona, en modo consulta.</p>
      {opciones.length===0
        ?<p style={{color:'var(--dim)',fontSize:14}}>No hay nadie disponible en este nivel.</p>
        :opciones.map(o=>
          <button key={o.numEmp||o.nombre} onClick={()=>onElegir(o)}
            style={{display:'block',width:'100%',textAlign:'left',padding:'11px 12px',marginBottom:8,borderRadius:10,border:'1px solid var(--border)',background:'var(--input)',color:'var(--text)',cursor:'pointer'}}>
            <div style={{fontWeight:700,fontSize:14}}>{o.nombre}</div>
            <div style={{fontSize:13,color:'var(--dim)'}}>{o.posicion||''}</div>
          </button>)}
      <Btn variant="secondary" onClick={onCerrar} style={{width:'100%',marginTop:4}}>Cancelar</Btn>
    </div>
  </div>;
}
// Barra bajo el encabezado, para Director y Líder. El director entra a la vista de un líder y,
// desde ahí, a la de uno de sus coaches (nivel 0 = su propia vista, 1 = líder, 2 = coach); el
// líder entra directo a la de uno de sus coaches (nivel 0 = la suya, 1 = coach). Se regresa un
// nivel a la vez. En los dos casos el último nivel es un coach: abajo ya solo hay vendedores, que
// no entran a la app — por eso la profundidad máxima es 2 para el director y 1 para el líder.
function BarraVistaPrestada({sessionBase,vistas,onAbrir,onRegresar,onSalir,abriendo}){
  const[eligiendo,setEligiendo]=useState(false);
  const esDirector=sessionBase.role==='director';
  const nivel=vistas.length;
  const actual=nivel?vistas[nivel-1]:null;
  // Nivel 0: para el director, sus líderes (van en `lideres`, aparte de `coaches`, que para él son
  // todos los coaches del distrito); para el líder, sus coaches. Nivel 1 (solo director): los
  // coaches del líder en el que ya se entró. El `||sessionBase.coaches` cubre una sesión guardada
  // de antes de que existiera `lideres`.
  const raiz=esDirector
    ?(sessionBase.lideres&&sessionBase.lideres.length?sessionBase.lideres:sessionBase.coaches)
    :sessionBase.coaches;
  const opciones=(actual?actual.coaches:raiz)||[];
  const puedeBajar=nivel<(esDirector?2:1)&&opciones.length>0;
  const ruta=vistas.map(v=>nombreCorto(v.user.nombre)).join(' › ');
  const chip={fontSize:13,fontWeight:700,padding:'6px 10px',borderRadius:8,border:'none',cursor:abriendo?'default':'pointer'};
  return <>
    <div style={{display:'flex',alignItems:'center',gap:6,flexWrap:'wrap',padding:'8px 14px',background:nivel?'var(--ybg)':'var(--accent-light)',borderBottom:'1px solid var(--border)'}}>
      <span style={{flex:1,minWidth:150,fontSize:13,fontWeight:700,color:nivel?'var(--yellow)':'var(--accent)'}}>
        {nivel?`👁️ Viendo como ${ruta} · solo consulta`:esDirector?'👔 Estás en tu vista de director':'⭐ Estás en tu vista de líder'}
      </span>
      {puedeBajar&&<button onClick={()=>setEligiendo(true)} disabled={!!abriendo} style={{...chip,background:'var(--accent)',color:'#fff',opacity:abriendo?.6:1}}>
        {abriendo?'Abriendo…':esDirector&&nivel===0?'👁️ Ver como líder':'👁️ Ver un coach'}
      </button>}
      {nivel>0&&<button onClick={onRegresar} disabled={!!abriendo} style={{...chip,background:'var(--card)',color:'var(--text)',border:'1px solid var(--border)'}}>← Regresar</button>}
      {nivel>1&&<button onClick={onSalir} disabled={!!abriendo} style={{...chip,background:'var(--card)',color:'var(--dim)',border:'1px solid var(--border)'}}>Salir de la vista</button>}
    </div>
    {eligiendo&&<ModalElegirVista
      titulo={nivel>0?'Ver la app como uno de sus coaches':esDirector?'Ver la app como uno de tus líderes':'Ver la app como uno de tus coaches'}
      opciones={opciones}
      onElegir={o=>{setEligiendo(false);onAbrir(o);}}
      onCerrar={()=>setEligiendo(false)}/>}
  </>;
}

function MainApp({session,setSession,onLogout,sessionBase,vistas,onAbrirVista,onRegresarVista,onSalirVista}){
  const[datosLocales,setDatosLocales]=useState(loadData());
  const[tab,setTab]=useState('dashboard');
  const[toastMsg,setToastMsg]=useState('');
  const toast=msg=>setToastMsg(msg);
  useEffect(()=>{retryPending(toast,setDatosLocales);},[]);
  const{user,team,coaches,role}=session;
  const enVista=!!session.verComo; // está viendo la app como un líder/coach de su equipo
  // Los registros guardados en ESTE teléfono son de quien inició sesión, no del líder/coach que
  // está viendo. Los de esa persona están en el Sheet (todo se sincroniza al guardar), así que se
  // traen de ahí y se reconstruyen a la forma local — con eso los contadores, el semáforo, el
  // plan de la semana y el historial se ven igual que en su propio teléfono, en vez de en 0.
  const[registrosVista,setRegistrosVista]=useState(null); // null = todavía cargando (ver efecto abajo)
  const data=enVista?{records:registrosVista||[],pendingSync:[]}:datosLocales;
  // En vista prestada nada se guarda (los botones de captura ya están bloqueados) — este setter
  // vacío evita además que algo escriba en localStorage los registros de otra persona.
  const setData=enVista?(()=>{}):setDatosLocales;
  const allTeam=[...(coaches||[]),...team];
  // Líder y Director supervisan a través de coaches (el director, los de todos sus líderes).
  const supervisaCoaches=role==='lider'||role==='director';
  const chipsEquipo=role==='director'?(session.lideres||[]):role==='lider'?(coaches||[]):[];
  const todayRecs=data.records.filter(r=>r.date===today());
  const hasArr=todayRecs.some(r=>r.type==='arranque');
  const hasCie=todayRecs.some(r=>r.type==='cierre');
  const roleLabels={coach:'🏅 Coach',lider:'⭐ Líder',director:'👔 Director',gestor:'🧑‍💼 Gestor CH'};

  // Botón flotante "Actualizar información" (todos los roles): re-trae ranking/ventas/cuentas del
  // equipo y fuerza a Arranque/Plan/Permisos a releer el historial del Sheet sin recargar la app.
  // La sesión se guarda en localStorage y sobrevive a cerrar la app por completo, así que sin esto
  // los datos podrían quedarse desactualizados indefinidamente entre una conexión y la siguiente.
  const[refreshKey,setRefreshKey]=useState(0);
  const[refreshing,setRefreshing]=useState(false);

  // Vista prestada: traer del Sheet los registros de esa persona (al entrar, al cambiar de
  // persona y al tocar "Actualizar información"). `cancelado` evita que una respuesta lenta de
  // la vista anterior pise a la nueva si se cambia de persona antes de que llegue.
  useEffect(()=>{
    if(!enVista){setRegistrosVista(null);return;}
    let cancelado=false;
    setRegistrosVista(null);
    fetchRegistrosPropiosDelSheet(session).then(recs=>{if(!cancelado)setRegistrosVista(recs);});
    return()=>{cancelado=true;};
  },[session.verComo,refreshKey]);
  const actualizarInfo=async()=>{
    if(refreshing)return;
    setRefreshing(true);
    try{
      // En vista prestada se refresca esa vista (sin tocar lo guardado en localStorage, que
      // sigue siendo la sesión propia de quien entró); en la propia, el refresco de siempre.
      if(enVista)setSession(await cargarVistaComo(session.token,{numEmp:session.verComo}));
      else await refrescarYPersistirSesion(session,setSession);
      setRefreshKey(k=>k+1);
      toast('🔄 Información actualizada');
    }catch(e){
      console.error(e);
      if(esSesionExpirada(e)){
        toast('⚠️ Tu sesión expiró, vuelve a iniciar sesión');
        onLogout();
      }else{
        toast('⚠️ No se pudo actualizar, intenta de nuevo');
      }
    }
    setRefreshing(false);
  };

  // Entrar a la vista de un líder/coach: traer su sesión completa toma unos segundos (perfil +
  // ranking + ventas), así que el botón avisa que está abriendo y la app se queda usable mientras.
  const[abriendoVista,setAbriendoVista]=useState('');
  const abrirVista=async objetivo=>{
    if(abriendoVista)return;
    setAbriendoVista(objetivo.nombre||'…');
    try{
      await onAbrirVista(objetivo);
      setTab('dashboard');
      toast(`👁️ Viendo como ${nombreCorto(objetivo.nombre)}`);
    }catch(e){
      console.error(e);
      if(esSesionExpirada(e)){
        toast('⚠️ Tu sesión expiró, vuelve a iniciar sesión');
        onLogout();
      }else toast('⚠️ No se pudo abrir esa vista, intenta de nuevo');
    }
    setAbriendoVista('');
  };

  const exportReporte=()=>{
    const html=generarReporteHTML(data,user,roleLabels[role]);
    const blob=new Blob([html],{type:'text/html'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`reporte-supervision-${today()}.html`;a.click();toast('📥 Reporte descargado');
  };

  // El marco se acomoda solo con CSS según la pantalla (ver .app en el <style>). En vertical:
  // encabezado, resumen y la barra de secciones, que se queda fija arriba al bajar. Acostado (celular
  // con poca altura) y desde 1024 px de ancho (tablet acostada, laptop): las secciones pasan a una
  // barra lateral para dejarle toda la altura al contenido. Dashboard e Historial aprovechan el ancho;
  // los formularios de captura se quedan a un ancho cómodo de leer y llenar.
  const anchoContenido=tab==='dashboard'||tab==='historial'?'ancho-amplio':'ancho-angosto';
  // Con la barra fija se puede cambiar de sección estando a media página: la nueva sección se
  // abre desde su inicio, no a la altura en que iba la anterior.
  const contenidoRef=useRef(null);
  const irATab=id=>{
    setTab(id);
    const arriba=contenidoRef.current?contenidoRef.current.getBoundingClientRect().top:0;
    if(arriba<0)window.scrollTo({top:0});
  };
  return <div className="app">
    <header className="app-enc">
      <div className="app-enc-titulo">
        <h1>Supervisión 2.0</h1>
        <p>{roleLabels[role]} · {user.nombre}</p>
      </div>
      <div className="app-enc-acciones">
        {hasArr&&<span style={{fontSize:15}}>☀️</span>}
        {hasCie&&<span style={{fontSize:15}}>🌙</span>}
        {/* El reporte se arma con los registros de este teléfono — en vista prestada no hay
            ninguno de esa persona, así que saldría en blanco: mejor no ofrecerlo ahí. */}
        {!enVista&&<button onClick={exportReporte} style={{background:'rgba(255,255,255,.15)',border:'none',borderRadius:8,padding:'5px 8px',color:'#fff',cursor:'pointer',fontSize:15}} title="Descargar reporte">📥</button>}
        <button onClick={onLogout} style={{background:'rgba(255,255,255,.15)',border:'none',borderRadius:8,padding:'5px 8px',color:'#fff',cursor:'pointer',fontSize:13,fontWeight:700}} title="Cerrar sesión">Salir</button>
      </div>
    </header>

    {/* Cambio de vista (Director y Líder) */}
    {(sessionBase.role==='director'||sessionBase.role==='lider')&&<BarraVistaPrestada
      sessionBase={sessionBase} vistas={vistas} abriendo={abriendoVista}
      onAbrir={abrirVista} onRegresar={onRegresarVista} onSalir={onSalirVista}/>}

    <div className="app-cuerpo">
      <nav className="app-nav" aria-label="Secciones">
        {TABS.map(t=><button key={t.id} onClick={()=>irATab(t.id)} className={tab===t.id?'activa':undefined} aria-current={tab===t.id?'page':undefined}>
          <span className="app-nav-icono">{t.icon}</span><span>{t.label}</span>
        </button>)}
        {/* Director y líderes (por su propio puesto, aunque estén en vista prestada) */}
        {(sessionBase.role==='director'||sessionBase.role==='lider')&&<button onClick={()=>window.open(REPORTE_COMERCIAL_URL,'_blank','noopener')} title="Abre el Reporte comercial en el Reporte de seguimiento">
          <span className="app-nav-icono">🧾</span><span>Reporte</span>
        </button>}
      </nav>

      <main className="app-main">
        <div className="app-resumen"><div className={anchoContenido}>
          <div className="app-stats">
            {[{l:'Hoy',v:todayRecs.length,c:'var(--accent)'},{l:'Equipo',v:team.length,c:'var(--green)'},{l:supervisaCoaches?'Coaches':'Total',v:supervisaCoaches?(coaches||[]).length:data.records.length,c:'#7c3aed'},{l:'Registros',v:data.records.length,c:'#ca8a04'}].map(s=>
              <div key={s.l} className="app-stat"><b style={{color:s.c}}>{s.v}</b><span>{s.l}</span></div>
            )}
          </div>

          {/* Team info — el líder ve sus coaches; el director, sus líderes (sus coaches son decenas
              y no caben como chips: van agrupados en la tarjeta de Distrito por Coach del Dashboard). */}
          {chipsEquipo.length>0&&
            <div style={{paddingBottom:8,display:'flex',gap:4,flexWrap:'wrap'}}>
              {chipsEquipo.map(c=><span key={c.nombre} style={{fontSize:13,background:'var(--accent-light)',color:'var(--accent)',padding:'2px 8px',borderRadius:10,fontWeight:600}}>{c.nombre.split(' ').slice(0,2).join(' ')}</span>)}
            </div>
          }

          {/* Ventas/ranking no cargaron: hay que decirlo con todas sus letras. Un Dashboard en ceros
              por una lectura fallida se ve idéntico a uno en ceros porque no hubo ventas, y así se
              han perdido horas buscando el problema del lado equivocado. */}
          {session.avisoDatos&&<p style={{margin:'0 0 10px',fontSize:13,fontWeight:600,color:'var(--red)',background:'var(--rbg)',border:'1.5px solid var(--red)',borderRadius:8,padding:'9px 11px'}}>
            ⚠️ Esta vez {session.avisoDatos}. Los números de oportunidades, validadas e instaladas de abajo salen en cero por eso — no es que el equipo no haya vendido. Toca 🔄 para reintentar.
          </p>}

          {/* En vista prestada los registros de esa persona se leen del Sheet — mientras llegan, los
              contadores están incompletos y hay que decirlo, o se leerían como "no trabajó". */}
          {enVista&&<p style={{margin:'0 0 10px',fontSize:13,color:'var(--dim)',background:'var(--card)',border:'1px dashed var(--border)',borderRadius:8,padding:'8px 10px'}}>
            {registrosVista===null
              ?`⏳ Cargando del Sheet los registros de ${nombreCorto(user.nombre)}…`
              :`📄 ${registrosVista.length} registro${registrosVista.length!==1?'s':''} de ${nombreCorto(user.nombre)} leídos del Sheet.`}
          </p>}
        </div></div>

        {/* Content — la `key` cambia al entrar/salir de una vista prestada, para que las pestañas
            se vuelvan a montar de cero y no arrastren el formulario a medio llenar ni los paneles
            ya cargados de la persona anterior. */}
        <div key={session.verComo||'propia'} ref={contenidoRef} className="app-contenido"><div className={anchoContenido}>
          {tab==='dashboard'&&<DashboardTab data={data} setData={setData} team={allTeam} coaches={coaches} session={session} setTab={irATab} toast={toast}/>}
          {tab==='arranque'&&<ArranqueTab data={data} setData={setData} team={allTeam} toast={toast} session={session} refreshKey={refreshKey}/>}
          {tab==='permisos'&&<PermisosTab data={data} setData={setData} team={allTeam} toast={toast} session={session} refreshKey={refreshKey}/>}
          {tab==='cierre'&&<CierreTab data={data} setData={setData} team={allTeam} toast={toast} session={session} refreshKey={refreshKey}/>}
          {tab==='plan'&&<PlanTab data={data} setData={setData} team={allTeam} toast={toast} session={session} refreshKey={refreshKey}/>}
          {tab==='feedback'&&<FeedbackTab data={data} setData={setData} team={allTeam} toast={toast} session={session} refreshKey={refreshKey}/>}
          {tab==='historial'&&<HistorialTab data={data} session={session}/>}
        </div></div>
      </main>
    </div>
    <button onClick={actualizarInfo} disabled={refreshing} title="Actualizar información"
      style={{position:'fixed',bottom:20,right:16,zIndex:50,width:52,height:52,borderRadius:'50%',
        background:'var(--accent)',color:'#fff',border:'none',boxShadow:'0 4px 14px rgba(0,0,0,.3)',
        fontSize:22,cursor:refreshing?'default':'pointer',display:'flex',alignItems:'center',justifyContent:'center'}}>
      {refreshing?<span style={{display:'inline-block',width:20,height:20,border:'2.5px solid rgba(255,255,255,.4)',borderTop:'2.5px solid #fff',borderRadius:'50%',animation:'spin .8s linear infinite'}}/>:'🔄'}
    </button>
    {toastMsg&&<Toast msg={toastMsg} onClose={()=>setToastMsg('')}/>}
  </div>;
}

// ═══ APP ROOT ═══
function App(){
  const[session,setSession]=useState(null);
  const[avisoSesion,setAvisoSesion]=useState('');
  // Pila de vistas prestadas (Director y Líder): [] = su propia vista; para el director,
  // [líder] = viendo a un líder y [líder, coach] = viendo a un coach de ese líder; para el líder,
  // [coach]. "Regresar" saca la de arriba. Vive solo en memoria: al recargar la app se entra
  // siempre por la vista propia.
  const[vistas,setVistas]=useState([]);
  const vistaActiva=vistas.length?vistas[vistas.length-1]:null;
  const abrirVista=async objetivo=>{
    const vista=await cargarVistaComo(session.token,objetivo);
    setVistas(v=>[...v,vista]);
  };
  // MainApp trabaja con la sesión activa sin saber si es propia o prestada: este setter manda el
  // cambio a donde corresponde (la vista de arriba de la pila, o la sesión propia).
  const setSessionActiva=upd=>{
    if(vistas.length)setVistas(v=>[...v.slice(0,-1),typeof upd==='function'?upd(v[v.length-1]):upd]);
    else setSession(upd);
  };
  // localStorage (no sessionStorage): al reabrir la app en campo sin señal, se entra directo con
  // la última sesión guardada en vez de quedarse atorado en la pantalla de login. Si esa sesión
  // guardada quedó incompleta o de una versión vieja de la app (le falta token/user/role), se
  // descarta en vez de arriesgarse a que truene MainApp con datos a medias — mejor pedir login
  // una vez que dejar la app "rota" hasta que alguien la cierre y la abra de nuevo a mano.
  useEffect(()=>{
    try{
      const s=localStorage.getItem('sv2-session');
      if(!s)return;
      const parsed=JSON.parse(s);
      if(parsed&&parsed.token&&parsed.user&&parsed.role){
        const revivida=revivirFechasSesion(parsed);
        // Sesión que se guardó sin ventas por tamaño (ver guardarSesionLocal): arranca en ceros
        // hasta que termine el refresco de abajo, y eso hay que decirlo — reusa el mismo aviso
        // que cuando la lectura de ventas falla.
        if(parsed.sinVentasGuardadas)revivida.avisoDatos='las ventas no se guardaron en este dispositivo por su tamaño, se están volviendo a cargar';
        setSession(revivida);
        // La app ya abre al instante con lo guardado — de fondo, sin bloquear ni avisar, se
        // refresca contra el servidor. Así una sesión que quedó con ventas/ranking vacíos (por
        // ejemplo por una falla de red justo al guardarla la última vez) se autocorrige sola en
        // cuanto haya señal, sin que la persona tenga que saber que existe el botón "Actualizar
        // información" — antes se quedaba así indefinidamente hasta que alguien lo tocara a mano.
        // Si en cambio el token ya venció, ni esto ni el botón manual pueden renovarlo — hay que
        // mandar de vuelta al login (con un aviso) en vez de dejar la app viendo datos viejos para
        // siempre sin que la persona entienda por qué.
        refrescarYPersistirSesion(revivida,setSession).catch(e=>{
          if(esSesionExpirada(e)){
            localStorage.removeItem('sv2-session');
            setSession(null);
            setAvisoSesion('Tu sesión expiró. Vuelve a iniciar sesión con tu PIN.');
          }
        });
      }else localStorage.removeItem('sv2-session');
    }catch{localStorage.removeItem('sv2-session');}
  },[]);
  const logout=()=>{localStorage.removeItem('sv2-session');setVistas([]);setSession(null);};
  if(!session)return <LoginScreen onLogin={setSession} aviso={avisoSesion}/>;
  return <MainApp session={vistaActiva||session} setSession={setSessionActiva} onLogout={logout}
    sessionBase={session} vistas={vistas} onAbrirVista={abrirVista}
    onRegresarVista={()=>setVistas(v=>v.slice(0,-1))} onSalirVista={()=>setVistas([])}/>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
<script>
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('./sw.js').then(reg=>{
      // El navegador solo revisa si hay una versión nueva del shell de vez en cuando por su cuenta
      // — se fuerza aquí para que un despliegue nuevo se note lo antes posible al abrir la app.
      reg.update().catch(()=>{});
    }).catch(()=>{});
  });
  // Si mientras la app está abierta se activa una versión nueva del service worker (se acaba de
  // desplegar algo), se recarga sola en vez de quedarse corriendo con JS viejo hasta que alguien
  // la cierre y la vuelva a abrir a mano. "controllerchange" también dispara la PRIMERA vez que
  // esta pestaña queda bajo control de un service worker (no solo en una actualización real) —
  // se ignora esa primera vez para no recargar de más justo al abrir la app.
  let yaHuboControlador=!!navigator.serviceWorker.controller;
  let recargandoPorSW=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{
    if(!yaHuboControlador){yaHuboControlador=true;return;}
    if(recargandoPorSW)return;
    recargandoPorSW=true;
    location.reload();
  });
}
</script>
