<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Supervisión 2.0</title>
<meta name="theme-color" content="#1e3a8a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Supervisión">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📋</text></svg>">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='18' fill='%231e40af'/><text x='50' y='68' font-size='60' text-anchor='middle'>📋</text></svg>">
<!-- React/ReactDOM/Babel vendorizados en ./vendor (mismo origen que este archivo, servidos por
     GitHub Pages) en vez de bajarlos de unpkg.com en cada arranque. Antes, aunque el HTML cargara
     bien desde GitHub Pages, el arranque completo dependía de que el navegador TAMBIÉN pudiera
     alcanzar un segundo origen distinto (unpkg.com/Cloudflare) — con una red que tuviera problemas
     específicamente con ese CDN (o solo con ese, no con Fastly/GitHub Pages), la app se quedaba en
     blanco aunque el resto sí cargara. Con todo bajo el mismo origen, un solo camino de red decide
     si la app arranca o no. Versión: react-dom 18.3.1, babel standalone 7.24.7. -->
<script src="./vendor/react.production.min.js"></script>
<script src="./vendor/react-dom.production.min.js"></script>
<script src="./vendor/babel.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
/* 15px de base: lo que se lee cómodo en un celular a pleno sol y en una laptop sin acercarse.
   Casi todo el texto trae su tamaño en línea, pero esto fija el piso de lo que no lo trae y evita
   que algo herede los 16px del navegador y se vea fuera de escala. */
body{font-family:'Inter',system-ui,-apple-system,sans-serif;background:#f0f2f8;color:#1a1d29;-webkit-font-smoothing:antialiased;font-size:15px;line-height:1.45}
:root{--bg:#f0f2f8;--card:#fff;--text:#1a1d29;--dim:#6b7086;--border:#e2e4ec;--accent:#1e40af;--accent2:#3b82f6;--accent-light:#dbeafe;--input:#f8f9fc;--green:#16a34a;--yellow:#ca8a04;--red:#dc2626;--gbg:#f0fdf4;--ybg:#fefce8;--rbg:#fef2f2;--nest-bg:#f7f3ec;--nest-border:#d9c9a8}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.anim{animation:fadeIn .2s ease-out}
input,textarea,select,button{font-family:inherit}
textarea{resize:vertical}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-thumb{background:#c4c8d4;border-radius:4px}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const{useState,useEffect,useRef,useCallback}=React;

// ═══ CONFIG ═══
// Ya no queda ningún dato (ni siquiera el catálogo de Clusters/Colonias) leído directo del
// navegador por gviz — todo pasa por el servidor con token, ver apps-script.gs.
const DOPOST_URL='https://script.google.com/macros/s/AKfycbx7DYc01sJV7QJsA9kVdtgW0JOZdyySjLqqHzszA9qsDE3xt8kpr7SfrdF2KqseVTr0/exec';
// Con datos móviles inestables, un fetch a Apps Script puede quedarse colgado (ni resuelve ni
// truena) en vez de fallar rápido — sin este tope, eso dejaba el login (u otros fetch) esperando
// para siempre con el spinner puesto, sin ningún mensaje de error. 25s es holgado (Apps Script
// puede tardar varios segundos leyendo hojas grandes), pero acotado.
function fetchConTope(url,opts,ms=25000){
  return Promise.race([
    fetch(url,opts),
    new Promise((_,rej)=>setTimeout(()=>rej(new Error('La conexión está tardando demasiado, intenta de nuevo')),ms)),
  ]);
}
// Debe coincidir con VENTAS_LOOKBACK_MESES en apps-script.gs, que es donde de verdad se aplica
// el filtro ahora (obtenerVentasComisiones) — aquí solo se usa para que el navegador de "Ventas
// del equipo" en el Dashboard no deje hojear a un periodo más viejo del que el servidor trae.
const VENTAS_LOOKBACK_MESES=3;
// Meta semanal de instalaciones por ranking (misma convención que informeseguimiento/avancecomisiones).
const META_SEMANAL_RANKING={ENTRENAMIENTO:3,CONDICIONADO:3,BRONCE:3,PLATA:4,ORO:5,PLATINO:6,DIAMANTE:6};
const metaSemanal=badge=>META_SEMANAL_RANKING[badge]||0;
const metaMensual=badge=>Math.round(metaSemanal(badge)*4.33);

// ═══ HELPERS ═══
const today=()=>new Date().toISOString().slice(0,10);
const now=()=>new Date().toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'});
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const fmt=d=>{if(!d)return'';const p=d.split('-');return`${p[2]}/${p[1]}/${p[0]}`};
// Nombre completo → primeros 3 tramos ("APELLIDO APELLIDO NOMBRE"), para que quepa en chips y barras.
const nombreCorto=n=>String(n||'').split(' ').slice(0,3).join(' ');

const STATUS={
  verde:{bg:'var(--gbg)',border:'var(--green)',label:'Verde'},
  amarillo:{bg:'var(--ybg)',border:'var(--yellow)',label:'Amarillo'},
  rojo:{bg:'var(--rbg)',border:'var(--red)',label:'Rojo'},
};
// El color solo no dice qué hacer. Cada uno lleva su significado y su emoji para que marcarlo no
// dependa de que cada coach se acuerde del criterio.
const SEM_EMOJI={verde:'🟢',amarillo:'🟡',rojo:'🔴'};
const SEM_OPCIONES=[
  {valor:'verde',emoji:'🟢',titulo:'Va bien',ayuda:'Cumple meta y ritmo'},
  {valor:'amarillo',emoji:'🟡',titulo:'Ojo',ayuda:'Se está quedando corto'},
  {valor:'rojo',emoji:'🔴',titulo:'Urgente',ayuda:'Necesita plan de acción'},
];
const TABS=[
  {id:'dashboard',icon:'📈',label:'Dashboard'},
  {id:'plan',icon:'📊',label:'Plan'},
  {id:'arranque',icon:'☀️',label:'Arranque'},
  {id:'permisos',icon:'📋',label:'Permisos'},
  {id:'cierre',icon:'🌙',label:'Cierre'},
  {id:'feedback',icon:'💬',label:'Hallazgos'},
  {id:'historial',icon:'📁',label:'Historial'},
];
// "Trabajo fuera de ruta" y "Actividad especial" no son ausencias: el vendedor sí trabaja, solo que
// fuera de su ruta. Por eso aparecen tanto aquí (Arranque) como en Permisos, y en los dos lados son
// los únicos que piden el compromiso del día — el resto de motivos no tiene nada que comprometer.
const ABSENCE_REASONS=['Falta justificada','Falta injustificada','Incapacidad','Permiso autorizado','Vacaciones','Descanso','Retardo','Trabajo fuera de ruta','Actividad especial','Otro'];
const PERMISO_TIPOS=['Trabajo fuera de ruta','Salida anticipada','Actividad especial','Otro'];
const TIPOS_CON_COMPROMISO=['Trabajo fuera de ruta','Actividad especial'];
const FEEDBACK_TIPOS=['Acompañamiento','Feedback 1 a 1','Revisión semanal','Incidencia operativa','Incidencia crítica','Retroalimentación','Evidencia de asignación externa','Otro'];
// Tipos de hallazgo que requieren foto sellada (como en Arranque) obligatoria.
const FEEDBACK_TIPOS_CON_FOTO=['Acompañamiento','Evidencia de asignación externa'];
const DIAS_SEMANA=['lunes','martes','miercoles','jueves','viernes','sabado','domingo'];
const DIAS_SEMANA_LABEL={lunes:'Lunes',martes:'Martes',miercoles:'Miércoles',jueves:'Jueves',viernes:'Viernes',sabado:'Sábado',domingo:'Domingo'};
// Compromiso vs. meta oficial: rojo si se comprometen por debajo, negro si es igual, verde si es mayor.
const colorVsMeta=(val,meta)=>{const v=Number(val)||0;if(!meta)return'var(--text)';if(v<meta)return'var(--red)';if(v>meta)return'var(--green)';return'#000';};

// ═══ STORAGE ═══
const LS_KEY='supervision-v2';
function loadData(){try{const d=localStorage.getItem(LS_KEY);return d?JSON.parse(d):{records:[],pendingSync:[]};}catch{return{records:[],pendingSync:[]};}}
function saveData(data){try{localStorage.setItem(LS_KEY,JSON.stringify(data));}catch(e){console.error(e);}}

// ═══ SYNC TO DIRECTOR'S SHEET ═══
async function sendToSheet(record){
  if(!DOPOST_URL)return{ok:false,error:'URL no configurada'};
  try{
    // Las fotos SÍ se envían: el Apps Script las sube a Drive y guarda la liga en el Sheet.
    const payload={...record};
    const res=await fetchConTope(DOPOST_URL,{method:'POST',body:JSON.stringify(payload),headers:{'Content-Type':'text/plain'}});
    const json=await res.json();
    return json;
  }catch(e){
    console.error('Sync error:',e);
    return{ok:false,error:e.message};
  }
}
// Guardar localmente + enviar al Sheet del Director
async function saveAndSync(data,record,toast,setData){
  saveData(data);
  if(DOPOST_URL){
    const result=await sendToSheet(record);
    if(!result.ok){
      // Guardar en cola pendiente para reintentar
      const pending=JSON.parse(localStorage.getItem('sv2-pending')||'[]');
      pending.push(record);
      // Si el almacenamiento está lleno esto truena, y hasta ahora se llevaba de corbata al
      // guardado completo — el registro ya quedó en `data`, así que se avisa y se sigue.
      try{
        localStorage.setItem('sv2-pending',JSON.stringify(pending));
        toast?.('⚠️ Guardado local — sin conexión al Sheet');
      }catch(e){
        console.error('No se pudo encolar el registro pendiente:',e);
        toast?.('⚠️ Sin conexión y sin espacio para la cola — vuelve a guardarlo con señal');
      }
    }else if(setData&&(result.fotoGrupoUrl||result.fotoGrupoSubidaUrl||result.fotosAusentes||result.fotoUrl||result.fotosEvidencia)){
      // Ya se subieron a Drive: se reemplaza la foto pesada (base64) local por la liga,
      // para que no se quede ocupando espacio en el teléfono.
      setData(d=>{
        const records=d.records.map(r=>{
          if(r.id!==record.id)return r;
          const upd={...r};
          if(result.fotoGrupoUrl)upd.photo=result.fotoGrupoUrl;
          if(result.fotoGrupoSubidaUrl)upd.photoSubida=result.fotoGrupoSubidaUrl;
          if(result.fotoUrl)upd.photo=result.fotoUrl;
          if(result.fotosEvidencia)upd.fotos=result.fotosEvidencia;
          if(result.fotosAusentes&&upd.ausentes){
            upd.ausentes=upd.ausentes.map(a=>{
              const found=result.fotosAusentes.find(f=>f.name===a.name);
              return found?{...a,photo:found.url}:a;
            });
          }
          return upd;
        });
        const nuevo={...d,records};
        saveData(nuevo);
        return nuevo;
      });
    }
  }
}
// Reintentar pendientes
async function retryPending(toast,setData){
  if(!DOPOST_URL)return;
  const pending=JSON.parse(localStorage.getItem('sv2-pending')||'[]');
  if(pending.length===0)return;
  const still=[];
  for(const rec of pending){
    const r=await sendToSheet(rec);
    if(!r.ok){still.push(rec);continue;}
    if(setData&&(r.fotoGrupoUrl||r.fotoGrupoSubidaUrl||r.fotosAusentes||r.fotoUrl||r.fotosEvidencia)){
      setData(d=>{
        const records=d.records.map(x=>{
          if(x.id!==rec.id)return x;
          const upd={...x};
          if(r.fotoGrupoUrl)upd.photo=r.fotoGrupoUrl;
          if(r.fotoGrupoSubidaUrl)upd.photoSubida=r.fotoGrupoSubidaUrl;
          if(r.fotoUrl)upd.photo=r.fotoUrl;
          if(r.fotosEvidencia)upd.fotos=r.fotosEvidencia;
          if(r.fotosAusentes&&upd.ausentes){
            upd.ausentes=upd.ausentes.map(a=>{
              const found=r.fotosAusentes.find(f=>f.name===a.name);
              return found?{...a,photo:found.url}:a;
            });
          }
          return upd;
        });
        const nuevo={...d,records};
        saveData(nuevo);
        return nuevo;
      });
    }
  }
  try{localStorage.setItem('sv2-pending',JSON.stringify(still));}catch(e){console.error('No se pudo actualizar la cola de pendientes:',e);}
  if(still.length===0&&pending.length>0)toast?.('✅ Registros pendientes sincronizados');
}
// Cuando el Director está viendo la app "como" uno de sus líderes/coaches, todas las lecturas
// llevan además ?verComo=<numEmp> — el servidor valida ahí que ese objetivo sea suyo y responde
// como si preguntara esa persona (ver apps-script.gs: resolverUsuarioVista). Sin él, se lee
// normal, como el dueño del token.
const qsVerComo=verComo=>verComo?`&verComo=${encodeURIComponent(verComo)}`:'';

// Historial del equipo leído del Sheet del Director (no solo lo capturado en este teléfono).
// `token` (emitido por fetchLogin) es obligatorio: el servidor valida la sesión y filtra
// el historial por jerarquía ahí mismo, ya no confía en que el cliente se autolimite.
async function fetchHistorialEquipo(hoja,token,verComo){
  if(!DOPOST_URL||!token)return[];
  try{
    const res=await fetchConTope(`${DOPOST_URL}?accion=historial&hoja=${encodeURIComponent(hoja||'ARRANQUE')}&token=${encodeURIComponent(token)}${qsVerComo(verComo)}`);
    const json=await res.json();
    if(!json.ok)return[];
    return json.registros||[];
  }catch(e){console.error('Historial equipo fetch error:',e);return[];}
}
// "Nombre: liga; Nombre: liga" (como lo guarda el Apps Script) → [{nombre, url}]
function parseFotosAusentes(txt){
  if(!txt)return[];
  return String(txt).split(';').map(s=>s.trim()).filter(Boolean).map(s=>{
    const m=s.match(/^(.*?):\s*(https?:\/\/.+)$/);
    return m?{nombre:m[1].trim(),url:m[2].trim()}:{nombre:s,url:''};
  }).filter(f=>f.url);
}

// ═══ REGISTROS DEL SHEET → FORMA LOCAL ═══
// Todo lo que se captura se guarda en el teléfono de quien lo capturó Y se manda al Sheet
// (saveAndSync). En la vista prestada del director no hay nada local de esa persona, así que sus
// registros se reconstruyen desde el Sheet: es la misma información que escribió buildRow
// (apps-script.gs), leída de vuelta al shape que usan Dashboard/Plan/Arranque/Cierre/Historial,
// para que los contadores, el semáforo, el plan de la semana y el historial se vean completos.
// Dos cosas no se pueden reconstruir porque el Sheet no las guarda: los NOMBRES de los presentes
// en un arranque (solo queda el total, que es lo que se muestra) y las fotos, que llegan como
// liga de Drive en vez de la imagen embebida (la app ya sabe abrir ambas, ver FotoMini).
const HOJA_POR_TIPO={arranque:'ARRANQUE',permiso:'PERMISO',cierre:'CIERRE',plan:'PLAN',plan_resultado:'PLAN_RESULTADO',feedback:'FEEDBACK',semaforo:'SEMAFORO'};
const nNum=v=>Number(v)||0;
// "Nombre: resto; Nombre: resto" → [{nombre,resto}] — el formato de lista que usa buildRow.
function partirLista(txt){
  return String(txt||'').split(';').map(s=>s.trim()).filter(Boolean).map(s=>{
    const i=s.indexOf(':');
    return i===-1?{nombre:s,resto:''}:{nombre:s.slice(0,i).trim(),resto:s.slice(i+1).trim()};
  });
}
// Inverso de formatZonas: "Lunes: Colonia (Cluster), Otra (todo) · 📍 dirección · 💬 comentario | Martes: …"
function parsearZonas(txt){
  if(!txt)return null;
  const porLabel={};DIAS_SEMANA.forEach(d=>{porLabel[DIAS_SEMANA_LABEL[d].toLowerCase()]=d;});
  const zonas={};
  String(txt).split('|').forEach(bloque=>{
    const i=bloque.indexOf(':');
    if(i===-1)return;
    const dia=porLabel[bloque.slice(0,i).trim().toLowerCase()];
    if(!dia)return;
    const dz={entradas:[],direccion:'',comentarios:''};
    bloque.slice(i+1).split('·').map(p=>p.trim()).filter(Boolean).forEach(parte=>{
      if(parte.startsWith('📍'))dz.direccion=parte.slice(2).trim();
      else if(parte.startsWith('💬'))dz.comentarios=parte.slice(2).trim();
      else{
        // "Colonia (Cluster)" → {cluster,colonia}; "Cluster (todo)" → cluster completo (así se
        // guarda también el coach que prioriza un líder: su nombre en `cluster`, colonia null).
        const re=/([^,(]+)\(([^)]+)\)/g;let m;
        while((m=re.exec(parte))!==null){
          const etiqueta=m[1].trim(),dentro=m[2].trim();
          if(dentro.toLowerCase()==='todo')dz.entradas.push({cluster:etiqueta,colonia:null});
          else dz.entradas.push({cluster:dentro,colonia:etiqueta});
        }
      }
    });
    zonas[dia]=dz;
  });
  return Object.keys(zonas).length?zonas:null;
}
// Una fila del Sheet (objeto {encabezado: valor}) → un registro con la misma forma que los que
// guarda la app en el teléfono. `desdeSheet` marca su origen (se usa para no ofrecer "Eliminar",
// que solo tiene sentido sobre lo local).
function recordDesdeFila(tipo,f){
  const base={id:f['ID']||uid(),type:tipo,date:f['Fecha']||'',registradoPor:f['Registrado por']||'',
    savedAt:String(f['Timestamp']||f['Fecha']||''),desdeSheet:true};
  switch(tipo){
    case'arranque':{
      const fotosAus=parseFotosAusentes(f['Fotos evidencia ausentes']);
      const fotosVendedores={};
      parseFotosAusentes(f['Fotos por vendedor']).forEach(x=>{fotosVendedores[x.nombre]=x.url;});
      return{...base,time:f['Hora']||'',rolRegistro:f['Rol']||'',
        presentes:new Array(nNum(f['Presentes'])).fill(''), // el Sheet guarda cuántos, no quiénes
        ausentes:partirLista(f['Detalle ausentes']).map(({nombre,resto})=>{
          const partes=resto.split('—');
          return{name:nombre,reason:(partes[0]||'').trim(),detail:(partes[1]||'').trim(),
            photo:(fotosAus.find(x=>x.nombre===nombre)||{}).url||null};
        }),
        notas:f['Notas']||'',photo:f['Foto grupo']||null,photoSubida:f['Foto grupo subida']||null,fotosVendedores};
    }
    case'permiso':
      return{...base,vendedor:f['Integrante']||'',tipo:f['Tipo']||'',motivo:f['Motivo']||'',
        compromiso:{cuentas:nNum(f['Compromiso Cuentas']),ventas:nNum(f['Compromiso Ventas']),instalaciones:nNum(f['Compromiso Instalaciones'])},
        colonia:f['Colonia']||'',autorizado_por:f['Autorizado por']||'',notas:f['Notas']||'',
        photo:f['Foto evidencia']||null};
    case'cierre':
      return{...base,time:f['Hora']||'',
        resultados:partirLista(f['Resultados por vendedor']).map(({nombre,resto})=>({
          nombre,
          oportunidades:nNum((resto.match(/(\d+)\s*op\b/)||[])[1]),
          validadas:nNum((resto.match(/(\d+)\s*val\b/)||[])[1]),
          instaladas:nNum((resto.match(/(\d+)\s*inst\b/)||[])[1]),
          pagadasHoy:nNum((resto.match(/(\d+)\s*pagadas/)||[])[1]),
          pendiente:((resto.match(/Pendiente:\s*(.*)$/)||[])[1]||'').trim(),
        })),
        incidencias:f['Incidencias']||'',
        seguimiento:partirLista(f['Seguimiento mañana']).map(({nombre,resto})=>({name:nombre,motivo:resto})),
        notas:f['Notas']||''};
    case'plan':
      return{...base,semanaLabel:f['Semana']||'',semanaInicio:f['Semana inicio']||'',semanaFin:f['Semana fin']||'',
        objetivos:{oportunidades:nNum(f['Obj. Oportunidades']),ventas:nNum(f['Obj. Ventas']),instalaciones:nNum(f['Obj. Instalaciones']),cuentasRecuperadas:nNum(f['Obj. Cuentas recuperadas NPPF']),arpu:nNum(f['Obj. ARPU'])},
        metaOficial:{oportunidades:nNum(f['Meta Oportunidades']),ventas:nNum(f['Meta Ventas']),instalaciones:nNum(f['Meta Instalaciones'])},
        prioridades:f['Prioridades']||'',vendedores_acompanar:f['Acompañamientos']||'',
        zonas:parsearZonas(f['Zonas']),resultado_esperado:f['Resultado esperado']||'',notas:f['Notas']||''};
    case'plan_resultado':
      return{...base,planId:f['Plan ID']||'',semanaLabel:f['Semana']||'',
        objetivos:{oportunidades:nNum(f['Obj. Oportunidades']),ventas:nNum(f['Obj. Ventas']),instalaciones:nNum(f['Obj. Instalaciones'])},
        resultados:{oportunidades:nNum(f['Real Oportunidades']),ventas:nNum(f['Real Ventas']),instalaciones:nNum(f['Real Instalaciones']),cuentasRecuperadas:nNum(f['Real Cuentas recuperadas NPPF']),arpu:nNum(f['Real ARPU'])}};
    case'feedback':{
      // "Evidencia de asignación externa" guarda varias ligas separadas por "; " en la misma
      // columna que la foto única del acompañamiento — se distinguen por el separador.
      const col=String(f['Foto evidencia']||'').trim();
      const fotos=col.includes(';')?col.split(';').map(s=>s.trim()).filter(Boolean):[];
      return{...base,vendedor:f['Integrante']||'',tipo:f['Tipo']||'',semaforo:f['Semáforo']||'',
        hallazgos:f['Hallazgos']||'',fortalezas:f['Fortalezas']||'',areas_oportunidad:f['Áreas de oportunidad']||'',
        compromisos:f['Compromisos']||'',fecha_revision:f['Fecha revisión']||'',
        grabado:String(f['Grabado']||'').toUpperCase().startsWith('S'),transcript:f['Transcripción']||'',
        notas:f['Notas']||'',photo:fotos.length?null:(col||null),fotos};
    }
    case'semaforo':
      return{...base,vendedor:f['Integrante']||'',semaforo:f['Semáforo']||'',nota:f['Nota']||''};
    default:return null;
  }
}
// Semáforo vigente de cada vendedor. Sale de dos lados: los hallazgos viejos, que traían el
// semáforo adentro, y los registros nuevos de tipo 'semaforo' que se ponen desde el Dashboard.
// Se ordena todo junto por savedAt y gana el más reciente, así que a quien ya estaba semaforizado
// por un hallazgo se le sigue viendo su color hasta que alguien lo cambie desde el panel Equipo.
function construirSemaforoMap(records){
  const map={};
  (records||[])
    .filter(r=>(r.type==='feedback'||r.type==='semaforo')&&r.vendedor&&r.semaforo)
    .sort((a,b)=>String(a.savedAt||'').localeCompare(String(b.savedAt||'')))
    .forEach(r=>{map[r.vendedor]={valor:r.semaforo,fecha:r.date||'',porQuien:r.registradoPor||'',desde:r.type};});
  return map;
}
// Los registros que capturó ESA persona (los suyos, no los de su equipo), de las 6 hojas.
async function fetchRegistrosPropiosDelSheet(session){
  const nombre=session?.user?.nombre;
  if(!nombre||!session?.token)return[];
  const listas=await Promise.all(Object.entries(HOJA_POR_TIPO).map(([tipo,hoja])=>
    fetchHistorialEquipo(hoja,session.token,session.verComo)
      .then(filas=>filas.filter(f=>f['Registrado por']===nombre).map(f=>recordDesdeFila(tipo,f)).filter(Boolean))
      .catch(e=>{console.error('Registros del Sheet:',hoja,e);return[];})));
  return listas.flat().sort((a,b)=>a.savedAt.localeCompare(b.savedAt));
}

function startOfWeek(date){ // lunes de la semana que contiene `date`
  const d=new Date(date);d.setHours(0,0,0,0);
  const diff=(d.getDay()+6)%7; // Mon=0..Sun=6
  d.setDate(d.getDate()-diff);
  return d;
}
function endOfWeek(date){
  const d=startOfWeek(date);
  d.setDate(d.getDate()+6);d.setHours(23,59,59,999);
  return d;
}
function startOfMonth(date){const d=new Date(date.getFullYear(),date.getMonth(),1);d.setHours(0,0,0,0);return d;}
function endOfMonth(date){const d=new Date(date.getFullYear(),date.getMonth()+1,0);d.setHours(23,59,59,999);return d;}
function enRango(fecha,inicio,fin){return fecha&&fecha>=inicio&&fecha<=fin;}
const fmtDateObj=d=>d?`${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`:'';
// yyyy-mm-dd en hora LOCAL (a diferencia de toISOString, que es UTC y puede recorrer la fecha un día).
const ymdLocal=d=>d?`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`:'';
const fmtMoney=n=>'$'+Number(n||0).toLocaleString('es-MX',{minimumFractionDigits:2,maximumFractionDigits:2});
const whatsappUrl=text=>`https://wa.me/?text=${encodeURIComponent(text)}`;
// Este estatus es la espera normal del primer pago del cliente, no algo accionable — no se muestra.
const ESTATUS_PAGO_OCULTO='COMISION RETENIDA AL PAGO DE LA PRIMER FACTURA DE SERVICIO';
const motivoNoPagado=c=>c.estatusPago&&c.estatusPago.toUpperCase()!==ESTATUS_PAGO_OCULTO?c.estatusPago:'';
function textoCuentasSinPagar(m,cuentas,ref){
  const lineas=cuentas.map(c=>{
    const motivo=motivoNoPagado(c);
    const dias=diasDesde(c.fechaInstalacion,ref);
    return `• ${c.cuenta} · ${c.cliente} · ${fmtDateObj(c.fechaInstalacion)} (${dias} día${dias!==1?'s':''}) · ${c.plan} · ${fmtMoney(c.importe)}${motivo?' · '+motivo:''}`;
  }).join('\n');
  return `📋 Cuentas sin pagar de ${m.nombre} (25 a 90 días de instaladas):\n\n${lineas}`;
}
function textoPendientesInstalar(m,pendientes,ref){
  const lineas=pendientes.map(v=>{
    const dias=Math.floor((ref-v.validacion)/86400000);
    const asig=(m.asignacionesPorOS||{})[v.os]||0;
    return `• ${v.cuenta} · ${v.os} · ${dias} día${dias!==1?'s':''} sin activar · ${asig} asignación${asig!==1?'es':''}`;
  }).join('\n');
  return `📋 Cuentas validadas sin instalar de ${m.nombre} (últ. 30 días):\n\n${lineas}`;
}
// Normaliza un día de zonas a {entradas,direccion,comentarios} — acepta también el formato
// viejo (un simple array de entradas) de planes guardados antes de agregar carpa/comentarios.
function diaZonas(zonas,d){
  const v=zonas?.[d];
  if(Array.isArray(v))return{entradas:v,direccion:'',comentarios:''};
  return v||{entradas:[],direccion:'',comentarios:''};
}
// Zonas por día ({lunes:{entradas:[{cluster,colonia}],direccion,comentarios},...}) → texto plano,
// una línea por día con actividad (zonas y/o punto de reunión y/o comentarios).
function zonasATexto(zonas){
  if(!zonas)return'';
  return DIAS_SEMANA.filter(d=>{
    const dz=diaZonas(zonas,d);
    return dz.entradas.length||dz.direccion||dz.comentarios;
  }).map(d=>{
    const dz=diaZonas(zonas,d);
    const partes=[];
    if(dz.entradas.length)partes.push(dz.entradas.map(e=>e.colonia?`${e.colonia} (${e.cluster})`:`${e.cluster} (todo)`).join(', '));
    if(dz.direccion)partes.push(`📍 ${dz.direccion}`);
    if(dz.comentarios)partes.push(`💬 ${dz.comentarios}`);
    return `${DIAS_SEMANA_LABEL[d]}: ${partes.join(' · ')}`;
  }).join('\n');
}
function textoPlan(rec){
  const o=rec.objetivos||{},m=rec.metaOficial||{};
  const lineas=[
    `📊 Plan de la semana — ${rec.semanaLabel}`,'',
    '🎯 Objetivo:',
    `• Oportunidades: ${o.oportunidades||0} (meta ${m.oportunidades??'-'})`,
    `• Ventas/validaciones: ${o.ventas||0} (meta ${m.ventas??'-'})`,
    `• Instalaciones: ${o.instalaciones||0} (meta ${m.instalaciones??'-'})`,
    `• Cuentas recuperadas NPPF: ${o.cuentasRecuperadas||0}`,
    `• ARPU: ${fmtMoney(o.arpu)}`,
  ];
  if(rec.prioridades)lineas.push('',`📌 Prioridades: ${rec.prioridades}`);
  if(rec.vendedores_acompanar)lineas.push('',`🤝 Acompañamientos: ${rec.vendedores_acompanar}`);
  const zt=zonasATexto(rec.zonas);
  if(zt)lineas.push('','🗺️ Zonas:',zt);
  if(rec.resultado_esperado)lineas.push('',`✅ Resultado esperado: ${rec.resultado_esperado}`);
  return lineas.join('\n');
}
function textoCierre(rec){
  const lineas=[`🌙 Cierre del día — ${fmt(rec.date)}${rec.time?' · '+rec.time:''}`,''];
  const resultados=(rec.resultados||[]).filter(x=>x.oportunidades||x.validadas||x.instaladas||x.pagadasHoy||x.pendiente);
  if(resultados.length){
    lineas.push('📊 Resultado del día:');
    resultados.forEach(x=>lineas.push(`• ${x.nombre}: ${x.oportunidades||0} op · ${x.validadas||0} val · ${x.instaladas||0} inst${x.pagadasHoy?` · ${x.pagadasHoy} pagada(s) hoy`:''}${x.pendiente?` — Pendiente: ${x.pendiente}`:''}`));
  }
  if(rec.incidencias)lineas.push('',`⚠️ Incidencias: ${rec.incidencias}`);
  if((rec.seguimiento||[]).length){
    lineas.push('','🔁 Seguimiento mañana:');
    rec.seguimiento.forEach(s=>lineas.push(`• ${s.name}${s.motivo?`: ${s.motivo}`:''}`));
  }
  if(rec.notas)lineas.push('',`📝 Notas: ${rec.notas}`);
  return lineas.join('\n');
}

// Login y refresco de sesión ahora se validan del lado del servidor (ver apps-script.gs:
// iniciarSesion/refrescarPerfil) — la app ya NO descarga el roster completo ni el PIN de
// nadie al navegador, ni decide aquí a quién le toca ver qué equipo. El servidor regresa
// solo lo que corresponde a este usuario, más un token firmado para las siguientes llamadas
// (historial, doPost) — así ya no hace falta reenviar el PIN después de este primer paso.
async function fetchLogin(numEmp,pin){
  try{
    const res=await fetchConTope(`${DOPOST_URL}?accion=login&numEmp=${encodeURIComponent(numEmp)}&pin=${encodeURIComponent(pin)}`);
    return await res.json();
  }catch(e){return{ok:false,error:'Error de conexión, intenta de nuevo'};}
}
// Re-trae team/coaches/role con el token (sin volver a pedir el PIN) — botón "Actualizar información".
async function fetchPerfil(token,verComo){
  try{
    const res=await fetchConTope(`${DOPOST_URL}?accion=perfil&token=${encodeURIComponent(token)}${qsVerComo(verComo)}`);
    return await res.json();
  }catch(e){return{ok:false,error:'Error de conexión, intenta de nuevo'};}
}

// Ranking, ventas/comisiones y asignaciones ahora también se piden al servidor con el token
// (ver fetchVentasComisiones/fetchRanking) — comparte el mismo pipeline entre login y refresco.
async function enriquecerSesion({user,team,coaches,lideres,role},token,verComo){
  const[rank,vtas]=await Promise.all([fetchRanking(token,verComo),fetchVentasComisiones(token,verComo)]);
  const{rankEnt,rankMen}=rank;
  const{ventasByVendedor,cuentasByHomologado,asignacionesPorOS}=vtas;
  const attachVentas=m=>({...m,
    ventas:ventasByVendedor[m.numEmp]||ventasByVendedor[m.numEmpB]||[],
    cuentasCom:cuentasByHomologado[m.numEmp]||cuentasByHomologado[m.numEmpB]||[],
    asignacionesPorOS,
  });
  return{
    user,
    team:sortByRanking(enrichTeam(team,rankEnt,rankMen).map(attachVentas)),
    coaches:sortByRanking(enrichTeam(coaches,rankEnt,rankMen).map(attachVentas)),
    // Solo el Director trae líderes (nivel arriba de los coaches); para el resto viene vacío.
    lideres:sortByRanking(enrichTeam(lideres||[],rankEnt,rankMen).map(attachVentas)),
    role,
    // Si ventas o ranking no cargaron, la sesión queda marcada: sin esto el Dashboard mostraba
    // ceros que se leen como "el equipo no vendió nada" cuando en realidad la lectura falló.
    avisoDatos:[vtas.error&&('no se pudieron cargar las ventas del equipo ('+vtas.error+')'),
                rank.error&&('no se pudo cargar el ranking ('+rank.error+')')].filter(Boolean).join(' y '),
  };
}

// Re-ejecuta el pipeline de datos (ranking/ventas/cuentas/asignaciones) para la sesión ya
// autenticada — usado por el botón flotante "Actualizar información".
async function refrescarDatosSesion(token,verComo){
  const perfil=await fetchPerfil(token,verComo);
  if(!perfil.ok)throw new Error(perfil.error||'No se pudo actualizar la sesión');
  return enriquecerSesion(perfil,token,verComo);
}

// Vuelve a traer ranking/ventas/cuentas para una sesión ya autenticada, guarda el resultado en
// localStorage y actualiza el estado — usado tanto al abrir la app (automático, en segundo plano,
// para que una sesión guardada con ventas vacías por ejemplo por una falla de red se autocorrija
// sola) como por el botón flotante "Actualizar información" (manual).
async function refrescarYPersistirSesion(sesionBase,setSession){
  const nuevo=await refrescarDatosSesion(sesionBase.token);
  const nuevaSesion={...sesionBase,...nuevo,loginTime:new Date().toISOString()};
  // Descarta cualquier `allEmployees`/PIN que pudiera venir de una sesión guardada antes de este
  // cambio (el servidor ya nunca los manda, pero una sesión vieja guardada localmente sí podría
  // traerlos) — no se vuelven a persistir.
  delete nuevaSesion.allEmployees;
  if(nuevaSesion.user)delete nuevaSesion.user.pin;
  guardarSesionLocal(nuevaSesion);
  setSession(nuevaSesion);
  return nuevaSesion;
}
// El token de sesión vence (ver apps-script.gs: TOKEN_VIGENCIA_MS) — cuando eso pasa, ni el
// refresco automático ni el botón manual pueden renovarlo solos, así que hay que distinguirlo de
// una simple falla de red para poder mandar a la persona de vuelta al login en vez de dejarla
// viendo datos viejos para siempre sin explicación.
const esSesionExpirada=e=>/expirada|inválida/i.test(e?.message||'');

// ═══ VISTA PRESTADA DEL DIRECTOR ═══
// Trae la sesión COMPLETA de uno de sus líderes (o de un coach de ese líder) tal como la vería
// esa persona: mismo pipeline que un login normal, pero pidiéndole al servidor que responda
// "como" ese objetivo (?verComo, validado allá). Va marcada `soloLectura` — el director consulta,
// no captura a nombre de nadie — y NO se guarda en localStorage: lo persistido sigue siendo la
// sesión del director, para que al reabrir la app entre en su propia vista.
async function cargarVistaComo(tokenBase,objetivo){
  const nuevo=await refrescarDatosSesion(tokenBase,objetivo.numEmp);
  return{...nuevo,token:tokenBase,verComo:objetivo.numEmp,soloLectura:true,loginTime:new Date().toISOString()};
}

// ═══ VENTAS, COMISIONES, ASIGNACIONES Y RANKING ═══
// Antes se leían directo de "BASE LA LAGUNA 2026" por gviz (obligaba a compartir ese Sheet
// ampliamente) — ahora el servidor hace la misma lectura y el mismo parseo dinámico de columnas
// de ranking (ver apps-script.gs: obtenerVentasComisiones/obtenerRanking), pero acotado por
// token a lo que le toca ver a cada quien. El shape que regresan sigue siendo el mismo de
// siempre, así que enrichTeam/attachVentas/funnelPeriodo/etc. no necesitaron ningún cambio.
// Las fechas viajan como texto ISO (JSON no tiene tipo Date) y se reconstruyen aquí.
const reviveFecha=s=>s?new Date(s):null;
// Si la fecha de validación quedó capturada a futuro (después de hoy), no cuenta como validada
// todavía — se trata como si no tuviera fecha de validación. Aplica solo a "validacion" (no a
// creacion/activacion/fechaInstalacion, que reviveFecha también reconstruye).
function reviveValidacion(s){
  const d=reviveFecha(s);
  if(!d)return d;
  const hoy=new Date();hoy.setHours(0,0,0,0);
  return d>hoy?null:d;
}

// Al guardar la sesión en localStorage (para poder abrir la app sin señal) las fechas dentro de
// ventas/cuentasCom se vuelven texto — igual que cuando viajan del servidor — y hay que
// reconstruirlas al leerla de vuelta, o cualquier código que espere un Date ahí (cuentasSinPagar,
// funnelPeriodo, etc.) truena. Los fetch frescos (login, "Actualizar información") no lo
// necesitan: ya pasan por reviveFecha en fetchVentasComisiones antes de guardarse.
function revivirFechasMiembro(m){
  return {
    ...m,
    ventas:(m.ventas||[]).map(v=>({...v,creacion:reviveFecha(v.creacion),validacion:reviveValidacion(v.validacion),activacion:reviveFecha(v.activacion)})),
    cuentasCom:(m.cuentasCom||[]).map(c=>({...c,fechaInstalacion:reviveFecha(c.fechaInstalacion)})),
  };
}
function revivirFechasSesion(session){
  return {
    ...session,
    team:(session.team||[]).map(revivirFechasMiembro),
    coaches:(session.coaches||[]).map(revivirFechasMiembro),
    lideres:(session.lideres||[]).map(revivirFechasMiembro),
  };
}

// La sesión del Director trae el distrito completo (cientos de vendedores con sus ventas de 3
// meses): son varios MB, y localStorage da ~5MB por sitio para TODO — ahí también viven los
// registros capturados en el teléfono (con fotos en base64 mientras no se suben a Drive). Si la
// sesión se acapara ese espacio, la siguiente escritura truena; cuando eso pasaba en el login,
// el error salía por el catch de handleLogin y la app decía "Error al conectar con la base de
// datos": el director no podía ni entrar. Por eso se decide POR TAMAÑO antes de escribir, en vez
// de provocar el error para atraparlo: si no cabe holgada, se guarda la misma sesión sin ventas
// ni cuentas (el refresco automático al abrir las vuelve a traer en cuanto hay señal).
const LIMITE_SESION_BYTES=2000000;
function guardarSesionLocal(sesion){
  const sinVentas=m=>({...m,ventas:[],cuentasCom:[],asignacionesPorOS:{}});
  const ligera=()=>JSON.stringify({...sesion,
    team:(sesion.team||[]).map(sinVentas),
    coaches:(sesion.coaches||[]).map(sinVentas),
    lideres:(sesion.lideres||[]).map(sinVentas),
    sinVentasGuardadas:true, // para avisar al abrir por qué arranca en ceros mientras refresca
  });
  try{
    const completa=JSON.stringify(sesion);
    if(completa.length<=LIMITE_SESION_BYTES){localStorage.setItem('sv2-session',completa);return;}
    localStorage.setItem('sv2-session',ligera());
    console.warn(`Sesión de ${(completa.length/1048576).toFixed(1)} MB: se guardó sin ventas para no llenar el almacenamiento.`);
  }catch(e){
    try{
      localStorage.setItem('sv2-session',ligera());
    }catch(e2){
      // Ni la ligera cabe: se borra lo que hubiera para no dejar una sesión a medias que reviva mal.
      try{localStorage.removeItem('sv2-session');}catch(e3){}
      console.error('No se pudo guardar la sesión localmente:',e2);
    }
  }
}

// Es la lectura más pesada de todas (BASE DE DATOS + COMISIONES + OS POR INSTALAR completas, que
// crecen mes con mes), así que se le da bastante más margen que a las demás: con el tope normal
// de 25s, en cuanto la lectura se pasaba de ahí el navegador la cortaba y el Dashboard se quedaba
// en ceros — indistinguible de "el equipo no vendió nada".
const TOPE_VENTAS_MS=90000;
async function fetchVentasComisiones(token,verComo){
  const vacio={ventasByVendedor:{},cuentasByHomologado:{},asignacionesPorOS:{}};
  if(!token)return vacio;
  try{
    const res=await fetchConTope(`${DOPOST_URL}?accion=ventas&token=${encodeURIComponent(token)}${qsVerComo(verComo)}`,undefined,TOPE_VENTAS_MS);
    const json=await res.json();
    if(!json.ok){console.error('Ventas fetch error:',json.error);return{...vacio,error:json.error||'el servidor no pudo leerlas'};}
    const ventasByVendedor={};
    Object.entries(json.ventasByVendedor||{}).forEach(([k,lista])=>{
      ventasByVendedor[k]=lista.map(v=>({...v,creacion:reviveFecha(v.creacion),validacion:reviveValidacion(v.validacion),activacion:reviveFecha(v.activacion)}));
    });
    const cuentasByHomologado={};
    Object.entries(json.cuentasByHomologado||{}).forEach(([k,lista])=>{
      cuentasByHomologado[k]=lista.map(c=>({...c,fechaInstalacion:reviveFecha(c.fechaInstalacion)}));
    });
    return{ventasByVendedor,cuentasByHomologado,asignacionesPorOS:json.asignacionesPorOS||{}};
  }catch(e){console.error('Ventas fetch error:',e);return{...vacio,error:e.message||'no hubo respuesta'};}
}

async function fetchRanking(token,verComo){
  const vacio={rankEnt:{},rankMen:{}};
  if(!token)return vacio;
  try{
    const res=await fetchConTope(`${DOPOST_URL}?accion=ranking&token=${encodeURIComponent(token)}${qsVerComo(verComo)}`);
    const json=await res.json();
    if(!json.ok){console.error('Ranking fetch error:',json.error);return{...vacio,error:json.error||'el servidor no pudo leerlo'};}
    return{rankEnt:json.rankEnt||{},rankMen:json.rankMen||{}};
  }catch(e){console.error('Ranking fetch error:',e);return{...vacio,error:e.message||'no hubo respuesta'};}
}

// Caché en localStorage de catálogos (clusters/colonias, PDV): si no hay señal en campo, se usa
// el último catálogo descargado en vez de dejar el formulario de Plan/Permisos sin opciones.
function cacheCatalogo(key,list){try{localStorage.setItem('sv2-cat-'+key,JSON.stringify(list));}catch{}}
function leerCatalogoCache(key){try{const s=localStorage.getItem('sv2-cat-'+key);return s?JSON.parse(s):[];}catch{return[];}}

// Catálogo de zonas para el Plan: hoja "Clusters Colonias" del mismo archivo base (Distrito La
// Laguna). Antes se leía por gviz directo del navegador (exigía que ese archivo tuviera enlace
// público) — ahora pasa por el Apps Script con token, igual que el resto, así el archivo ya puede
// restringirse a solo la cuenta del script sin romper nada (ver apps-script.gs: obtenerClusters).
async function fetchClustersColonias(token){
  if(!token)return leerCatalogoCache('clusters');
  try{
    const res=await fetchConTope(`${DOPOST_URL}?accion=clusters&token=${encodeURIComponent(token)}`);
    const json=await res.json();
    if(!json.ok){console.error('Clusters/Colonias fetch error:',json.error);return leerCatalogoCache('clusters');}
    cacheCatalogo('clusters',json.clusters||[]);
    return json.clusters||[];
  }catch(e){console.error('Clusters/Colonias fetch error:',e);return leerCatalogoCache('clusters');}
}
function buildClusterMap(list){
  const clusterToColonias={},coloniaToCluster={};
  list.forEach(({cluster,colonia})=>{
    (clusterToColonias[cluster]=clusterToColonias[cluster]||[]).push(colonia);
    coloniaToCluster[colonia]=cluster;
  });
  return{clusterToColonias,coloniaToCluster,clusters:Object.keys(clusterToColonias).sort()};
}
// Catálogo de Puntos de Venta (hoja "PDV", columna A) — Plan de Coach Promovendedor Punto de Venta.
async function fetchPDV(token){
  if(!token)return leerCatalogoCache('pdv');
  try{
    const res=await fetchConTope(`${DOPOST_URL}?accion=pdv&token=${encodeURIComponent(token)}`);
    const json=await res.json();
    if(!json.ok){console.error('PDV fetch error:',json.error);return leerCatalogoCache('pdv');}
    cacheCatalogo('pdv',json.puntos||[]);
    return json.puntos||[];
  }catch(e){console.error('PDV fetch error:',e);return leerCatalogoCache('pdv');}
}

// Oportunidades validadas en los últimos 30 días que todavía no se instalan.
function pendientesInstalar30d(ventas,ref){
  const desde=new Date(ref);desde.setDate(desde.getDate()-30);desde.setHours(0,0,0,0);
  return(ventas||[]).filter(v=>v.estatus!=='Rechazada'&&v.validacion&&!v.activacion&&enRango(v.validacion,desde,ref));
}

// Funnel de oportunidades de un vendedor en un periodo (semana o mes): creadas / validadas / instaladas.
function funnelPeriodo(ventas,inicio,fin){
  const f={oportunidades:0,validadas:0,instaladas:0};
  (ventas||[]).forEach(v=>{
    if(enRango(v.creacion,inicio,fin))f.oportunidades++;
    if(v.validacion&&enRango(v.validacion,inicio,fin))f.validadas++;
    if(v.activacion&&enRango(v.activacion,inicio,fin))f.instaladas++;
  });
  return f;
}
// ARPU promedio (columna S de BASE DE DATOS, sin IVA ÷1.16) de las ventas activadas/instaladas de
// un vendedor en un periodo.
function arpuPromedioPeriodo(ventas,inicio,fin){
  const activadas=(ventas||[]).filter(v=>v.activacion&&enRango(v.activacion,inicio,fin));
  if(!activadas.length)return 0;
  return activadas.reduce((s,v)=>s+(Number(v.arpu)||0),0)/activadas.length/1.16;
}
// Oportunidades rechazadas de un vendedor en un periodo (agrupadas por fecha de oportunidad).
function rechazosPeriodo(ventas,inicio,fin){
  return(ventas||[]).filter(v=>v.estatus==='Rechazada'&&enRango(v.creacion,inicio,fin));
}
// Quita el sufijo de versión (V1, v9, V12...) del nombre del plan para agrupar todas las
// versiones como un solo plan. "TV" no es versión (no lleva dígito) y se conserva tal cual.
function normalizarPlan(nombre){
  return String(nombre||'').replace(/\s*\bV\d+\b\s*/gi,' ').trim().replace(/\s+/g,' ')||'Sin plan';
}
// Instalaciones de un vendedor en un periodo (semana o mes), agrupadas por plan (con el detalle de cada una).
function instalacionesPorPlan(ventas,inicio,fin){
  const out={};
  (ventas||[]).forEach(v=>{
    if(v.activacion&&enRango(v.activacion,inicio,fin)){
      const p=normalizarPlan(v.plan);
      (out[p]=out[p]||[]).push(v);
    }
  });
  return out; // plan -> [venta,...]
}
// Instalaciones con canal "Punto de Venta" de un vendedor en un periodo, agrupadas por el punto
// de venta específico (columna Subcanal) — para Coach/Líder Promovendedor Punto de Venta.
function instalacionesPorPDV(ventas,inicio,fin){
  const out={};
  (ventas||[]).forEach(v=>{
    if((v.canal||'').trim().toUpperCase()!=='PUNTO DE VENTA')return;
    if(v.activacion&&enRango(v.activacion,inicio,fin)){
      const pdv=(v.subcanal||'').trim();
      const key=(!pdv||pdv==='-')?'Sin especificar':pdv;
      (out[key]=out[key]||[]).push(v);
    }
  });
  return out; // pdv -> [venta,...]
}
// Cuentas activadas/instaladas entre hace 25 y 90 días (ventana rodante por día, no por mes
// calendario) — pagadas o no, es el universo contra el que se saca el %.
// Días enteros transcurridos entre una fecha y la de referencia. Es el mismo cálculo con que se
// arma la ventana de 25 a 90 días, así que los días que se muestran por cuenta siempre cuadran
// con el motivo por el que esa cuenta está (o deja de estar) en la lista.
function diasDesde(fecha,ref){
  return fecha?Math.floor((ref-fecha)/86400000):0;
}
function cuentasDelPeriodo(cuentas,ref){
  return(cuentas||[]).filter(c=>{
    if(!c.fechaInstalacion)return false;
    const dias=diasDesde(c.fechaInstalacion,ref);
    return dias>=25&&dias<=90;
  });
}
// De esas, las que aún no se han pagado.
function cuentasSinPagar(cuentas,ref){
  return cuentasDelPeriodo(cuentas,ref)
    .filter(c=>!/^YA COMISIONADA/i.test(c.estatusPago))
    .sort((a,b)=>a.fechaInstalacion-b.fechaInstalacion);
}
// Y las que sí se pagaron: el complemento exacto de cuentasSinPagar dentro de la misma ventana,
// para que el informativo del panel cuadre siempre con el "N sin pagar de M instaladas".
function cuentasPagadas(cuentas,ref){
  return cuentasDelPeriodo(cuentas,ref).filter(c=>/^YA COMISIONADA/i.test(c.estatusPago));
}
// Número de semana ISO: el jueves de la semana decide a qué año y semana pertenece. Es la misma
// numeración con la que la hoja COMISIONES llena su columna V — verificado contra el calendario
// del negocio: la semana 36 de 2026 va del 31/08 al 06/09 y la 37 arranca el 07/09.
function semanaISO(date){
  const d=new Date(date.getFullYear(),date.getMonth(),date.getDate());
  d.setDate(d.getDate()+3-((d.getDay()+6)%7)); // jueves de esa semana
  const jueves1=new Date(d.getFullYear(),0,4); // el 4 de enero siempre cae en la semana 1
  jueves1.setDate(jueves1.getDate()+3-((jueves1.getDay()+6)%7));
  return 1+Math.round((d-jueves1)/(7*86400000));
}
// Semanas que se restan a la actual, dando la vuelta al año: en enero, la anterior a la 1 es la
// 52 (o 53) del año pasado, no la 0. Las cuentas de la ventana de 25 a 90 días son de los tres
// meses previos, así que ese número siempre cae en el año correcto.
function semanaMenos(semana,n,ref){
  let s=semana-n;
  if(s>=1)return s;
  const dic=new Date(ref.getFullYear()-1,11,28); // el 28/12 siempre cae en la última semana del año
  return semanaISO(dic)+s;
}
// Cuántas de esas cuentas traen un valor dado en la columna V de COMISIONES. Ojo: `semana` es el
// número TAL CUAL viene en V (la semana en que se paga la comisión), no la semana real en que se
// pagó la cuenta — van corridas una entre sí, ver vSemanaPasada. Las que no traen semana no se
// cuentan en ninguna: se sabe que ya se pagaron, pero no cuándo.
function pagadasEnSemana(pagadas,semana){
  return pagadas.filter(c=>c.semanaPago===semana).length;
}

// Enrich team with ranking data
function enrichTeam(team,rankEnt,rankMen){
  const reByName={};
  Object.values(rankEnt).forEach(v=>{if(v._nombre)reByName[v._nombre]=v;});
  const rmByName={};
  Object.entries(rankMen).forEach(([k,v])=>{if(v.nombre)rmByName[v.nombre]=v;});

  return team.map(m=>{
    // Only match with D (numEmp) and B (numEmpB) — NOT C (ID POSICIONES, different namespace)
    const keys=[m.numEmp,m.numEmpB].filter(k=>k&&k!=='INTERNO'&&k!=='EXTERNO');
    const re=keys.reduce((found,k)=>found||rankEnt[k],null)||reByName[m.nombre]||null;
    const rm=keys.reduce((found,k)=>found||rankMen[k],null)||rmByName[m.nombre]||null;
    // Badge is whatever the sheet itself has already decided (never recomputed here):
    // re.ranking for employees still on the ENTRENAMIENTO tab, otherwise the official
    // "RANKING <mes>" column read from the main roster tab.
    let badge=re?.ranking||rm?.badgeOficial||null;
    let mesesEnRanking=0;
    if(rm){
      // Count consecutive months at a similar install level (context only, not the badge itself).
      const u=rm.ultimos3meses;
      if(u.length>=2){
        const lvl=u[u.length-1]>=20?20:u[u.length-1]>=12?12:u[u.length-1]>=8?8:0;
        mesesEnRanking=u.filter(v=>(v>=20&&lvl>=20)||(v>=12&&v<20&&lvl>=12&&lvl<20)||(v>=8&&v<12&&lvl>=8&&lvl<12)||(v<8&&lvl<8)).length;
      }
    }
    // Missing certifications: entrenamiento tab for rookies, otherwise the BRONCE/PLATA/ORO
    // block matching their current tier (read straight from the roster sheet).
    let certFaltantes=[];
    if(re){
      if(re.certActitud!=='APROBADO')certFaltantes.push('Actitud e Imagen');
      if(re.certSist1!=='APROBADO')certFaltantes.push('Sistémica I');
      if(re.certSist2!=='APROBADO')certFaltantes.push('Sistémica II');
      if(re.certSist3!=='APROBADO')certFaltantes.push('Sistémica III');
    }else if(rm?.certFaltantes?.length){
      certFaltantes=rm.certFaltantes;
    }
    // Observación oficial de la hoja de ranking (misma prioridad que el badge: entrenamiento primero).
    const obsRaw=re?.obs||rm?.obsOficial||'';
    const obs=obsRaw&&obsRaw!=='-'?obsRaw:null;
    return{...m,
      rankingEnt:re,
      rankingMen:rm,
      badge,
      mesesEnRanking,
      certFaltantes,
      obs,
    };
  });
}

// Order used for ranking-based sorting across dashboard/lists: lowest tier first.
const RANK_ORDER=['ENTRENAMIENTO','CONDICIONADO','BRONCE','PLATA','ORO','PLATINO','DIAMANTE'];
function getInstalls(m){
  if(m.rankingMen)return m.rankingMen.promedioMensual||0;
  if(m.rankingEnt)return Number(m.rankingEnt.insUlt4)||0;
  return 0;
}
// Sin ranking primero, luego Entrenamiento → Platino ascendente; empates por menos instalaciones primero.
function sortByRanking(members){
  return[...members].sort((a,b)=>{
    const ia=RANK_ORDER.indexOf(a.badge);
    const ib=RANK_ORDER.indexOf(b.badge);
    const oa=ia===-1?-1:ia;
    const ob=ib===-1?-1:ib;
    if(oa!==ob)return oa-ob;
    return getInstalls(a)-getInstalls(b);
  });
}

// ═══ PHOTO CAPTURE ═══
// `modo`: 'ambos' (por defecto), 'camara' (solo tomar) o 'galeria' (solo subir). Cuando ya hay foto,
// los botones de arriba a la derecha son los que permiten cambiarla, y respetan el mismo modo.
// `onQuitar` agrega una ✕ para vaciar la foto (solo se usa donde la foto es opcional).
function PhotoCapture({photo,onCapture,label,modo='ambos',onQuitar}){
  const refCam=useRef();
  const refGal=useRef();
  const verCam=modo!=='galeria',verGal=modo!=='camara';
  const handle=e=>{const f=e.target.files?.[0];if(!f)return;const r=new FileReader();r.onload=ev=>{const img=new Image();img.onload=()=>{const c=document.createElement('canvas');const M=800;let w=img.width,h=img.height;if(w>M){h=h*(M/w);w=M;}c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);onCapture(c.toDataURL('image/jpeg',.7));};img.src=ev.target.result;};r.readAsDataURL(f);e.target.value='';};
  return <div>
    <input ref={refCam} type="file" accept="image/*" capture="environment" onChange={handle} style={{display:'none'}}/>
    <input ref={refGal} type="file" accept="image/*" onChange={handle} style={{display:'none'}}/>
    {photo?
      <div style={{position:'relative'}}>
        <img src={photo} alt="" style={{width:'100%',maxHeight:220,objectFit:'cover',borderRadius:10,border:'1px solid var(--border)'}}/>
        <div style={{position:'absolute',top:6,right:6,display:'flex',gap:4}}>
          {verCam&&<Btn onClick={()=>refCam.current.click()} variant="ghost" style={{background:'rgba(0,0,0,.55)',color:'#fff',borderRadius:8,fontSize:13,padding:'5px 9px'}}>📷</Btn>}
          {verGal&&<Btn onClick={()=>refGal.current.click()} variant="ghost" style={{background:'rgba(0,0,0,.55)',color:'#fff',borderRadius:8,fontSize:13,padding:'5px 9px'}}>🖼️</Btn>}
          {onQuitar&&<Btn onClick={onQuitar} variant="ghost" style={{background:'rgba(0,0,0,.55)',color:'#fff',borderRadius:8,fontSize:13,padding:'5px 9px'}}>✕</Btn>}
        </div>
      </div>
    :<>
      {label&&<p style={{fontSize:13,color:'var(--dim)',marginBottom:6}}>{label}</p>}
      <div style={{display:'flex',gap:8}}>
        {verCam&&<button onClick={()=>refCam.current.click()} style={{flex:1,padding:'18px 10px',borderRadius:12,border:'2px dashed var(--border)',background:'var(--input)',cursor:'pointer',textAlign:'center',color:'var(--dim)',fontSize:14}}>📷 Tomar foto</button>}
        {verGal&&<button onClick={()=>refGal.current.click()} style={{flex:1,padding:'18px 10px',borderRadius:12,border:'2px dashed var(--border)',background:'var(--input)',cursor:'pointer',textAlign:'center',color:'var(--dim)',fontSize:14}}>🖼️ Subir foto</button>}
      </div>
    </>}
  </div>;
}

// Foto con sello de coach, día/fecha/hora, dirección y coordenadas (geolocalización del dispositivo).
function PhotoCaptureGeo({photo,onCapture,coachName,toast,label,modo='ambos'}){
  const refCam=useRef();
  const refGal=useRef();
  const verCam=modo!=='galeria',verGal=modo!=='camara';
  const[loading,setLoading]=useState(false);
  const handle=e=>{
    const f=e.target.files?.[0];if(!f)return;
    setLoading(true);
    const r=new FileReader();
    r.onload=ev=>{
      const img=new Image();
      img.onload=async()=>{
        const M=900;let w=img.width,h=img.height;if(w>M){h=h*(M/w);w=M;}
        try{
          let coordsTxt='',direccion='';
          try{
            if(!navigator.geolocation)throw new Error('sin geolocalización');
            const pos=await new Promise((res,rej)=>navigator.geolocation.getCurrentPosition(res,rej,{enableHighAccuracy:true,timeout:8000}));
            const lat=pos.coords.latitude,lng=pos.coords.longitude;
            coordsTxt=`${lat.toFixed(5)}, ${lng.toFixed(5)}`;
            try{
              const resGeo=await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&zoom=18&addressdetails=1`,{headers:{'Accept-Language':'es'}});
              const j=await resGeo.json();
              direccion=j?.display_name||'';
            }catch(eGeo){console.error('Reverse geocoding falló:',eGeo);}
          }catch(eLoc){console.error('Geolocalización falló:',eLoc);toast?.('⚠️ No se pudo obtener ubicación (revisa permisos)');}
          const c=document.createElement('canvas');
          c.width=w;c.height=h;
          const ctx=c.getContext('2d');
          ctx.drawImage(img,0,0,w,h);
          const ahora=new Date();
          const diaFecha=ahora.toLocaleDateString('es-MX',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
          const hora=ahora.toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'});
          const lineas=[
            `👤 ${coachName||''}`,
            `📅 ${diaFecha.charAt(0).toUpperCase()+diaFecha.slice(1)}`,
            `🕒 ${hora}`,
            direccion?`📍 ${direccion}`:'',
            coordsTxt?`🌐 ${coordsTxt}`:'',
          ].filter(Boolean);
          const lh=Math.max(14,Math.round(w*0.032));
          const padY=8,boxH=lineas.length*lh+padY*2;
          ctx.fillStyle='rgba(0,0,0,.6)';
          ctx.fillRect(0,h-boxH,w,boxH);
          ctx.fillStyle='#fff';
          ctx.font=`${lh-3}px sans-serif`;
          ctx.textBaseline='top';
          lineas.forEach((linea,i)=>{
            let txt=linea;
            while(ctx.measureText(txt).width>w-16&&txt.length>10)txt=txt.slice(0,-4)+'…';
            ctx.fillText(txt,8,h-boxH+padY+i*lh);
          });
          onCapture(c.toDataURL('image/jpeg',.75));
        }catch(eStamp){
          console.error('No se pudo sellar la foto:',eStamp);
          toast?.('⚠️ No se pudo sellar la foto, se guardó sin datos');
          const c=document.createElement('canvas');
          c.width=w;c.height=h;
          c.getContext('2d').drawImage(img,0,0,w,h);
          onCapture(c.toDataURL('image/jpeg',.75));
        }
        setLoading(false);
      };
      img.src=ev.target.result;
    };
    r.readAsDataURL(f);
  };
  return <div>
    <input ref={refCam} type="file" accept="image/*" capture="environment" onChange={handle} style={{display:'none'}}/>
    <input ref={refGal} type="file" accept="image/*" onChange={handle} style={{display:'none'}}/>
    {photo?

        <div style={{position:'absolute',top:6,right:6,display:'flex',gap:4}}>
          {verCam&&<Btn onClick={()=>refCam.current.click()} variant="ghost" style={{background:'rgba(0,0,0,.55)',color:'#fff',borderRadius:8,fontSize:13,padding:'4px 8px'}}>📷</Btn>}
          {verGal&&<Btn onClick={()=>refGal.current.click()} variant="ghost" style={{background:'rgba(0,0,0,.55)',color:'#fff',borderRadius:8,fontSize:13,padding:'4px 8px'}}>🖼️</Btn>}
        </div>
      </div>
    :<>
      {label&&<p style={{fontSize:13,color:'var(--dim)',marginBottom:6}}>{label}</p>}
      <div style={{display:'flex',gap:8}}>
        {verCam&&<button onClick={()=>refCam.current.click()} disabled={loading} style={{flex:1,padding:'10px 12px',borderRadius:8,border:'2px dashed var(--border)',background:'var(--input)',cursor:loading?'wait':'pointer',textAlign:'center',color:'var(--dim)',fontSize:13}}>
          {loading?'📍 Obteniendo ubicación...':'📷 Tomar foto'}
        </button>}
        {verGal&&<button onClick={()=>refGal.current.click()} disabled={loading} style={{flex:1,padding:'10px 12px',borderRadius:8,border:'2px dashed var(--border)',background:'var(--input)',cursor:loading?'wait':'pointer',textAlign:'center',color:'var(--dim)',fontSize:13}}>
          {loading?'📍 Obteniendo ubicación...':'🖼️ Subir foto'}
        </button>}
      </div>
    </>}
  </div>;
}

// Varias fotos sin sello (persona en campo + conversación del avance, etc.) — cada toque agrega una más.
function PhotoCaptureMulti({photos,onChange,label}){
  const refCam=useRef();
  const refGal=useRef();
  const handle=e=>{
    const f=e.target.files?.[0];if(!f)return;
    const r=new FileReader();
    r.onload=ev=>{
      const img=new Image();
      img.onload=()=>{
        const c=document.createElement('canvas');const M=800;let w=img.width,h=img.height;if(w>M){h=h*(M/w);w=M;}
        c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);
        onChange([...(photos||[]),c.toDataURL('image/jpeg',.7)]);

      img.src=ev.target.result;

    r.readAsDataURL(f);

  const quitar=i=>onChange(photos.filter((_,idx)=>idx!==i));

// Tono corto (beep) antes de empezar a escuchar, para que los participantes sepan cuándo hablar.
function reproducirTono(){
  return new Promise(resolve=>{
    try{
      const ctx=new(window.AudioContext||window.webkitAudioContext)();
      const osc=ctx.createOscillator();
      const gain=ctx.createGain();
      osc.frequency.value=880;
      osc.connect(gain);gain.connect(ctx.destination);
      gain.gain.setValueAtTime(.001,ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(.2,ctx.currentTime+.02);
      gain.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.35);
      osc.start();
      osc.stop(ctx.currentTime+.35);
      osc.onended=()=>{ctx.close();resolve();};
    }catch(e){resolve();}
  });
}

// ═══ AUDIO RECORDER ═══
function AudioRecorder({onTranscript}){
  const[rec,setRec]=useState(false);const[preparando,setPreparando]=useState(false);const[txt,setTxt]=useState('');const rr=useRef(null);
  const toggle=async()=>{
    if(rec){rr.current?.stop();setRec(false);return;}
    const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
    if(!SR){alert('Navegador sin soporte de voz. Usa Chrome.');return;}
    setPreparando(true);
    await reproducirTono();
    setPreparando(false);
    const r=new SR();r.lang='es-MX';r.continuous=true;r.interimResults=true;let final=txt;
    r.onresult=e=>{let interim='';for(let i=e.resultIndex;i<e.results.length;i++){if(e.results[i].isFinal)final+=e.results[i][0].transcript+' ';else interim+=e.results[i][0].transcript;}setTxt(final+interim);onTranscript(final+interim);};
    r.onerror=()=>setRec(false);r.onend=()=>{if(rec)try{r.start();}catch{}};
    rr.current=r;r.start();setRec(true);
  };
  return <div><div style={{display:'flex',gap:8,alignItems:'center',marginBottom:8}}><Btn onClick={toggle} disabled={preparando} variant={rec?'danger':'primary'} style={{display:'flex',alignItems:'center',gap:6}}>{rec?<><span style={{width:10,height:10,borderRadius:'50%',background:'#fff',animation:'pulse 1s infinite'}}/>Detener</>:preparando?<>🔔 Suena el tono...</>:<>🎙️ Grabar</>}</Btn>{rec&&<span style={{fontSize:13,color:'var(--red)',fontWeight:600}}>● Escuchando...</span>}</div>{txt&&<Textarea value={txt} onChange={e=>{setTxt(e.target.value);onTranscript(e.target.value);}} style={{minHeight:100}}/>}</div>;
}

// ─── Arranque ───
function ArranqueTab({data,setData,team,toast,session,refreshKey}){
  const esLider=session.role==='lider';
  // Coach Promovendedor Punto de Venta: arranca en un punto de venta, oficina o con su líder
  // (foto de grupo normal), pero además cada vendedor a su cargo tiene que quedar resuelto: o sube
  // la foto de entrada de ese vendedor en su punto de venta, o lo marca ausente con el motivo
  // (falta, descanso, etc.). Ninguno se puede dejar pasar, y hasta que todos estén resueltos se
  // habilita el botón de guardar. La foto del vendedor es solo de galería (no se toma con cámara:
  // el vendedor la manda) pero sí lleva sello, porque es la evidencia de la entrada.
  const esCoachPDV=(session.user.posicion||'').toUpperCase().includes('PROMOVENDEDOR');
  const[form,setForm]=useState({date:today(),time:now(),photo:null,photoSubida:null,presentes:[],ausentes:[],fotosVendedores:{},notas:''});
  useEffect(()=>{setForm(f=>({...f,presentes:team.map(m=>m.nombre),ausentes:[]}));},[team]);
  // Catálogo de colonias: lo necesita el compromiso del día de "Trabajo fuera de ruta"/"Actividad
  // especial", igual que en Permisos.
  const[zonasData,setZonasData]=useState({clusterToColonias:{},coloniaToCluster:{},clusters:[]});
  useEffect(()=>{fetchClustersColonias(session.token).then(list=>setZonasData(buildClusterMap(list)));},[]);
  const toggle=name=>{setForm(f=>{const p=f.presentes.includes(name);return{...f,presentes:p?f.presentes.filter(n=>n!==name):[...f.presentes,name],ausentes:p?[...f.ausentes,{name,reason:'Falta justificada',detail:'',photo:null,compromiso:{cuentas:'',ventas:'',instalaciones:''},colonia:''}]:f.ausentes.filter(a=>a.name!==name)};});};
  const updAus=(name,field,val)=>setForm(f=>({...f,ausentes:f.ausentes.map(a=>a.name===name?{...a,[field]:val}:a)}));
  // Igual que en Permisos: si el motivo deja de ser uno de los que llevan compromiso, se limpia para
  // no arrastrar números de una selección anterior.
  const updMotivoAus=(name,val)=>setForm(f=>({...f,ausentes:f.ausentes.map(a=>a.name!==name?a:(
    TIPOS_CON_COMPROMISO.includes(val)?{...a,reason:val}:{...a,reason:val,compromiso:{cuentas:'',ventas:'',instalaciones:''},colonia:''}))}));
  const setFotoVendedor=(name,photo)=>setForm(f=>({...f,fotosVendedores:{...f.fotosVendedores,[name]:photo}}));

  // Líder: estatus de arranque de hoy de cada coach (leído del Sheet, cada coach lo guarda en su

  const[arranquesEquipo,setArranquesEquipo]=useState([]);
  const[cargandoArranquesEquipo,setCargandoArranquesEquipo]=useState(false);

    if(!esLider)return;
    setCargandoArranquesEquipo(true);

  },[esLider,refreshKey]);
  const coachesArranqueHoy=esLider?(session.coaches||[]).map(c=>({coach:c,row:arranquesEquipo.find(r=>r['Registrado por']===c.nombre&&r['Fecha']===hoyStr)||null})):[];
  const diaHoyKey=DIAS_SEMANA[(new Date().getDay()+6)%7];
  const semanaIniHoy=ymdLocal(startOfWeek(new Date()));
  const planLiderSemana=esLider?data.records.find(r=>r.type==='plan'&&r.registradoPor===session.user.nombre&&r.semanaInicio===semanaIniHoy):null;
  const coachesPrioridadHoy=planLiderSemana?.zonas?.[diaHoyKey]?.entradas?.map(e=>e.cluster)||[];

  // Vendedores del coach PDV que todavía no están resueltos: siguen marcados como presentes y no

  const pendientesPDV=esCoachPDV?team.filter(m=>form.presentes.includes(m.nombre)&&!form.fotosVendedores[m.nombre]):[];

              ?`${team.length-pendientesPDV.length} de ${team.length} resueltos — falta subir la foto de entrada o marcar ausente a: ${pendientesPDV.map(m=>m.nombre).join(', ')}`

                <Input placeholder="Detalle..." value={aus.detail} onChange={e=>updAus(m.nombre,'detail',e.target.value)} style={{flex:2,minWidth:130}}/>
              </div>
              {TIPOS_CON_COMPROMISO.includes(aus.reason)&&
                <CompromisoDelDia compacto compromiso={aus.compromiso} colonia={aus.colonia} zonasData={zonasData}
                  onCompromiso={c=>updAus(m.nombre,'compromiso',c)} onColonia={v=>updAus(m.nombre,'colonia',v)}/>}

            </div>}
            {esCoachPDV&&<div style={{marginTop:6}}>
              <PhotoCaptureGeo modo="galeria" photo={fotoVendedor} onCapture={p=>setFotoVendedor(m.nombre,p)} coachName={session.user.nombre} toast={toast}
                label={present?'🖼️ Subir foto de entrada en el punto de venta (obligatoria)':'🖼️ Subir foto (opcional — ya quedó justificado arriba)'}/>
              {present&&form.photo&&!fotoVendedor&&<button type="button" onClick={()=>setFotoVendedor(m.nombre,form.photo)} style={{marginTop:4,fontSize:13,background:'none',border:'none',color:'var(--accent)',cursor:'pointer',textDecoration:'underline',padding:0}}>📎 Usar la misma foto del Arranque del día</button>}

    <Card title="Notas"><Textarea value={form.notas} onChange={e=>setForm({...form,notas:e.target.value})} placeholder="Prioridades, situaciones especiales..."/></Card>

      <Btn onClick={guardar} disabled={pendientesPDV.length>0} style={{width:'100%'}}>💾 Guardar arranque</Btn>

}

// ─── Permisos ───
function PermisosTab({data,setData,team,toast,session,refreshKey}){
  const esLider=session.role==='lider';
  const[form,setForm]=useState({date:today(),vendedor:'',tipo:'Trabajo fuera de ruta',motivo:'',compromiso:{cuentas:'',ventas:'',instalaciones:''},colonia:'',autorizado_por:session.user.nombre,notas:'',photo:null});
  const[zonasData,setZonasData]=useState({clusterToColonias:{},coloniaToCluster:{},clusters:[]});
  useEffect(()=>{fetchClustersColonias(session.token).then(list=>setZonasData(buildClusterMap(list)));},[]);

  // Líder: permisos que cada coach ya otorgó a su gente, agrupados por coach (mes en curso).
  const[permisosEquipo,setPermisosEquipo]=useState([]);
  const[cargandoPermisosEquipo,setCargandoPermisosEquipo]=useState(false);
  useEffect(()=>{
    if(!esLider)return;
    setCargandoPermisosEquipo(true);
    fetchHistorialEquipo('PERMISO',session.token,session.verComo).then(regs=>{setPermisosEquipo(regs);setCargandoPermisosEquipo(false);});
  },[esLider,refreshKey]);
  const mesActual=today().slice(0,7);
  const permisosPorCoach=esLider?(session.coaches||[]).map(c=>({
    coach:c,
    permisos:permisosEquipo.filter(r=>r['Registrado por']===c.nombre&&(r['Fecha']||'').slice(0,7)===mesActual)
  })):[];
  const totalPermisosMes=permisosPorCoach.reduce((s,x)=>s+x.permisos.length,0);

  const guardar=async()=>{
    if(session.soloLectura)return; // vista prestada del director: solo consulta
    if(!form.vendedor){alert('Selecciona un integrante');return;}
    if(!form.photo){alert('Agrega una foto de evidencia (foto o conversación del motivo) para poder guardar el permiso');return;}
    const rec={id:uid(),type:'permiso',...form,registradoPor:session.user.nombre,token:session.token,savedAt:new Date().toISOString()};
    const upd={...data,records:[...data.records,rec]};setData(upd);saveAndSync(upd,rec,toast,setData);toast('✅ Permiso documentado');
    setForm({date:today(),vendedor:'',tipo:'Trabajo fuera de ruta',motivo:'',compromiso:{cuentas:'',ventas:'',instalaciones:''},colonia:'',autorizado_por:session.user.nombre,notas:'',photo:null});
  };
  // Al cambiar a un tipo que no lleva compromiso se limpia, para no guardar en el Sheet los números
  // que hayan quedado escritos de un tipo anterior.
  const cambiarTipo=v=>setForm(f=>TIPOS_CON_COMPROMISO.includes(v)
    ?{...f,tipo:v}
    :{...f,tipo:v,compromiso:{cuentas:'',ventas:'',instalaciones:''},colonia:''});
  return <div>
    {esLider&&<Card title={`🗂️ Permisos otorgados por coach — este mes (${totalPermisosMes})`}>
      {cargandoPermisosEquipo?<div style={{textAlign:'center',padding:20}}><Spinner/></div>:
      (session.coaches||[]).length===0?<p style={{color:'var(--dim)',fontSize:15}}>Sin coaches asignados.</p>:
      permisosPorCoach.map(({coach,permisos})=>
        <div key={coach.nombre} style={{marginBottom:12}}>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'6px 10px',borderRadius:8,background:'var(--bg)',fontWeight:700,fontSize:14,marginBottom:6}}>
            <span>{coach.nombre}</span>
            <span style={{fontSize:13,color:'var(--dim)'}}>{permisos.length} permiso{permisos.length!==1?'s':''}</span>
          </div>
          {permisos.length===0?<p style={{fontSize:13,color:'var(--dim)',padding:'0 10px 4px'}}>Sin permisos este mes.</p>:
          permisos.map((p,i)=>
            <div key={i} style={{marginLeft:10,marginBottom:6,padding:8,border:'1px solid var(--nest-border)',background:'var(--nest-bg)',borderRadius:8}}>
              <div style={{display:'flex',justifyContent:'space-between',fontSize:13,fontWeight:600}}>
                <span>{p['Integrante']}</span>
                <span style={{color:'var(--dim)',fontWeight:400}}>{fmt(p['Fecha'])}</span>
              </div>
              <p style={{fontSize:13,color:'var(--dim)',margin:'2px 0'}}>{p['Tipo']}{p['Motivo']?' · '+p['Motivo']:''}</p>
              {(p['Compromiso Cuentas']||p['Compromiso Ventas']||p['Compromiso Instalaciones'])&&
                <p style={{fontSize:13,margin:'2px 0'}}>🎯 Compromiso: {p['Compromiso Cuentas']||0} cuentas · {p['Compromiso Ventas']||0} ventas · {p['Compromiso Instalaciones']||0} instal.{p['Colonia']?` en ${p['Colonia']}`:''}</p>}
              {p['Autorizado por']&&<p style={{fontSize:13,color:'var(--dim)',margin:'2px 0'}}>Autorizó: {p['Autorizado por']}</p>}
            </div>
          )}
        </div>

    {!esLider&&<>
    <Card title="📋 Documentar permiso">
      <Field label="Fecha"><Input type="date" value={form.date} onChange={e=>setForm({...form,date:e.target.value})}/></Field>
      <Field label="Integrante"><Select value={form.vendedor} onChange={v=>setForm({...form,vendedor:v})} options={[{value:'',label:'— Seleccionar —'},...team.map(m=>({value:m.nombre,label:m.nombre+(isCoach(m.posicion)?' (Coach)':'')}))]}/></Field>
      <Field label="Tipo"><Select value={form.tipo} onChange={cambiarTipo} options={PERMISO_TIPOS}/></Field>
      <Field label="Motivo"><Textarea value={form.motivo} onChange={e=>setForm({...form,motivo:e.target.value})} placeholder="Motivo del permiso..."/></Field>
      {TIPOS_CON_COMPROMISO.includes(form.tipo)&&
        <CompromisoDelDia compromiso={form.compromiso} colonia={form.colonia} zonasData={zonasData}
          onCompromiso={c=>setForm(f=>({...f,compromiso:c}))} onColonia={v=>setForm(f=>({...f,colonia:v}))}/>}
      <Field label="Autorizado por"><Input value={form.autorizado_por} onChange={e=>setForm({...form,autorizado_por:e.target.value})}/></Field>
      <Field label="Evidencia (obligatoria)"><PhotoCapture photo={form.photo} onCapture={p=>setForm({...form,photo:p})} label="Foto o conversación del motivo del permiso"/></Field>
      <Field label="Notas"><Textarea value={form.notas} onChange={e=>setForm({...form,notas:e.target.value})} placeholder="Observaciones..." style={{minHeight:50}}/></Field>
    </Card>
    {session.soloLectura?<AvisoSoloLectura nombre={session.user.nombre}/>:<Btn onClick={guardar} style={{width:'100%'}}>💾 Guardar permiso</Btn>}
    </>}
  </div>;
}

  const[ultimoGuardado,setUltimoGuardado]=useState(null);

  // Líder: cierre de hoy de cada coach (leído del Sheet) — quién ya lo cargó y qué reportó.
  const hoyStr=today();
  const[cierresEquipo,setCierresEquipo]=useState([]);
  const[cargandoCierresEquipo,setCargandoCierresEquipo]=useState(false);
  useEffect(()=>{
    if(!esLider)return;

    setForm(f=>({...f,resultados:vendedores.map(m=>{

    {esLider?
    <Card title="📊 Resultado del día por coach">
      {cargandoCierresEquipo?<div style={{textAlign:'center',padding:20}}><Spinner/></div>:
      (session.coaches||[]).length===0?<p style={{color:'var(--dim)',fontSize:15}}>Sin coaches asignados.</p>:
      coachesCierreHoy.map(({coach,row})=>

  </div>;

// Quita acentos para que la búsqueda no dependa de teclearlos (Muñoz ~ munoz).
const sinAcentos=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');

// ─── Combobox con búsqueda: escribe y filtra desde la primera letra, elige de la lista. ───
function Autocomplete({value,onChange,options,placeholder}){
  const[query,setQuery]=useState('');
  const[open,setOpen]=useState(false);
  const wrapRef=useRef(null);
  useEffect(()=>{
    const opt=options.find(o=>o.value===value);
    setQuery(opt?opt.label:'');
  },[value]);
  useEffect(()=>{
    const onClickFuera=e=>{if(wrapRef.current&&!wrapRef.current.contains(e.target))setOpen(false);};
    document.addEventListener('mousedown',onClickFuera);
    return()=>document.removeEventListener('mousedown',onClickFuera);
  },[]);
  const q=sinAcentos(query);
  const filtradas=q?options.filter(o=>sinAcentos(o.label).includes(q)):options;
  return <div ref={wrapRef} style={{position:'relative'}}>
    <Input value={query} placeholder={placeholder} onFocus={()=>setOpen(true)}
      onChange={e=>{setQuery(e.target.value);setOpen(true);if(!e.target.value&&value)onChange('');}}/>
    {open&&<div style={{position:'absolute',zIndex:30,top:'calc(100% + 2px)',left:0,right:0,background:'var(--card)',border:'1.5px solid var(--border)',borderRadius:8,maxHeight:170,overflowY:'auto',boxShadow:'0 6px 16px rgba(0,0,0,.15)'}}>
      {filtradas.length===0&&<div style={{padding:'8px 10px',fontSize:13,color:'var(--dim)'}}>Sin coincidencias</div>}
      {filtradas.slice(0,60).map(o=><AutocompleteOpcion key={o.value} label={o.label} onClick={()=>{onChange(o.value);setQuery(o.label);setOpen(false);}}/>)}
    </div>}
  </div>;
}
function AutocompleteOpcion({label,onClick}){
  const[hover,setHover]=useState(false);
  return <div onClick={onClick} onMouseDown={e=>e.preventDefault()} onMouseEnter={()=>setHover(true)} onMouseLeave={()=>setHover(false)}
    style={{padding:'8px 10px',fontSize:14,cursor:'pointer',background:hover?'var(--accent-light)':'transparent'}}>{label}</div>;
}

// ─── Plan: selector de zonas de un día (cluster y/o colonia, con cruce colonia↔cluster) ───
function ZonaDia({label,dia,zonasData,onChange}){
  const entradas=dia.entradas||[];
  const[modo,setModo]=useState('cluster');
  const[clusterSel,setClusterSel]=useState('');
  const[coloniasSel,setColoniasSel]=useState([]);
  const[coloniaSel,setColoniaSel]=useState('');
  const coloniasDelCluster=zonasData.clusterToColonias[clusterSel]||[];
  const todasColonias=Object.keys(zonasData.coloniaToCluster).sort();

  const agregar=()=>{
    if(modo==='cluster'){
      if(!clusterSel)return;
      if(coloniasSel.length===0){
        if(entradas.some(e=>e.cluster===clusterSel&&!e.colonia))return;
        onChange({...dia,entradas:[...entradas,{cluster:clusterSel,colonia:null}]});
      }else{
        const nuevas=coloniasSel.filter(c=>!entradas.some(e=>e.cluster===clusterSel&&e.colonia===c)).map(c=>({cluster:clusterSel,colonia:c}));
        onChange({...dia,entradas:[...entradas,...nuevas]});
      }
      setColoniasSel([]);
    }else{
      if(!coloniaSel||entradas.some(e=>e.colonia===coloniaSel))return;
      onChange({...dia,entradas:[...entradas,{cluster:zonasData.coloniaToCluster[coloniaSel]||'',colonia:coloniaSel}]});
      setColoniaSel('');
    }
  };
  const quitar=i=>onChange({...dia,entradas:entradas.filter((_,idx)=>idx!==i)});
  const toggleColonia=c=>setColoniasSel(s=>s.includes(c)?s.filter(x=>x!==c):[...s,c]);

  return <div style={{marginBottom:10,padding:8,border:'1px solid var(--border)',borderRadius:8}}>
    <div style={{fontWeight:700,fontSize:13,marginBottom:6}}>{label}</div>
    {entradas.length>0&&<div style={{display:'flex',flexWrap:'wrap',gap:4,marginBottom:6}}>
      {entradas.map((e,i)=><span key={i} style={{display:'inline-flex',alignItems:'center',gap:4,background:'var(--accent-light)',color:'var(--accent)',padding:'2px 8px',borderRadius:10,fontSize:13,fontWeight:600}}>
        {e.colonia?`${e.colonia} (${e.cluster})`:`${e.cluster} · todo`}
        <span onClick={()=>quitar(i)} style={{cursor:'pointer',fontWeight:800}}>✕</span>
      </span>)}
    </div>}
    <div style={{display:'flex',gap:4,marginBottom:6}}>
      <button onClick={()=>setModo('cluster')} style={{flex:1,padding:'5px 6px',fontSize:13,fontWeight:700,borderRadius:6,border:'1.5px solid var(--border)',background:modo==='cluster'?'var(--accent)':'var(--card)',color:modo==='cluster'?'#fff':'var(--dim)',cursor:'pointer'}}>Por Cluster</button>
      <button onClick={()=>setModo('colonia')} style={{flex:1,padding:'5px 6px',fontSize:13,fontWeight:700,borderRadius:6,border:'1.5px solid var(--border)',background:modo==='colonia'?'var(--accent)':'var(--card)',color:modo==='colonia'?'#fff':'var(--dim)',cursor:'pointer'}}>Por Colonia</button>
    </div>
    {modo==='cluster'?<>
      <div style={{marginBottom:6}}>
        <Autocomplete value={clusterSel} onChange={v=>{setClusterSel(v);setColoniasSel([]);}} placeholder="Buscar cluster..." options={zonasData.clusters.map(c=>({value:c,label:c}))}/>
      </div>
      {clusterSel&&coloniasDelCluster.length>0&&<div style={{maxHeight:120,overflowY:'auto',border:'1px solid var(--border)',borderRadius:6,padding:6,marginBottom:6}}>
        <p style={{fontSize:12,color:'var(--dim)',margin:'0 0 4px'}}>Opcional: marca colonias específicas (si no marcas ninguna, aplica a todo el cluster)</p>
        {coloniasDelCluster.map(c=><label key={c} style={{display:'flex',alignItems:'center',gap:6,fontSize:13,padding:'2px 0',cursor:'pointer'}}>
          <input type="checkbox" checked={coloniasSel.includes(c)} onChange={()=>toggleColonia(c)}/>{c}
        </label>)}
      </div>}
    </>:
      <div style={{marginBottom:6}}>
        <Autocomplete value={coloniaSel} onChange={setColoniaSel} placeholder="Buscar colonia..." options={todasColonias.map(c=>({value:c,label:`${c} (${zonasData.coloniaToCluster[c]})`}))}/>
      </div>
    }
    <Btn variant="secondary" onClick={agregar} style={{width:'100%',fontSize:13,padding:'6px 10px'}}>+ Agregar</Btn>
    <div style={{marginTop:8,paddingTop:8,borderTop:'1px dashed var(--border)'}}>
      <Field label="📍 Punto de reunión / Carpa">
        <Input value={dia.direccion||''} onChange={e=>onChange({...dia,direccion:e.target.value})} placeholder="Dirección o referencia..." style={{fontSize:14}}/>
      </Field>
      <Field label="💬 Comentarios adicionales">
        <Textarea value={dia.comentarios||''} onChange={e=>onChange({...dia,comentarios:e.target.value})} placeholder="Notas para este día..." style={{minHeight:50,fontSize:14}}/>
      </Field>
    </div>
  </div>;
}

// Para el líder: en vez de cluster/colonia, elige qué coach(es) va a priorizar/acompañar ese día
// + un comentario. Reutiliza la misma forma de dato que ZonaDia ({entradas,direccion,comentarios})
// guardando el nombre del coach en "cluster" — así zonasATexto/reporte/WhatsApp lo leen sin cambios.
function CoachDiaSelector({label,dia,coachesDisponibles,onChange}){
  const entradas=dia.entradas||[];
  const[coachSel,setCoachSel]=useState('');
  const agregar=()=>{
    if(!coachSel||entradas.some(e=>e.cluster===coachSel))return;
    onChange({...dia,entradas:[...entradas,{cluster:coachSel,colonia:null}]});
    setCoachSel('');
  };
  const quitar=i=>onChange({...dia,entradas:entradas.filter((_,idx)=>idx!==i)});
  return <div style={{marginBottom:10,padding:8,border:'1px solid var(--border)',borderRadius:8}}>
    <div style={{fontWeight:700,fontSize:13,marginBottom:6}}>{label}</div>
    {entradas.length>0&&<div style={{display:'flex',flexWrap:'wrap',gap:4,marginBottom:6}}>
      {entradas.map((e,i)=><span key={i} style={{display:'inline-flex',alignItems:'center',gap:4,background:'var(--accent-light)',color:'var(--accent)',padding:'2px 8px',borderRadius:10,fontSize:13,fontWeight:600}}>
        {e.cluster}
        <span onClick={()=>quitar(i)} style={{cursor:'pointer',fontWeight:800}}>✕</span>
      </span>)}
    </div>}
    <div style={{marginBottom:6}}>
      <Autocomplete value={coachSel} onChange={setCoachSel} placeholder="Buscar coach..." options={coachesDisponibles.map(c=>({value:c.nombre,label:c.nombre}))}/>
    </div>
    <Btn variant="secondary" onClick={agregar} style={{width:'100%',fontSize:13,padding:'6px 10px'}}>+ Agregar</Btn>
    <div style={{marginTop:8,paddingTop:8,borderTop:'1px dashed var(--border)'}}>
      <Field label="💬 Comentario adicional">
        <Textarea value={dia.comentarios||''} onChange={e=>onChange({...dia,comentarios:e.target.value})} placeholder="Notas para este día..." style={{minHeight:50,fontSize:14}}/>
      </Field>
    </div>
  </div>;
}
